elo en el amor. ¡Tú, Mi pequeño instrumento!”</i>","17 de diciembre. La Fère, Aisne. <i>“No esperes los grandes acontecimientos de tu vida para ofrecérmelos. Todo gesto pequeño es para Mí igualmente grande. Ofrécemelo todo. Ora con toda voluntad de orar bien, Yo Me encargaré del resto.”</i>\nY como Él me daba algunas luces sobre los tapices del techo, yo Le decía: ‘Señor, ¿cómo te ocupas de semejantes detalles?’ Me respondió: <i>“En Mi Amor por vosotros nada es irrelevante. Él Ángel caído no creyó en el Amor y por eso fue arrojado de Él. Cree en Mi Amor y sobre abundarás.”</i>","17 de diciembre. En París. Yo pensaba en el Busto de Cristo hecho por Le Rouz-Druet, cuya cabeza, conmovedora, no se parece a ninguna otra. Me dijo: <i>“Yo muevo las almas con los medios que Me placen.”</i>"],[8,14,42]],[350,["20 de diciembre. En la Fère. En el escenario, con una noche glacial, pude presentarme sin accesos de tos y otras molestias. Le dije: ‘Yo soy en realidad Tu hija pequeña’ y Le daba las gracias. Me contestó: <i>“Y Yo Soy en realidad tu Padre. Pero tú, ¿eres en verdad Mi ‘hijita pequeña’?”</i>"],[24]],[351,["22 de diciembre. Nantes. Yo: ‘Señor, te entrego el día de hoy’. Él: <i>“Di ‘nuestro’ día, pues Yo trabajaré en ti más que tú misma.</i>"],[50]],[352,["22 de diciembre. <i>“Fui Yo El que te amó primero.”</i>"],[16]],[353,["24 de diciembre. Misa de media noche. <i>“Goza. Es preciso que nada de cuanto Yo padecí en Mi Pasión sea perdido para vosotros. Recógete. Ofréceme a Mí Mismo.”</i>\nEn espíritu me había colocado yo en el hueco de Su Manos, en las Llagas, y me admiraba de verme envuelta por entero. Me dijo: <i>“Mis Heridas pueden contener al mundo. Quédate ahí, en Mi Corazón, y no digas nada. Intercambiemos nuestros Sufrimientos, nuestro Amor, en secreto. Yo te vivo: ¡víveme tú!”</i>"],[27]],[355,["27 de diciembre. Fiesta de san Juan, que descansó sobre Su Pecho. <i>“Dime que con cada una de tus respiraciones aspiras el Amor de Mi Corazón. ¡Qué fortuna para ti!</i>\n<i>“Te quiero activa en Mi servicio y contemplativa en Mi Amor. Que aumente tu alegría; así aumentarás la Mía.”</i>"],[11]],[356,["27 de diciembre. <i>“No aguardes que llegue el momento de tu muerte para ofrecerme todos sus instantes. Igual placer Me causan tus minutos de buena salud.”</i>"],[25]],[357,["27 de diciembre. Yo: ‘¿No me sucederá que me voy a habituar a amarte hasta hacerme insensible a ello?’ Él: <i>“Yo no Me acostumbro a ser amado por ti. Aumenta tu alegría y con ello aumentarás la Mía.”</i>"],[0]],[358,["30 de diciembre. En Notre Dame, a las cinco y media de la mañana, durante mi Via Crucis, pensando en Verónica, oí que me dijo: <i>“Cuando tú Me consuelas, Yo imprimo Mi Rostro en tu alma.”</i>"],[51]],[361,["1º de enero de 1938. Le dije: ‘Señor, te amo por tal y tal.’ Me contestó: <i>“Ahora, ámame por Mí Mismo.”</i>\n<i>“Si Yo te concedo favores de ternura es para animarte a hacer sacrificios por tu prójimo. Da en la medida en que recibes. Yo quiero descender al fondo mismo de tu corazón y hacer allí Mi Morada. Será algo sencillo y habitual.”</i>"],[5]],[362,["1938. <i>“Dame los buenos días cada amanecer, cuando te despiertes. Como si entraras al Cielo.”</i>"],[39]],[363,["Cuando estaba a punto de dormirme. <i>“Reza el Padrenuestro. Es verdad que ya lo rezaste, pero ¡hay tantas maneras de rezarlo!”</i>"],[35]],[364,["Después de la comunión. <i>“Deja a un lado tus pequeñas preocupaciones. Piensa en las Mías, que son las almas que se pierden.”</i>"],[44]],[365,["Yo estaba descontenta de mí y cohibida con Él. Entonces me dijo: <i>“¿Es que no Soy Yo más grande que tus deficiencias? ¿Es que no Soy más grande que tu pobre ser? Dame todo lo que tienes. Yo reparo cuando se Me pide que repare.”</i>"],[30]],[366,["2 de enero de 1938. Después de la comunión: <i>“La vida de Amor entre el Creador y la creatura podría no haber comenzado sino en el Cielo, pero Yo vine a encenderla en la Tierra para adelantar las cosas.”</i>"],[2]],[367,["Mientras remendaba mis guantes, me preguntaba: ‘¿Será posible que esto sea contado como obra de amor?’ Él me contestó: <i>“Cuando yo manejaba la garlopa sobre la madera, eso contaba para la salvación del mundo.”</i>"],[50]],[368,["(Con tristeza):<i> “¿Acaso por ser Yo Dios no tengo derecho a la ternura de Mis hijos?”</i> Y al día siguiente <i>“¿No puedo Yo ser amado como cualquier otro?”</i>"],[10]],[370,["Yo unía a los Suyos un pequeño desengaño. Él: <i>“Este es el Cáliz de la Misa: tú, una gota de agua; Yo, el vino.”</i>"],[46]],[371,["Después de la comunión. <i>“Aquí estoy, en la Trinidad, lleno de Amor por Mi Padre. Las Tres Divinas Personas se aman en ti. Únete.”</i>"],[8]],[373,["15 de enero. En Notre Dame durante mi Via Crucis, antes de partir para Brest, me dijo: <i>“En cada una de las estaciones, piensa en Mi Amor.”</i>\nY luego, en el tren: <i>“Ten cuidado, que te quiero más alto. Escóndete en el hueco de Mi Corazón.”</i>"],[13,51]],[376,["28 de enero. Via Crucis, décima cuarta estación. Era el momento de comulgar. Al acercarme, Le dije: ‘Señor, yo soy tu sepulcro. ¿Te quedará en mí más de tres días?’ Me dijo: <i>“Por supuesto que estaré en ti más de tres días. Estaré todos los días.”</i> Aludía a mis comuniones cotidianas."],[8]],[377,["29 de enero. De viaje para Vierzon. <i>“¿No eres tu una hija mimada del Buen Dios?”</i>\nYo sentía mi miseria y Su extremada Misericordia.\nVia Crucis, en la estación de las santas mujeres. <i>“Yo os consuelo para que vosotros consoléis.”</i>"],[51]],[378,["30 de enero. En Vierzon, en Misa. <i>“Entrégate a Mí por completo. ¿Por qué tienes siempre reservas? ¿Me tienes miedo? Dáteme sin ponerme limitaciones.”</i>"],[46]],[380,["4 de febrero de 1938. Yo me había sentido contristada por una falta de amistad. Me dijo: <i>“He permitido esto para que comprendas lo que es el amor despreciado.” </i>Y luego, por la tarde: <i>“Confiésame tus faltas del día en el secreto de nuestros dos corazones; Yo te las perdonaré.”</i>\n11 de febrero. Entre Alençon y Rouen. <i>“La vida se os concede para que os corrijáis y os volváis a corregir. Y la muerte aporta la última corrección.”</i>"],[12]],[383,["6 de febrero de 1938. En el tranvía recitaba yo maquinalmente algunas oraciones, mirando al mismo tiempo tiendas y transeúntes. Me dijo con dulzura: <i>“Si Yo fuera nada más un hombre, te preguntaría: ‘¿te estás burlando de mí?’”</i>"],[17]],[384,["Después de unta mortificación fatigosa. <i>“Estarnos agotados. Tú y Yo... tú, que quieres ayudar a tu prójimo, ayúdame a Mí. Soy tu prójimo más cercano. ¡Si tuvieras el mismo deseo de recibir Mis Gracias que el que Yo tengo de dártelas! He puesto tu cuerpo al servicio de tu espíritu, pero tu espíritu está a Mi Servicio.”</i>"],[37]],[385,["De París al Havre. Yo le daba las gracias por Sus Dones y Le decía: ‘¿No es un poco ridículo eso de que yo Te dé dones con los mismos que Tú me has dado?’ Me respondió: <i>“No siempre son los dones los que causan complacencia, sino la manera como son ofrecidos.”</i>"],[22]],[386,["Moulins. En el tranvía. <i>“Desea, desea. Desear ensancha la capacidad de recibir.”</i>"],[3]],[388,["8 de febrero de 1938. En una duda. <i>“Yo Soy bueno para quienes Me tienen confianza, y Soy más bueno aún para los que confían más. Pero a los que se abandonan totalmente en la confianza, los tomo íntegramente.”</i>","8 de febrero de 1938. Después de la comunión. <i>“Los ángeles, cuando pecaron, no habían aún visto a Dios. Si lo hubieran visto, no habrían podido pecar. Mira pues a Dios cuanto te sea posible. Contémplalo.</i>\n<i>“¡Contempla!”</i>","8 de febrero de 1938. Mientras hacía una mortificación corporal, yo decía ‘¡Si estos golpes pudieran alcanzar mi corazón y ablandarlo, por los Sufrimientos de Cristo!’ Entonces me dijo: <i>“Tengo en cuenta tu deseo como si se hubiera cumplido. Activa con mayor frecuencia tus buenos deseos.”</i>"],[9,11,37]],[389,["<i>“Sí, arde de amor; arder es una purificación.”</i>","<i>“Tú, que gustas de ayudar a tu prójimo, ayúdame a Mí, que Soy tu Prójimo más próximo. Sí, arde de amor; arder es una purificación.”</i>","10 de febrero.<i> “Dime al oído lo que quieras decirme; es ahí donde el Padre te oye.” </i>Como yo me preguntaba si sería de veras Él, me dijo: <i>“El pensamiento de tu indignidad te hace dudar de que sea Yo quien te habla. Pero, ¿dónde dejas Mi Misericordia? “</i>"],[3,10,15]],[390,["11 de febrero. Dieppe. <i>“Adquiere el hábito de no pensar en ti, sino en Mí. Cuando llegues a tenerlo, ya no Me abandonarás.</i>\n<i>“Cuando no tengas nada que decirme, dime que no tienes nada que decirme y apóyate sobre Mi Corazón.”</i>\nYo ponía mi corazón sobre el Suyo. Me dijo: <i>“Un padre cariñoso se presta a todas las invenciones de su hijo pequeño. Dime como esta niñita a su padre: ‘Ven cerca de mí’.”</i>"],[13]],[392,["18 de febrero. En la casa ‘Santa Rosalía’. Debiendo tomar el tren para representar ese mismo día en Le Havre, yo me atormentaba por el retraso de la Misa. Con un dulce reproche me dijo:<i> “Yo sé esperar. Y tú no tienes que hacer nada, fuera de hablar conmigo…”</i>"],[34]],[398,["París, en la estación del Norte. <i>“Es por vosotros por los que Me hago tan pequeño en la Hostia. Como si os dijera: ¡Pobres pequeñitos Míos!”</i>"],[20]],[400,["9 de marzo. Varades. <i>“Si vives para ti, no tienes sino una satisfacción de la Tierra; pero si vives para Mí, tendrás el Cielo infinito.”</i>"],[54]],[401,["10 de marzo. Nantes, en Notre Dame, después de la comunión. Yo Le expresaba mi deseo de ser el ideal que Él se ha formado de mí. Me dijo:<i> “No empañes Mi imagen en ti.” </i>Y Me mostró todo lo que debía haber en mí de bondad, de atenciones, en mis relaciones con el prójimo en el curso de mis viajes."],[5]],[402,["10 de marzo, en el campo. Yo estaba con mi pensamiento en medio de la Sagrada Familia con San José, la Santísima Madre y el hijo Único. Me dijo con inmensa Ternura: “<i>Sé tú la hermanita.”</i>"],[28]],[406,["17 de marzo de 1938. Después de la comunión, yo estaba en espíritu al pie de la Cruz. Me dijo: <i>“Como ves, no puedo caminar ya sobre la Tierra con Mis Pies que en una ocasión caminaron sobre las aguas.</i>\n“He cumplido vuestros deseos y dejo que Mis Venas se vacíen de toda Su Sangre. Porque puse toda Mi Voluntad en sufrir.”"],[46]],[407,["18 de marzo. En el tren de París a Vesoul miraba yo un pequeño campanario en el campo. Me dijo: <i>“En cualquier lugar en que te encuentras estás en tu Patria. Yo estoy y te espero en todas partes.</i>”"],[39]],[408,["21 de marzo. Vesoul. Después de la comunión veneraba yo Su Santa Faz con una corona de besos en los agujeros de las espinas y con un collar de reparaciones y compasión. Me dijo: <i>“Ahora rinde homenaje a Mi Voluntad, a Mi Memoria, a Mi Entendimiento, a todo lo que tú sabes que puede sufrir en el alma del hombre.</i>\n<i>“Y recuerda sobre todo Mi Delicadeza, inmensamente superior a la de los demás hombres.”</i>"],[36,51]],[409,["23 de marzo. Le Fresne. En una primavera llena de cerezos en flor plantaba yo algunas flores y Le decía alegremente: ‘Te doy mi corazón con todo lo que tiene dentro.’ Me respondió: <i>“Los saludos que Me ofreces te los devuelvo en los mismos términos, pero en Dios.”</i> Con esto me quiso decir que recibo más de lo que doy.\nEn medio de los árboles frutales cubiertos de flores blancas, sobre el Loira azul lleno de aves, yo alababa Su Poder. Me dijo:<i> “Todo lo Mío es tuyo.”</i> Y me hizo sentir que es Suyo todo lo que es de Su Padre."],[16]],[410,["24 de marzo. San Gabriel. A las cinco y media. Via Crucis: en la estación en que Jesús es despojado de Sus Vestiduras. Me hizo ver. <i>“En este momento Mi Iglesia se ve despojada de sus cristianos en Rusia, en Alemania, en México y otras partes. Ofréceme al Padre. Ofréceme despojado...”</i>"],[51]],[411,["26 de marzo. Mientras me arreglaba, buscaba yo palabras afectuosas. Me dijo: <i>“Nunca Me dirás palabras demasiado impregnadas de amor.”</i>\nEn el tren para Rennes: <i>“Muestra lo que es la paz de un corazón que se apoya en el Corazón de su Dios. Haz más a menudo actos de confianza.”</i>"],[13]],[412,["28 de marzo. Refiriéndose a la influencia que puedo tener sobre los demás, dijo: <i>“Comienza a sembrar, Yo haré el resto. Pero comienza...”</i>","28 de marzo. En el tren de Combourg a Nantes trataba yo, con la ayuda de la Santísima Virgen, de curar amorosamente las heridas de Su Frente. Me dijo: <i>“Es una buena obra que haces conmigo.”</i>"],[4,36]],[414,["1º de abril de 1938. Viernes, en Montmartre. <i>“Sé Mi pequeña amiga, alegre y gozosa. Háblame con sonrisas. Hay tantos que Me consideran como a un verdugo, como a un Juez implacable. Quiero ser vuestro dulce y cordial Amigo. ¡Qué no haría Yo por los que quieren darme su abandono, un abandono de niños!”</i>\nEn el metro: <i>“Háblame, háblame...”</i>"],[34]],[415,["4 de abril. En el tren. Yo Le encomendaba un tesoro que transportaba. Me dijo: <i>“Es posible que si lo perdieras y te resignaras a la pérdida por amor a Mí, tuvieras en ello un tesoro todavía más precioso que ese.”</i>","4 de abril. En el tren. <i>“Tú eres Mía. Sé, pues, siempre sonriente. En una de tus comedias decías: ‘Yo quisiera ser vendedora de sonrisas’, ¿te acuerdas?”</i>","4 de abril. En Angers. <i>“Si no Me escuchas no podrás oírme. Está en Mí, no en ti. Yo os he dado todo cuanto recibí de Mi Padre; da pues tú a los otros exactamente lo que Yo te he dado.”</i>"],[1,5,15]],[416,["4 de abril. A la vista de un pobre hombre que dormía sobre una banca a la intemperie, yo Le decía: ‘Apiádate de él.’ Él me contestó: <i>“A ti, que has recibido tantas Gracias, se te pedirá más que a él. ¡Qué difícil os resulta olvidaros por completo de vosotros mismos para arrojaros en Mí!”</i>"],[40]],[417,["Chalons-sur-Saône. Yo hacía esfuerzos por vivir encerrada en Cristo. Él me dijo. <i>“Tú has dado una ‘carta poder’ para que en tu ausencia se pueda abrir tu caja fuerte; pero no hay en el mundo quien te pueda sacar de Mi Corazón. Solo tú misma. No des importancia sino a lo que es eterno.”</i>"],[13]],[418,["7 de abril. En el tren de París a Grenoble. Unos esposos jóvenes conversaban cariñosamente en el carro restaurante. Él: <i>“¡Ojalá Me hablaras con la misma alegría! ¡Es tan bueno y tan sencillo!”</i>","Ante los Alpes cubiertos de nieve arriba y llenos debajo de rosados duraznos, adoraba yo la Fuerza y la Dulzura. Lo invitaba a descender a estas regiones, y para que el hielo no enfriara Sus Pies, ponía yo como un tapete de amor. Me dijo: <i>“Que tu vida se consagre de ahora en adelante a encantarme y verás cómo se transforma. Agradarme. Vivir para mí. Este es el verdadero sentido del ser.”</i>","7 de abril. <i>“Las Gracias concedidas a otros santos no han agotado Mis Recursos. Estoy siempre pronto a darlas, y aún más grandes.”</i>","7 de abril. Veynes, en el tren. Yo me excusaba de la cortedad de mis pensamientos y de mis pobres voluntades. Me dijo <i>“Pero si no eres más que una niña.”</i>","7 de abril. Veynes. Ante los Alpes altísimos, cubiertos de nieve arriba y llenos abajo de rosados duraznos, adoraba yo Su Fuerza y Su Dulzura. Lo invitaba a descender para que el hielo no enfriara Sus Pies, ponía yo como un tapete. Me dijo. <i>“Que tu vida se consagre de ahora en adelante a encantarme, y verás cómo se transforma. Agradarme; vivir para mí. Este es el verdadero sentido del ser.”</i>"],[0,1,19,24,39]],[419,["10 de abril. Arvieux. <i>“El Purgatorio será el reino de la Justicia, pero mientras estás sobre la Tierra, vives bajo el signo de la Misericordia. Aprovéchala.”</i>"],[30]],[420,["12 de abril. En Marsella, a bordo del U.S.O. contemplaba toda la actividad antes de la partida del barco. Jesús me dijo: <i>“Lo que Yo contemplo son los movimientos de amor de Mis fieles sobre la Tierra.”</i>"],[1]],[421,["Cuando yo miraba el último tablón que se puso para separar el barco del muelle, pensaba en la muerte. Él me dijo: <i>“No temas. Yo estaré a tu lado.”</i>"],[31]],[426,["En Tirlempt. <i>“Desaparece en Mí, Yo apareceré en ti”.</i>"],[49]],[427,["En el desierto. Yo miraba las arenas, los innumerables y casi invisibles granos. Él: <i>“Yo tengo para ti, y para todos tus momentos innumerables, Bondades que no ves.”</i>"],[16]],[429,["16 1º abril. En automóvil por el desierto, de Laghoua a Gardhia. Una mujer joven ponía a su hijita sobre la espalda de su marido. Entonces, en espíritu, apoyé mi cabeza sobre el Hombro de Jesús. Me dijo: <i>“Considera si un hombre puede amar tanto...”</i> Me hizo pensar en la Llaga de su Hombro destrozado por el peso de la Cruz."],[27]],[430,["<i>“Pídeme toda clase de Gracias. No pienses nunca que algo es imposible, que hay algo que Yo no quiera concederte. Apoya tu cabeza en Mi Hombro de Resucitado.”</i>","Pascua, l7 de abril. Gardhaia. <i>“Esta mañana te di Mi Cuerpo en alimento. Cuando llegue tu hora de comer, piensa en Mi Ayuno en el desierto e invítame.”</i>"],[27,54]],[432,["<i>“Yo puedo darte TODO. Haz cada día un pequeño esfuerzo de heroísmo de amor. Alcánzame.”</i>"],[1]],[433,["23 de abril. En el desierto, Qued Ouaouseur. <i>“Pídeme el gusto de la Eternidad.”</i>"],[38]],[434,["Cuando yo oraba por una conversión: “<i>Invita a Mi Madre para que pase el día con él.” </i>Y cuando yo Le daba las gracias, me dijo:<i> “¿No tengo acaso Yo que pagar los honorarios de Mi comedianta?”</i>"],[28]],[437,["28 de abril. En la catedral de Túnez cuando se extinguían la voz del órgano y se apagaban los candelabros, me dijo: <i>“Yo quedo siempre para ti.”</i>"],[39]],[438,["29 de abril. En Cartago. Pensando en las lágrimas de santa Mónica, yo estaba en espíritu en el Corazón de Jesús y me preguntaba cómo podría tener tiempo para estar también cerca de la Santísima Virgen. Me dijo: “<i>Basta con que permanezcas en el Corazón que se formó en el Seno de Mi Madre.”</i>"],[28]],[439,["2 de mayo de 1938. Túnez. <i>“Hacer el bien es propagarme. El Bien Soy Yo. Yo Me ocupo de cada alma como si fuera la única en el mundo.”</i>"],[4]],[440,["2 de mayo. En Túnez. “<i>Mi Madre no vivía más que para Dios. No tenía ningún egoísmo, no se miraba a Sí Misma. Respondía con entera exactitud al fin que se propuso el Creador al hacer a Su creatura. Imítala.”</i>"],[28]],[441,["Túnez. Vinieron a buscar al señor Cura. Una mujer venía a devolver siete hostias que había puesto en su libro después de comulgar. Él me dijo: <i>“Repara.”</i>"],[37]],[444,["6 de mayo. Túnez. Distraída por la gente que entraba a la iglesia, yo tomaba en espíritu Su Mano para que cerrara mis párpados. Me dijo: <i>“Mira hacia tu interior; allí está el Reino de Dios.”</i>"],[41]],[445,["9 de mayo. De Túnez a Constantine, veía los miles de flores que adornaban las praderas. Me dijo: <i>“Multiplica cada día tus actos de amor para alegrarme la Mirada.”</i>"],[29]],[446,["10 de mayo (1938). En la catedral de Constantine, después de la comunión. <i>“Mis delicias son estar con los hijos de los hombres.”</i>"],[8]],[447,["11 de mayo. Argel. En Nuestra Señora de África, después de la comunión. <i>“Yo soy el Corazón viviente.”</i>","11 de mayo. Argel. A la hora del desayuno, en un comedor que lindaba pared por medio con una capilla, me dijo: <i>“¿Crees a fondo en Mi? No te quejes nunca, ni delante de los otros, ni delante de ti misma.”</i>"],[8,37]],[448,["14 de mayo. Ante dos ramilletes de flores que adornaban el altar de Nuestra Señora del África para la exposición del Santísimo Sacramento: “<i>Esto no vale lo que un alma. Llama ‘Hermana’ a Mi Madre. Varía las apelaciones, para estimular tu cariño.”</i> Esto me lo decía por el recuerdo que tuve de mi querida hermana Clemencia."],[28]],[449,["19 de mayo. A bordo. <i>“Encontrarse en estado de Gracia es estar en estado de Cristo.”</i>"],[47]],[450,["20 de mayo. En el tren de Bordeaux-Nantes. <i>“Cuando Me buscas, Me encuentras. Yo, por Mí, tengo gran deseo del calor de vuestros corazones.”</i>"],[16]],[453,["24 de mayo, en Argel. En la Iglesia de Nuestra Señora de África. <i>“Prefiero que no Me digas nada a que Me digas algo que no piensas.”</i>"],[17]],[455,["28 de mayo. Retorno al campo, en Francia. Yo había omitido mi tiempo de descanso delante de Dios. Él: <i>“¿Por qué Me privas de ese momento de intimidad? ¿Tienes mucha prisa? Pero, ¿hay algo que pueda compararse a quince minutos sobre Mi Corazón?”</i>"],[13]],[456,["En mi aposento. <i>“Cuando puedas no aparecer en público, no lo hagas. Escóndete. Escóndete en Mí. Que tu amor sea siempre joven e invente para Mí cosas nuevas, como un nuevo amanecer.”</i>"],[41]],[457,["Pensaba en la muerte y me preguntaba: ‘¿cómo voy a hacer? ¿Seré siquiera capaz de decir buenos días a mi Dios? Él, con viveza: <i>“Seré Yo el que te dé los buenos días.”</i>"],[31]],[458,["30 de mayo. <i>“¡Qué feliz eras cuando podías dar a un ser querido un día entero de intimidad! Dame a Mí, con mayor gusto aún, tus soledades.”</i>","30 de mayo. <i>“Mira Mi Sangre. Nada fuera de Mí. Habita en la Mansión de tu Señor, de tu Esposo.</i> (Su Corazón).<i> ¿Crees realmente en Él? Pídeme amor, a Mí, que ardo en deseo de dároslo.”</i>","30 de mayo. <i>“¡Qué feliz eras cuando podías dar a un ser querido un día entero de intimidad! Dame a Mí, con mayor gusto, tus soledades”.</i>","30 de mayo. <i>“Mira Mi Sangre. Nada fuera de Mí. Habita en la Mansión de tu Señor, de tu Esposo</i> (Su Corazón). <i>¿Crees realmente en Él? Pídeme amor, a Mí, que ardo en deseo de dártelo.”</i>"],[11,13,26,45]],[459,["7 de junio. <i>“Cuando tú Me hablas, Yo te respondo; pero no siempre oyes sensiblemente Mi Respuesta.”</i>"],[15]],[460,["8 de junio. Yo le pedía a la Santísima Virgen una conversión. Él me dijo: <i>“Un alma cuesta caro. Es necesario el tiempo, los sacrificios. Sufre por ella. Une tus sufrimientos a los Míos, para mejor complacer al Padre.”</i>"],[4]],[461,["10 de junio. Versalles. <i>“Róbame por amor. Roba Mis Méritos. Pide, pues Yo tengo más urgencia de dar que vosotros de recibir.”</i>\n486 Yo: ‘Amor mío, ¿cuándo nos veremos? Tú me ves a mí, pero yo no Te veo a Ti.’ <i>“No, pero condúcete como si Me vieras.”</i>","10 de junio. Aniversario de mi Primera Comunión, ante unas rosas espléndidas: <i>“Esto es para ti. Para que Me ames todavía más.”</i> Luego, aludiendo a ciertas rosas que encogen sus pétalos cuando muere el sol, me dijo después de la comunión: <i>“Enciérrate sobre Mí.”</i>"],[3,8]],[462,["12 de junio, en Versalles. <i>“Ejercita tu virtud preferida. Recuerda que tu fuerza está en tu alegría y que tu alegría Soy Yo. Olvídate de ti misma. Abandona la dirección. Pierde tu alma en la Mía. ¿Por qué quieres hacerlo todo tú? Déjame obrar en ti, tenme confianza. Déjate ir como a la deriva en la corriente de Mi Acción.”</i>"],[9]],[463,["13 de junio. París, en el metro. Yo: ‘Señor, ¿Te amaría yo más dando mi sangre?’ Él: <i>“Ámame con lo que Yo te doy cada día. ¡Cada día!”</i>"],[1]],[464,["14 de junio. Le Fresne. <i>“Charla conmigo. No hay para Mí oración más dulce.”</i>"],[34]],[465,["15 de junio. Cuando yo mortificaba mi cuerpo pensando en la hora de Su Flagelación, me dijo: <i>“Únete. Entra en Mi Sufrimiento, con mucho amor. El amor es lo que importa.” </i>Después de una obra de Caridad, Le dije: ‘Señor, dame Tu Bondad, pues la mía no es suficiente.’ Me contestó: <i>“Tómala toda. Porque, hija, puedes creerme si te digo que por ti sola habría Yo venido a la Tierra a sufrir y morir.”</i> (Esto lo dijo con inmensa Ternura)."],[36]],[466,["16 de junio. Yo me disponía a dormir en el suelo y Le dije: ‘Señor ven aquí.’ Me respondió: <i>“Estoy de ti mucho más cerca que cerca: estoy en ti y tú estás en Mí.”</i> ‘Señor, he dormido en el suelo, como dormías Tú; pero no he velado noches enteras como lo hacías Tú.’ Me contestó: <i>“Pero Yo he velado por ti.”</i>"],[49]],[468,["18 de junio. Tras un día entero pasado en recibir gente y hablar, yo Le decía: ‘¿Es piedad todo esto?’ Él me respondió: <i>“¿Acaso no Me sucedió a Mí lo mismo durante Mi Vida pública? No te inquietes. Ya lo sé.”</i>"],[5]],[469,["Mientras preparaba unas flores en la terraza para recibir a una amiga. <i>“Acuérdate de Mi Trabajo diario en Nazaret. Yo no hacía otra cosa que orar. Y luego, Mis Viajes; pero todo sucedía en Mi Padre. Permanece en Mí y estarás en Él.”</i>"],[50]],[470,["20 de junio. <i>“No seas amable por mero amor a la amabilidad. Sé amable para tenerme contento.”</i>"],[10]],[471,["20 de junio. Después de la comunión. <i>“Mi Padre y Yo somos Uno. ¿Recuerdas la angustia que había en los gritos de X cuando veía ahogarse a su padre? Imagínate entonces, si puedes, cual será Mi Agonía ante la pérdida de las almas de Mis hijos.”</i>"],[44]],[472,["21 de junio, después de la comunión. <i>“Aquí estoy, indudablemente para recibir vuestros homenajes, pero sobre todo y ante todo para serviros. ¡Sírvete de Mí! ¡Que se sirvan todos! Y a tus prójimos háblales como creas que les hablaría Yo.”</i>","21 de junio. Mientras yo Le daba las gracias por los pajaritos que cantan este día, por el cielo azul, por el Loira y por las flores, me dijo: <i>“Me agradeces Mi sol, y haces bien. Pero debes darme igualmente las gracias por los días malos, pues todo viene de Mi Providencia. Ora con toda tu voluntad de orar bien, Yo haré lo que tú no puedas.”</i>"],[8,40]],[473,["23 de junio. Con un acento como de desamparo, me dijo: <i>“¡No Me dejes solo!”</i>"],[10]],[474,["Yo le daba las gracias por todas las hostias que he recibido desde mi Primera Comunión. Él me dijo: <i>“¡Las tienes todas contigo! Una hostia recibida es eternamente dada. Es esto lo que hace el tesoro de los elegidos.”</i>"],[8]],[475,["<i>“Yo vivo en una eterna Agonía de sed por las almas. Sacia mi sed.”</i>"],[4]],[476,["Durante la procesión con el Santísimo Sacramento, yo Le pedía esto y aquello. Él: <i>“¿No me permitirás escoger por Mí mismo la vida que te conviene? ¿No ves que te la he hecho sobre medida?”</i>"],[9]],[477,["Contra las distracciones después de comulgar. <i>“Para que Yo te hable en tu casa es preciso que estés ahí.”</i>"],[8]],[478,["24 de junio. Fiesta del Sagrado Corazón. <i>“Todo lo Mío es tuyo; que todo sea Mío. Y dímelo con frecuencia.”</i>","24 de junio. Fiesta del Sagrado Corazón. <i>“Todo lo Mío es tuyo; que todo lo tuyo sea Mío. Y dímelo con frecuencia”.</i>\nEl trenzado de la corona de espinas.<i> “La parte interior de la corona penetró en Mi Cabeza; apóyate tú en la parte de afuera para consolarme. Y consuélame en tu prójimo; ten la preocupación de los pecadores y atiéndelos por Mí. Considera Mi Corazón, solo tiene palpitaciones de Amor y palpitaciones de Dolor por el deseo de ser amado de vosotros. Ayúdame.”</i>\n‘¿Qué puedo hacer, Señor?’ Él: <i>“Ofrece a través de Mí todo lo que tienes, por su salvación. Olvida los pequeños cuidados de la Tierra y entra en los grandes intereses del Cielo. Si pudieras comprender lo que es el Cielo, ninguna otra cosa te importaría fuera de la salvación de las almas.”</i>"],[13,44]],[480,["27 de junio. Iglesia de Fresne. <i>“Manifiesta primero en tu rostro el encanto amable que quieras poner en tus palabras.”</i>"],[5]],[481,["27 de junio. Cinco cuarenta y cinco de la mañana, en la avenida solitaria. <i>“Dime que hoy vas a hacer más que ayer en reparación.”</i> Y luego, en un tiempo de descanso: <i>“¿Has trabajado en la Redención? El trabajo en la Redención es la medida de la santidad.”</i>"],[12]],[482,["29 de junio. Después de la comunión, pensando en la fiesta cercana del Corazón Eucarístico, decía Yo: ‘Tómame en Tu Corazón’. Él: <i>“¿No sabes que desde hace mucho tiempo estás en Él?”</i>"],[13]],[483,["30 de junio. Fiesta del Corazón Eucarístico. <i>“¿Te acuerdas de Jos? ¡Qué intensidad de amor tenía! ¿Y de Éltt... y de J? Pues bien, piensa que la Intensidad de Mi Corazón las sobrepasa con la distancia que hay entre Dios y el hombre. Yo amo como ninguna creatura es capaz de amar.”</i>"],[13]],[487,["Viernes, 1º de julio de 1938. Yo pensaba en Su Sangre y trataba de cubrir con Ella todas las heridas de mi alma, como en una transfusión, y Le decía: ‘Señor, ¿hago con esto daño a los otros?’ Me contestó: <i>“Hay para todos, para todos los que La desean. No descuides nada que pueda acercarte a Mí: ¡el tiempo de que disponéis es tan corto!”</i>"],[45]],[488,["2 de julio. Via Crucis, estación del encuentro con su Madre. <i>“Cuando Ella Me abrazó, se manchó con Mi Sangre. Pídele esas gotas para la conversión. No busques nunca las recompensas de la Tierra; son demasiado poco.”</i>"],[45]],[489,["2 de julio, después de la comunión. <i>“Nada para ti, todo para Mí y nada sin Mí.”</i>"],[8]],[490,["Después de la comunión. <i>“Si a tu primito lo hubieras recibido ayer como Me habrías recibido a Mí de catorce años, habría sido mucho mejor. Veme a Mí en todo.”</i>"],[5]],[491,["3 de julio. Le Fresne. A la hora de la Elevación tuve el sentimiento de que me tomaba la cabeza con sus dos Manos y la apoyaba sobre Su Corazón. <i>“Cuando la esposa, para honrar a su Esposo se toma mil molestias con la casa, Él está tan contento como si ella se hubiera quedado apoyada en Su Hombro en la contemplación.”</i>"],[11]],[492,["14 de julio, en Bretaña. <i>“Si pudieras visitar todos los lugares de la Tierra, tu primera pregunta en cada lugar debería ser: ¿Os amáis aquí los unos a los otros?”</i>"],[5]],[493,["Saliendo de viaje a las seis de la mañana, me impacientaba porque la ayudante no me servía el café. <i>“El mérito no está en ser amable con la gente amable, sino en serlo con quienes no lo son...”</i>"],[5]],[494,["Unos viajeros no sabían qué hacer. Él me dijo: <i>“Que te guste servir. Acuérdate de que Yo lavé los pies de Mis discípulos. Yo consolaba y curaba.”</i>","<i>“La oración es como un faro giratorio que llega muy lejos”.</i>"],[5,34]],[495,["En Gien. <i>“El deseo de no ir al Purgatorio para poder verme más pronto es un deseo que Me honra y Me complace.”</i>"],[38]],[496,["En medio de la sofocación de un carro de ferrocarril sobrecalentado: <i>“Dime: ‘¡Qué importa que me atormente la sed! Ni qué importa el peso de las maletas... con tal que las almas se salven y que las Misiones prosperen y que llegue por fin el Reino de Dios’.”</i>"],[44]],[497,["Chambéry, en una pequeña iglesia adosada al monte. <i>“Honra Mi Rostro Vivo. Mis Ojos, que vieron los instrumentos de la tortura; Mis Oídos, que oyeron las injurias y los insultos; Mi Nariz, que percibió el olor de los escupitajos; Mis Labios, que absorbieron la hiel; Mis Mejillas hinchadas y maltratadas. Todo Mi Rostro desfigurado.”</i>"],[42]],[498,["Después de una gira que hice por Él. <i>“Ven ahora conmigo a lo apartado... descansemos.”</i>"],[41]],[500,["11 de julio. Una tarde, en Le Croisic. <i>“El sueño es imagen de la muerte. Adormécete siempre en Mis Brazos y así aprenderás a morir.”</i>"],[31]],[501,["17 de julio <i>“Ejercítate en no pecar con las palabras.”</i> Luego, en el carro que va de Croisic a Nantes. <i>“Que la finalidad de todos tus días sea la de dar gusto.”</i>"],[5]],[502,["19 de julio. Le Fresne. Como yo me inquietaba por tantos favores, me dijo: <i>“Déjame obrar y déjate hacer.”</i>"],[16]],[503,["20 de julio. En Misa. <i>“Que unirte a Mí sea toda tu actividad; Yo obraré en ti. Toma los medios de escucharme.” </i>El pensamiento de Su Amor me oprimía. ‘¿Si mi corazón se metiera en Tu Pecho?’ Él: <i>“Nuestros dos corazones volverían al tuyo. Víveme. Yo te viviré.”</i>"],[49]],[504,["22 de julio. Sobre la terraza. <i>“En tus cartas pon Mi Suavidad.”</i>\nPor la tarde pasaban los niños por delante de mí en sus bicicletas. Yo iba sola al cementerio y en el camino del Loira, Le decía: ‘Señor, ¿puedo en espíritu poner mi cabeza sobre Tu Corazón?’ Él: <i>“¡Claro! Nadie nos ve.”</i> Y Su Voz tenía una indecible Ternura."],[13]],[505,["23 de julio. Via Crucis. <i>“Inmediatamente después del encuentro con Mi Madre Me vino otro socorro: Simón el Cireneo. Acude a Ella.”</i>"],[51]],[506,["24 de julio. Después de la comunión, estaba distraída. <i>“¿Me has dedicado hoy siquiera una mirada?”</i>","24 de julio. Andaba yo perdida en mil pequeños cuidados. Me dijo: <i>“¿No te sería mucho más descansado pensar en Mí?”</i>"],[29,52]],[509,["3 de agosto de 1938. <i>“Participa en el gozo de tu Señor. Irradia la Alegría del Cielo.”</i>"],[38]],[510,["“<i>Cuando veas que has caído en alguna falta, como un exceso, una exageración en el lenguaje, pon inmediatamente en Manos de mi Madre tres Avemarías, rogándole que Me las ofrezca como reparación.”</i>","Malesherbes. Loirel. Yo pensaba en la princesa N., que estaba presente. Él: <i>“Ocúpate sobre todo de los Grandes que están en el Cielo.”</i>"],[28,38]],[511,["8 de agosto. <i>“Que tu virtud se traduzca en actos de Caridad. ¡La Caridad asume tantas formas! ¿Conoces la Bondad de Mi Madre? Entonces, considera cuál será la Bondad de Dios, que ha hecho la Bondad de Mi Madre.”</i>","8 de agosto. Briare.<i> “No pierdas de vista Mis intenciones.”</i> (La salvación de las almas). <i>“Y pídeme que comparta los instantes de tu vida.”</i>"],[5,52]],[513,["14 de agosto. Ambérieu. <i>“Sé semejante a Mí. Seréis juzgados según esta semejanza. Mira y compara. Humíllate.”</i>"],[49]],[514,["15 de agosto. <i>“Yo doy a cada alma la vida que mejor puede conducirla a Mí.”</i>"],[40]],[516,["19 de agosto. Le Fresne. <i>“Vigila tu pensamiento. Porque tu pensamiento precede a la acción y la palabra. Ponlo constantemente en Mí. Piensa en Mi Madre, que pensaba siempre en Dios. Temer y confiarse; humildad y amor.”</i>"],[52]],[517,["22 de agosto. En la visita al Santísimo Sacramento: <i>“Sé fiel.”</i>\nY en el rezo del Via Crucis: <i>“¡Acompáñame!”</i>"],[51]],[518,["23 de agosto. Yo besaba en espíritu la Llaga de su Costado. Me dijo: <i>“Pide a Mi Madre que acompañe cada uno de tus besos.”</i>"],[27]],[519,["24 de agosto, cuando yo decía el Padrenuestro: <i>“Considera como todo está encerrado en Mi oración del Pater: Dios, tú, los otros.”</i>"],[35]],[520,["28 de agosto. Yo apresuraba en la iglesia mi tiempo para terminar una decoración de altar. Me dijo: <i>“¿Piensas acaso que Yo no prefiera tus cariñosos momentos de adoración a todas estas rosas que estás preparando? Ora más y con más amor. Y no te preocupes del número.”</i>","28 de agosto. A la elevación, en la Misa Mayor: <i>“Vacíate de ti misma y entonces Yo te llenaré. Te daré Mi Mirada para que veas con ella.”</i>","Yo me ponía a dormir en el suelo. Me dijo: <i>“Tú eres Mi Cuerpo.”</i>"],[1,29,49]],[521,["2 de septiembre de 1938. Esta noche: <i>“Al comenzar tus acciones, ponte en Mi Presencia diciéndome: ‘Aquí está Jesús’. Y al terminarlas, haz un acto de amor: ‘Jesús mío, Te amo’.”</i> Y luego, como yo lamentaba la insuficiencia de todas las cosas de aquí abajo, me dijo: <i>“No estás en el Cielo, sino en la Tierra.”</i>"],[39]],[523,["8 de septiembre. Me dijo, con un acento lleno de Amor: <i>“Entra en las Llagas de Mis Manos. Si hirieras a tu prójimo, Me herirías a Mí. ¿Soportarías acaso desgarrar Mi Cuerpo?”</i>"],[27]],[524,["9 de septiembre. <i>“Busca, busca lo que nunca pasa. El ‘danos hoy nuestro pan de cada día’ significa que debes pedir cada día, y que cada día el Padre se ocupa de ti.”</i>"],[35]],[527,["Vervins. <i>“Tú encuentras en tus prójimos prolongaciones de Verdad, de Bondad y de Belleza; pero la Fuente primera de todo eso Soy Yo.”</i>"],[39]],[528,["17 de septiembre. <i>“A veces creo Yo situaciones angustiosas para poner a prueba vuestra confianza. Dame la tuya y dámela con frecuencia.”</i>"],[9]],[529,["19 de septiembre. De Bourges a Le Fresne, después de la bonita representación de ‘La Pequeña veladora de cuatro centavos’:<i> “Gloria al Padre... no a ti.”</i>"],[35]],[530,["23 de septiembre. Estación de Nantes, saliendo para Cambourg. <i>“¡Mis Cristos! Que Mis cristianos oren unos por otros, como Yo oré por ellos.”</i>"],[33]],[533,["Bastia. Tentación de dejarlo todo y volver a mi casa. <i>“¿Acaso Mis Apóstoles se retiraron a su casa para dedicarse a la contemplación?”</i>"],[4]],[535,["27 de septiembre. <i>“Si cambiaras los pensamientos de preocupaciones por pensamientos de amor hacia Mí, ¿no crees que eso te sería más útil y que al final serías más feliz?”</i>"],[52]],[536,["<i>“Con los demás tú puedes hablar pensando en otra cosa, pero conmigo, no.”</i>"],[34]],[537,["<i>“No tendrías mérito alguno en amarme si Me vieras...”</i>"],[42]],[538,["Leyendo en las revelaciones hechas a Ana Catarina Emmerich que Jesús había caído siete veces en su camino al Calvario, yo me decía: ‘¿Por qué no nos habrá querido decir todo esto el Señor en su Evangelio?’ Él me contestó: <i>“No por eso Me habrían los hombres amado más...”</i>"],[36]],[539,["<i>“Los que son Mis íntimos en la Tierra lo serán también en el Cielo.”</i>"],[34]],[540,["En Lozera. En el Grand Hotel pensaba yo en las mujeres que lavan la vajilla. Él me dijo: <i>“¿No acabas de entender que cualquier cosa puede hacerse por Mi Amor? Yo no veo entre esas cosas la diferencia que vosotros ponéis en ellas. Lo que tomo en consideración son los diferentes grados en el amor.”</i>"],[50]],[541,["En Lyon. <i>“¡Tú puedes, cada minuto, salvar millares de almas! Piénsalo. Pídelo. Ama.”</i>"],[4]],[543,["Marsella.<i> “Bórrate de tus propios pensamientos.”</i>"],[52]],[546,["3 de octubre. <i>“Ahora que has comprendido lo que es la vida en Mí, vigila para ver si pones Mi Suavidad en tus relaciones con el prójimo. Recuerda que tu prójimo es ‘Yo’. Dámelo todo. La vida está hecha de cosas muy pequeñas. Si Yo, por ejemplo, te quitara este pequeño sufrimiento, ya no podrías volver a ofrecérmelo.”</i>"],[54]],[547,["4 de octubre. Yo advertía que el anuncio de la paz había tenido lugar el 30 de septiembre, aniversario de la muerte de santa Teresita. Jesús me dijo: <i>“Los que son muy pequeños tienen gran poder sobre Mi Corazón. Y sobre todo, ten confianza. Cuando tengas una preocupación de algo que te es imposible, piensa que Yo te lo voy a arreglar, y entra en Mi Paz.”</i>"],[24]],[548,["6 de octubre. Yo iba a retomar mi vida ordinaria y Le decía: ‘¿Qué otra cosa puedo hacer por ti?’ Me dijo. <i>“Dame más de ti misma. Más Fe, más Esperanza, más Amor.”</i>\nY luego, en un tiempo de descanso: <i>“Cuando contemplas, pasa toda entera dentro de Mí, sin acordarte para nada de ti misma. ¡Os amo tanto!”</i>","6 de octubre. Al repetir una plegaria, pensaba yo: ‘Ahora voy a aburrirte, Señor.’ Me dijo: <i>“Una plegaria no puede cansarme. Soy sensible a toda manifestación de afecto.”</i>"],[11,16]],[549,["7 de octubre.<i> “¿Sabes lo que es una presencia? Vive pues en presencia Mía. En todas partes.”</i>"],[39]],[550,["8 de octubre. En Saint-Jean-d’Angely. “<i>Aún en los misterios gozosos tuvo siempre Mi Madre sufrimientos y sacrificios. Que en todos tus gozos haya siempre una parte para Mí.”</i>"],[28]],[551,["<i>“Si te he concedido la alegría es para que la comuniques a los otros con el encanto que Yo pondría. No te guardes nada y dalo todo en Mi Nombre. Ofrécete en tu cuerpo, como Yo Me ofrezco en la Hostia.”</i>","11 de octubre. Fiesta de la Maternidad de la Santísima Virgen María. “<i>Ella es Madre no solamente Mía, sino también tuya. Durante todo el día llámala ‘Madre’.”</i>"],[0,28]],[552,["12 de octubre. Le Fresne. <i>“Mira cómo todas esas casas reciben el sol en pleno y sin disminución. De igual manera, la hostia es toda entera para todos vosotros.”</i>","12 de octubre (1938). Le Fresne.<i> “Mira cómo todas esas casas reciben el sol en pleno y sin disminución. De igual manera, la Hostia es toda entera para vosotros.”</i>"],[8,20]],[553,["14 de octubre. Al dejar mi aposento de Fresne para ir a Vervins, Le dije: ‘Hasta la vista, mi Dios, que eres tan bueno.’ Él: <i>“Pero, ¡si voy contigo!”</i>"],[54]],[555,["19 de octubre. Por, la tarde, en la terraza, ante el Loira espléndido por la puesta del sol, Le agradecía tantas bellezas y flores. Me dijo:<i> “Es que quería que descansaras.”</i> (Yo regresaba de Vervins).","19 de octubre. Le Fresne. <i>“¿No has llegado todavía a comprender que Yo quiero estar siempre contigo? ¿Por qué obras por ti misma, siendo que estás en Mí? Yo Soy tu Íntimo. Que te sea imposible pensar fuera de Mí.”</i>"],[16,54]],[556,["20 de octubre. En el tren para Tours-Saint-Vertin. <i>“Le pido a Mi Madre que te prepare a recibirme. Pídeselo tú también en memoria de Su Primera Comunión del Jueves Santo.”</i>","‘Gracias del misterio de la Coronación de Espinas, descended sobre nuestras almas.’ Él: “<i>Cuando invocas de este modo las Gracias de los misterios del Rosario, cree que ellas vendrán a inundarte.”</i>"],[8,28]],[557,["29 de octubre. En camino hacia Bourges-Saint-Bonnet, cantaba yo, sola en el vagón, el canto ‘Dios solo’. Me dijo: “<i>Invita a Mi Madre a cantar contigo.”</i>"],[28]],[558,["29 de octubre. Bourges. <i>“Tú les pides con frecuencia a Mis sacerdotes que te bendigan. Pídeme a Mi directamente, Mi Bendición.”</i>\nEn la cripta de la catedral se hacía un entierro en una sala sombría, entre pilares. Yo besaba la Frente del Señor. Me dijo:<i> “Este beso durará por toda la Eternidad”.</i>"],[42]],[560,["4 de noviembre. En el tren para Isère consideraba yo Su Agonía. Era viernes. Le dije: ‘¡Cómo sufres, mi Señor!’ Me contestó: <i>“Sufro como Dios.”</i> Con esto quería decir que Su capacidad de sufrimiento sobrepasa la nuestra."],[36]],[561,["7 de noviembre. Saint-Ramberto d’Albon; en el otoño de la fiesta de San Martin daba gracias a Dios por los bellísimos paisajes. Jesús me dijo: <i>“Son derivaciones de Mi Dulzura.”</i> Luego, en un restaurante de Lyon, cuando miraba el azúcar deshaciéndose en el café, me dijo: <i>“Yo Me disuelvo todavía más en los Míos.”</i>"],[16]],[562,["Mende, 15 de noviembre. Longogua. Me dijo: <i>“¡Cómo te colmé ayer!”</i> Con esto se refería a la hermosa representación de ayer. Y añadió: <i>“Mi Bendición no te abandona. Pero si Me la pides, te la doy de nuevo.”</i>","Mende, 15 de noviembre. <i>“Cuando te venga algún pequeño sufrimiento, recíbelo recibas con mucha alegría. Eso nos unirá.”</i>"],[33,37]],[564,["Fourviére, 17 de noviembre. Después de la comunión hacía yo esfuerzos para lograr una buena acción de gracias. La Santísima Virgen me dijo: <i>“¿Por qué te complicas de ese modo? ¡Es algo tan sencillo! ¡Tan dulce y tan fácil! Tú, que gustas de las iglesias pobres, considera con piedad Mi Corazón, tan pobre.”</i>"],[8]],[565,["19 de noviembre. Ampuis. <i>“¡Si tuvieras más confianza, salvarías más almas! Todo lo que hagas, hazlo por ellas. Cuento contigo.”</i>"],[4]],[566,["21 de noviembre. En Vienne, Isere. “<i>Encárgate de Mis Intereses, Yo tomaré los tuyos. Permanece a Mis Pies.”</i>"],[49]],[567,["23 de noviembre. En la travesía de Niza a Calvi a bordo del ‘Bonaparte’ que se sacudía horriblemente, Jesús me tenía como encerrada en Su Corazón, y fui la única que no se sintió enferma."],[13]],[568,["23 de noviembre. En Calvi, Córcega. “<i>Yo seré para ti lo que tú quieras que sea.”</i>"],[2]],[569,["Bastia. “<i>Cuando hagas oración piensa en Mí cuando Yo tenía tal o cual sufrimiento, o estaba en tal o cual lugar. Esto dará mayor fuerza a tu plegaria.”</i>"],[34]],[570,["25 de noviembre, en Bastia. <i>“Que te guste ser pequeña, pues a Mí Me gusta que lo seas.”</i>"],[24]],[571,["29 de noviembre, en Corte. En la capilla de Cristo Rey. Le decía: ‘Señor, guárdame.’ Me contestó: <i>“Te he guardado hasta entregarme por ti: confía.”</i>"],[13]],[573,["3 de diciembre. “<i>Cuando ores a Mi Madre, únete a las expansiones que Yo tenía con Ella cuando vivíamos sobre la Tierra.”</i>"],[28]],[574,["3 de diciembre, en Bastia. “<i>Sírvete de tus manos, de tus pies, de tu aliento como si fueran los Míos. ¿Qué otra cosa deseo Yo, sino que estemos unidos?</i>\n<i>“Cuando ores al Padre, hazlo con Mis labios. Si te humillan, piensa que tus humillaciones completan las Mías. Nadie se arrepentirá jamás de haberse entregado al Amor”.</i>"],[49]],[575,["4 de diciembre. Después del éxito de la representación de ‘Una señorita vieja y trece muchachos’, asistía yo a la bendición del Santísimo Sacramento detrás de un pilar. Me dijo: <i>“¿De qué te serviría ponerte de rodillas sobre el pavimento si al mismo tiempo no te humillaras en tu corazón? Pon tu alma en la humildad. Ponla en la confianza y entonces podrás orar.”</i>"],[23]],[576,["Mientras se tomaban fotografías del grupo que representó ‘Una señorita vieja y trece muchachos’, algunas de las actrices insistían en estar cerca de mí, y yo estaba conmovida. Él me dijo: “<i>También a Mí Me conmueven las más pequeñas atenciones. Mi Madre te ofrece a Mí y Yo te ofrezco a Mi Madre”</i> (bajo el patrocinio de San José)."],[28]],[577,["5 de diciembre, al regreso. <i>“No hay crimen tan grande que lo sea más que el Amor. El Amor es más grande que todos vuestros pecados.”</i>"],[30]],[578,["Ajaccio, en la montaña de Solaria. <i>“Si tú hubieras dado a una amiga tuya un signo, ¿no te gustaría vérselo con frecuencia? Yo os he dado la señal de la Cruz. Sígnate con frecuencia, como signo de amor y de unión.”</i>"],[36]],[579,["<i>“¿Hasta cuándo dejarás de tener distancias conmigo?”</i>"],[17]],[580,["<i>“El amor es toda ausencia de separación.”</i>"],[1]],[581,["6 de diciembre. Ajaccio. Después de la comunión. <i>“Que no haya nubes entre tú y Yo. Si cometes una falta, repárala enseguida con un ‘Señor, te amo’ dicho de todo corazón.”</i>"],[12]],[582,["7 de diciembre. Llegada a la casa de las Hermanas de San José en Sartène. <i>“Esas pequeñas, quienesquiera que sean, piensa que Yo morí por ellas; esto te ayudará a sentir respeto por ellas.”</i>"],[5]],[583,["8 de diciembre. A la hora de la Elevación. <i>“Santo es aquel que tiene el mayor grado de Fe, de Esperanza y de Caridad. Ten, con todo respeto, la intención de reparar las irreverencias que se cometen en Mis Templos.”</i>"],[53]],[584,["11 de diciembre. En la iglesia de Sartene. “<i>La Trinidad está en ti. La Trinidad está en este templo. Y en Mi Madre, que os encierra a todos.”</i>\n599.1° de enero de 1939. Al despertar, apoyaba yo mi cabeza sobre Su Pecho y Le deseaba un año de Gloria: ‘Que dulces debieron ser para Tu Madre estos tiernos abrazos.’ Él: <i>“Mi Madre tenía con frecuencia menos privilegios, pues debía sufrir para ser la Corredentora del Mundo.”</i>"],[28]],[586,["En Bastia. En la Misa, durante el <i>Pater</i>. Yo: ‘¿Cómo es posible, Señor, que cuando Tú llevabas con tan atroces dolores Tu Cruz, no hayas salvado en esos solos minutos a todos los pecadores del mundo?’ Él: <i>“Yo he abierto el Cielo para todos, pero cada uno es libre. A vosotros os toca, Mis hermanos, completar la salvación de los hombres pidiéndomela y sufriendo por ellos.”</i>"],[44]],[587,["13 de diciembre. En la capilla de San Damián, en lo alto de la montaña. <i>“Renueva con frecuencia tu oblación de amor, sobre todo los viernes.”</i>"],[37]],[588,["14 de diciembre. Bastia, con las franciscanas Misioneras de María. <i>“Dime algo que encante Mi Corazón.”</i> Yo: ‘Señor, si yo pudiera encantarte con algo, sería con alguno de Tus Dones.’ Él: <i>“Mis Dones, cuando pasan por tu voluntad, Me llegan como si fueran tuyos. Ámame, aun cuando parezca intrascendente lo que haces. Búscame, ¡eso Me complace tanto! Y toma de Mí, para dar después.”</i>"],[13]],[589,["17 de diciembre. Misa en la capilla de las franciscanas, ante el Santísimo expuesto. “<i>Ofréceme tus pies, como Yo entregué los Míos; ofréceme tus manos, como Yo ofrecí las Mías”.</i>"],[49]],[590,["18 de diciembre.<i> </i>En la capilla, la víspera de mi partida, Me dijo con delicadeza: <i>“Yo seguiré viendo este lugar, en el cual tú ya no vas a estar.”</i>","18 de diciembre. <i>“Renueva con frecuencia los actos de humildad, como lo hacía Mi Madre.”</i>","18 de diciembre. <i>“Pídeme que cada momento presente contenga el más grande amor de tu corazón por el Mío.”</i>"],[16,23,25]],[591,["19 de diciembre. En la capilla. Yo: ‘Señor en otros tiempos los viejos servidores formaban parte de la familia. Después de diez años de servicio en la representación de comedias, ¿puedo sentirme parte de Tu familia?’ Él: <i>“¡Eres parte de ella desde el primer instante de tu vida, pues fuiste creada a imagen de Dios!”</i>"],[16]],[592,["Bastia, 23 de diciembre. <i>“¿Lo recuerdas? Cuando eras niña escribiste una vez en un cuaderno: ‘Habla, Señor, que tu sierva Te escucha’. De este modo crecerás en Mí. Repite: ‘Que mis miembros estén en los Tuyos, mi espíritu en Tu Espíritu, mi corazón en Tu Corazón y que nuestra vida sea una sola’.”</i>"],[49]],[595,["26 de diciembre. Yo: ‘Señor, me gustaría tanto que estas santas especies permanecieran en mí hasta mañana por la mañana’. Él: <i>“Haz como si me quedara.”</i>","26 de diciembre. Pensando en el Pesebre, yo pedía a la Santísima Virgen el favor de cantar para adormecer al Niño Jesús. Él me dijo:<i> “Aun cuando Me adormeciera, Mi Corazón seguiría velando por ti.”</i>"],[8,32]],[596,["27 de diciembre. <i>“Yo Soy el Hijo de Dios. Y por Mí tú eres la hija de Dios. Cada vez que tú te Me das, Yo te tomo.”</i>"],[35]],[600,["2 de enero. <i>“Como propósito de Año Nuevo toma el cuidado de Mi Gloria en todo lo que hagas. Y Yo prepararé la tuya.</i>\n<i>“Cuando tomes tus alimentos, pídeme que te nutra con Mi Gracia. Cuando te paseas, pídeme que te haga penetrar en Mis Jardines divinos.</i>\n<i>“Eres Mi creatura: dame lo que haya en ti de más delicado. Dámelo. Recuerda la pena que te causaba aquella pequeña salvaje que huía de ti. No Me hagas tú lo mismo.</i>\n<i>“Vive con el Padre, con el Hijo y te poseerá el Divino Espíritu. Yo viví en la Tierra en medio de la contradicción; no te admires, entonces, si también tú la encuentras.”</i>"],[54]],[601,["Enero de 1939, en Seine-et-Oise. <i>“No te envanezcas de nada. ¿Qué te importa que la gente piense de ti esto o aquello? Debe bastarte que Yo lo sepa.”</i>"],[23]],[602,["En el bosque, mientras dos hombre me colmaban de injurias porque sabían que yo iba a la iglesia: <i>“Alégrate de tener parte en Mis Ultrajes.”</i>"],[23]],[603,["1939. <i>“¿Por qué Me abandonas? Yo nunca te abandono a ti.”</i>"],[54]],[604,["<i>“Cuando el sacerdote cierra la pequeña puerta del sagrario, pídeme que Yo te encierre en Mi Corazón. Aprovecha cualquier oportunidad para hablar conmigo, como si en el Mundo no hubiera nadie sino tú y Yo.”</i>"],[13]],[605,["<i>“Un acto de bondad es un rasgo de semejanza conmigo.”</i>"],[5]],[607,["6 de enero. Nantes a Ozoir-la-Ferrière. <i>“No, Yo no Me acostumbro; para Mí es cosa siempre nueva.”</i> (Se refería a las conversaciones del alma).\n<i>“Y aquí estoy siempre contigo, para darte siempre más.”</i> Y añadió, recordándome mi vida: <i>“Tú has vivido siempre bajo Mi Cuidado. ¡Ojalá pudieras ser más tierna y más sencilla, como un niña, para conmigo!”</i>"],[15]],[608,["9 de enero, en Ozoir. <i>“Tú puedes salvar a los que Yo no he podido. Compréndelo: la más grande comedianta del mundo se disminuye si sirve a la Tierra; en cambio, es grande si se pone al servicio de Dios.”</i>\nEn el tren: <i>“Pide siempre por los que te rodean. Aquí. En los países que visitas. En todas partes.”</i>","9 de enero, en Ozoir. El tren se hallaba atestado de gente, y yo, quién sabe cómo, había logrado un buen rinconcito. Me dijo: <i>“Dame las gracias con cariño, como si hubiera sido Yo Quien te preparó tu sitio.”</i>"],[4,16]],[610,["13 de enero. En el tren para Poitiers me sentí llena de consolación. Él: <i>“Si tú permanecieras en tu casa al servicio de un egoísmo confortable, no recibirías tantas Gracias. Pero, ¿no es verdad que Yo sé recompensar a quienes Me sirven?”</i>","13 de enero. <i>“¡Aumenta, aumenta la intensidad de sentimientos de Fe, de Esperanza y de Caridad! ¿Crees que si con frecuencia Me pidieras que te haga santa, te lo podría Yo negar? Ejercítate en la Esperanza y en la Reparación; pues no hay arte que se pueda adquirir sin el ejercicio.”</i>"],[4,53]],[611,["18 de enero. <i>“Recuerda que Soy Yo el que goza de ti mientras vives sobre la Tierra. Te lo digo para animarte a ser Mi Encanto.”</i>"],[16]],[612,["20 de enero. En la estación de Nantes, de viaje para Lyon, Le decía: 'Señor, quiero viajar en Tus Brazos.’ Me contestó: <i>“En Mis Brazos no es bastante: entra en Mi Corazón.”</i> Después de un favor recibido, pensaba: ‘¡Qué bueno es!’ Él: <i>“Tú dices que Soy bueno en este momento. Pero siempre lo Soy, con una Bondad inconmovible. Es preciso que lo recuerdes, para mantener vivo tu amor.”</i>","20 de enero. Soissons. <i>“Difunde la alegría por dondequiera que pases.”</i> En mi soledad pensaba yo: ‘Ah, si Él estuviera conmigo en el vagón.’ Él: <i>“Tú no Me ves, pero aquí estoy. Siempre estoy contigo.”</i>"],[13,54]],[613,["27 de enero. Laon. En mi aposento del hotel Le Lion d'Or. Me dijo: <i>“¡Salva! ¡Imita! Mi oficio es el de salvar. Salva tú también, ofreciéndomelo todo. ¿Qué cosa hay que sea más verdadera que Mis Palabras?”</i>"],[44]],[614,["29 de enero. En la catedral de Laon. <i>“Con frecuencia te hago repetir las tres primeras peticiones del Padrenuestro: ‘que Tu Nombre sea santificado; que venga Tu Reino; que sea hecha Tu Voluntad’. Ahora repite esta otra: ‘Que me devore el celo por Tu Casa’.”</i>","29 de enero. Desde el tren miraba yo la catedral de Laon como suspendida y como horadando el cielo y la montaña. Me sentí feliz de que la hubieran construido con tanta magnificencia para abrigar al Hombre-Dios. Me dijo: <i>“Pero Mis templos mejores los tengo en vuestros corazones.”</i>"],[35,41]],[616,["3 de febrero de 1939. <i>“Mi Padre, el Padre Celestial, es más Padre tuyo que tu padre de la Tierra. ¡Créelo siempre así!”</i> Yo Le decía: ‘Tan miserable soy, Señor, que ni siquiera sé qué necesidades tengo’. Me contestó: <i>“Considérame como tu Proveedor. ¿Por qué no Me pides cosas? ¿No tienes confianza en Mí, que Soy Todopoderoso, que Soy el Amor? Ten siempre confianza absoluta, como de niño pequeño...”</i>"],[35]],[617,["4 de febrero, en el Metro. <i>“Cuando tú Me mandas una flecha de amor, Mi Omnipotencia la utiliza en seguida para socorrer a un alma necesitada. No tienes que tomarte el trabajo de designarla.”</i>"],[4]],[619,["Cardenac. <i>“Me gustan estos largos días de viaje porque en ellos Me toca a Mí la mejor parte.”</i>"],[39]],[620,["Nantes. 12 de febrero. Via Crucis, a las cinco treinta y cinco de la mañana. <i>“Durante la duración de este Via Crucis considerarás Mis Ojos. No podrás ver en Ellos sino una Dulzura extrema en medio de las crueldades y un extremado Amor.”</i> Viendo que yo trataba de precisar el número de mis pecados: <i>“¿Para qué cuentas? Yo perdono sin contar...”</i>"],[51]],[621,["14 de febrero. En Nantes, después de la comunión. <i>“¿No comprendes que Yo Soy tu vida? Yo te la organicé. Yo aquí, Yo allá, Yo en todas partes.”</i> Solamente al entrar en casa supe del horrible accidente del que me escapé el día anterior en Saint-Nazaire."],[16]],[622,["18 de febrero. De Vierzon a Rodez. <i>“Ten la intención de amar más cada minuto: así será tu Gracia cada vez mayor.”</i>","18 de febrero. De Limoges a Brive. Yo les decía a las Tres divinas Personas presentes en mi corazón: ‘Quisiera amaros como Vosotras mismas os amáis, pero no sé cómo.’ Él: <i>“Uniéndote.”</i>"],[3,48]],[623,["20 de febrero (1939). Rodez. En la capilla de las Hermanas de Nevers se preparaba el altar para el día siguiente. Él: <i>“El Banquete soy Yo.”</i>","20 de febrero. Rodez. Miércoles de Ceniza. En la Elevación me dijo la Santísima Virgen, cuyas lágrimas estaba yo considerando: <i>“Ten compasión de Él”</i>, y me invitó a orar por los pecadores. Luego me dijo Jesús: <i>“Contempla Mi Corazón durante todas las fases de Mi Pasión, a la manera como consideraste Mis Miradas en uno de tus Via Crucis.”</i>"],[8,51]],[624,["23 de febrero. En Rocamadour. Capilla milagrosa. <i>“Cuando contemples Mis Ojos, pídeme que haga Yo el bien por medio de los tuyos. Cuando contemples Mis Labios, pídeme que haga el bien por medio de tus labios.”</i> Ese día se veneraba la Santa Faz.","23 de febrero. En Rocamadour el hostelero me explicaba que aquellas excelentes trufas crecen a la sombra de los robles. Jesús: <i>“¿Qué frutos excelentes no darás tú si vives cerca de Mí, a Mi Sombra?”</i>"],[42,54]],[625,["25 de febrero, después de la comunión. <i>“Ten más confianza en Mi Misericordia y salvarás a más. Cree en la Comunión de los Santos. Mi Misericordia se pone al alcance de vuestra miseria. Comprende, pues, la confianza.”</i>"],[30]],[626,["28 de febrero. Le Fresne. Yo Le decía: ‘Puesto que no soy sino una niña pequeña, Señor, enséñame a caminar delante de Ti y de mis semejantes.’ Él: <i>“Repíteme con frecuencia esta plegaria.”</i> Luego pude, con mil dificultades, conseguir algo que necesitaba y Le daba las gracias. Él: <i>“Tú, dame almas.”</i>"],[4]],[627,["7 de marzo de 1939. De Rennes a Nantes. ‘Padre querido: cuando tenga que morir, si estuviera en cama, sería preciso que me despertaras. Yo quisiera morir en pleno conocimiento de sacrificio.’ Él: <i>“Es mucho más sencillo de lo que tú crees. Abandónate y déjame obrar. Haz cada uno de tus actos con el mismo amor, con la misma alegría con que lo harías si estuvieras en el Cielo. Busca únicamente Mi Gloria y todo te será dado como añadidura. Vive enteramente en el reino de tu interior.”</i>"],[38]],[628,["9 de marzo. <i>“Sé toda tú suavidad para tu prójimo.”</i>"],[5]],[629,["París, en la iglesia de Nuestra Señora de la Buena Nueva. Yo me preguntaba en qué consistiría esta suavidad para con el prójimo. Me dijo: <i>“La suavidad está en la bondad de la sonrisa, del gesto y en una gran simplicidad.”</i>"],[5]],[630,["En los Vosgos. <i>“No recites tus oraciones solo por recitarlas, sino llenándolas con un alma de amor. De lo contrario, sería mejor rezar menos.”</i>"],[17]],[631,["<i>“Si Yo te doy Fuerza y la guardas para ti, queda como está; pero si tú la comunicas a los demás, se multiplica al ciento por uno. Ten, pues, ánimo.”</i>"],[4]],[632,["Antes del Via Crucis. <i>“¿Irá a enternecerse el corazón de Mi pequeña hija?”</i>"],[51]],[635,["13 de marzo. Yo: ‘Señor, ¿cómo se hace para hablar con el prójimo con suavidad?’ Él: <i>“Trata de imaginarte cómo le hablaría Yo.”</i>","Raon-l’Etape, Vosgos. Yo pensaba que con tanta nieve era yo afortunada de tener un aposento calientito. Me dijo: <i>“Cuando tengas un motivo de alegría, alábame, alaba al Padre, alaba al Espíritu Santo. Son ocasiones de glorificar con renovado ardor.”</i>"],[5,48]],[636,["24 de marzo. Le Fresne. Fiesta de San Gabriel. <i>“¿Por qué te sientes sola cuando haces oración? Yo oro contigo. Juntos los dos, siempre.”</i>\nPasión. Después de comulgar. <i>“Dios está en todas partes. Si lo pensaras, tu adoración sería perpetua.”</i>"],[34]],[637,["27 de marzo.<i> “Te he colmado de Gracias para que confíes en Mí. Una Gracia que doy, la doy para siempre.”</i>"],[16]],[638,["28 de marzo. <i>“Tú has viajado mucho y has visto que la Tierra no es tan grande, pídeme la conversión de todos los pueblos. Pero aun cuando la Tierra fuera mucho más grande, ¿acaso tiene límites Mi Misericordia?”</i>"],[30]],[639,["29 de marzo, después de comulgar.<i> “Di: ‘Padre Santo, Te ofrezco a Jesús viviente en mi vida, a Jesús muriendo en mi muerte, al Corazón de Jesús palpitando en los latidos de mi corazón’.”</i>","29 de marzo, después de comulgar. <i>“Di: ‘Padre Santo. Te ofrezco a Jesús viviente en mi vida; a Jesús muriendo en mi muerte; el Corazón de Jesús palpitando en los latidos de mi corazón’.”</i>\nYo me preguntaba: ‘¿Soy purificable?’ Él: <i>“Todo puede ser purificado en Mi Sangre.”</i>"],[35,45]],[640,["30 de marzo. <i>“Te lo voy a repetir: cuida el momento presente, con el más grande amor.”</i>","30 de marzo. Pensaba en la aspereza de los sufrimientos de la Tierra. Él: <i>“Es que no has visto nunca Mi Gloria que los recompensa. Honra Mi Cuerpo.”</i> (Me lo decía de Su Cuerpo Místico, en el que se aumentan las riquezas de la iglesia)."],[25,37]],[642,["2 de abril, Domingo de Ramos. <i>“Cuando ores, cree que eres escuchada. Eso Me dará gusto y transformará tu plegaria.”</i>"],[34]],[643,["3 de abril, después de comulgar. <i>“Te llamo. Sube a la Morada de Mi Corazón. Escúchame, amiga Mía. ¿Reconoces Mi Voz? Porque todo el que escuche, oirá. ¿Qué tienes tú que hacer aquí abajo fuera de amarme? Amar es glorificar.”</i>"],[13]],[644,["7 de abril, Viernes Santo. En el tren para Túnez, por Aviñón. <i>“Quiero que Mi pequeña piense en Mí hoy durante todo el camino.”</i>\nEn la Turena miraba yo el paisaje primaveral y el agua sembrada de lirios blancos. Él: <i>“Que no haya en tu vida sino bellezas. Gestos amables y gentiles. Haz ver Mis Gracias. El mundo interior de las almas es lo que importa.”</i>"],[39]],[646,["Lo felicitaba yo por los dulces cánticos. Él: <i>“Recuérdalo: estos cantos no Me dirían nada si no fueran expresiones de amor. Di: ‘Quiero ser santa, toda llena de amor de Dios; purificada de toda falta, para agradar a Dios’.”</i>"],[1]],[648,["16 de abril. En la capillita de las Hermanas de la Asunción, en Sfax. <i>“Tú no Me ves. Eso es bueno para que crezcas en la Fe.”</i>","16 de abril. En Sfax. Domingo de Quasimodo, en Misa. <i>“¿No crees que Yo te escucho cuando oras? ¿No crees que te amo? Ora con Fe y con amor. Adoración y reconocimiento. Adora en humildad. Adora en confianza, con fe en Mi poder. Adora amando.”</i>"],[21,34]],[649,["17 de abril. En Soussa, ciudad árabe, pensaba hacer compras. Él: <i>“Lo que importa adornar es el interior de la casa que es tu alma. La quiero hermosa.”</i>"],[47]],[650,["Abril. <i>“Recogimiento. Cuando un vaso está lleno, el contenido se derrama si se inclina a derecha o izquierda, pero si se le mantiene hacia el cielo, permanece colmado.”</i>"],[41]],[651,["En el tren. <i>“Ayer pasaste cerca de la prisión y tratabas de imaginarte lo que sería la vida de esos reclusos en su soledad de una celda. Yo Soy el Gran Prisionero del Tabernáculo. Pero a Mí se Me puede visitar en Mi Soledad.”</i>"],[20]],[652,["Yo me apresuraba para terminar una oración. <i>“A veces quiere uno retener cerca del pecho a un niño pequeño. Pero el niño piensa que tiene otras cosas que hacer y le dan ganas de escaparse.”</i>"],[17]],[656,["20 de abril. <i>“Mira el Cielo con frecuencia. Eso te ayudará a desearlo más.”</i>"],[38]],[657,["En Lyon. <i>“¿Serás capaz de recorrer toda esta calle sin mirar a la gente que pasa, por darme un gusto?”</i>"],[37]],[658,["Después de la comunión. <i>“Mira con qué facilidad te distraes cuando dejas de pensar en el momento presente. Vuelvo a recomendarte que vivas en él. Imagínate lo que valdría una vida cuyos momentos presentes, todos ellos hubieran sido vividos para la Gloria de Dios.”</i>"],[17]],[659,["En el campo. <i>“Honra y saluda a los ángeles de tu terraza. Están aquí porque tú los invitaste.”</i> Recordé entonces que antes de salir había yo dicho a los ángeles: ‘Venid, sentaos en las bancas del jardín y alabad a Dios por todas las magnificencias del horizonte’. Él continuó: <i>“Honra a los ángeles de tu casa. ¡Ah! Si tuvierais algo de Fe viviríais más en contacto con el mundo invisible que con el visible.”</i>"],[21]],[660,["Una vez en que me bendecía un sacerdote. <i>“Es él quien traza el signo de la Cruz; pero Soy Yo Quien te bendice.”</i>"],[16]],[661,["22 de abril. Nantes. En Notre Dame. <i>“¿Sientes de veras que lo que importa en ti es tu alma? ¿Por qué Yo, que Soy el Amor, no habría de poder tener momentos de Amor misteriosos, secretos y escogidos? El perfume de un alma no es como el de otra.”</i>","22 de abril. Nantes. En Notre Dame. <i>“Alimenta las almas. Ayúdame, pues Yo Me sirvo de ti.”</i>","22 de abril. Nantes. En Notre Dame. Yo me sentía susceptible. Me dijo: <i>“Aprovecha tu sensibilidad; te fue dada para adquirir méritos.”</i>"],[2,4,23]],[662,["23 de abril. De Nantes a Fresne. Me di cuenta de que había estado a punto de perder el tren. Él: <i>“Tú no conoces toda la protección con que te cuido.”</i> En la noche: <i>“Vive solamente para Mi.”</i>"],[40]],[663,["24 de abril. <i>“Conoce finalmente Mi Amor. Dame el consuelo de creer en Él. Te cuesta creer que Dios pueda gozar de Su creatura, pero sin embargo así es. Inventa continuamente una manera nueva de amarme, ¿no te sentirías feliz sabiendo que Me haces feliz?”</i>\nEn Le Fresne, de regreso de Túnez. <i>“Ya estamos de nuevo en nuestra soledad: dame las gracias con amor. Como ves, no sé hablar sino de Amor. Porque Dios es Amor.”</i>"],[1]],[664,["25 de abril. <i>“Tú no eres nada. Menos que nada. Yo Soy tu Todo. Yo compuse el Pater con Amor, os lo enseñé con amor; no lo recéis nunca sin amor. Orar es acordarse de Dios.”</i>"],[34]],[665,["26 de abril. Visita al Santísimo Sacramento. <i>“¿Por qué no Me hablas de lo que has hecho hoy?”</i> (Habían sido trabajos de jardinería). <i>“Esto sería para Mí de mucha confianza e intimidad.”</i>"],[9]],[666,["28 de abril, después de la comunión. <i>“Goza de Mí. Interrumpe tus oraciones para gozar de Mi Amor.”</i>"],[20]],[667,["29 de abril. Nantes, en Notre Dame. Le expresaba mi tristeza de no poder trabajar para Él sino durante mi vida. Me dijo: <i>“Tu deseo es suficiente.”</i>\nYo tomaba un refresco después de un trabajo fatigoso. Él.<i> “Agradécemelo, como si Yo te lo acabara de ofrecer.”</i>","29 de abril. De Nantes a Le Fresne, en el tren, pensaba yo mirando las tierras cultivadas: ‘Él estará contento de que los hombres hayan cumplido tan bien sus deberes de trabajadores.’ Me dijo: <i>“Ah, ¡si todo este trabajo hubiera sido hecho por Mi Amor!”</i>"],[16,50]],[670,["2 de mayo. <i>“¿No entiendes que te llamo a la perfección? ¿Y no crees que la perfección de una sola alma es de gran utilidad para el género humano? Tú diles que hablen conmigo. Ves como la lluvia cae con dulzura sobre las pequeñas y frescas hojas de mayo. Imagina, pues, las precauciones que Yo tomo para acercarme a las almas.”</i>"],[47]],[672,["5 de mayo. Yo veía cubiertos de polvo los muebles que había limpiado la víspera. Él: <i>“Esto es la viva imagen del cuidado que debéis poner en purificar vuestras almas”</i> (por los sacramentales)."],[12]],[673,["6 de mayo. <i>“¿No te sucede todavía que Mi Vida humillada te proporcione gusto en las humillaciones?”</i>"],[23]],[674,["6 de mayo. <i>“Sí, escribe con mayúscula cuando hablas de Mí, porque Yo Soy el Principio.”</i>"],[15]],[675,["8 de mayo, en Le Fresne. <i>“Si me preguntas por nuevas maneras de amarte, te diré una sola palabra: Unión. Unión. Unión.”</i>","8 de mayo, en Le Fresne. <i>“Tú, que eres amante de lo bello, ¿por qué no copias la infancia? Cada alma conserva su personalidad: en esto reside la belleza del Cielo.”</i>"],[1,24]],[676,["16 de mayo. En Lyon, entre las dos representaciones de ‘La Cantante Callejera’. <i>“Si estas cansada, reposa tu cuerpo en Mi Servicio. Hazlo descansar, como si fuera el Mío. Sírvete de Mi Dulzura infinita. Dulzura, no podrías encontrarla suficientemente en ti misma; pero Yo Me siento feliz de darte lo que te falta. Dime que cuentas conmigo. Fuerza la puerta del Tabernáculo con golpes de amor. Me libertarás cuando liberes a otras almas. Lo que libera es el amor.”</i>"],[16]],[677,["17 de mayo. “<i>Ofrécete a Mí tal como eres, sin esperar a estar contenta de ti misma. Únete a Mí en medio de tus mayores miserias: Yo te recibo, reparo en ti lo que sea necesario; pero esto, si Me concedes tu confianza. Tenla y muy grande: ¿quién te ama más que Yo?”</i>"],[2]],[678,["18 de mayo. Yo pensaba en los cuarenta mártires postrados sobre el hielo. Él me dijo, como sonriendo: <i>“¿Te asombra que haya gente que Me ama?”</i>"],[37]],[679,["18 de mayo. En Nantes. Fiesta de la Ascensión. <i>“Pon juntos tus pecados y Mis Favores, y entona luego un canto de alabanza.”</i>"],[30]],[680,["12 de febrero. Yo le dije: ‘Señor, quiero estar siempre cerca de Ti, pero mi pensamiento se me escapa.’ Él: <i>“Llámalo con suavidad para que vuelva, y no te enojes, ¡Yo no Me enojo! Os conozco bien y os amo en vuestra buena voluntad. Es la paz que cantaron los ángeles cuando Yo vine a renovar el Mundo, ¡Con frecuencia Soy Yo para con vosotros más indulgente que vosotros mismos! Dame la alegría de comprobar que lo crees.”</i>"],[17]],[682,["23 de mayo. En el tranvía de Vellecour: <i>“Si te hablo es por lo indigna que eres de escucharme. Así es Mi Misericordia. Que tu alma tenga la semejanza de tu Madre</i> (la Santísima Virgen) <i>y de tu Hermano</i> (Cristo).” (Yo iba a la Fourvière).","23 de mayo. Lyon. <i>“Tú te inquietas porque no siempre estás pensando en Mí. Te inquietan también tus faltas y no te atreves a mirarme. Pero no ha de ser así.</i>\n<i>“Dáteme como eres. Yo conozco la naturaleza humana y vine a la Tierra para sanarla y elevarla. Trasplántate en Mí. No por tus méritos, sino por Mi Deseo. Une el cansancio de tu rostro a Mi Rostro desfigurado por los golpes; así repararás tus faltas y las de todo el mundo. Aprovecha todas las ocasiones de unirte a Mí.</i>\n<i>“¡Si supieras cuánto gozo Me proporciona la unión con las almas, comprenderías que Yo recompense a los que Me ofrecen con frecuencia los pensamientos de su corazón!”</i>"],[30,52]],[683,["25 de mayo. “<i>Vive en la intimidad conmigo. Cuando viajabas por el Canadá o en los desiertos del África, ¿no te sentías acaso más fuerte y más confiada? Pues, haz conmigo el viaje de tu vida.”</i>","25 de mayo. Yo me encontraba más fea que de costumbre. <i>“Que te guste la apariencia exterior que tienes: es la que Yo te he dado.”</i>"],[26,40]],[684,["Lyon. San José. 25 de mayo. <i>“Tú no comprendes el misterio de una semilla que se convierte en un árbol que da otras muchas semillas; tampoco entiendes los misterios de la electricidad, de las ondas, de tantas otras fuerzas que vosotros los hombres conocéis apenas. No te asombres, entonces, de los Misterios de Dios. Alégrate que haya Misterios. Con esto probarás tu confianza de hija del Padre.”</i>","Lyon. San José. 25 de mayo.<i> “¿La santidad? Es algo lento y progresivo como el paso de las estaciones. Fíate de Mí, Yo te ayudaré. Yo deseo tu santidad más que tú misma.”</i>"],[21,47]],[685,["Mientras yo deshacía un nudo difícil, Él me dijo:<i> “Así pasa con las almas. Hay siempre un punto débil que se puede alcanzar con paciencia y dulzura.”</i>"],[4]],[686,["Catedral de San Juan. Ocupada en buscarme un buen lugar para ver a los Fummazzioni, yo no había orado. Él me dijo: <i>“No me has dicho siquiera los ‘buenos días’. ¿Esto lo haces cuando entras en la casa de tus amigos?”</i>"],[20]],[687,["26 de mayo, a las 5:30. <i>“Desde el momento mismo en que despiertes pídeme almas. Reclámame que te dé pecadores. Me darías con ello un gusto que no puedes imaginar. Yo morí por todos. Y morí sin haber estado enfermo; morí lleno de vida. Morí porque fui torturado. Si tú no Me ayudas hoy, Yo no podría salvar a tal o tal alma: y ya sabes cuánto las amo. Sálvalas como si Me salvaras a Mí.”</i>"],[44]],[688,["<i>“¡Seguro que sí! Todo lo que digo a un alma lo digo para todas. Todas son para Mí Mis preferidas. ¡Si supieran de Mi Amor por cada una! Tú, cree en este Amor, y expándelo.”</i>"],[15]],[689,["<i>“Hay que tener confianza en los santos y en los ángeles. Cuando uno es todavía un niño anda en los brazos de todo el mundo. Uno se deja querer, y eso es del todo natural.”</i>"],[9]],[690,["28 de mayo. En la tarde del día de Pentecostés, después de tres Misas y dos bendiciones con el Santísimo, Le pregunté: ‘Señor, ¿he ganado algunas almas el día de hoy?’ Él: <i>“Lo sabrás en el Más Allá. Por ahora, conténtate con vivir de Fe, en unión conmigo.”</i>"],[21]],[691,["29 de mayo, en Ars. <i>“Pide, pide mucho. Me gustan los que son audaces cuando se trata del amor de Mi Gloria.”</i>"],[33]],[692,["30 de mayo, en Lyon. Yo: ‘¿El amor es eso que tengo cuando mi corazón late más aprisa pensando en Ti?’ Él: <i>“Eso es amor. Pero también hay amor cuando haces, pensando en Mí, un esfuerzo de virtud sin gusto alguno. No Me dirás que Yo te he abrumado nunca con el trabajo. ¿O es que Yo Me he tomado algo más de lo que tú podías darme? Yo sé medir.”</i>"],[1]],[693,["Yo tenía hambre y encontraba deliciosa la comida. <i>“Tú Me das las gracias por esta comida de la Tierra, y tienes razón. Pero piensa que esto es una imagen lejana de la satisfacción que hay en el Banquete Eterno, en la Divinidad de las Tres Personas.”</i>"],[38]],[694,["‘Señor, qué, ¿no podías salvarnos sin morir?’ Él: <i>“Morí para daros mejor la Vida.”</i>"],[36]],[696,["1° de junio, en el Ain. <i>“Escribe. Yo querría que nadie tuviera miedo de Mí; que todos miraran Mi Corazón lleno de Amor y hablaran conmigo como se habla con un amigo dilecto. Para algunos Soy un perfecto Desconocido. Para otros Soy un Extranjero, un Dueño severo, rígido al pedir las cuentas.</i>\n<i>“Son pocos los que vienen a Mí como a un familiar querido; y mientras tanto, ahí está Mi Amor esperándolos. Esperándolos tales como ellos son. Yo haré en ellos las necesarias reparaciones. Yo los cambiaré, y ellos tendrán entonces una alegría que no imaginan. Yo Soy el Único que la puede dar. Pero, ¡que vengan! ¡Diles que vengan!”</i> (Con una Voz llena de gran anhelo)."],[15]],[699,["<i>“Crucifícate conmigo. Y crucificarse significa una distensión contra su naturaleza, contra los propios deseos y el amor de sí mismo, en la pobreza, en la oscuridad, en la obediencia al Padre. Recuerda que la crucifixión es el preludio de la resurrección, es decir, de todos los gozos.”</i>","<i>“Crucifícate conmigo. Y crucificarse supone la distensión contra la propia naturaleza, contra los propios deseos y el amor de sí mismo, en la pobreza, en la oscuridad, en la obediencia al Padre.</i>\n<i>“Recuerda que la crucifixión es el preludio de la resurrección, es decir, de todos los gozos.”</i>"],[36,37]],[700,["7 de junio de 1939. Le Fresne, después de la comunión.<i> “Si tú crees en Mi Poder y en Mi Riqueza infinitas, ¿por qué no te Me entregas sin condiciones? Dame tu confianza y tu Esperanza, para que Yo sea glorificado en ti. Yo aprovecho la miseria.”</i>"],[19]],[701,["8 de junio. Yo Le preguntaba: ‘¿Cómo podré imitar la eminente perfección de la Santísima Virgen?’ Contestó: <i>“Piensa que eres su hija y que tienes la herencia de una Madre semejante. ¿Qué podríais ofrecerme vosotros en el dominio de lo espiritual, sino Mis Dones?”</i>","8 de junio. Fiesta de Corpus. Yo pensaba en la muerte de X. Jesús me dijo: <i>“La muerte que vas a tener es la que Yo he escogido para ti.”</i>","8 de junio. Yo le rogaba a la Santísima Virgen que me ayudara a curar las heridas de la Cabeza de mi Señor. Él me dijo: <i>“Lo que en verdad Me consuela es el progreso de un alma en el amor.”</i> Después de la comunión: <i>“Yo quise vivir en medio de los hombres. Viví con Mis Apóstoles y quiero vivir con los hombres hasta el fin del mundo. Es un deseo lleno de Amor.”</i> Después de haber orado por la mortificación: <i>“Ahora colócate bajo la Fuente de Sangre”</i> (Aludía a Su Flagelación)."],[28,31,42]],[703,["12 de junio.<i> “Desclávame de la Cruz. Llévame a la terraza y cuídame con tu amor. Siempre estoy herido. Rodéame con tus flores. Inventa delicadezas de cariño. Yo sufro por vosotros. Permanece en Mí, que Soy tu Principio, la Fuente de tu vida y de tu alegría y la Aurora de tu ser.</i>\n<i>“Por esta razón, cuando Me veas, podrás decir: ‘Te reconozco, aunque nunca te había visto’.”</i>"],[36]],[706,["16 de junio. Yo pensaba en tantos que me han amado, y con qué bondad. Él:<i> “Pero todos ellos te abandonaban de vez en cuando. Yo nunca te dejo. Siempre te tengo en Mi Pensamiento.”</i>"],[2]],[707,["<i>“¿Sabes lo que puede ser el Amor de un Hombre-Dios que llama, que pide vuestro amor, y que no recibe más respuesta que la risa que insulta?”</i>"],[12]],[708,["20 de junio. Yo pensaba para mí: ‘¿Será posible que Él se acuerde de alguien tan pobre de virtudes como yo?’ Él: <i>“Sí. En la Cruz pensé en Mi pequeña hija, con todas sus pobrezas, tal como ella es. ¡Si los hombres supieran! Mi Hostia consagrada: un solo Sufrimiento, una sola Alegría.”</i> (Entonces me acordé de la consagración de Montreal y de la de Corte). <i>“Tu temor de ofenderme es para Mí como una flecha que Me hiere de amor. Hija: que las heridas de amor que Me causan Mis fieles vengan a curar las heridas que Me causan la indiferencia, el odio y los desprecios.”</i>"],[12]],[709,["22 de junio, en el campo. <i>“Sé sencilla conmigo. ¿Qué es lo que se hace por la mañana o por la tarde en el seno de una familia? La gente se da un beso de afecto, y esto es del todo natural. A veces durante el día, con motivo de alguna palabra o un don, se intercambia una mirada, una mirada afectuosa. Hay impulsos de ternura. ¡Qué dulce es todo esto y qué reconfortante! ¡Si Me permitieran ser uno de la familia…!”</i>"],[10]],[710,["22 de junio. Yo había sido importunada durante mi tiempo de descanso por algunos servicios que se me pedían. Él: <i>“Me has causado más satisfacción con tu fidelidad en ser amable que si no hubieras interrumpido tu contemplación.”</i>"],[5]],[712,["24 de junio. San Juan Bautista. <i>“Ama ser pequeña.” </i>Luego, mientras barría, pensaba yo: ‘¡Qué pobre cosa, Señor, esta que hago por Ti!’ Él: <i>“¡Qué me importa lo que haces! Esta es para Mí lo mismo que otra que a ti te pareciera grande: Yo no considero sino el amor que ponéis. La intención de amor. ¿Comprendes?”</i>"],[50]],[713,["26 de junio. “<i>Donde Yo quiero habitar es en el fondo mismo de tu ser. Yo Soy la Vida, Yo te haré vivir. No tengas otra voluntad que la Mía, que es la misma de Mi Padre. Serás recompensada en el último día”.</i>"],[26]],[714,["En la Misa, a la hora del <i>Pater</i>.<i> “Yo compuse la oración del Padrenuestro para que todos vosotros la digáis...”</i>"],[35]],[715,["27 de junio. Yo me preguntaba: ‘¿Qué puedo esperar de Él el día de hoy?’ Él: <i>“Te será dado en la medida de tu Fe.”</i>"],[21]],[716,["Por la calle: <i>“Que tu mirada vuelta a Mí sea una comunión espiritual.”</i>","28 de junio. Nantes. <i>“Honra Mi Corona de espinas. Fue tan terrible para Mi Cabeza, pero tan dulce para Mi Amor. De hoy en adelante harás la Hora Santa los jueves. Quiero que pases esa hora conmigo. Al principio te será necesario un esfuerzo, pero luego no te costará. Recuerda las primeras veces que dormiste en el suelo y, ¿ahora? Lo mismo tus primeros Via Crucis. Te costaron, pero ahora no te cuestan. Hija querida, no Me abandones nunca, Yo estoy siempre contigo.”</i>"],[20,36]],[719,["2 de julio. En el tren: <i>“¿Ya lo ves? Simplemente con una sonrisa de amabilidad les has hecho el bien. Me has comprendido. Compréndeme más y entonces la unión será muy estrecha.”</i>","2 de julio. Yo había perdido mi carta de media tarifa. Él: <i>“Ofréceme esas pequeñas contrariedades como espinas tuyas que alivian el dolor de las Mías.”</i>"],[5,37]],[721,["5 de julio (1939). En el momento en que yo hacía una genuflexión en la iglesia. <i>“Si pensaras que Yo estoy aquí, Me saludarías de mejor manera.”</i>","5 de julio. Yo me escondía en Él, humillándome por mi orgullo. Él: <i>“¡Qué felicidad la de tener en Mis Brazos a una hija Mía que es muy pequeña! Ya sabes cómo suele querer la gente a los niños pequeñitos, los que no son capaces de nada por sí solos.”</i>","5 de julio. <i>“No pienses con ligereza en el Espíritu Santo. ¡Si conocieras Su Majestad!”</i>","5 de julio. <i>“Sacrifícame tu soledad y tu independencia. Cambia tu ser por el Mío. Y persuádete de que no perderás en el cambio, amiga Mía.”</i>"],[20,24,48,49]],[722,["Primer Viernes. <i>“¿Has oído decir alguna vez que alguien esperó demasiado en Dios? ¿O que alguno haya sido defraudado o traicionado por Él?”</i>"],[19]],[723,["8 de julio, Le Fresne, después de la comunión. Yo: ‘Señor, ¿me amas con la misma intensidad como si ya estuviera en el Cielo?’ Él: <i>“Mi Amor no cambia. Eres tú la que puede amarme con diferentes medidas. Haz, Mi pequeña, esfuerzos de amor mayores cada vez.”</i>"],[3]],[724,["10 de julio. <i>“¿Cuál es tu divinidad? ¿Eres tú o Lo Soy Yo? ¿Por qué, entonces, no piensas más en Mí que en ti?”</i>"],[52]],[725,["17 de julio. <i>“Qué, ¿es tan difícil pensar en Mí? Todo lo que te interesa, todo lo que hace la trama de tu vida, dímelo. Te escucharé con mucha alegría. Si supieras con cuánta atención... diles a tus hermanos que sean para conmigo como se e
