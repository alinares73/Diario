 de poner mi entendimiento, mi memoria y mi voluntad a los Pies de mi Salvador. Me dijo: <i>“Pon toda tu atención amorosa en el momento presente. Ten la devoción del momento presente durante toda tu vida. Nada de lo pasado. Nada tampoco del porvenir, solo el presente de amor.”</i>"],[25]],[1267,["10 de septiembre, en la iglesia de Ingrandes. <i>“Vive santamente en Mi Amor el momento presente, pues en eso consiste todo. Echa fuera las preocupaciones, las imaginaciones, las complicaciones. Dame simplemente tu alma a Mí, que Soy el Simplicísimo.”</i>"],[25]],[1268,["17 de septiembre de 1942. Le Fresne. <i>“¿Para qué hablarte si tú no tienes deseos de escucharme? Mi Corazón Se desborda. Ofréceme el deseo de derramar sobre todos esa oleada de Amor vivo. Yo Me ofrezco a todas las almas y a cada una; pero es preciso que alguien Me ayude para el encuentro. En otro tiempo dije: ‘Dejad que </i>(<i>los niños</i>)<i> vengan a Mí’. Ahora digo: ‘Ayudadlos para que vengan’. A esos que no Me conocen; a los que Me conocen, pero mal; a los que no quieren conocerme. A todos los aguardo con ardiente Amor.”</i>"],[15]],[1269,["‘Señor, ¡cuánta unción hay en Tus Palabras!’ Él: <i>“Mis Palabras van dirigidas con inmensa ternura a Mis hijos. Y tú las recibes de rodillas, como si Me recibieras a Mí. Escríbelas para siempre, pues otros las recibirán después de ti.</i>\n<i>“El bien fluye y renace con un renacimiento perpetuo en Dios. ¡Benditos aquellos que trabajan por el Bien! Pueden ya desde ahora descansar, como hijos muy amados, en Mi Corazón.”</i>"],[15]],[1271,["30 de septiembre. Iglesia de Ingrandes. <i>“Mi Corazón palpita en la Hostia como palpitaba cuando vivía Yo sobre la Tierra, como palpita ahora en el Cielo. Cristo no tiene sino un solo Corazón, porque Cristo es Uno. ¡Ya ves lo solo que estoy en una iglesia vacía! Consuélame creyendo firmemente en Mi Presencia. Yo preveía estas soledades y, sin embargo, instituí Mi Sacramento. Por una sola alma Lo habría instituido. Una sola alma hubiera podido gustarla… Conversa con la Hostia como con tu más dulce íntimo. La Hostia te escucha. Ensánchate, pues, bien segura de que eres muy amada. Descansa. Deja la Tierra, entra en el Espíritu, déjame arrebatarte. Dime que estás impaciente por alcanzarme, ofréceme tu fidelidad. Tú Me perteneces; ¿cómo podrías seguir siendo tuya? ¿No te sientes feliz de pertenecerme? Date. Date siempre más y con mayor frecuencia. Alarga tus impulsos. Y date a Mí dándote a tus hermanos.”</i>"],[43]],[1272,["8 de octubre, en la iglesia de Le Fresne. Yo decía: ‘Aquí estamos Tú y yo, como si nos hubiésemos encerrado con llave.’ Él: <i>“Invoca a Mi Madre durante todo este mes del Rosario, dándole el nombre de ‘Nuestra Señora del Amor’. Y dile: ‘Nuestra Señora del Amor, dame el Amor’.”</i>","8 de octubre, en la iglesia de Le Fresne. <i>“Llégate poco a poco, con el corazón lleno de fuego, al momento de la muerte. Y dale a esta muerte un nombre más dulce. Llámala ¡el Encuentro! y con eso Me tenderás ya desde ahora los brazos, aunque todavía no Me veas con nitidez. Tiéndeme los brazos. Que tu corazón esté lleno de anhelos encantadores y de amorosas impaciencias que Yo guardaré en el Mío.”</i>"],[28,31]],[1273,["17 de octubre. Yo le hablaba de los sentimientos que me gustaría tener en el momento de mi muerte.<i> “Dímelos desde ahora y los tomaré como Me los dices. Nada se olvida, nada se pierde.”</i>"],[31]],[1278,["12 de noviembre.<i> “Comprende, pequeña, que si Yo no estoy ya sobre la Tierra, os he dejado a vuestro prójimo; y que tus deseos de amarme, de servirme y de consolarme pueden tener su realización en el prójimo. En él puedes atenderme como antaño Me atendieron Marta y María. ¡Qué sonriente serías para todos si realmente vieras en todos a tu Jesús!”</i>","12 de noviembre. <i>“No debes asombrarte de tus lentitudes en llegar a Mí; pero has de pedir incesantemente la ayuda de lo Alto, que es donde está la ocupación de tu alma. No prives al Cielo de esos vuelos del corazón. Porque el Fin se acerca y tienes necesidad de contactos más cálidos y frecuentes con el Más Allá; así como cuando se hace un viaje se tiene gusto en vivir por adelantado lo que nos está aguardando. Di a tu Esposo: ‘¡Es tiempo ya de que nos veamos! ¿Cuándo me mostrarás la Dulzura de Tu Rostro? ¡Ya he caminado bastante en el desierto! ¿Por qué no puedo aún dejar esta Tierra árida y fría para caer entre Tus Brazos? ¡Enciende mis deseos! Apresura mis pasos, porque ya no puedo estar en ningún lugar. ¡Haz que mi alma se escape de la red de mi cuerpo y que ese soplo que Tú me diste se pierda en Tu Ser!’</i>\n<i>“Si Me hablas así Yo escucharé tu voz, pues Yo mismo estoy preparando el Encuentro.</i>\n<i>“Tú dirás: ‘¿En dónde está mi Amado?’ Porque todavía no Me habrás visto, aunque siempre estoy contigo, ya que estoy en todos los lugares.</i>\n<i>“Hija Mía, guárdate en el silencio. Ofrécete al Padre envuelta en Mis Méritos. Implora el Amor del Espíritu Santo y abandónate sin mirar atrás, como Yo en el Gólgota.”</i>"],[5,31]],[1282,["16 de diciembre. En la iglesia de Fresne. <i>“No te inquietes. Esas cosas en las cuales tú no puedes hacer nada, no son de tu incumbencia, sino de la Mía. Encomiéndamelas y eso es todo. Es preciso que no te falten oportunidades de ejercitar la confianza, y vosotros no sabéis cuanto aprecio Yo la confianza infantil de Mis hijos. Esos son los momentos en que podéis mostrar que sois pequeños y a Mí Me dan la oportunidad de cuidar de vosotros.</i>\n<i>“Nada de lo que te pasa es en vano. No estás en el error, sino solamente en una noche de penumbras en que la Fe va como a tientas. Así lo he querido Yo. Arrójate en Mis Brazos. Haz continuas afirmaciones de Fe, de Esperanza y de Amor y abandónate a Mí.”</i>"],[9]],[1284,["31 de diciembre de1942. <i>“Sé confiada, como Yo cuando era Niño, ¡Cuánto amamos Nosotros vuestra confianza! El mérito que hay en ella no se puede ya tener ni en el Cielo ni en el Purgatorio. Es una alegría de la Tierra. ¡Dánosla, pues! ¿No estás dispuesta a darnos ese gusto? Te despiertas en el Padre y te adormeces en el Espíritu Santo. Oye bien lo que Él te diga antes de que te duermas. Que no haya ninguna distracción con las cosas de afuera. Abandónate toda a esta dichosa unión y pon en ella tu última confianza, como si murieras cada día.”</i>","31 de diciembre de1942. <i>“Que no haya ninguna distracción con las cosas de afuera. Abandónate a esta dichosa unión y pon en ella tu última confianza, como si murieras cada día. ¡Cuántos ensayos podrías hacer para el momento de la muerte, nuestro Encuentro! Prepara tu alegría, pues Soy Yo el que va llegando; que tu corazón lata de prisa. Yo recogeré esos latidos: es Mi pequeña esposa que se acerca a Mí. Y seré Yo el que cante el cántico que tus labios ya no podrán entonar.”</i>"],[9,31]],[1289,["Al despertar. <i>“Ya sabes que ante Dios todo es presente: Mi Vida sobre la Tierra, Mi Pasión, Mis Sacrificios. Ten ánimo para los sacrificios que tengas que hacer y únelos a los Míos, porque así estarán siempre presentes a la Mirada de Dios.”</i>"],[36]],[1292,["21 de enero de 1943. <i>¿Vives tú realmente para Mí? ¿Estoy Yo realmente en el principio y en el fin de todos tus pensamientos? ¿O haces algunas reservas de interés personal? ¡Pequeña! ¿Qué interés más grande podrías tener que el de vivir toda para Mí? Dámelo todo y lo encontrarás todo y aún más. Yo no guardé nunca nada para Mí mismo y la esposa debe imitar a su Esposo uniendo su pobre amor al riquísimo Amor de Él. Envuélvete en Mí y estrecha en toda ocasión los lazos que nos unen. Yo nunca te dejo, pero... ¿tú?”</i>"],[52]],[1293,["<i>“¡Cuán pocos son los que viven como en familia con las Tres divinas Personas! Y sin embargo, Yo Soy vuestra Vida y vuestro Camino. Viviendo en Mí vivís en Ellas Tres. Sé, pues, sincera y tierna, con toda simplicidad. ¡Ellas te aman tanto! ¿Cómo podrías tú tener miedo de amarlas? Reduce, pues, tus deseos al solo deseo de vivir y morir en un único amor a las Tres divinas Personas, aunque solo fuera para agradecerles Su Amor. Tienes muchos motivos para ello, pero haz que tu actual soledad sea un vivir con ‘tus Tres’ amorosamente y sin esfuerzos. ¿Te acuerdas? Por las tardes Yo Me escapaba de las multitudes y Me retiraba a lugares solitarios para orar. Mi Alma iba derecha al Padre en un gran descanso de los trabajos del día.”</i>"],[48]],[1295,["30 de enero, en mi aposento. <i>“¿Por qué tenéis el hábito de ofrecerme solamente vuestras aflicciones? ¿No crees que la misma complacencia Me da el ofrecimiento de vuestras alegrías? ¡Con tal que el amor sea el mismo!”</i>"],[0]],[1296,["4 de febrero de 1943. <i>“Debe haber un encanto en tu voz y en todo lo que haces, ya que vives para Mí.”</i> Yo: ‘Bien quisiera estar segura de eso, Señor.’ Él: <i>“Repítemelo con frecuencia para que ante ti misma no pueda haber ningún equívoco. Y eso Me agradará. ¿Para qué o para quién más podrías vivir? Sí, Mi Amor tiene necesidad de Sus creaturas en una Intimidad de amor... Tengo necesidad de la ternura de Mis hermanos. Fui a mendigar la ternura de Pedro, Santiago y Juan durante Mi Agonía. ¡Y cuánto es lo que doy a las almas que, bajo el influjo de Mi Gracia, Me expresan su amor! Ponme delante de tus ojos y lo verás todo a través de Mí… Entonces habrá fiesta en Mi Corazón, porque el tuyo no podrá ya apartarse del Mío. Piensa con frecuencia: ‘solo Él tiene necesidad de mi vida, sea lo que fuere lo que otros puedan necesitarme’. Porque no hay otro fuera de Mí que tenga ese deseo con la misma intensidad. Es el Deseo de un Dios, ¿cómo podrías imaginar Su Magnitud?”</i>"],[10]],[1297,["11 de febrero. En la iglesia de Fresne. <i> “Acostúmbrate a caminar, como los ciegos, en la oscuridad. Ten confianza en que Mi Mano es la que te guía. La mayor ofensa que podrías hacerme sería la de dudar de Mí. Hija Mía, tan pequeña y tan débil, piensa con frecuencia: ‘¿Qué sería de mí sin Mi grande Amor? ¡Él lo es Todo y yo no soy nada!’”</i>","11 de febrero. En la iglesia de Fresne. <i>“No creas que la amabilidad con que debes dar testimonio y alabanza a la Bondad se refiere solamente al prójimo; también debe haberla en toda relación que tengas con Dios. A Dios se Le llama –y lo es– el infinitamente Amable. Sé tú también amable con Él, y el intercambio será dulcísimo. Solo más tarde entenderás lo bien recibidas que fueron tus amabilidades.”</i>"],[9,14]],[1298,["13 de febrero, después de la comunión. <i>“Lo que no puedes obtener de ti misma, como detener tus palabras irreflexivas, o el recordar la Presencia de Dios, te será más fácil si acudes a Mi Madre en busca de ayuda. Pídesela. A Ella confié Yo a la Magdalena y las otras santas mujeres. Haz lo que ellas: no la abandones.”</i>"],[28]],[1300,["18 de febrero. En la iglesia de Fresne. <i>“Te estaba esperando. Ponte silenciosamente a Mis Pies.” </i>Yo: ‘Sí, Señor mío; pero el peso de Tus Gracias me asusta un poco... ¿Cómo puedo corresponder dignamente?’ Él: <i>“¿Quién puede asustarse de la Bondad de un Redentor que por salvar a los suyos muere en la infamia? Nada hay en ti que pueda responder a Mis Gracias, fuera de la totalidad de tus afectos. Tu corazón puede ser muy poca cosa, pero Yo lo quiero todo. Algunas veces te he dicho que tengo necesidad de tu vida; pero ahora te digo que necesito tu corazón. ¿Te parece extraño que siendo Dios pueda decirte algo semejante? Pues así es. ¿Cómo explicarte lo que es el Deseo de un Dios? ¿Cómo explicarte lo que es la Locura de la Cruz? ¿La Locura de la Hostia? Recuerda que Dios es Amor, pero a veces se ve como obligado a contenerse en el Amor debido a la pobreza de vuestra comprensión. Recuerda también que cuando dije ‘les daré mi Carne como alimento’ muchos se apartaron de Mí. Yo escojo palabras que tú puedes entender. Necesito que Me des tu corazón, un corazón pobre.”</i>"],[3]],[1301,["18 de febrero. Al entrar a la iglesia: <i>“Te estaba esperando. Ponte silenciosamente a Mis Pies. Silenciosamente, que todo recuerdo de las cosas del mundo se apague. Te quiero toda para Mí. ¿Lo quieres tú también? Yo no tomo nada por la fuerza, siempre espero que Me den. ¿Te acuerdas de aquel pobre loco que iba todos los días por un camino en busca de su hija muerta años atrás? Yo espero siempre a Mis hijos. Algunos están muertos desde hace tiempo a la vida de la Gracia. Ruega para que finalmente Me den la alegría de creer en Mi Ternura misericordiosa.</i>\n<i>“¿Acaso no son Mis Palabras algo siempre nuevo en tu oído? ¿No sacas de Ellas una fuerza que te asombra?”</i>"],[26]],[1302,["Jueves Santo. <i>“La fiesta de Mi Corazón fue la Institución de este Sacramento. Ensaya este Jueves Santo un lenguaje fuerte y nuevo que Me diga tu amor agradecido. ¡Cuántas veces Me has recibido en la Comunión! Y el más feliz de los dos he sido siempre Yo.”</i>"],[8]],[1303,["25 de febrero. En la iglesia de Fresne. <i>Debéis aprender a contar Conmigo y no apoyaros en vosotros mismos. Si Pedro Me negó tres veces fue porque presumió de sí mismo. Pídeme siempre auxilio, pequeña Mía, pues ya sabes bien que eres nada y Yo Soy el Todo. ¿Cuándo llegarás a tener en tu Dios una confianza realmente absoluta? ¿Eres ya capaz de cerrar los ojos cuando Me das la mano? ¿Me has entregado el timón de tu vida? ¿Dudas todavía que Yo esté contigo? Pero siempre lo estoy y con una Presencia de Amor. ¿Entonces?”</i>","25 de febrero. En la iglesia de Fresne. Yo había estado a punto de hablar de una manera ridícula. Me dijo: <i>“Ya ves la diferencia entre un movimiento de la naturaleza y un movimiento de la Gracia, que modifica la naturaleza. Implora la Gracia. Aprende a retener tu precipitación instintiva. Este será el signo de tu sumisión amorosa, como una niña pequeña que antes de hacer algo mira a su madre para ver si lo aprueba.</i>\n<i>“a hoguera más grande que tú encendieras acabaría por extinguirse si, distraída con otras cosas, no te acordaras de alimentarla. Echa con frecuencia combustible a tu amor: sacrificios, admiraciones gozosas, miradas contemplativas, suspiros por Mí, lamentación por el pasado, deseos ardientes de Mi Reino y llámame frecuentemente porque no pido sino venir a ti. Pero Yo Soy como un pobre que suspira, como un tímido lleno de delicadeza: Me quedo siempre ante la puerta. ¿Estarán pensando en Mí las personas que hay dentro? ¿Piensan en Mí esos corazones que Yo he salvado?</i>\n<i>“Muchos Me dejan a la puerta sin invitarme a entrar, durante largos años. Pero si una voz humilde Me dice: ‘Señor, quédate conmigo’, créeme que entro en esa alma con todos los auxilios que necesita y con deseos de darle las gracias por haberme permitido que la ayude.”</i>"],[9,47]],[1304,["2 de marzo. En una iglesia. <i>“La iglesia está vacía, pero tú estás aquí. Suple la presencia de todos los que no pudieron venir porque no tuvieron tiempo. Tú, toma este tiempo y dámelo. Cuando ya estés en la Eternidad le darás a este tiempo mucha mayor importancia que ahora. Los hombres dejan lamentablemente perder este tesoro de tiempo destinado a comprar la Gloria, el Amor, un conocimiento creciente de Dios. ¡Méritos y más méritos!</i>\n<i>“Pequeña, que todo lo tuyo sea Mío. Ofréceme tus horas como un ramillete por Mi Reino y por Mi Honor. Cuando suene el reloj, mírame con una sonrisa: ‘Otra hora más por Ti, mi Amor’. Esa hora, Yo sabré bendecirla. Mis Días y Mis Noches eran para el Padre y para vosotros; nunca Me reservé nada. Dámelo todo, porque la esposa injuriaría al Esposo si no correspondiera a Su Amor.”</i>"],[43]],[1307,["18 de marzo. Iglesia de Fresne. <i>“Trasmítele a Mi Corazón, en voz baja, la alegría del tuyo. Tus palabras serán como una recompensa. ¿No eres feliz colocándome en la intimidad de tu existencia? Que sean cada vez más frecuentes esos viajes al interior de tu gran Amigo: eso será bueno para los dos. Participa en el consuelo que el Ángel Me dio en Getsemaní. ¿En qué consistió? En el pensamiento de que vosotros habríais de sacar provecho de Mi Agonía y de Mi Sangre que empapaba la Tierra como una savia potente.”</i>","18 de marzo. Iglesia de Fresne. <i>“Invítame siempre: a la mesa, por ejemplo. Cuántas veces acudí a comer con otros durante los años de Mi Vida pública. Y lo hice no solo con los Míos, sino también con los fariseos. Invítame también a tus jardines: conversaremos y te parecerán aún más hermosos. Recuerda que Yo lo creé todo: las mariposas y las flores, para vuestro contento.</i>\n<i>“Para vosotros es... para ti... la Naturaleza con todos sus perfumes. ¿Acaso no son delicados y suntuosos estos regalos Míos? Pero, ¿cuántos son los que se acuerdan de darme las gracias por esta radiante mañana de primavera?”</i>"],[36,39]],[1309,["25 de marzo. Iglesia de Ingrandes. No tenía yo sino muy poco tiempo para el al Santísimo. <i>“Lo principal es que seas fiel, es el sentimiento lo que importa. Cuenta más la intensidad del afecto que el número de minutos de la visita. Que salga como una flecha de tu corazón, sin mirar ni a derecha ni a izquierda; dame el placer de ser Yo tu único objetivo. Como las santas mujeres de mi tiempo, que vivían totalmente para su Cristo. Ámame y con eso todo quedará dicho, todo quedará hecho. ¿Sabes cómo se ama? Conservándose siempre cerca del Amado.”</i>"],[1]],[1310,["29 de marzo. Mientras yo pasaba la sagrada hostia.<i> “Di: ‘Aquí está mi Corazón, que entra en mí’.”</i>"],[8]],[1311,["1º de abril. En la iglesia de Fresne. <i>“Yo te escogí para que hagas ver lo simple y gozosa que es la vida de amor, el lenguaje del amor, la conversación de amor. Todo se reduce a mirarme como al Amado, porque entonces todo en el alma converge hacia Mí y Yo atraigo todo lo que hay en ella.</i>\n<i>“Y cuando en tu vida Soy Yo el Amado, tus pensamientos Me rodean; tus palabras están impregnadas de ternura y tus suspiros son más ardientes. Nada te sujeta, sino Yo; tú estás atenta solo a Mi Voz y no buscas sino Mi Beneplácito. Si he puesto sobre tu cabeza coronas de oro es para recibirlas luego de ti como regalos de amor. Tú inventarás la manera de dármelos; en esto reside el matiz especial de cada alma. Que la tuya Me sea dulce como un refugio en que Yo busque abrigo; porque, asilos, tengo pocos sobre la Tierra. Cuando un corazón está lleno, no queda lugar para Mí, que morí por todos. Invita a tu Amado a entrar en ti; de día, de noche; y acógelo dándole lo mejor, lo más dulce, lo más íntimo y escondido que tengas. Tu Amado es amigo de los secretos y está dispuesto a comunicarte Él también los Suyos. Los escucharás por largo tiempo, porque resuenan dentro del alma y su sonido no se parece a ningún otro. Es la Voz de Dios, la Voz del eterno Amor.”</i>"],[1]],[1312,["8 de abril de 1943. En la iglesia de Ingrandes. <i>“Acércate a Mí. Muy cerca. Háblame al oído con el lenguaje de los grandes secretos; que tu corazón se vuelque en el Mío. Nunca Me has dicho demasiadas cosas. No eres suficientemente confiada. Dímelo todo, dámelo todo, con profunda humildad. Como Juan, a quien Yo tanto amaba, y que escogía siempre el último lugar. Tú Me darás gozo y consolación, como Juan. No creas que abundan los que tienen la intención de consolarme y estén dispuestos a tomarse una molestia para darme una prueba de amor. Y sin embargo, aun a vosotros os da gusto cuando recibís una prueba de afecto. ¿Qué decir de Mí, el más tierno, el más afectuoso, el más sensible?”</i>","8 de abril de 1943. En la iglesia de Ingrandes. <i>“Nada que sea inútil, ni en las palabras ni en los ademanes. Nada que esté fuera de Mí. Todo Me lo ofrecerás en tu corazón y Yo dispondré de todo. Así serás Mi pequeña colaboradora, porque en Mi Vida nada fue inútil, ni siquiera una Mirada o un Pensamiento. Y Mi Finalidad era solo una: Mi Padre y vosotros. Así, vive tú solamente para el Reino de Dios y para la salvación de los hombres. ¡Es tan poco lo que queda de vida sobre la Tierra!... Si Me comprendieras bien, vivirías en medio de la Creación como si nada existiera. Tus ojos no acabarían realmente de abrirse sino sobre tu gran Amigo, tu Creador y Salvador, tu último Fin, que alcanzarás mañana. Es el encuentro continuado, ¡alégrate!”</i>"],[10,39]],[1313,["15 de abril en la iglesia de Fresne. En el camino, Él me había dicho: <i>“por un pecador”</i>. <i>“Sí. Cuando recorras tus kilómetros, hazlo como si fueras a buscarme un pecador. Únete a Mí cuando caminaba, en medio del calor, hacia el pozo para encontrar a la samaritana. Únete a Mí en toda circunstancia, y Yo estaré en ti.”</i>","15 de abril en la iglesia de Fresne. <i>“Tú, que has contemplado Mi Agonía y has visto algo de la fuerza de Mi Dolor, debes pensar más que los otros en consolarme. Has conocido Mi Amor, ¿no tienes por eso que amarme mucho más?</i>\n<i>“Hija, nunca harás demasiado trabajando en el florido jardín de tu alma enamorada de tu Salvador. Yo Soy el Dueño del jardín y sé cómo recoger y aspirar sus perfumes profundos, en una como embriaguez de reposo. Como si se interrumpieran los tormentos del Huerto de los Olivos para beber algo de fuerza en tu amor delicado.</i>\n<i>“Ya ves el poder que tenéis sobre Mi Sensibilidad, ¡Aprovéchala! No temas. Yo, como si Me olvidara de que Soy Dios cuando Me entrego, Me doy todo empequeñecido por vosotros, débiles hijos Míos...”</i>"],[4,10]],[1314,["Jueves Santo. Fresne. Yo pensaba que había venido a visitar al Santísimo Sacramento dos veces por la mañana, dos por la tarde e iba a volver una vez más. <i>“Todo un día para Mí una vez, al año, ¿crees que es demasiado? Mi Eucaristía está entre vosotros todos los días y todas las noches. Aquí estoy, lleno de Ternura y rico en Gracias que quiero dar. No Me digas, entonces, que todo un día tuyo sea para Mí demasiado. Piensa en la Fiesta que hay en Mi Corazón...”</i>"],[43]],[1317,["13 de mayo. Hora Santa, en el campo. <i>“Convéncete de que no eres nada, ni eres capaz de nada. ¿Qué sería de ti si Yo no estuviera contigo? ¿Qué podrías tú decir si Yo no te hablara? Yo te muevo y te llevo, sin Mí vivirías en la extrema pobreza. Pero tú tienes dificultades para creer en un Amor así. Y sin embargo, debes rendirte. Di dentro de ti misma: ‘¡Es verdad! Creo que si no hubiera que salvar más alma que la mía, Tú habrías querido sufrir y morir por mí, porque Tu Ternura no tiene límite.’ ¿Crees que una palabra semejante no Me haría feliz? Lo peor de todo está en haber sufrido tanto y ser desconocido y olvidado en tantos corazones fríos como el hielo. Mi Corazón es una Hoguera de celo y de Amor por vuestras entregas; pero ¡qué pocos son los que se dirigen a Él! Ruégame por ellos. Tu plegaria será como una razón para conceder Gracias nuevas.”</i>"],[1]],[1319,["20 de mayo. En la iglesia de Ingrandes. <i>“Enciende tu amor. No omitas un solo paso, ve siempre adelante. Entra todavía más hondo. Pídeme la Gracia de responder a este Amor de tu Dios y Yo encenderé en ti un fuego nuevo, que te asombrará. No podrás atribuirlo a ti misma, sino que dirás: ‘Es Él quien me lo da’. Y será verdad. Tú por ti no tienes ninguna fuerza. Abre para Mí tu cámara secreta, para que podamos hablar de nuestro nuevo Amor. Las palabras serán las mismas, pero tendrán un alcance distinto y entonces no podrás ya comprender cómo podías pasar un solo instante sin Mí. Donde esté tu tesoro, allí está tu corazón. ¡Hace tanto tiempo que lo deseo! Pídeme ser toda para Mí y Yo seré todo para ti. Cuando no tengas nada que decirme, vendrás a la cámara secreta para mirarme. No tendrás que esperar, pues ahí estaré Yo y sabré lo que piden tus miradas. Y si no sabes cómo decirme las cosas, te quedarás ahí, a Mis Pies como Magdalena y Yo leeré en ti. Conserva pues tu lugar en la cámara secreta. ¡Cuántas alegrías te tengo preparadas!</i>\n<i>“No tengo sobre la Tierra muchas de estas cámaras secretas. Ahora escojo la más miserable. Igual que antes...”</i>"],[3]],[1320,["23 de mayo. Después de la comunión. Él: <i>“Tú no tienes la oportunidad de echarte al agua para salvar a alguien. Es en las circunstancias ordinarias de la vida donde puedes, por Mi Amor, entregarte al servicio del prójimo. Cosas de nada, pero cargadas de un afecto que las haga encantadoras. Es la intención lo que busco siempre en ti.”</i>"],[5]],[1321,["27 de mayo. En el campo, en una iglesia. <i>“¿Has llegado a comprender Mi Amor? ¿Piensas incesantemente en él? Esfuérzate por creer en él todavía más, porque es una delicia penetrar en él. Vive de Mi Amor; salúdalo todos los días al despertar, y por la noche duérmete en Sus Brazos. El Amor y Yo somos la misma cosa.</i>\n<i>“Pero muchos hombres se forman una triste idea de Dios, una pobre idea de Jesucristo. Por eso les falta el entusiasmo de vivir. Solo Yo puedo saciar vuestro corazón. ¡Pobre gente, esa que pide la felicidad a quienes no la poseen! Ahora dime, ¿dónde podrías buscar la felicidad fuera de Mí? Yo te he amado desde toda la Eternidad y esto tú no lo puedes comprender. ¡Desde toda la Eternidad! Cree y agradece. Y luego, ábrete a Mí, como una flor que se abre al sol y se despliega por él. Ábrete por Mí e irrádiame; trabajo exquisito para un alma que une sus fuerzas a las de Dios.”</i>","27 de mayo. <i>“Por lo que a ti toca, unifica por adelantado nuestras dos muertes: la Mía y la tuya. Yo morí por ti; tú, muere por Mí.”</i>"],[2,31]],[1322,["10 de junio, aniversario de mi Primera Comunión. <i>“¡Cuántas otras has hecho después! ¿Puedes contar las veces que te Me he dado todo entero? ¿Puedes imaginar el Amor que Yo he puesto en esas comuniones? Necesitarías conocer lo que es la Naturaleza Divina. Dame las gracias muchas veces.”</i>","<i>“Si Me hablas, te haces a ti misma un bien, pues tengo una respuesta precisa. Una respuesta de tu Dios vale bien la pena de que Le hables según la máxima medida de tu amor. Búscala, empléala. No tengas vergüenza en amarme ni en decírmelo. Soy Yo Quien te dará el impulso. Soy el Director de la Orquesta, tomo las sonoridades de tu alma con sus dulzuras y violencias y las hago subir a Mi Padre, mezclando con ellas Mi propia Voz. Y en el momento de la muerte Yo seré tu canto del cisne, pues entonces te faltarán las fuerzas, no tendrás ya contactos con la Tierra y todavía ninguna vista sobre el Más Allá. Tendrás entonces el abandono del Gólgota y te unirás así mejor que nunca a Mi Corazón abandonado; estaremos así juntos para dar el paso.”</i>","10 de junio. <i>“En el momento de la muerte Yo seré tu canto del cisne, pues entonces te faltarán las fuerzas. No tendrás ya contactos con la Tierra y todavía ninguna vista sobre el Más Allá. Tendrás entonces el abandono del Gólgota y te unirás así mejor que nunca a Mi Corazón abandonado; estaremos juntos para dar el paso.”</i>"],[8,15,31]],[1323,["10 de junio. <i>“Ríndeme cuentas de tu amabilidad. Quiero que cada día no tengas para ofrecerme sino palabras de exquisita Caridad y amabilidad. Que se acabe de una vez por todas tu espíritu burlón, que no es el Mío. ¿Cuándo has leído en el Evangelio una palabra sarcástica en Mis Labios? Considera el bien que puedes hacer con el encanto de tu conversación y con una bondad paciente. Hija Mía, aseméjate a Mí. Seamos Uno. ¿Quieres? Pídeme que Yo aprisione para siempre tu corazón en el Mío; porque si vives prisionera en Él, ¿cómo podrías no ser amable?”</i>"],[5]],[1327,["7 de julio de 1943. <i>“Insisto en la Unión. ¿Por qué quedaros solos, cuando podéis vivir en Mí? Porque estar en Mí es la esencia del Cielo, prescindiendo de la Visión y Sus Delicias. “Ejercítate pues en vivir en Mí y en darme tu adoración y tu cariño. ¡Lo que harías si Me vieras! Te arrojarías a Mis Pies, Me abrazarías, Me darías infinitas gracias por Mis Sufrimientos y Mis Beneficios; Me pedirías perdón por tus faltas voluntarias y Me dirías mil palabras de amor. Haz todo esto como si Me vieras. Este ejercicio de Fe trae consigo la Esperanza y la Caridad; porque si estás segura de Mi Presencia, ¿cómo no desear la Unión con el que te ama infinitamente?”</i>"],[53]],[1328,["15 de julio. <i>“Piensa que es muy poco lo que te impide verme, y vive con la emoción de saber que siempre te estoy mirando.”</i>"],[29]],[1329,["22 de julio. ‘Señor, ¡cómo querría reemplazar a Magdalena sobre la Tierra, pues sé que su amor Te era muy dulce!’ Él: <i>“Ofréceme el amor de Magdalena. Porque a Mí todo Me es presente, y por la comunión de los santos, todo te pertenece. Te cuesta trabajo creer en estos misterios, que son una invención de tu Dios. Aprovéchate de su Magnificencia y cree en Ella. Todas Mis invenciones son para bien de Mis hijos, no para Mí. Humíllate tú como se humilló Magdalena, en la Fe y en el Amor. Dime en secreto y con frecuencia, tus faltas…</i>\n<i>“El sacrificio que más agrada a Dios es el de un corazón roto de dolor, y el dolor más grande que puedas tener es el de no amar bastante. Toma pues el amor de todos los santos y ofrécemelo como por primera vez. Pide a Magdalena que te ayude, ella, que tan bien supo amar. Invítala, y cerca de vosotras dos encontraré Yo la morada íntima de las confidencias, de esas conversaciones que no se expresan sino con silencios.”</i>"],[7]],[1337,["7 de octubre En la iglesia de Montrelais. <i>“Tú te dices a ti misma: ‘¡Oh, si por lo menos tuviera la seguridad de que Lo consuelo!’ Pero recuerda que siendo Dios, Soy también Hombre y que a un hombre se le puede consolar.”</i>","7 de octubre En la iglesia de Montrelais. Yo Le daba gracias por haberme librado del bombardeo. Él: <i>“Sí, dame siempre las gracias. Te he dado mucho. Y ahora, si te mandara alguna tribulación, ¿Me darías las gracias? Tendrías que hacerlo, pues todo lo hago para el bien de las almas. No dudes de ello y cree en Mi Amor. Espera en Mi Amor, ama Mi Amor. Si así lo haces, lo recibirás todo como venido de Mí, y Yo seré tu único motivo en todo lo que hagas. Si esperas en Mi Amor, ya no contarás más contigo misma y Me encontrarás en todas las circunstancias difíciles, pensando que si tú no puedes nada, Yo lo puedo todo. Y así permanecerás confiada y en paz. Y tomarás de nueva cuenta tu tarea de amor, feliz de sufrir algo por consolarme.”</i>"],[10,22]],[1338,["15 de octubre. Iglesia de Ingrandes. <i>“No pierdas un minuto, hija Mía. Es poco el tiempo para salvar tantas almas. Y no creas que la salvación se obtiene solamente con oraciones: todo sirve, aun las más ordinarias acciones de la vida, si se viven para Dios. Ofrécemelo todo, unido a Mi Vida terrena. Reviste con esa riqueza a los pobrecitos pecadores, los más de ellos ignorantes. Preocúpate por ellos, tú que tanto has recibido. Pagarás así a la Justicia y Me darás consuelo. Ofréceme todas las cruces de la Tierra, tan numerosas en este momento; casi nadie piensa en ofrecérmelas como expiación por los pecados. Tú, que sabes de esto, ayuda para que nada si pierda. Dame almas. Tengo Sed.”</i>"],[44]],[1339,["3 de noviembre.<i> “Tú te inquietas por esta hora de oración, temiendo hacerla mal, pero ya sabes que estamos juntos: lo que falte lo supliré Yo. ¿No es así como sucede entre amigos? ¿No es lo mismo que tú harías con una persona muy querida? ¡Cuánto más Yo, tu Dios y Salvador! Lo que más quiero de ti es la confianza. Sábete que en toda situación puedo ayudarte y que Mi Corazón encendido lo desea. Tengo un inmenso anhelo por vuestra perfección; sois Mi Cuerpo y Mi Cuerpo debe ser perfecto. Mantén tu voluntad unida a la Mía. Desea ser lo que Yo he querido que seas y pon en este deseo todo tu amor y tu intensidad. ¡Qué hermosa vida la de los corazones unidos! Yo estoy dispuesto, os aguardo a todos para la gran Fusión.”</i>","3 de noviembre. <i>“No os quedéis a mitad del camino. Acercaos y entrad sin temor en Mi Corazón, vuestra eterna Morada. Mi Corazón, que es la Casa paterna, vuestra Mansión de Reposo y Felicidad. Entrad. Es vuestra Casa y en Ella sois esperados. ¿No es muy dulce ser esperados? Se ha preparado para vosotros un Banquete, y el Banquete Soy Yo mismo. El que sirve es el Amor. Que tu ternura, hija, te ponga en condiciones de ser el comensal más atendido y más encantado. El Banquete no termina nunca. Se desarrolla primero en el misterio y la penumbra de los secretos; se ilumina a la hora de la muerte. Es solamente entonces cuando el alma ve Quién es el que la recibe, la ama y la guarda.”</i>"],[9,13]],[1340,["11 de noviembre de 1943. Iglesia de Fresne. <i>“Es preciso que te arraigues en un solo deseo, el de no vivir sino para Mí. Tu vida será colmada. Hace tiempo aguardo la dicha de darte más. Ayúdame. Pídemelo. Tiende hacia Mí tus manos vacías. Déjame lugar, todo el lugar. Comprende que vives en el destierro y esperas el regreso del Amado. Escúchalo de lejos y dile: ‘Acerca Tu Aliento al mío. Tu Morada será mi morada; yo no podría vivir sin Tu Paso en el mío, sin Tu Voz en mi voz’”</i>","11 de noviembre de 1943. Iglesia de Fresne. <i>“Intensifica tus miradas de amor: que sean como el complemento de tus acciones y como la respiración de tu alma. Porque la palabra de amor sigue con facilidad a la mirada de amor. Es la vida de dos que no son sino Uno.”</i>"],[3,29]],[1341,["18 de septiembre de 1943. En la iglesia de Fresne. <i>“Pídeme el don de la buena voluntad, ya que bien sabes que no puedes vivir sin Mí. Ni siquiera puedes pronunciar Mi Nombre con amor si Yo no vengo en tu ayuda. ¡Mi pobre pequeña! Pero por otra parte sabes que Mi Auxilio no te puede faltar si Me lo pides. Yo no puedo rehusar nada a Mis pequeños, pues Mi Corazón está ya enternecido antes de que ellos empiecen a hablar. ¡Son tan débiles Mis pobres hijos! Si realmente conocieras el Amor que sufrió y murió por vosotros... Su Fuerza y Su Ternura... Yo, con cariño más que de madre, guío vuestros pasos por los caminos que mejor convienen; Mi objetivo es vuestra santidad, cerca de Mí, como otros Cristos.”</i>"],[30]],[1342,["25 de noviembre. Iglesia de Ingrandes. <i>“Ofrécemelo todo, hasta tu respiración. No solo la respiración del cuerpo, sino todo el flujo de los pensamientos de tu alma. Parece algo insignificante, pero en eso está toda tu vida, y toda tu vida Me pertenece, pues Mi Amor posee todos los derechos de conquista. ¡Qué tristeza para nosotros dos si algo de tu alma se Me escapara! Estrecha siempre más, Mi pequeña, los lazos que nos unen. Conviértete en una gozosa prisionera Mía. Yo acompaño fielmente a los que Me son fieles. Los lleno de fuerza y de consuelo, a ellos, que tanto desean sufrir por Mí. Fomenta los santos deseos: un pequeño suspiro de amor, una mirada afectuosa, un poco menos de tiempo pasado lejos de Mi recuerdo, una fidelidad más sonriente, un silencio de humildad, un acto de gentileza hecho por Mi Amor. Y luego, la acción de gracias. Dámela sin interrupción. Es tanto lo que hago por Mi pequeña… percibes algo, pero ¡es tanto lo que no ves!”</i>"],[2]],[1343,["3 de diciembre de 1943. Iglesia de Fresne. <i>“Emplea todo este mes en darme las gracias. Un ‘gracias’ amoroso es para Mí más dulce de cuanto puedas imaginar. Ya sabes que Soy un Ser sensible y que Me encuentro siempre en un estado de apogeo de Ternura. No debe extrañarte, entonces, que escuche con Alegría vuestras palabras de reconocimiento. Esto lo comprenderías muy bien si tuvieras un conocimiento mejor de lo que es la Divinidad.”</i>"],[22]],[1344,["9 de diciembre. Iglesia de Fresne. <i>“No dejes a tu Madre Inmaculada, y tampoco Ella te dejará. Te ama más que tu madre de la Tierra. Ella, la Reina de los mártires, sufrió por ti los horrores de Mi Muerte. Siempre se ama más a aquellos por los que más se sufre; imagínate, si puedes, la ternura que te tiene. Nada podría detenerla, ni siquiera tu ingratitud. Dile con frecuencia que la amas y le agradeces. Los coloquios con Ella te acercarán a Mí. Ella es tan humilde que no refiere para sí lo que es Mío; Ella, que no vivió sino para Dios. Pídele que te enseñe a no vivir sino para Mí; pon en Ella toda tu confianza y Ella te ayudará a escalar la dura montaña de la perfección.</i>\n<i>“¿Quién podrá purificarte y encender la luz en tu espíritu, sino aquellos que ya la poseen, los santos y la Reina de todos los santos? Siéntete muy pequeña junto a Ella, porque Ella no es ‘una’ mujer, sino ‘La Mujer’, la segunda Eva, la que aplasta la cabeza de la serpiente. Vive con nosotros en familia, con toda simplicidad, como si vivieras en el hogar de Nazaret, porque nada de nuestra intimidad te queda vetado. Yo os doy todo lo que poseo, aun el Amor de Mi Madre. Así, cuando te sientas sola y débil, entra en la intimidad de nosotros dos, Mi Madre y Yo. No es necesario que nadie te presente, pues te conocemos mejor de lo que tú misma te conoces. Hija Mía y de Mi Madre, humíllate ante nuestro gran Amor por ti. Y ámanos para consolarnos de los otros, de los que no nos aman.”</i>"],[28]],[1345,["16 de diciembre de 1943. <i>“¡Mi pequeña! Mira cuán grande es Mi Interés porque vivas atenta cerca de Mí. Yo persigo a cada alma como si fuera la única sobre la Tierra. Mi Amor es desbordante, aunque Yo Lo mantengo silencioso y escondido, para dejar íntegro el mérito de la Fe. Confía que tu Amado te mira como a través de una celosía: no dudes. Mira Mi Rostro ensangrentado, tal y como Lo tuve por tus pecados, y di si es posible que no empieces a amarme como Yo deseo ser amado, por encima de todas las cosas. Mira Mi Rostro de pobre hombre desfigurado por el furor de los verdugos y recuérdalo: ¡Soy tu Dios!”</i>"],[2]],[1346,["24 de diciembre. Iglesia de Fresne. <i>“En este trabajo de amor, ofréceme todo lo que haces, todo lo que piensas. Haz cuanto puedas por agradarme, por no dejarme solo, sino estar conmigo. ¡Cuántas veces Me sentí solo cuando viví sobre la Tierra! Yo Me refugio en un corazón fiel para morar allí con Mi Padre y entonces ese corazón posee una dulce y sencilla felicidad.</i>\n<i>“Adquiere el hábito de vivir en Mí. Ensaya. Vuelve a empezar sin fatigarte y Nosotros te ayudaremos. Porque vosotros, Mis pequeños, nunca estáis solos cuando Nos habéis dado vuestra confianza. Nosotros os llevamos con Ternura infinita, con una Delicadeza que os asombraría, que llegaría hasta escandalizaros si La conocieseis. ¿Cómo es posible que Dios ame tanto a Sus creaturas? Pero así es, y mucho más. Nuestra Riqueza es el Amor; Locura santa, en la que debes creer firmemente. Entrégate a Ella sin interrupción, porque Dios te ama sin interrupción. ¡Mi pobre hija pequeñita!”</i>"],[26]],[1347,["30 de diciembre de 1943. Iglesia de Fresne.<i> “Entiende, hija, que nunca estás sola, y que este pensamiento te dé fuerza. Fuerza para hablarme porque ahí estoy; fuerza para obrar, porque Yo puedo ayudarte, especialmente cuando hablas con los otros. Esto es una fortuna para ti, que nunca Me agradecerás bastante. Los esposos de la Tierra se ven con frecuencia obligados a separarse, pero Yo estoy siempre en lo más íntimo del ser de Mi esposa y ella puede en sí misma contemplarme. Cuando se siente muy impresionada, puede abrirme su alma y esconderse en Mis Llagas. Bebe en Ellas a grandes sorbos tu santificación. Toma en Mí, toma de Mí, y ofreciendo al Padre Mis Méritos, pídele que olvide tus pecados.”</i>","30 de diciembre de 1943. Iglesia de Fresne. <i>“No se pide perdón tanto como se debiera. Y sin embargo todos saben que el Perdón se obtiene con solo pedirlo. ¡La Alegría que tengo cuando perdono! En el Evangelio puedes contar Mis Perdones: a la mujer adúltera, a la cananea, al paralítico, a Magdalena, a Pedro, a Mis verdugos, al ladrón… A Judas mismo lo habría perdonado si él hubiera querido. Tu Dios tiene un Corazón que perdona. Llorad vuestras faltas, una tras de otra, en Mi Presencia. Mirad Mis Ojos que lloraron antes que los vuestros. Unid vuestro dolor a Mi Dolor. ¿Qué menos podríais hacer vosotros, que tanto Me hicisteis llorar?”</i>"],[9,30]],[1349,["6 de enero de 1944. Iglesia de Fresne. <i>“Piensa, hija, en el gozo que tuvieron los reyes de la Epifanía. El que Me encuentra, encuentra los gozos más grandes que son posibles en la Tierra pero es preciso buscarme, no solamente una vez o dos, sino de manera continua; porque vuestra flaqueza Me pierde continuamente de vista por las distracciones de la vida diaria. Los ojos que Me miraban se vuelven a otra parte y su atención se desperdicia aquí y allá. Entonces Yo Me retiro, y es preciso que de nuevo me busquéis. Bendita búsqueda, ya que Me volveréis a encontrar. ¡Si pudierais vosotros conservarme como Yo os conservo en Mí! No os dejo un instante. Tú sabes que Me eres muy querida, no obstante tus miserias: ¿es demasiado pedir, entonces, si espero de ti la intimidad de todos los momentos de tu día? ¿Que Me lo des todo, sin retornos sobre ti misma? ¿Que te instales en Mi Corazón, sin distancia alguna entre el Mío y el tuyo, para darme gusto y consuelo? ¿Es mucho si te pido que olvides las cosas de este mundo para vivir por anticipado de las alegrías del otro? ¿Me excedo acaso cuando te pido que vayas más adentro?</i>\n<i>“Y si tu alma se vuelve hacia Mí espontáneamente con dulzura, no habrá habido Conquistador tan orgulloso de sus victorias. Eres el premio de Mis Angustias en Getsemaní, eres la respuesta, y el Padre te mira.”</i>"],[41]],[1351,["20 de enero de 1944. Iglesia de Fresne. Yo: ‘Señor, ¿cómo podría yo hacer que las almas vinieran todas a Ti como un vuelo de palomas?’ Él: <i>“Ora, habla de Mí. No admitas ninguna falsa vergüenza de poner Mi Nombre en tus conversaciones. De Mi Nombre, cuando se pronuncia, llueven las Gracias. ¡Qué pocas son las veces en que el Nombre de Dios figura en las conversaciones humanas! Y sin embargo, todos se mueven en Mí y Yo los he salvado a todos. ¿No sería lo más natural que todos pensaran en Mí? Pero es de otro modo; entonces, tú, Mi pequeña, repara.”</i>","20 de enero de 1944. Iglesia de Fresne. <i>“El consuelo en la hora de Mi Agonía. Lo comprenderías si supieras a cuánto llega la indiferencia del mundo, casi de todo el mundo, pues son realmente pocos Mis amigos íntimos. Entonces supone una gran riqueza para Mí cuando alguno de ellos viene a hacerme compañía en esta hora de amargura. No temas ser demasiado tierna conmigo, ni temas hablarle mucho a tu Amado. Quéjate de ti misma y dime: ‘¿Cuándo me curarás, Amigo mío, de esto y aquello?’ Porque hay en ti tantas cosas que son indignas de Mí. Hazte pequeña pensando en esto y esconde todas esas fealdades en Mi Corazón, que es para vuestras almas como un Hospital en que se curan.”</i>","20 de enero de 1944. Iglesia de Fresne. <i>“¿Que no habrá en ti un lenguaje desconocido para los otros y reservado a Mí? Lenguaje en el que las palabras no sean necesarias. Simples dulzuras, amores, agradecimientos, impulsos, impaciencias de finalmente encontrarme. Sumisiones, deseos de Mi Gloria, júbilos por Mi Felicidad en el Seno del Padre. Olvídalo todo para no pensar sino en Mí. ¿Cómo podrías agitarte por otra cosa, por otra persona? Yo Soy El que Es. Sé Mía.”</i>"],[4,10,26]],[1352,["27 de enero de 1944. En mi aposento: ‘Señor, escucho.’ <i>“No estés sola: no hay sobre la Tierra quien te esté más cercano que Yo. ¡Gran pensamiento este de que te estoy Presente! Se suele hablar de la Presencia de Dios. Tú, piensa en la Presencia de tu gran Amigo, del Único, del Incomparable, de la Visión de mañana. La Presencia del Amor eterno en ti, en torno tuyo. Vive como inmersa en Mí, de día y de noche. ¿No te es muy dulce pensar que estás sumergida, no en la indiferencia, sino en el Amor? Abre tu corazón cuán grande es. Aumenta tu Esperanza y muéstrame tu alegría.”</i>"],[39]],[1353,["27 de enero, iglesia de Fresne. Yo: ‘Señor, aquí estoy, delante de Ti, lista para escucharte.’ Él: <i>“Mis Palabras no pueden tomar otra coloración que no sea la del Amor. Parece que Me repito, pero el Amor es siempre nuevo. Ese Amor de Dios, del que viviréis en la Eternidad. Es imposible que te imagines la Fuerza, la Dulzura, el Encanto y la Totalidad de ese Amor, porque no puedes imaginarte, tú finita, al Infinito.”</i>"],[18]],[1354,["3 de febrero. Iglesia de Fresne. <i>“¿Crees realmente a fondo, hija, todo lo que Me dices? Sumérgete más y más en la Fe. Vive con más intensidad. Háblame como si Me vieras, pues bien sabes que estoy contigo. Dondequiera que te encuentres, encuéntrame. Ámame como a un Ser vivo, pues Lo estoy en Mi Cuerpo glorificado, y hónrame en este Cuerpo que fue herido y muerto por tus pecados. Cuídalo. Repósalo. Guárdalo contigo, de día y de noche.”</i>","3 de febrero. Iglesia de Fresne. <i>“Une ya desde ahora tu muerte a la Mía; estemos siempre juntos, pero de modo especial en la última hora. Como los miembros de una familia, que en el momento de peligro se estrechan unos con otros. Y tú te estrecharás conmigo cuando sientas que se acerca tu fin. Entonces tendrás el impulso perfecto, te desprenderás de todo lo que te rodea y te apoyarás amorosamente en Mi Corazón. ¡Qué corta es, hija Mía, tu vida terrena! Todo se queda a medio camino. ¿Sientes que tu morada está más Allá? No hay para qué retrasarse aquí abajo. Mañana será la otra vida. ¿No tienes muchas ganas de verme y de conocerme mejor?”</i>"],[21,31]],[1355,["10 de febrero. Iglesia de Fresne. Yo Le daba gracias por haber protegido mi cambio de Nantes a Le Fresne. Me dijo:<i> “Bien está y Me es muy dulce que Me des las gracias. Ten la seguridad de que no hablas al aire, pues cada palabra tuya toca Mi Corazón sensible. Cree siempre que estoy junto a ti con todo Mi Amor. Vivimos juntos; todos los días por la mañana Me recibes y luego, no Me dices que Me vaya.</i>\n<i>“¡Cuán preciosa es para vosotros una fe sencilla! En ella está </i>(<i>¿o no es así?</i>)<i> la mayor felicidad que podéis tener en la vida. Recuerda que la Tierra es limitada y mira con frecuencia al Cielo, sin temor. Muere por anticipado, con una muerte de amor. Abandónalo todo en espíritu de alegría, porque eres Mi hija y vienes a Mí y Yo te espero con los Brazos abiertos. ¿Qué podrías temer cuando Yo te he salvado? ¿No ha llegado para ti el momento de las confianzas extremas? Ensánchate, en compañía de los santos que supieron morir en la paz y el amor.”</i>"],[21]],[1356,["17 de febrero. Iglesia de Fresne. Yo: ‘Señor, quita de mi corazón todo lo que Te disgusta.’ Él: <i>“Seguirás cometiendo pequeñas faltas, tendrás debilidades que serán para ti motivo de humillación, pero el Amor lo repara todo. Vuelve a empezar cada vez, sin fatigarte; continúa, desarrolla. Nadie se ha arrepentido de haberme amado mucho.</i>\n<i>“Habitúate a las horas de amor, a caminar en el amor, a los descansos de amor. Así llegarás a la muerte de amor. Ponte a prueba en los servicios que prestas al prójimo, recordando que el prójimo Soy Yo. Y el prójimo se lleva más de la mitad de tu vida. Trata, hija, de conocer un poco, finalmente, el Amor.”</i>","17 de febrero. Iglesia de Fresne. Yo pensaba en todas Sus Gracias y Le dije: ‘Señor, ya que me das tanto, ¿qué puedo hacer para agradecértelo?’ Me dijo: <i>“Hazme compañía con más asiduidad. No puedes imaginarte lo que es para Mí que se Me trate como Amigo íntimo. ¡Es algo tan raro! Yo gozo del afecto como Hombre que Soy y, lo mismo que a ti, Me gusta que Mis amigos descansen en Mi Compañía. A Mí, como a ti, Me gusta ser deseado, y que se Me haga depositario de los secretos. Así pues, búscame y no Me dejes ir. Dame una compañía fiel y gozosa.</i>\n<i>“Esta mañana, después de la comunión, pensabas en Mis Miembros dislocados y saludabas Mis Sufrimientos. Me llamabas ‘Rey de los mártires’ y estabas cerca de Mí, en Mí. Haz eso mismo en el curso del día. Piensa en las diversas escenas de Mi Vida y quédate ahí cerca. Para Mí el tiempo no existe, ¿lo crees?”</i>"],[12,43]],[1357,["24 de febrero de 1944. Iglesia de Ingrandes. Yo decía: ‘¿Cómo podré conocer el Amor?’ Él:<i> “Aplícate a verme en todos los acontecimientos, grandes y pequeños. Y digo ‘pequeños’ porque son los que forman la trama de tus días. Recibiéndolo todo de Mi Mano, comprenderás mejor la Solicitud de Dios. ¡Cuán dulce y amable te parecerá! Aunque no podrás verla sino superficialmente. Remóntate entonces hasta el Corazón de tu Dios, acuérdate de Sus Sufrimientos, que Él conoció y aceptó de antemano. Sumérgete en estas consideraciones, y eso avivará la llama de tu amor. Confíame tu amor. Cuando Yo vivía en la Tierra, Me llevaban a los débiles y los enfermos, y tu amor es enfermo y débil. Si creyerais en Mi Poder, tendríais las más grandes esperanzas. Cree, entonces, en el Amor; esto basta. Sí, Yo te ayudaré, pero Me lo has de pedir. Ya ves que te digo cómo hacerlo. Te soplo tu papel; aparece pues sin temor en el escenario del amor. Seré Yo Quien te conteste.”</i>"],[18]],[1358,["2 de marzo de 1944. Yo: ‘¡Mi pobrecillo Amor!’ Él: <i>“Sí, Pobre. Pobre de vuestros amores, tan escasos e imperfectos. ¡Qué fácil es contar el número de los que en este momento Me aman lo bastante como para dejarlo todo por Mí! Y si considero el número de los hombres, Me siento tan pobre y abandonado como durante Mi Vida mortal: no tengo sino un pequeño grupo de íntimos...</i>\n<i>“Procura, hija, venir al socorro de esta Pobreza de Mi Corazón. Trata de compartir y de proveer. Se Me conoce tan mal... ¿cuántos son los que creen que Soy tierno? ¿Cuántos, los que piensan en Mi Misericordia? Por eso, tú debes abandonarte a ti misma y pasar a Mí.”</i>"],[10]],[1360,["9 de marzo, iglesia de Fresne. <i>“Que nada te inquiete nunca, fuera del temor de ofenderme. Todo está en Mi Mano, pues Yo Soy el Omnipotente. No pienses que es incorrecto que tu atención se dirija solamente a Mí y a lo que se refiere a Mí. Gobierna tu imaginación, para que no se salga de Mis Caminos. Que tus facultades te obedezcan; céntralo todo en Mí. Toma de Mí aquella fuerza que Me hizo resistir el hambre en el desierto.”</i>"],[40]],[1362,["23 de marzo. Iglesia de Ingrandes. <i>“Que haya entre nosotros dos una incansable primavera de amor; dulces intercambios cada día renovados, e inefables conversaciones… Las palabras que tengas que decirme te las inspiraré, para que no falles ni siquiera en el acento. Y si nada tienes que decirme, Me mirarás… puede haber tanto amor en una mirada… y en una sonrisa. Lo importante es que nos correspondamos; que no haya entre nosotros silencios de indiferencia ni retrasos en la comunión íntima. Pídeme que continuamente te socorra, pues sola no podrás...</i>\n<i>“Reconoce tu nada. Ve dónde te encuentras. Humíllate y tiéndeme los brazos. Yo te haré volar sobre el obstáculo, teniéndote en Mi Corazón.”</i>"],[29]],[1365,["13 de abril de 1944. En mi aposento había abierto al azar uno de los cuadernos y sentía una iluminación interior. <i>“Es bueno el interés por leer con frecuencia Mis Palabras. Te impregna de Dios y te arranca de la pequeñez del Mundo. Así, de inspiración en inspiración llegarás al Fin, al Fin que es el verdadero comienzo de la Vida.”</i>"],[15]],[1367,["19 de abril de 1944. <i>“Gracia para hoy: Mi Presencia. Vive del pensamiento de que tu Amigo está aquí. Tu influjo será multiplicado, pues un alma enciende a otra como un cirio enciende a otro.”</i>"],[39]],[1369,["27 de abril. Iglesia de Fresne. <i>“Piensa en la Santísima Trinidad, de La cual procedes y a La cual has de volver. Adora, ama y confíate. Pide incansablemente perdón y, si La amas, no temas nada de Ella. Sé pequeñita ante Dios. Todo lo que tienes, todo lo que te gusta, son Dones suyos. Nada de lo que tienes procede de ti. Y alaba a la Santísima Trinidad por tu pequeño éxito de ayer, porque a Ella pertenece toda alabanza. Y vive en Mí, que te amo.”</i>"],[48]],[1370,["5 de mayo. Iglesia de Fresne. Yo me sentía hundida por las faltas y negligencias. Él: <i>“Recuerda que una vez dije: ‘Si Yo Me voy, os Lo enviaré’. Invoca pues con frecuencia al Espíritu Santo; ¿de qué podrías avergonzarte? ¿Acaso no habéis sido creados para ser santos? ¿Y acaso podéis conseguirlo sin la Ayuda divina? Invoca pues al Espíritu Santo, que Él te penetre... pídeselo en Mi Nombre.”</i>"],[48]],[1371,["10 de mayo. Iglesia de Fresne. Yo me lamentaba de una maleta perdida. Él me dijo: <i>“Tú Me la habías dado, pues todo lo tuyo es también Mío. Consuélate pensando que quizás Yo tenía necesidad de este sacrificio para la conversión de un pecador. Tú estás dispuesta a no regatear conmigo, pues Yo estoy profundamente en tu vida. Y permanecerás en la paz. ¿Estás conforme en que Yo presida todo en tu vida?”</i>\n‘Sí, Señor, todo; hasta mi muerte. Que ella Te glorifique.’ Él: <i>“Busca Mi Gloria en tu vida y morirás por Mi Gloria.”</i>"],[44]],[1372,["24 de mayo. Hora Santa, en el campo. ‘Señor, ¿es cierto que estamos ya desde ahora en el Seno de Dios?’ <i>“¿Entiendes tú la dulzura que hay en las palabras ‘Seno de Dios’? Trata de vivir de ellas. Así como el niño se desarrolla poco a poco en el seno de su madre, así tú desarróllate en Mi Ser, no esperando sino de Mí tu acrecentamiento progresivo. Muévete en Mí, respira en Mí. Come y bebe en Mí, extiéndete en Mí y olvídate de que existes. Mírame en todas las cosas. Y cuando de esta manera te hayas ‘trasladado’ a Mí, vivirás en una perpetua adoración y en el Amor, Hija Mía, ¿es demasiado? ¿Es suficiente?”</i>"],[49]],[1378,["22 de junio. Hora Santa. Le dije: ‘Iré a donde quieras y a quién Tú quieras. Ya no soy mía, sino tuya.’ Me contestó: <i>“Recuerda que todo procede de Mí y debe volver a Mí. Si pudieras entender lo que es el Amor de un Dios, no podrías menos de abandonarte completamente para perderte en Él. No podrías apoyarte sino en Él para la vida y para la muerte. Yo poseo Suavidades que nunca podrás imaginar. Y es este Dios el que quiere poseerte. ¡Él! A ti, que eres la nada. No te distraigas de Su Presencia, pues Él te tiene siempre presente. Respira en Él, muévete en Él. Y sobre todo, no temas, porque eso Lo contristaría, así como tu confianza y tu alegría Lo honran. Espéralo todo de Él y todo lo tendrás.</i>\n<i>“Dátele y Él se te dará. ¿Quién podría vencerlo, quién podría ser mejor que Él? Acércate y pon tu corazón sobre el Suyo. Serás para otros reposo y paz, porque Yo los apaciguare por tu medio. Muchas veces ni siquiera lo sabrás, pero así será. Y no te es difícil unirte a Mí, pues toda tú procedes de Mi.”</i>"],[18]],[1385,["3 de agosto. Iglesia de Fresno. Hora Santa. Yo pensaba que en medio de las mil ocupaciones es indispensable que me ocupe de mi Amado. Él: <i>“Tu Amado se ocupa de ti. Cuando tú estás sumergida en el quehacer, Él está contigo. Cuando te apenas porque tu Fe se apaga un poco, Él está contigo. Y cuando te sientes sola y abandonada, ahí está Él, en tu centro, viviente, vigilante, amándote. Sabiendo esto, ¿cómo podría tu delicadeza dejar de ocuparse de Él?</i>\n<i>“Dile una vez y otra vez: ‘Señor, sé muy bien que no sé nada de Ti, pero tengo Fe y confianza; me entrego a Ti con amor y sin reserva, tanto en la vida como en la muerte, porque Tú eres quien siempre está presente, el que ama más, el qué es más mío’.</i>\n<i>“Todo esto Me lo dirás; pero lo más importante es que lo pienses. Profundizarás en el sentido de las palabras si te metes en Mis Llagas. Que sean Ellas, especialmente la Herida de Mi Corazón, tu Morada habitual. Habita en Mi Corazón. ¿Quieres ensayar? Porque estás invitada. Que no te lo impidan ni la timidez, ni el temor, ni la indiferencia.</i>\n<i>“Sabes que siempre te ayudo. Ensaya. Una vez franqueado el dintel, te darás cuenta de que en Mi Corazón estás más ‘en casa’ que cuando estás en ti misma. Conocerás la dulzura de la vida secreta y de las intimidades silenciosas y transformantes. Y ¡qué alegría para Mí! ¿Puedo ya desde ahora darte las gracias? ¿Estás pronta para recibirlas?”</i>"],[13]],[1386,["17 de agosto. Hora Santa en la iglesia de Fresne. Yo Le decía: ‘Buenos días, Amor de mis amores, el más hermoso.’ Me contestó: <i>“Así es, hija Mía. Nada hay más hermoso que Yo en ti; Dios en un alma. El ojo del hombre nunca vio nada semejante.</i>\n<i>“Cuando el alma es así, humilde y atenta, no me resisto. Me lanzo sobre ella como un águila; la envuelvo con Mis Fuegos, aunque trato de atenuarlos como una luz demasiado viva que podría lastimar sus ojos y herirla con el temor. ¿Cuántas veces dije en el Evangelio ‘No tengan miedo’? Lo que deseo es vuestro amor.</i>\n<i>“Tengo un respeto infinito por vuestras decisiones libres. Y muchos caminos para llegar a cada uno. Hago la corte a las almas con variadas delicadezas; Me valgo de un recuerdo, de un pensamiento, de un acontecimiento. Tú misma has comprobado que los momentos hay que escogerlos sin mirar atrás, pero que hay que entregarse con confianza a una vida nueva, que ya no es para uno mismo, sino una vida ‘a dúo’, para la Gloria del Padre.”</i>"],[18]],[1387,["24 de agosto. Hora Santa. <i>“La reverencia en la iglesia es un acto de Fe. Tú piensas que es poca cosa, pero esos pequeños actos Me complacen. Son las pequeñeces que llenan vuestra corta vida.”</i>","Hora Santa. <i>“No hay sino una tristeza: la del pecado. Llora los tuyos sobre Mi Corazón. Los lloraremos juntos. Ya no Me volveré a acordar de lo que Me costaron y te descargaré de ellos tomándolos sobre Mí. Te verás revestida del fastuoso manto de Mis Méritos y estarás magnífica en la presencia del Padre. Créelo, porque es así. ¡Qué no inventa la Misericordia! Nada podrá ya asombrarte si te confías a Ella. Porque el milagro de la Misericordia está en que Ella parece como si no viera las ingratitudes y cuando un alma Me niega que la ponga cerca de Mi Corazón, ¿cómo quieres que Yo no Me empeñe en vencer con el Amor? Soy como un hombre herido de muerte, que estrecha sobre su corazón a su adversario y le dice: ‘escucha mi perdón’.”</i>"],[21,30]],[1389,["7 de septiembre. Hora Santa. <i>“¿Puedes siquiera imaginarte que Yo alguna vez haya faltado a una cita de amor? ¡Cuánto querría tenerlas con cada alma! Pero, ¿quién piensa en eso?</i>\n<i>“Este día tengo dadas muchas de esas citas, pero nadie ha respondido. ¡Cuántos tesoros tenía Yo preparados para quienes no han venido! Acaso vendrán más tarde, y entonces les daré todos. Mi Riqueza y Mi Poder están al servicio de Mi Misericordia. Un regreso vuestro, un pequeño regreso, y Mis Brazos de Salvador se abren ampliamente. Mi Corazón no puede olvidar que os dio toda Su Sangre.”</i>"],[43]],[1390,["14 de septiembre. Iglesia de Fresne. Hora Santa. <i>“Yo no te dejo, no Me dejes tú. Esta fidelidad será tu gratitud para con tu Salvador, y el más feliz de nosotros seré Yo, porque tengo más necesidad de ti que tú de Mí. Yo Soy, de los dos, el que tiene más hambre de amor. He descendido hasta el punto de decírtelo y de aparecer ante ti como un mendigo. Esto te causa asombro, pero es así porque Yo Soy siempre El-que-ama-más. Mi Ser es todo Él, Amor. Tú sabes que se suele comparar el amor con el fuego que devora, pero es una débil comparación. ¡Oh! Cuando llegues a ver, cuando por fin llegues a sentir... Entonces volverías a la Tierra con el fin de sufrir toda clase de penas y honrar así al Amor finalmente poseído. Hija Mía, ámame. Como ves, sigo pidiendo limosna...”</i>"],[18]],[1395,["l2 de octubre. Hora Santa.<i> “Consuela. ¿No fui Yo el Consolador? Que no pase cerca de ti ninguna pena que no alivies. Y a los que no tienes cerca, consuélalos con tu oración. Puedes estar segura de que consolando a otros, Conmigo lo haces. Oh, Mi pequeña, qué dulzura de Gloria daré a Mis consoladores...</i>\n<i>“¿No pedí Yo siempre la Caridad, la ayuda mutua? ¿La humilde dulzura de corazón que hace cálida la acogida? Y si no sabes hacerlo, toma Mi propia Voz para dar encanto a tu acogida. Toma Mi Mano al tender la tuya y, piensa: ‘Así lo haría Él, así hablaría, así sonreiría.’ ¿No estamos tú y Yo el Uno en el otro?”</i>\n10 de julio. <i>“No pienses en el dinero por el dinero, piensa en él por motivos de Mi Gloria. Trata de servirme por todos los medios, así como Yo cuando viví en la Tierra todo lo hice por serviros.</i>\n<i>“¿Y por qué te cansas de ser buena para con los otros? ¿No estoy Yo en ellos? ¿Te cansarías de ayudarme si Me vieras cerca de ti? Me ayudarías con amor y con júbilo, y dirías: ‘¿Quieres algo más, Amor mío? ¿Está bien lo que he hecho?’”</i>","12 de octubre. <i>“¡Siempre te hablo de Amor! Pero, ¿cómo podría hablar de otra cosa, Yo, el Amor? Conviértete en Amor por la unión. Habitúate a ello. Es sencillo, casi natural.”</i>"],[5,18]],[1398,["2 de noviembre, en mi soledad. ‘Y yo escribo Tus adorables Peticiones uniéndome a Ti en los momentos en que el Evangelio dice que escribiste en la arena.’ <i>“Y ahora Me valgo de ti para escribir y no sobre la arena, sino en el fondo de las almas. Escribo con alegría y luz.”</i>"],[15]],[1400,["9 de noviembre. Hora Santa. <i>“Para oír Mi Voz, es preciso ponerse primero en un estado puro; es decir, alejar los pensamientos mundanos, rebajarte ante tu propia estimación, avivar cuanto te sea posible sentimientos de amor y luego pedir Mi Auxilio con palabras íntimas y cariñosas. Así te encontrarás en el aposento de arriba en tu alma, donde se da el intercambio de cariños y allí, humildemente, aguardarás los Favores del Rey.</i>\n<i>“Desea curar las almas de los otros y así curarás la tuya.” </i>Y luego añadió con inmensa ternura:<i> “Te tengo cautiva y Mi Cariño te envuelve. Nada de ti se Me podrá escapar durante esta hora, la Hora Santa. ¡Oh! Haz de todo lo que queda de tu vida una Hora Santa en Mi Corazón, que es tu ‘Aposento de Arriba’.”</i>","9 de noviembre. Hora Santa.<i> “¿No reconoces en todos los pasos de tu vida la acción de Mi Amor? Yo Soy el Amor escondido, pero Soy también el Amor ardiente. Soy el Amor silencioso, pero también el Amor elocuente. Ensaya conocer Mi Corazón en el silencio de los días y las noches en Mi Tabernáculo solitario. ¿Qué es lo que lees en Mi Corazón? Nostalgia por los ausentes, gratitud para los que Me visitan. Yo Me imprimo en ellos. Quisiera que al salir de Mi Casa tuvieran como suyo Mi Rostro para presentarlo a los demás.”</i>"],[15,43]],[1401,["16 de noviembre, Hora Santa. Yo: ‘Señor, qué contenta estoy de que estas líneas hagan bien a los que las lean.’ Él: <i>“Cuando serviste como lazo de unión en el castillo de L. presentando mutuamente a todos los vecinos, tú estabas contenta de que ellos lo estuvieran. ¿No? Pues, ¿qué decir de la felicidad que tendrán Mis amigos lectores? Espéralo todo de Mi Bondad infinita. Infinita, ¿comprendes? ¡Lo que sería la vida si cada alma pudiera vivir conmigo ‘una Vida a dúo’!”</i>"],[15]],[1405,["23 de noviembre. Hora Santa. ‘Padre amado, no quiero hacer sino Tu Voluntad, pero con frecuencia hago la mía y Vivo para mí.’\n<i>“No es posible llegar a desprenderse totalmente de sí, pero una mirada que Me dirijas basta para purificar tu intención. Una de esas miradas tuyas que sonríen. No te olvides, pues, de mirarme a través de tus días y tus noches. No te canses.”</i>"],[35]],[1411,["7 de diciembre. Hora Santa. Yo: ‘¿Mi Amor, no tienes algo que decirme en este día?’ Él: <i>“Yo siempre tengo qué decirte, pues Mi Corazón late por ti sin descanso. ¿No estás convencida? ¿Asombrada ante el Amor de tu Dios? Esfuérzate en pensar en Él y te será cada vez más dulce. Además, Yo estaré feliz. Se diría que vuestro Dios os ama solamente para daros la Alegría. Y sin embargo, son tantos los que se niegan a creer... De ahí Mi inmensa Tristeza en Getsemaní: ‘Sufro hasta la muerte, porque los amo, pero ellos no pueden ni siquiera soportar que se los diga...’</i>\n<i>“Pequeña, cree en el Amor con simplicidad. Alaba al Amor, ama al Amor. No te ocupes sino de Él, que es el Tesoro de tu corazón y el Animador de tus soledades, el Compañero de tus noches. Si conocieras Mi Sensibilidad. ...Será Ella la que os embriague en el Cielo con Su Delicadeza, Su Belleza, Su Bondad; todas esas perfecciones que buscas en la Tierra y que solo encontrarás en el Infinito.”</i>"],[18]],[1412,["7 de diciembre. <i>“Piensa en el Cielo con más frecuencia. ¿Qué son todas las obras de arte –que aquí en la Tierra te encantan– en comparación con el Más Allá? ¡Cómo os espero a todos! He preparado muy bien la Fiesta; tu lugar te aguarda. Trata de comprender Mi Impaciencia por recibir a los convidados y gozar de su sorpresa y encantamiento. Yo, el Cristo, pagué por esto.”</i>"],[6]],[1413,["13 de diciembre, Hora Santa. <i>“Ejercita tu Fe. Cuando aprendías a andar, te lanzabas como podías, pero poco a poco se afirmaban tus pasos. Haz lo mismo en tu vida interior: lánzate hacia la Trinidad, hacia Mi Madre, con impulsos siempre nuevos, cada vez más directos y verdaderos, desde tu íntimo centro: pronto te serán habituales. Habrás crecido. ¿Comprendes? Y habrás hecho crecer a los otros, ya que vuestros actos tienen siempre una resonancia, buena o mala. ¿No Me has dicho varias veces que querías ayudarme a la Redención? Que Ella sea el Fin único de todos tus actos, como era el Fin de los Míos. Debemos estar siempre juntos, Mi pequeña; hazme el honor de creer que es eso lo que deseo.”</i>\nEntonces Le dije: ‘Señor, soy toda tuya’. Me contestó: <i>“En este momento sí, pero no te Me escapes. Hay momentos en que la Fe se hace brumosa y tú no sientes sino fastidio. Tú llamas y parece que Yo no te oigo, pero has de creer, pequeña.</i>\n<i>“Húndete en la Verdad. Contra todo, contra ti misma. Grita, grítame diciendo: ‘A pesar de todo, creo que eres mío y que yo soy Tú. No importan las apariencias en contrario, estoy segura de Ti’. Este punto de la batalla es donde Yo te espero. Es el punto preciso en que Yo quiero tu amor; por encima de todo, porque estoy por encima de todo. Alcánzame.”</i>","13 de diciembre, Hora Santa. <i>“Porque Yo estoy aquí en el Tabernáculo, el Padre Se complace de verte a Mis Pies. Por eso os pido que vengáis a hacer la Hora Santa, para hacerme compañía en unión de los ángeles que Me rodeaban en el Huerto de los Olivos. Ellos estaban allí para sostener Mis Fuerzas, tú ven aquí para darme fuerza en Mi Soledad. Como ves, no hay nadie en la iglesia. Mis visitantes son pocos y sus visitas son breves y apresuradas.</i>\n<i>“Si de verdad creyeran que estoy aquí presente, no dejarían de manifestarme su amor o, cuando menos, su simpatía. Me manifestarían también sus necesidades, pues Soy rico y poderoso. Pero creen más fácilmente en Mi Poder que en Mi Amor. ¿Y tú?” </i>Entonces Le dije: ‘Señor, creo firmemente en tu gran Amor.’ Él: <i>“¿Y no es verdad que te consuela y te hace vivir el pensamiento de que eres amada hasta el extremo? ¿Y qué sería tu vida si Yo no fuera su Objeto único? ¿Por qué habrías de desear la muerte, si Yo no estoy detrás de la puerta?”</i>"],[21,43]],[1415,["21 de diciembre, en el tren. Yo pensaba: ‘He escrito tantas veces Sus Palabras. ¿Será suficiente? ¿Debo continuar?’ Él me dijo: <i>“¿Acaso te cansas de Mí? ¿O Me quieres obligar a no hablarte más? Mi Consuelo consiste en explayarme sin cesar en vuestros corazones. Y digo ‘sin cesar’ pues grande es Mi Necesidad de mantenerme vivo en vuestro pensamiento. Yo en vosotros: estas son, hija, Mis Delicias. No temas, pues, ni importunarme a Mí ni importunar a los otros; Me valgo de ti para dirigirme a tal o cual persona, para confortarla y moverla a acercarse a Mí y a contarme lo que le pasa. Me gustan esas confidencias. Y aun cuando ellas no supieran hablarme, que vengan de todos modos a decirme sin temor: ‘No lo sé hacer, es la primera vez.’</i>\n<i>“Aun cuando no sepan qué nombre darme, que Me digan su ternura sin darme nombre ninguno. Ahí estoy, almas queridas, y os escucho. ¿Para qué esperar? Contádmelo todo, vosotras, ovejitas que el Pastor fue a buscar tan lejos y por las cuales dio Su Sangre, gota a gota, hasta la última. Y cuando todo hubo terminado para Él sobre la Tierra, encontró un medio de quedarse con vosotros hasta la consumación del tiempo.”</i>"],[15]],[1420,["18 de enero de 1945. Hora Santa. <i>“Ya te es conocida la fuerza de la soledad. Ensaya esta semana la vida del recogimiento. También cuando vayas por la calle, pues Yo estoy en todas partes. Hermoso ejercicio, ese de interrogar al Dios-Amor. ‘¿En dónde está Él, el que me ve? Apenas lo había yo estrechado cuando huyó de Mí rápidamente, y no Sé dónde se fue. ¿Quién podrá devolvérmelo?’</i>\n<i>“Estos suspiros interiores son Mi Vida en tu alma. Me hieren y Me atraen hacia ti. ¡Soy tan impaciente! En el Cielo Me poseerás sin llamarme, pero ahora pruébame tu fe por tus deseos de Mí. Llámame por la mañana. No Me prives de ese grito, que conozco tan bien.”</i>"],[21]],[1421,["21 de enero. Clausura de las Cuarenta Horas. Había poca gente. Él pasó junto a mí en la Procesión y me dijo: <i>“Tú también podrías hacer algo más: una mirada ligera, aún reprimida, Me daría tanto gusto. Un poco más de recogimiento no es algo que te cueste demasiado, pero es mucho para Mí.</i>\n<i>“Ya ves mi necesidad de ayuda, tú que tanto deseas Mi Reino. ¡Cuántos son los ausentes! Consuélame sufriendo conmigo por su negligencia.”</i>"],[43]],[1423,["1º de febrero de 1945. Hora Santa. <i>“¡Si supieras lo que es esa Misericordia que debes imitar! Es pasar por encima de todo para inclinarse sobre un corazón; es no fijarse en las frustraciones ni en la ingratitud; es ser todavía más amables para con aquellos que nos hicieron sufrir. Cuando llegues a eso Me verán a Mí con solo verte a ti; Me haré ver a través de ti como por transparencia. Pero eres muy pequeña y te preguntas cómo podrías lograrlo. Hay una Gracia que viene de la unión. Algo que se nota en la voz, en la mirada, en los gestos. Eso lo pudiste observar ayer, cuando esa parienta tuya que no te había visto en años, exclamó: ‘¡Cuánto te quiero!’ Se dirigía a Mí, pues Yo Me había manifestado por medio de tu voz.”</i>\nEntonces yo Le dije: ‘Señor, que sea siempre así. ¡Que vean en mí siempre algo Tuyo!’ Él: <i>“Desaparece cada vez más, Mi pequeña; piérdete en Mí, que Soy el Océano infinito. ¡Es tan fácil para ti perderte, puesto que Yo te espero! Y esto será cuando tu voluntad sea una sola con la Mía; cuando el único objetivo de tu vida sea la Gloria del Padre; cuando no tengas para hablarme sino la palabra ‘Te amo con toda la fuerza de este corazón que Tú me diste’. Eso es todo. Entonces el Padre nos tomará a los dos juntos como una sola Ofrenda, una sola: tú y Yo.”</i>"],[4]],[1425,["9 de febrero. Después de la comunión. <i>“Dilata tu alma en la alegría. La alegría Me honra, porque nace de la confianza. Me llega al Corazón; se añade a Mis Alegrías del Cielo. Habitemos juntos, Mi Gabriela, en la Alegría… Haz como si fueras tú la encargada de dármela. Que tu cámara secreta tenga una constante irradiación de vida, como si pusieras flores dentro de ti para recibirme. Y Me dirás entonces: ‘Señor, ya puedes entrar’. Y Yo entraré y Me gozaré en la decoración. ¡Oh, esa alegría que viene de la pureza de la intención!”</i>"],[0]],[1426,["11 de febrero. Después de la comunión. Le dije: ‘Si yo estuviera segura de que Te consuelo y Te agrado haciendo esto o aquello, eso multiplicaría mis fuerzas.’ Él: <i>“Si lo que Me haces o Me dices es por su naturaleza misma capaz de agradar a un hombre ordinario, puedes estar segura de que a Mí Me agrada mucho más, porque Yo Soy el más Sensible, el más Amante, el más Delicado.</i>\n<i>“Nunca pienses que te diriges a un recuerdo, a un ideal pasado, a un Dios lejano; te diriges a Mí, que vivo en ti, que Soy ‘tu Inmediato’; y cuando Me hables a Mí o a Mi Madre, que sea con una sonrisa amorosa. Dame a Mí la buena acogida que tanto celebran en ti.</i>\n<i>“Ven a Mí toda viva de alegría, de serenidad y de ternura. Es un dulce esfuerzo de tu parte, que transformará nuestras relaciones. Tendremos una vida de familia, que es lo que Yo busco en vosotros.”</i>"],[0]],[1428,["1º de marzo de 1945. Le Fresne. Hora Santa. Yo: ‘Es posible que yo muera de alegría por saber que me amas de ese modo.’ Él: <i>“No es suficiente saber que Yo tengo ese Amor; es indispensable creerlo. ¡Cuánto consuelo habría en la vida de los hombres! Serían felices, aun en medio de las tribulaciones, si creyeran que todo lo que les pasa es dirigido por Mi Deseo de su bien y a la medida de cada uno.”</i>","1º de marzo de 1945. Le Fresne. Hora Santa. Yo: ‘Señor, mi alma será siempre Tu casa. Me gustaría grabar sobre mi corazón: «Casa de descanso para Él»’ Él: <i>“En el Cielo te encontrarás la respuesta: </i>«<i>Morada de las Delicias para Mi Gabriela</i>»<i>. Esfuérzate por creerlo, hasta trastornarte de felicidad: </i>«<i>Soy amada</i>»<i>. Porque ya sabes que te será dado aquello en que hayas creído. Y de estos enternecimientos nacidos de tu confianza surgirán nuevos favores para el ascenso a la Unión. Más todavía, a la Unidad.”</i>","1º de marzo de 1945. Le Fresne. Hora Santa. <i>“Piensa en las palabras: ‘Él y Yo’. Vive de ellas porque Soy Yo, eres tú y Yo en ti. Como preso en ti tras la barrera de la señal de la Cruz con que te signas. Además de estar en la Eucaristía, ¿en dónde podría Yo estar sobre la Tierra como no sea en los corazones de los hombres, por lo menos de aquellos que se Me abren? Ellos Me han llamado, Me llamaron de día y de noche. Y Yo vine a ellos para establecer en ellos Mi Morada.”</i>"],[0,6,49]],[1436,["3 de mayo. ‘Mi Jesús amado, vengo para recibir Tu Palabra y sobre todo Tu Amor. ¿Sabes que el jueves es para mí el día más hermoso de la semana?’ Él: <i>“Entra en el atrio e implora la ayuda de Mi Madre. Entra más. Olvídate de todas las cosas. Penetra hasta el aposento más secreto, donde radican el silencio, la libertad del entendimiento, la ofrenda pura de la voluntad, la llama que arde para arder todavía más.</i>\n<i>“Luego pide al Espíritu Santo que se mueva sobre ti como se movía sobre las aguas al principio de la Creación. Por ti misma no eres sino caos…</i>\n<i>“Y ahora, poseída por el Espíritu, ¿qué Me podrás decir, sino palabras de amor? A Él, que es Amor, dile que hable por ti. ¿No crees que esa es la manera más simple y delicada?... La alabanza que tú querrías darme y que no sabes cómo, Él la completará, porque tiene una traducción invisible para las plegarias, los deseos y los afectos.”</i>"],[41]],[1442,["31 de mayo de 1945. Hora Santa. Yo entraba a la iglesia en traje de casa y me disculpaba. Me dijo: <i>“Pero si lo que busco es vuestra intimidad. Estar siempre con vosotros, como quiera que os encontréis. Quiero estar, sobre todo, en el pensamiento habitual de vuestros corazones, Mis fieles amigos, para consolarme de los que no se acuerdan de Mí sino para insultarme. Desgraciadamente, de esos hay muchos; tú no sabes cuántos.</i>\n<i>“Comprende entonces Mi Gozo cuando encuentro un cariño delicado que Me ofrece un asilo... iba a decir ‘de protección’… ¡Oh, imágenes Mías, que tratáis de devolverme lo que os he dado: la Vida! Sí, es la Vida lo que Me gusta encontrar en vosotros. Intensifica siempre tu vida interior. Me pertenece; no Me prives de ella jamás. Pídeme ayuda y Yo te diré las palabras que debes decirme. Dichas por ti serán un encanto consolador. ¿No has deseado convertirte Mi consoladora?”</i>"],[10]],[1445,["14 de junio. Yo había recibido la visita de un extranjero y habíamos hablado de Dios toda la tarde. Me dijo: <i>“¿Por qué habrías de temer ocuparte de Mí y de Mi Reino con los que se te acercan? ¿Hay acaso un tema de conversación más fascinante? Y además, Yo estoy ahí, en medio de vosotros y actúo en vuestras facultades. ¿No sientes por dentro una dulzura especial cuando tratas de encontrarme estando con otros? ¿No crees que Mi Rocío cae sobre vosotros desde Mi Corazón? ¿No te sientes como transportada a otro plano, y que el tiempo corrió más aprisa porque hablaban de Mí? ¿No ves en ello una demostración de que solo Yo puedo llenar vuestro corazón? ¡Oh, dulces conversaciones, en que el Espíritu habla por vosotros! Agradécele y dile tu amor. Invócalo. Desea, desea.”</i>"],[4]],[1450,["5 de julio. Hora Santa. <i>“Sí, hija. Piérdete en Mí y no te vuelvas a encontrar. Yo sabré guardarte bien si te entregas a Mí.</i>\n<i>“¿Sabes lo que es entregarte y lo que es servirme? Un buen servidor piensa siempre en el bien de su amo; le gustaría aumentar su fortuna, si le fuera posible; se enorgullece de su reputación, pues lo ama hasta el olvido de sí.</i>\n<i>“Yo no os llamo ya Mis servidores, sino Mis amigos. ¡Cuáles tienen que ser, entonces, vuestros sentimientos de confusión, de gozo, de esperanza en este Amigo rico e incomparable! Pues se diría que no quiso ser rico sino para daros y haceros favores. Y si tú estuviste contenta esta mañana cuando regalaste un objeto al templo, piensa en Mi Alegría cuando veo que por Mis Méritos vuestras almas se enriquecen. Porque todo se embellece cuando lo toca el Amor.”</i>"],[19]],[1452,["19 de julio. <i>“Hija, no desperdicies ninguna oportunidad de penetrar en Mi Corazón y de hacerme entrar en los corazones de tus hermanos; ¡es tanta la Alegría para Mí! Más tarde verás las gavillas que Me diste y que nunca creíste haber segado.</i>\n<i>“Alégrate conmigo y háblame de todas las cosechas que te gustaría encerrar en Mis Graneros. ¡Tanto pecador, tanto pagano! ¡Y tantos fieles que Me son infieles! Y ofrécete para ganármelos. No te dé miedo ofrecerte, aunque bien sabes que es poco lo que ofreces y que lo ofreces a un Dios. ¿No tienes en ello una ganancia pura? Porque con ello esperas en Su Longanimidad y te compenetras con Su Trinidad. Ofrécete, es sencillo. Todo es simple con tu Dios. Ofrécete, Yo te tomaré.”</i>"],[4]],[1455,["3 de agosto. Iglesia de Fresne. <i>“¿No has pensado que mientras más amas, más cerca estás de Mí? Reanima tus deseos de alcanzarme... aun a costa de la vida. Considera la Tierra como nada en sí, como un simple medio de pagar el encuentro en el secreto de nuestra Morada. Yo te espero en Ella.”</i>","3 de agosto. Iglesia de Fresne. Yo: ‘Señor, como querría procurarte la Gloria que se dice en las palabras del Salmo: Bendito sea Dios en sus ángeles y en sus santos. ¿Cómo es posible que nuestra santidad pueda honrarte?’ Él: <i>“Porque no hay santidad sin amor y el amor de la creatura es el triunfo del Amor del Creador.”</i>"],[26,47]],[1469,["11 de octubre.<i> No temas abusar, ¡es tan poco lo que pides! ¿Por qué? Examínate; quizá sea una falta de confianza. ¿O de despreocupación? ¿O una inclinación a no contar sino contigo misma? ¡Cuántas alegrías perdería Yo si no Me dejaras ayudarte!”</i>","11 de octubre. Yo pronunciaba con mucha ponderación las palabras ‘Padre Nuestro’. Me dijo: <i>“Dios es tu Padre. Entra en la profundidad de esa palabra. Él te ha adoptado por Amor. Que te deleite la dulzura de ser hija de tal Padre. No te admires del Nombre que a Sí mismo Se da, Lo contristarías. Y piensa que ningún padre es Padre como Él, y esto te animará a esperarlo todo, en medidas insospechadas, haciendo crecer tus balbuceos de afecto y reconocimiento. Porque Él vela sobre todo lo tuyo y lo conoce mejor que tú.</i>\n<i>“Él ha puesto en ti Su Morada. Es allí donde debes buscarlo con una sonrisa, deseándole que Su Reino venga ya, que Su Voluntad sea hecha.”</i>"],[33,35]],[1474,["1945. Todos los Santos. <i>“Tus penas son nada si piensas en el Cielo. Los santos, si pudieran volver a vivir sobre la Tierra, Me pedirían que los hiciera sufrir más, porque ahora saben que todo sufrimiento recibe una recompensa magnífica en el Reino del Amor. ¡De qué no serían capaces por lograr un grado más alto en el Seno del Infinito! Únete a su alegría, a la alegría de las almas que acaban de ser ahora recibidas en el Seno de Dios. Y según la misión que tienes en la Tierra, que es la de aliviar las penas de los otros, piensa en las almas del Purgatorio. Con esto Me rindes servicio y honor. Esas almas Yo las espero, porque las amo y ellas van a cantar Mi Gloria. Mi pequeña hija, sé santa desde ahora...”</i>"],[6]],[1483,["7 de diciembre. Después de la comunión rezaba algunas oraciones sin pensar en lo que decía. Él: <i>“¿No estabas hablándole a tu Padre? Cuándo te diriges a un interlocutor, ¿lo haces pensando en otra cosa? Entonces, cuando digas el ‘Padrenuestro’ sitúate bien frente a tu Dios y míralo.”</i>"],[35]],[1502,["14 de marzo. Hora Santa. <i>“Aun cuando ahora no comprendes bien el alcance de todo lo que con tanto Amor te digo, quiero decírtelo, porque llegará un día, una hora, una circunstancia, en que tus ojos se abrirán al sentido oculto de Mis Palabras. Entonces, tu alma tendrá la fuerza toda que hay en Ellas.”</i>","14 de marzo. Hora Santa. <i>“Tu viaje continúa: arroja lastre. Que nada retenga ya tu ser. Des
