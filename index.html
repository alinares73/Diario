a que se parezca a otro. Y esto vale para vosotros mismos; si Yo no os sostuviera en la existencia, dejarías de existir. ¿Me amarás por eso y Me darás las gracias? Esta creación continua de vuestro cuerpo y de vuestra facultad de pensar proviene de Mi Amor inagotable. Usad el cuerpo y el alma para alabar a Dios, como si hubierais comenzado a cantar el día de vuestro nacimiento, para no cesar sino en el momento de la muerte; y para luego retomar el canto para toda la Eternidad.</i>\n<i>“Ora por los que reciben Mis Dones sin querer conocerme, ni amarme, ni servirme. Y sin embargo, también ellos existen por Mí. Si Yo no los mantuviera en el ser volverían a la nada. Los espero. Ora para que no desaprovechen las ocasiones de venir a Mí. ¡Que vengan, tengo sed de ellos! Y que me digan, como cuando eran pequeños. ‘¡Perdóname, no lo volveré a hacer!’ Y Yo lo olvidaré todo, y el Cielo hará sus preparativos para la gran Fiesta. Pero la Fiesta que habrá en Mi Corazón será la más grande. ¡El Cariño de Dios! Yo estoy al pie de la escalera de vuestras vidas y escucho para ver si vuestros pasos se acercan o se alejan para siempre...”</i>"],[18]],[1725,["4 de octubre.<i> “Hoy contemplarás Mi Belleza. Esta mañana viste aquella flecha rosada e intensa en el Oriente; y luego, al pasar bajo los árboles, te detuviste a mirar los largos hilos que las arañas de octubre tienden de una rama a otra. Estaban cargados de gotas de rocío como perlas ensartadas en collares.</i>\n<i>“El grillo que te cantó durante la noche en tu cerezo enmudeció a la salida del sol. Entonces el Loira comenzó a cambiar de colores con una variedad de matices que nadie sobre la Tierra es capaz de imitar, y pasaron las garzas como una larga raya en el horizonte violeta.</i>\n<i>“Si aprendes a mirar, verás que en el espacio de un solo día hay un despliegue de magnificencia que procede de Mí. Un poco de Mí para vosotros, para despertar en vosotros el atractivo de la alabanza, el gusto por la adoración, el amor al Amor.</i>\n<i>“Y cada día cambio Mis Espectáculos para renovar vuestros corazones. ¿Conoces otro proveedor tan deseoso de agradarte? ¿Tienes alguien que recorte las nubes en esas formas que te gustan? ¿Cuentas con algún ingeniero que ensanche las ondas del río hasta hacerlas tocar el muro de tu terraza? ¿Y quién llenó de pájaros las ramas de tus árboles? ¿Y quién te trajo tantas mariposas alrededor de tus flores? Y dime, ¿qué mano deprendió con tanta elegancia las hojas amarillentas de tus tilos, mientras tus plantas de fresa alargan sus tallos rastreros en el surco para los frutos de cosechas venideras...?</i>\n<i>“Es el Amor que pasa. Abre bien tus ojos para que Lo veas.”</i>"],[18]],[1726,["7 de octubre de 1948. Hora Santa. <i>“Después de haber vivido estos días gloriosos que son los días de otoño en compañía de Mi Hermosura, de Mi Potencia, ¿quieres ahora vivir con Mi Delicadeza? Puedes ciertamente encontrarla en cada uno de tus días. Así fue esta mañana: encontraste a la persona que necesitabas en ese momento... Y el correo te trajo la carta que esperabas, para animarte a realizar el bien que habías comenzado. En eso estaba Yo. Y en la reunión mundana de ayer, la conversación que tú iniciaste tomó un giro inesperado y cautivante para todos. ¿Sentiste que Yo te ayudaba? Las palabras te venían con tanta facilidad...</i>\n<i>“Y luego, esa alegría que te llega como por oleadas; ese refugio que encuentras por encima de la Tierra, como una evasión de la vida terrena; ese reposo, esa paz feliz, ese bienestar que obtienes para ti y para los demás, ¿no piensas que sea también Yo?</i>\n<i>“Te cuesta trabajo pensarlo, porque aparezco poco en escena. Es preciso que salgáis hacia Mí; necesito oír vuestra llamada y ver vuestros brazos abiertos. Es preciso venir a buscarme y hacérmelo entender. Entonces diré: ‘¿Será cierto? ¿De veras Me quiere? ¿No estoy de más en su vida, llena ya de tantas cosas?’ Entonces, como si me desatarais las Manos, Yo derramaría sobre vosotros la abundancia de Mis Gracias.”</i>"],[16]],[1727,["12 de octubre. Yo tenía un dolor de muelas. Él:<i> “Apoya tu mejilla dolorida sobre la Mía abofeteada.”</i>"],[54]],[1728,["14 de octubre. <i>“Permanece conmigo aun cuando vayas por el mundo, permanece conmigo” </i>(Es que yo iba a una reunión en casa de los X.)\n<i>“Durante el camino permanece conmigo y cuando estés allá, quédate conmigo en el fondo de tu corazón.</i>\n<i>“Si sentís algunas veces el orgullo de poseer solamente vosotros, como en exclusiva, una amistad, bien puedes creer que Yo, el que más ama, tengo siempre la ambición de ser tu Único. Y para evitar que te Me escapes con las distracciones del Mundo, con gusto echaría sobre ti la red del cazador de pájaros: un encantamiento que te mantuviera inmóvil en Mi Recuerdo.”</i>"],[39]],[1729,["21 de octubre. Acababa de morir el sacerdote que había sido mi director espiritual, y yo me sentía como bajo su bendición. Jesús me dijo:<i> “Cree que Mis hijos permanecen unidos en Mí como los miembros del cuerpo viven de los latidos del mismo corazón. Hay herencias espirituales que se transmiten a través de los muros de los sepulcros. Todo pasa por Mí y todo es para la Gloria del Padre.</i>\n<i>“Estad siempre cerca de vuestros muertos, así como ellos están cerca de vosotros... ensanchad vuestra confianza, más allá de las pequeñas medidas de la Tierra. Estableceos en el Seno de Dios. Perded de vista este Mundo que no puede deteneros, ya que vosotros vais a la Eternidad.</i>\n<i>“¡Merecer verme! Que sea este tu constante anhelo, tu deseo secreto. Y digo secreto, porque todavía es débil. Pídeme que lo haga crecer en ti para que los que se te acercan tengan como una reverberación, y comprendan el sentido de cada día que comienza. Y cuando se te cierren los ojos, desea que no se te vuelvan a abrir sino sobre Mí, tu dulce y amante Salvador.”</i>"],[38]],[1730,["22 de octubre. Después de la comunión meditaba en la Justicia de Dios. <i>“Si, pero durante vuestra vida en la Tierra no existe sino Mi Misericordia. Vive constantemente en Ella.”</i>"],[30]],[1731,["27 de octubre. Hora Santa. <i>“Tengo también otra casa habitación: vuestra alma, cuando vivís en Gracia; en ‘estado de Mí’, pues la Gracia Soy Yo. Nadie alcanza a entender Mi Gozo de ser amado en vuestras almas. Aun cuando sea solamente un poquito... ¿Te imaginas lo que es sentirse ‘en su propia casa’ en un alma? Ser el esperado, el más querido, el mejor comprendido, el que manda, aunque sea Yo siempre el inclinado a hacer todo lo que desea esa alma que vive para Mí ¡Oh, esas almas amadas que viven en gozosa atención hacia Mí para agradarme; que viven impacientes por escucharme y tienen avidez de aumentar su amor, que ellas sienten tan corto y miserable, tan frágil e inseguro, que tienen siempre miedo de recaer en las mismas faltas de ayer!</i>\n<i>“Cierra todas las entradas de nuestra casa, para librarnos del aullido de los lobos. Olvidemos la Tierra con sus cosas pequeñas, y en el lugar más apartado en el fondo del corazón hablemos con el lenguaje nuestro. Lenguaje sin palabras.”</i>","27 de octubre. Hora Santa. A la hora del Ángelus se cantaba: ‘Y habitó entre nosotros’. <i>“Yo habito siempre entre vosotros. Ya ves la casa en que habito, el Tabernáculo. Aquí os espero. La gente del mundo tiene sus días para recibir; para Mí, todos los días son de recepción...</i>\n<i>“Y conmigo, nada falta, ni el Banquete, ni el Espíritu, ni el Afecto, ni los Regalos de Mi Gracia. Os recibo sin haceros esperar; Soy Yo el que os espera.”</i>"],[26,43]],[1732,["4 de noviembre de 1948. <i>“Yo llamo a tu puerta. Mi Amor divino necesita de vuestro amor. ¿Recuerdas Mi Palabra en la Cruz, cuando dije ‘Tengo Sed’? Siempre la tengo. Si tú conocieras esta Sed, más ardiente que la sed de los hombres, te ingenierías por todos los medios para aliviarla. Por esto llamo a tu puerta.</i>\n<i>“¿Recuerdas los calores del Sahara? Pues el desierto está menos ardiente que Yo. Estoy sediento de que penséis en Mí y en agradarme, sediento de vuestra gratitud por Mis Sufrimientos, de vuestra compasión por todos los oprobios, salivazos y odios de que fui objeto la noche y la mañana de Mi Muerte. ¿Pensáis alguna vez en esos tormentos de Mi Cuerpo y de Mi Espíritu? ¿Podréis medir ese Amor que Me llevó a dejarme prender? Yo pude muy bien haber desaparecido, haciéndome invisible; pero Mi Amor Me llevó a todas las torturas. ¿No crees que con todo eso haya Yo pagado Mi Derecho a recibir de vosotros, cuando menos, amistad? El buen Ladrón Me dijo: ‘Señor, acuérdate de mí cuando estés en Tu Reino’. Y Yo os digo: ‘Acordaos de Mí durante toda vuestra vida’.</i>\n<i>“En ninguna parte puedes estar tú en donde no esté Yo también. Cuando Me buscas, ya estoy ahí; cuando Me amas, Yo mismo Me amo en ti, Soy tu Fuente. Haz cuanto puedas por volver a Mí con alegría y con simplicidad. Entonces… desea que llame a tu puerta...”</i>"],[3]],[1734,["18 de noviembre. Hora Santa. Yo Le agradecía el haber dado un perfume tan exquisito a un ramo que había cortado en el jardín. Él: <i>“Ten la firme convicción de que el Padre Celestial hizo todas esas cosas encantadoras pensando en vosotros. Su Bondad tiene sobreabundancia de inventiva para el bien de Sus hijos. Pero, ¿quién piensa en darle las gracias?</i>\n<i>“Y aun cuando ha preparado todas esas magnificencias de la Naturaleza para todos en general, también es cierto que lo ha hecho para cada uno en particular, como si cada uno fuera Su único hijo sobre la Tierra. ¡Amor para muchos y para uno solo! Todas las maneras de amar provienen de Dios, todas son adorables. Agradécele la manera que tiene de amarte a ti; Sus Pensamientos sobre tu persona, lo que ha puesto en tu corazón y no en el de otra, lo que hizo para que fueras ‘tú’, como favor particular. ¿No es un favor el que Su Mirada te haya seguido desde la Eternidad? ¿No te sientes con esto más hija Suya, y feliz de tener un Padre así?”</i>","18 de noviembre. <i>“Nadie puede hacerte daño, pues eres la hija del Padre y Cristo es tu Hermano. ¿No ves en eso una fuente inagotable de alegría? Escápate, líbrate de las preocupaciones de la Tierra; vuelve sin fin al Seno eterno que te llevó. Entrégate al Espíritu Santo, que te vivificará y te revelará al Padre. No lo puedes comprender. Entrégate de todos modos; mientras más pequeña seas, más alto te elevará el Espíritu. Enumera tus incapacidades: quisieras saltar, cuando no puedes ni siquiera caminar. Pero tiéndele los brazos y el Espíritu vendrá por ti.”</i>"],[35,48]],[1735,["19 de noviembre. ‘¿Y mis faltas, Señor? ¡Tengo tantas!’ Él:<i> “Llóralas sobre Mi Corazón. Nunca se llora bastante, algunos incluso se glorían de ellas. Pero Mis amigos saben lo que Me han costado... Se sienten tristes de Mi Tristeza y se desprecian a sí mismos. De ahí nace su amor, deseoso de expiar. Y a partir de ahí, todas sus acciones serán hechas en espíritu de reparación. Y Yo tomo la fealdad de las faltas como material para hacer lucir los esplendores del alma.</i>\n<i>“Ten Fe en la magnífica belleza de un alma humilde que Me muestra sus heridas y no confía sino en Mí. Es entonces cuando Yo la cubro con el manto de Mis Méritos. ¿Cómo podría ser de otra manera?”</i>"],[12]],[1736,["23 de noviembre. Después de la comunión.<i> “El Evangelio relata cómo bastaba con tocar la orla de Mi Manto para recibir la curación. Y tú Me comes, Me posees todo entero. Hay con eso en ti una fuerza que te puede curar, que puede cambiarte, convertirte de un golpe. ¿Lo crees en firme?”</i>"],[8]],[1739,["3 de diciembre de 1948. Yo: ‘Señor, ¿dónde podré encontrar el medio de intensificar mi celo?’ Él:<i> “Búscalo en Mí, tu Señor y tu Dios. Pide. Pide como se pide en el seno de una familia, en todo momento y déjame vivir donde tú vives. Que nada te lleve lejos de Mí, que nada Me aleje de ti. Mantenme en el centro de tu ser, como el sol en el cenit, y tus días serán divinos.”</i>"],[4]],[1741,["9 de diciembre. <i>“Si llegas a estar impregnada de Mí, como una esponja llena de agua viva, ¡con qué gusto te estrujarás para derramarme sobre los otros!</i>\n<i>“Te comprimirías por el sacrificio de no replegarte sobre ti misma, de renunciar a tu soledad silenciosa y a tu preferencia por lo que está fuera de lo común. Como si quedaras al margen de ti misma.</i>\n<i>“Con frecuencia te he dicho que te desprendas de ti y vayas hacia los otros; pero si lo haces sin afecto, el objetivo se frustra. En cambio, Me los ganas si en tu conducta pones la delicadeza de tu corazón. Y ganar un alma para Mí es algo que puede llegar muy lejos. No escatimes nada; no te reserves.”</i>","9 de diciembre. Mi aposento estaba totalmente iluminado por una nube bañada de sol. Le dije: ‘Señor, haz que yo Te refleje como esa nube.’ Me contesto:<i> “Apodérate de tu Dios. ¿Qué eres tú sin Él? Nada. Cédele todo el lugar. No te ocupes sino de Él, en pensamientos, en palabras, en acciones. Y Él se ocupará de ti.</i>\n<i>“¡Es tan poco, tan poco el tiempo que vivís sobre la Tierra! Que al menos ese poco sea todo para Él. Como Yo, que no viví sino para vosotros. Belén, Nazaret, Mi Vida pública y su terrible Fin. Ponme en el centro de todas tus acciones. Que tu amor y tu ansia sea siempre Yo. Cuídate, Mi pobre pequeña, de no hacer las cosas por ti.”</i>"],[5,26]],[1743,["En mi recámara. <i>“Pide sentir hambre de Dios, sed de Dios. Pide enfermarte de Dios.”</i>"],[3]],[1744,["<i>“Un santo es un hombre como los demás, pero un hombre que se ha vaciado de sí mismo y ha invitado al Espíritu a que ocupe su lugar. Y el que es Santo es el Espíritu.”</i>"],[47]],[1745,["10 de diciembre. <i>“La Fe es la vida de la Tierra. La Esperanza, la vida del Purgatorio. La Caridad, la vida del Cielo. La Fe se dirige al Padre Creador; la Esperanza, al Hijo Salvador; la Caridad, al Espíritu de Amor.”</i>"],[53]],[1746,["21 de diciembre. Yo volvía de París y Le daba gracias por un favor. Me dijo:<i> “¿No era eso lo que tú Me pedías cada mañana al ofrecerme las obras del día? Yo también sé complacer a los Míos. Aprende de Mi Delicadeza.” </i>Yo: ‘Señor, mis faltas merecían más bien un castigo.’ Él: <i>“Imítame. Cuando tengas que reprender a los otros, no los humilles. Muéstrales una ternura nueva. Imita a tu Dios en todo. Cuando tu alma se desprenda del cuerpo no habrá visto a Dios, pero habrá sabido mucho de Él; y de ese conocimiento nacerá un inmenso deseo de verlo y poseerlo.</i>","21 de diciembre. <i>“Quiero, hija, que se apodere de ti el empeño en poseerme. Será una gloria que Me ofrezcas, un juego de luces de amor, en respuesta a Mis Fuegos, esos Fuegos en los que nadie cree. Porque... tú, ¿crees realmente siempre en ellos? Para algunos, creer es una debilidad...</i>\n<i>“¡Oh amable debilidad que regocija Mi Corazón ardiente! Nunca pienses que crees demasiado, ni temas excederte en Mi Amor. Continúa, como si nada hubieras hecho todavía; y de ese modo, Yo, que os amé hasta el fin, recomenzaré cada vez con vosotros, como una prueba más de Mi Amor infinito. Aprende, hija, a amar al Amor. Y que te encante el aprendizaje de amar.”</i>"],[5,18]],[1747,["22 de diciembre. Después de la comunión.<i> “Como sabes, en otro tiempo regía la ley del temor, pero ahora el Amor es la ley. Esto lo hace sentir profundamente la Dulce fiesta de la Navidad. ¿No es cierto que a partir de ahora todo será amor en tu vida, especialmente el arrepentimiento de tus pecados? Haz de ellos una plataforma para amarme mejor. Y no pienses que es poca cosa; el amor es siempre una transfiguración. Lo tienes de la mañana a la noche, como una llama que alumbra todos tus actos y que se mezcla con las lumbres del Cielo. ¿Acaso no estás unida a los habitantes del Más Allá? ¿No sois todos vosotros una sola familia, la familia de los hijos del Padre Celestial? Y la alegría, ¿no es la unión? Apóyate, antes de partir, en los méritos comunes: no estarás sola. Todos esos ornatos tomados de la Comunión de los Santos cantarán muchos nombres para acompañarte.”</i>","22 de diciembre. Después de la comunión.<i> “Como sabes, en otro tiempo regía la ley del temor; pero ahora el Amor es la ley. Esto lo hace sentir profundamente la Dulce fiesta de la Navidad.</i>\n<i>“El Amor no es egoísta ni calculador y siempre está pronto a socorrer. Y en el Cielo no hay sino Amor. Este Amor Yo lo traigo a la Tierra, mientras que el Maligno siembra el odio. Son dos campos: escoge. Y si escoges el Amor, no te quedes tímidamente a la orilla; entra con decisión en el camino de los fuertes. Y considera el ciclo de Mi Vida. ¿Qué es lo que te ha gustado más? ¿Mi Nacimiento en la pobreza? ¿La Vida oculta? ¿La Revelación manifiesta? ¿O la muerte ignominiosa? En todo esto se encuentra bien visible el sello del Amor. El Amor de Mi Padre, el Amor a vosotros, a ti... Regocíjate y responde al torrente de Mis Favores.”</i>"],[7,32]],[1750,["6 de enero de 1949. Hora Santa. <i>“¿Quién como Dios? ¿Puedes, hija, encontrar una comparación? ¿Un Amigo más grande, más cariñoso, más rico, más poderoso? Y si nada puede serle comparado, ¿por qué no te entregas completamente a Él? ¿Por qué siempre tienes reservas? ¿De dónde te viene ese miedo a abandonarte en Él?</i>\n<i>“Te cuesta trabajo creer en las liberalidades de tu Señor. ¡Él! ¡Yo! ¿Será posible? Pero todo es posible al Amor. Ven, con atrevimiento. Encontrarás que te estaba esperando.”</i>"],[3]],[1751,["13 de enero. Hora Santa.<i> “Lo que os falta es el celo de Mi Gloria. No hay impulso. Vuestros pensamientos y acciones son monótonos, sin ese vivo deseo de agradecerme, de ofrecerme vuestro amor como una mano que se tiende para acariciar. Sería la vida para Mí, no para vosotros. Levantáis la cabeza un momento, pero luego caéis otra vez en vuestro punto central, que es el egoísmo. Y esto les sucede incluso a los mejores. Yo sigo siendo un Ser aparte. Algunas veces existo los domingos… pero quiero existir para vosotros todos los días.</i>\n<i>“Ámame, aun cuando Yo no te amara. Y ámame por Mí mismo, no por ti. Ofréceme todo lo que te he dado. Mírame desde Mi Infancia sobre la Tierra. Mira Mi Candor, Mi Lealtad, Mi Espíritu de inmolación, ya desde entonces. Y sin embargo, Yo no era sino un Niño pequeño.</i>\n<i>“Tu alma es pequeña. Hazla muy simple: ¿para qué complicarte? Responde a la simplicidad de tu Señor. Ven a Mí en todo momento. Y si no sabes qué te impide hacerlo, búscalo y destrúyelo.”</i>"],[2]],[1754,["3 de febrero de 1949. <i>“Da ejemplo. Es preciso que los hijos de Dios honren a su Padre.”</i>"],[35]],[1755,["Hora Santa. <i>“No permitas que se apague la llama de tu confianza. Mantenla ardiente en Mí, pues la necesitas a todo lo largo de los días. Entra y vuelve a entrar en la confianza como en un estado feliz previsto por Mí. Os quiero establecidos en Mi confianza. La confianza es parte del amor. Comprende que si tú Me amas y crees en Mi Amor, te abandonarás en Mis Manos, como un niño pequeño que ni siquiera pregunta a dónde lo llevan y camina gozoso de mano de su madre. ¡Dichosa confianza, que os granjea tantas Gracias! Guarda tu diadema.</i>\n<i>“Haz que te guste no saber nada del porvenir; así tendrás ocasión de abandonarlo en Mis Manos. Yo sé cómo llevar a los ciegos por los mejores senderos. Y cuando uno de estos ciegos recuerda que es Mi hijo, llega hasta alegrarse de una ceguera que le da fuerza sobre Mi Corazón.</i>\n<i>“Y Yo, por Mi parte, Me veré tentado de agradecerle esa confianza, como si con ella Me hiciera un favor especial. Descubre en todo esto Mi Ternura, esa Ternura que no Se limita ni Se fatiga.”</i>"],[9]],[1760,["3 de marzo de 1949.<i> “Acércate a Mí y acerca a los otros: este es el sentido de la vida terrena, tan breve...”</i>","3 de marzo de 1949. Hora Santa. <i>“Mírame con frecuencia, con la dulzura de la mirada de los que se aman. Yo te tengo presente sin cesar. Ante Mi Rostro, manifiesta tu deseo de pagarme con la misma moneda. Sé que te arrastran las ocupaciones de la vida, pero tu ocupación primera ha de ser la de estar conmigo, como si te enraizaras en Mí, porque entonces las flores y los frutos –tus buenas acciones– tendrán un perfume especial: ‘olerán a Mí’.”</i>"],[4,29]],[1761,["10 de marzo. (Misión). <i>“Si un hombre rico se complaciera en enriquecer a personas pobres con gran amor y deseo de verlas alegres, y si esos pobres tuvieran un cierto desdén por los dones recibidos, el bienhechor sufriría una lastimadura en su amor. Y tendría razón al preguntarse si vale la pena continuar ayudando a gente tan ingrata. Pero si algunos de ellos tienen en su corazón una respuesta amorosa, el bienhechor continuará con sus dones sobre todos ellos, por causa de la piedad de algunos. ¡Si supieras la fuerza que tiene sobre Mí un grupo escogido!”</i>"],[22]],[1763,["24 de marzo. <i>“Creer es la mayor de todas las felicidades. ¡Qué Gracia tan grande, la Gracia de creer! ¿Podéis acaso comparar vuestra vida con la de aquellos que perdieron la Fe? Vosotros pues, siendo ricos, dad a los pobres. Dadles toda vuestra potencia de oración, toda vuestra fuerza de amor y vuestros deseos de amar todavía más.”</i>"],[21]],[1764,["28 de marzo. Después de la comunión. ‘De donde Él vendrá un día a juzgar a los vivos y a los muertos…’ <i>“Ese día será el de las grandes Justicias. Pero ahora es el tiempo de las grandes Misericordias y Yo vengo en el Amor. Concéntrate en vivir tu momento presente.”</i> (Esto me lo dijo porque mi mente vagaba por el pasado y el porvenir)."],[25]],[1765,["30 de marzo. En mi recámara. Me dijo: <i>“Hija Mía, considera mejor el valor del momento presente, el peligro de regresiones al pasado y la inutilidad de los atisbos al porvenir. Vive amorosamente y con simplicidad el momento de que dispones.”</i>"],[25]],[1766,["31 de marzo. Hora Santa. <i>“Pon cuidado en lo que piensas, pues tus pensamientos se llevan la mayor parte de tu existencia. Son como un reino interior que se debe gobernar con prudencia, pues en ellos está el origen del bien y del mal de cada día.</i>\n<i>“Ponlos habitualmente en un clima de Dios: Su Gloria, Su Voluntad, Su Clemencia y todas esas Perfecciones que hacen que Dios sea Dios. Vivir en este clima de las Perfecciones divinas lleva a conocerlo mejor y a darse uno mismo menos importancia.</i>\n<i>“Recuerda que una vez Me preguntaste: ‘Señor, ¿cuándo estaré perfectamente unida a Ti? ¿Tan absorta en Ti que ya no me acuerde para nada de mí misma?’… Tú tienes libertad para mandar sobre tus pensamientos y el deber de elegirme siempre a Mí.</i>\n<i>“¿Cómo podrías, si no Me eliges siempre, tenerme como a tu gran Amigo, como a tu más hermoso Amor? ¿Cómo a ese Ser amado que vive siempre en tu ser? Tú no Me ves, pero sabes que aquí estoy; dedícame, pues, tus amorosos pensamientos de ciega.”</i>"],[25]],[1767,["6 de abril de 1949. Yo: ‘Sí, Dios mío, estoy dispuesta a partir para encontrarte… pero, ¡mis pecados! ¡Todos mis pecados…! ¿Qué puedo hacer?’ Él: <i>“Dámelos. Yo lavaré tu alma. Pero dámelos.”</i>"],[12]],[1769,["14 de abril. Jueves Santo. <i>“Permanece muy cerca de Mí este día: es el Día de Mi inmenso Amor. Celebra este aniversario de la manera más sencilla y afectuosa. Considera, en primer lugar, el Amor. Da en primer lugar, amor. Búscalo antes que nada y por encima de todo, y serás la que Yo quería. ¿No sientes, Mi pequeña, que todo lo demás no vale nada? Haz que los otros sientan lo mismo, y así avanzarás en tu camino de apóstol. ¡Qué Gozo el Mío, si todos vuestros instantes fueran momentos de amor! Sería una buena respuesta a lo que fue Mi Vida terrena. Comprenderás que en un día como hoy no puedo hablarte de otra cosa.</i>\n<i>“¿Has considerado alguna vez lo que tuvo que ser el peso del Amor que Me llevó a la Institución de la Eucaristía, este acuerdo perfecto entre lo interior y lo exterior? Yo ardía por ser vuestro y quedar en vuestra posesión hasta el fin de los tiempos; por ser conocido como cosa vuestra, cosa que se toma, se come y se bebe; por estar encerrado en una casa vuestra, en una iglesia, para aguardaros allí, escucharos, consolaros, en la más íntima de la uniones posibles. ¿No Me amaréis un poco más por esto? O, ¿qué lenguaje debo usar para hacerme comprender? Si tu Fe es demasiado débil para encontrar palabras encendidas, pídeme que Yo Me hable a Mí mismo en ti. Pon tu alma entre Mis Dedos como un arpa tensa y bien afinada; Yo sacaré de ahí sonidos admirables, cuya armonía asombrará al Cielo y a la Tierra. Pero, una vez más: ¿quieres ser este instrumento entre Mis Manos?” </i>Yo: ‘Claro que sí, mi Señor, y con toda mi alegría.’ Él: <i>“Entonces, cantaremos juntos y con los mismos acentos, al Padre: ‘Padre Santo, gracias Te damos por haber hecho este día’. Y tú lo repetirás como una niña que está aprendiendo el alfabeto del Amor.”</i>"],[20]],[1770,["Viernes Santo. <i>“¿Por qué tendrías que emplear largas frases y palabras difíciles al hablarme? Haz conmigo como con tus íntimos: dame lo que hay de más simple en tu corazón. ¿No Soy Yo uno de ellos?”</i>"],[34]],[1772,["28 de abril. En camino hacia París. <i>“Piensa mucho en Mí, hija, mucho. Con tan poco Me das un gusto muy grande. Comprende que en el Cielo no vas ya a tener ocasiones de elegir. Aquí puedes escoger entre ser tuya o Mía… allá, no. Quizá piensas que es poco importante ese pequeño pensamiento con que vienes a Mí, pero es la modalidad de toda una vida. El pensamiento es la mirada del alma; que la tuya sea natural, cálida. Adora, saluda. Y cree firmemente que todo en tu vida ha sido hecho expresamente para ti. Hazme el honor de creerlo así. Sábete que si Me contemplas así, sin cansarte, Me imitarás.”</i>"],[25]],[1773,["9 de mayo. <i>“Dime con toda humildad: ‘Señor, no he hecho sino esto en todo el día. Podría haberlo hecho mejor. Contigo y con los demás.’ Dímelo así y Yo pondré lo que faltó.”</i>"],[23]],[1774,["12 de mayo de 1949.<i> “Cuando vengas a Mí, ven con el entusiasmo del amor. Si te detienes porque no aciertas a desprenderte de tus ocupaciones, ¿dónde está el amor? No Me hagas esperar, porque siempre te espero. ¿Estás dispuesta a olvidarte, para venir a Mí? No Me prives del placer de llamarte. Hay penas que no siempre se manifiestan, pues son muy grandes. Ámame por ti y ámame por los otros, como si Me ofrecieras amores adicionales que no formaran sino uno.”</i>"],[10]],[1775,["19 de mayo. <i>“¿Crees tú que podrías sostenerte largo tiempo sin Mí? ¿No sientes la necesidad de gritarme que Me necesitas? ¿Y no comprendes que Yo necesito ese grito tuyo? Aquí estoy, cargado de Tesoros; pero no sé cómo dártelos si tú no Me los pides. Y no puedo estar alegre si solo de cuando en cuando Me dices que Me amas. Cada alma tiene una luz directa que ninguna otra Me puede dar. No te Me hurtes: tu amor es irremplazable.”</i>"],[3]],[1776,["29 de mayo de 1949. <i>“¿Sabes qué te voy a pedir hoy? Que aprendas a hablar bien de los demás. Si adquieres ese hábito Me darás mucho gusto. Y habría en ello una gran enseñanza para todos. Porque, incluso en las personas más llenas de defectos, hay cualidades. ¿Quieres empezar ensayando hoy, y continuar haciéndolo hasta el fin de tu vida?”</i>"],[5]],[1777,["2 de junio de 1949. Hora Santa. <i>“¿No alcanzas a darte cuenta de que todavía ahora Me juzgas como a un ser lejano y severo? ¡Sonríeme cuando Me hables! Cree que Me harás feliz… No es orgullo creer que Yo miro incesantemente con Amor cómo vives y que, mirándote vivir, Me complazco en todos los gestos tuyos con que tratas de agradarme. Ve, simplemente, la profundidad de Mi Cariño.”</i>","2 de junio de 1949. <i>“El amor crece con el amor. No escatimes su ejercicio, ese que busca los impulsos directos. Sea que ores, que des gracias, o que pidas el advenimiento de Mi Reino. Eso no es contrario a la humildad, puesto que todo viene de Mí. ¿No has observado que Mi contemplación te calma, como si entraras en Mi Paz?</i>\n<i>“Dame gracias por haber hecho la Creación del Mundo y la de vuestra segunda vida, la del Cielo conmigo. Y, ¡hay tantas maneras de agradecer! Que tu entusiasmo de amor venga al encuentro de Mi Entusiasmo de Ternura. Será la recapitulación de la Primera Sinfonía, la que se ejecutó entre Dios y Adán.”</i>"],[1,11]],[1778,["8 de junio. En el Metro de París. <i>“Ciertamente Me da mayor gusto el que estés conmigo en medio de una multitud, que en la soledad de tu aposento. Las multitudes de París Me dejan solo, como cuando estaba muerto.”</i>","8 de junio. De camino. <i>“Hasta ahora tu unión conmigo ha sido ‘como si fuera verdad’. Ahora debes dar un paso más adelante: una unión en la Verdad actual. No será ya algo del dominio de la imaginación, sino la seguridad de la Fe.”</i>"],[10,21]],[1779,["9 de junio. <i>“Busca la simplicidad del amor en las cosas pequeñas; en las más pequeñas de todas. ¿Por qué las pequeñas no habrían de tener el valor de las grandes, si se viven con el mismo amor?”</i>"],[14]],[1780,["10 de junio. Aniversario de mi Primera Comunión. Le dije: ‘Bendito seas, Dios de mis amores, por todas las Gracias que me concediste esa primera vez. Y gracias por todas las otras, hasta la mañana de hoy. ¿Habré comulgado 20,000 veces?’ Él: <i>“Cuando Yo Me doy, Me doy para siempre, a menos que se Me rechace. No te debe sorprender, después de esto, si te digo que Yo os deseo en el ofrecimiento de todos los instantes de vuestra vida. Y si somos continuamente el Uno para el otro, nuestra alegría es grande y nadie nos la puede robar.</i>\n<i>“Mi Vida transcurrió únicamente para los hombres. Yo amaba y salvaba. Tú, ama y salva. Dame almas; trabaja por ellas, con la oración y la penitencia. Muchos no piensan en eso; otros se ríen y, sin embargo, esa es la moneda con que se compra y se redime. Que todo sea hecho piadosamente, en el amor.”</i>","10 de junio.<i> “El Amor es como un bosque sagrado en que calzadas secretas conducen a la encrucijada de una Unión de alegría. Los altos follajes se balancean al soplo del Espíritu y los pájaros que cantan con inspiraciones divinas completan la armonía, que no es sino la felicidad en el sacrificio temporal: corto y poca cosa el sacrificio de la Tierra. Los santos del Cielo os tendrían envidia, porque ellos ya no pueden hacer penitencias redentoras. No pierdas tiempo, hija, pues ya Me has dicho que todo en ti es para Mí.”</i>"],[4,37]],[1783,["17 de junio. Después de la comunión consideraba yo con tristeza mis pecados de ayer. Él: <i>“Dame tu ropa arrugada. La plancharé como nueva con Mis Méritos.”</i>"],[12]],[1784,["22 de junio. Después de la comunión. <i>“Cuando cierras los ojos es como si pusieras a Mi servicio todo lo que hay en tu interior, toda tú. Cuando miras hacia afuera ya no somos nosotros, pues te separas de Mí.”</i>"],[8]],[1785,["23 de junio. Hora Santa. <i>“Tú y Yo somos uno. Es ya tiempo de que Me veas de una manera nueva: la manera fuerte de la Verdad. Esta soledad entre nosotros dos es algo tan admirable que la envidian los ángeles, pues ellos no han recibido la Sagrada Comunión. Todo lo que constituye tu ser está penetrado por Mí; conságrate con efusión y Yo te tomaré para llevarte hasta la Unidad. ¿Por qué no vienes a Mí con la alegría que experimentas cuando encuentras a un amigo muy querido?”</i>"],[8]],[1787,["28 de junio. Un mirlo cantaba deliciosamente. Él: <i>“¿Sabes por qué canta así? ¿Por lo azul del cielo? No. Canta porque responde a otro.” </i>Entonces oí a lo lejos la voz del otro y en mi corazón pensé en la Voz de mi Señor. Luego, yendo por la calle, decía yo: ‘Que sea siempre alabado y amado el Corazón Eucarístico de Jesús.’ Entonces me dijo: <i>“Cada vez que formulas este deseo, Yo Me siento obligado a escucharlo, como si aumentara Yo Mi Gloria solo para darte gusto.”</i>"],[34]],[1788,["4 de julio de 1949. <i>“La Fe es lo que hace que se toquen el Creador y la creatura. Cuando tú consigues afirmar la fuerza de tu Fe, la Esperanza y el Amor se dilatan en ti para estrechar la Unidad… Y cuando se establece la Unidad, se es fiel en los actos pequeños lo mismo que en las grandes acciones, pues todo es común y sencillo en la Presencia de Dios.”</i>","4 de julio de 1949. <i>“Repítele con frecuencia, como una respiración de amor: ‘estamos juntos, estamos juntos’.”</i>"],[53,54]],[1790,["14 de julio. <i>“Nada, hija, iguala a la alegría que Yo doy, y toda alegría viene de Mí. Y la alegría la puedes tener aun en medio de un sufrimiento, si lo sufres por Mi Amor. Los placeres del Mundo rebajan al hombre; pero Mi Alegría lo hace crecer y le da una fuerza y un celo nuevos. Es tanto lo que amo al hombre, que le daría las gracias por aprender a gustar de Mi Alegría; porque gustar de Ella es gustar de Mí.”</i>","14 de julio. <i>“Acepta que Yo estoy en ti. Desea que esté en ti. A veces el espíritu del Mundo se apodera de un hombre y habita en él a su pesar. El Espíritu de Dios, por el contrario, Se inclina ante vuestra voluntad libre. El Amor Se detiene y espera. Y manifiesta Su Poder de Amar precisamente esperando antes de tomar lo que anhela.</i>\n<i>“¡Hija! Si pudieras concebir en ti ese impulso total de la voluntad hacia Dios, esa locura por poseerlo, el encuentro sería muy simple y la posesión se haría habitual. Pon Mi Nombre delante de ti, y avanza.”</i>"],[0,26]],[1791,["21 de julio. <i>“Tú has creído en el afecto de tu padre y de tu madre. Cree entonces en el Mío, pues Yo Soy para ti padre y madre. Yo les di lo que te dieron. Considera cuál no será Mi Alegría cuando creas como Yo quiero que creas. Que te ayude el deseo de procurarme esa Alegría. Dime con frecuencia: ‘Señor, creo, pero auméntame la Fe’; y Yo te La aumentaré.”</i>","21 de julio. <i>“Convéncete de que Yo presto atención a todo lo que vosotros Me pedís: Mi Oído está pendiente de vuestros labios aun antes de que comencéis a hablar. Y, ¡qué decir de Mi Corazón! Nadie sobre la Tierra puede escucharte con la avidez con que Yo lo hago. No hay corazón que pueda conservar lo que tú dices, completarlo y embellecerlo. Y eso que Me dices necesita pulimento, acentuación, aumento. ¿Quién se lo dará? Solo Yo, tu Animador.”</i>"],[21,33]],[1792,["28 de julio. Hora Santa, en mi aposento de la casa de campo. <i>“¡Tú! ¡Tú! ¿Sabes lo que eres para Mí? Fuiste Mi razón de ser y de vivir sobre esta Tierra. Eres tú, pequeña creatura, quien Me sacó de los esplendores del Padre para agotar las ignominias de la Humanidad. Cuando te miro se renueva en Mí la memoria de Mis Sufrimientos y las Invenciones de Mi Amor, desde antes de que tú nacieras. Y ahora que estás aquí, ahora que has recibido el Soplo de Dios y Su semejanza, ¿qué es lo que vas a hacer por Mí los pocos días que te quedan? ¿Vas a despertar tu corazón para que una nueva vida lo vuelva hacia Mí? ¿O te vas a contentar con tus pequeños impulsos ordinarios sin darme nunca otros más directos y ardientes?</i>\n<i>“Comprende que después de haber vivido para ti, aspire Yo con ansias una respuesta de amor y de vida. Tengo necesidad de recuperar en sacrificio tu cuerpo y todas tus facultades, que recibiste de Mí. Tu pensamiento, sobre todo, porque es él el que te mueve para Mí o sin Mí; el que mueve tu corazón y el que puede prenderme y conservarme. Es él el que Me descubre ante ti y te arrastra al heroísmo; él puede hacer que te revistas de Mí como con una vestidura que se ajusta a toda la configuración de tu ser. Y cuando tu pensamiento llega a Mí gozoso por ser tierno, ¿qué podría Yo negar a su confianza? Tú no estuviste lejos de Mí en Mis años de Vida terrena; no te he tenido lejos de Mí durante toda la Eternidad. ¿Puedo, entonces, pedirte que nunca te alejes de Mí voluntariamente y esto, hasta tu último instante?</i>\n<i>“¡Qué será el instante del supremo Encuentro! ¡Con qué claridad comprenderás, en ese momento, que era preciso estrecharme en tus respiraciones para vivificar los latidos de tu corazón! ¡Ah, tú… tú…!”</i>"],[3]],[1794,["3 de agosto de 1949. Yo estaba distraída, después de la comunión. Con un tono de suave reproche, me dijo: <i>“¡Aquí estoy!”</i>"],[8]],[1795,["4 de agosto. Hora Santa. <i>“Cuando estás a Mis Pies, en oración o en contemplación, ¿por qué no te unes a todas las almas santas que en ese momento oran o contemplan? Tú no eres como una pequeña iglesia separada; formas parte del gran Movimiento de Cristo, bajo el Soplo del Espíritu; si te aislaras, romperías la cadena. Permanece ligada a las almas fervientes, y reconoce Mi Deseo de veros a todos unidos, como aquella Túnica Mía, que no tenía costuras. Debes llegar a ser tan humilde que te pierdas en la multitud, y lo bastante ávida de merecer como para buscar el beneficio de aquellos hermanos tuyos que Yo permita que te ayuden.</i>\n<i>“Piensa con mayor frecuencia en esta unión cotidiana con todos Mis amados del Mundo actual. Los que sufren, los que son perseguidos, los que están abandonados, los que viven en el destierro o en las cárceles, los que son martirizados a causa de Mi Nombre. Los que en su cuerpo destruido continúan sufriendo hasta su último suspiro y bendiciéndome, sirviéndome y llamándome con todo su amor; únete a ellos, para que nada se pierda.”</i>"],[7]],[1797,["18 de agosto. Yo debía someterme a una operación quirúrgica. Él: <i>“¡Qué importa lo que pueda suceder! Tú eres Mía y habitas en Mi Amor; tu camino sobre la Tierra te llevará a una vida sin fin. Invítame a recorrer contigo este último tramo. Y, sobre todo, que sea el más íntimo y gozoso, pues los dos mantendremos el mismo paso. ¿No tienes una canción para el camino? ¡La Voluntad de Dios! No hay otra tan encantadora. La cantaremos juntos.</i>\n<i>“Por otra parte, no vayas a pensar que Yo Me alejo cuando Mis amigos están padeciendo. Y Mi Presencia es tan reconfortante que algunos llegan hasta tener el deseo de sufrir siempre. Mantenme, pues, muy cerquita, para que caminemos mejor. ¡Qué camino tan hermoso el que conduce a la Eternidad! No estés triste. Tu tristeza Me daría pena, porque morir no es sino venir a Mí, ya que al perderte tú Me encuentras a Mí. ¿Quieres que, por fin, llegue el momento del Encuentro?”</i>"],[40]],[1798,["25 de agosto.<i> “Si un hombre ofreciera una mesa copiosamente servida con manjares que le hubiera costado mucho, y si rogara a todos los transeúntes que fueran a la mesa para beber allí la vida, se sentiría defraudado en lo más hondo de su corazón si ellos, en vez de aceptar la invitación, pasara de largo con desprecio. Y si hasta sus amigos, los que se decían sus íntimos, no vinieran a su mesa sino ocasionalmente… ¿no crees que ese hombre generoso se vería muy dolido, y que tendría el derecho de cerrar para siempre la puerta de su casa?</i>\n<i>“Pues bien. Yo Soy ese Hombre, y Mi Banquete permanece hasta la consumación de los siglos. Entrad pues, todos los que no habéis todavía sentido la ternura de la invitación. Y traedme a vuestros amigos, ¡a todos! Revestíos con Mis Riquezas, y dad a los pobres en confianza, a los pobres en deseos, a los pobres en luces de entendimiento… ¡que se creen ricos! Y mientras más deis a los otros, más espléndida será vuestra parte. Mis Méritos son inagotables. Mis Méritos son Yo mismo.”</i>","25 de agosto. <i>“Si estás fatigada, descansa; pero descansa en Mi Corazón. En ningún lugar encontrarás tanto cariño. Yo Soy tu eterna Respuesta. Respuesta a tus anhelos, que Yo compré con el Dolor cuando Me entregué a Mi Pasión.”</i>"],[8,13]],[1799,["8 de septiembre, después de la operación. 1949. <i>“¿Ya lo ves? Yo hubiera podido venir a buscarte y tú te habrías dejado llevar llena de gozo. Pero también quieres trabajar un poquito más para Mi Gloria, ¿o no? ¿Y lo quieres alegremente? En servirme está el valor de la vida.</i>\n<i>“¿Me creerás si te digo que Yo Soy Quien te sirve para ayudarte a que Me sirvas? Te daré todo lo que aún te falta en el corazón y en la inteligencia. ¿Te he fallado alguna vez? No Me falles tú a Mí.</i>\n<i>“Juntos recorreremos las millas y nudos de lo que te falta por vivir. En días como hoy, en que sientes tu debilidad, apodérate de la Fuerza de tu Hermano para amar, alabar y agradecer al Padre común. No lo prives de ninguna sonrisa tuya, pues cada una es un feliz ‘Amén’. Y de la misma manera dale a tu prójimo, tan necesitado como está de alegría y de benevolencia. Camina de frente y con fuerza, como cuando se va hacia Dios.”</i>"],[54]],[1802,["29 de septiembre. Convalecencia. Me dijo: <i>“¿Notas la diferencia entre la vida que Me ofrecías antes de la prueba y la que ahora Me ofreces? ¿No es verdad que te ha sido provechoso acercarte a los confines para mirar con ojos de verdad lo que es la Tierra y lo que es la Eternidad? ¿Comprendes que ha sido un medio nuevo empleado por tu Dios para atraer tu atención y hacerse más cercano a ti?</i>\n<i>“Mi Amor, pequeña, es ingenioso, inventivo en Su Deseo de adueñarse de vosotros en plena carrera, pero muchos Me esquivan. Tú, déjate tomar. Y así, extenuada y sin resuello como estás ahora, reposa sobre Mi Corazón. Él conoce bien la prueba a que te ha sometido, y lo que más importa es que no hayas dudado de su Amor y hayas dicho: ¡Fiat!, abandonándote a lo que pudiera suceder.</i>\n<i>“Y ahora, no nos separemos más. Yo Soy el Globo que encierra tu vida. Si ardes, es por Mi Fuego; si avanzas, es por Mis Pasos; si respiras, Soy tu respiración. Una aceptación gozosa de Mi Voluntad puede impulsar a un alma a una etapa espiritual superior, que ella no podría siquiera sospechar. Dadme las gracias con toda la fuerza del corazón, dejándome en libertad de acción en vuestras vidas. Yo tengo giros repentinos que no entran en vuestras previsiones, y cuando la Fe o la mirada de amor os hace comprenderlas, es cuando podéis ofrecer al Padre una alegría desconocida. Al Padre, que en vuestros momentos de tristeza, igual que en los de prosperidad, no es nunca sino Amor.”</i>"],[40]],[1803,["6 de octubre de 1949. Yo trataba de contener a una persona que se dejaba arrastrar por una pasión terrible. <i>“No podrás conseguir eso tú sola. Invoca a Mi Madre. Ella Me verá en ese hombre y lo asirá. Pero tú, ora. ¡Con cuánto ardor hay que pedir por la salvación de las almas! Todos esos instantes perdidos, que vosotros no ocupáis en nada, dádmelos a Mí para el bien de vuestros hermanos que están en peligro.”</i>"],[28]],[1804,["13 de octubre. <i>“Como ves, toda la esencia de la vida cristiana vuelve siempre a lo mismo: al Amor. Tú no conoces aún todas sus tonalidades, sus sinfonías. Busca para cada día un amor nuevo, que no haya encontrado todavía palabras para expresarse, y él provocará en ti movimientos que no tenías, como si te dirigieras a un Dios nuevo, adorado bajo otra luz, y que variaría cada mañana para agotar en tu corazón elocuentes conciertos sobre la Unión.</i>\n<i>“Dios es infinito. Penetra en Él como en una selva profunda en que los silencios llenos de misterios resuenan en las honduras del ser.”</i>"],[18]],[1805,["20 de octubre. <i>“¿Piensas acaso que tu vida interior necesita mucho de tus sentidos? ¿O es que todavía no comienzas a estar más cierta de lo invisible que de lo visible? Hay momentos en que te afianzas en la certeza de la Fe, y es entonces cuando Nosotros venimos a ti, dentro de ti, porque en esos momentos respondes a lo que fue Nuestra Intención cuando te creamos.</i>\n<i>“El hombre debe dejar toda cosa material para apegarse solamente a Dios, a Quien debe amar sin verlo. Y en esto reside todo el secreto de darle felicidad a Dios.” </i>Yo: ‘Pero, Señor, aun cuando Te hablo en mi alma y con espíritu de Fe, no hay belleza alguna en las pobres palabras que Te digo.’ Él:<i> “¿Y qué importa eso? Lo importante es que Me hables.”</i>","20 de octubre. Hora Santa. Yo: ‘Señor, mi perseverancia se me escapa, como arena entre los dedos.’ Él: <i>“Eres pequeña. No tienes por qué asombrarte de tu flaqueza. ¿No comprendes que es preciso darme continuamente la mano? Llamarme y aceptar la Alegría que Yo traigo, porque la alegría es fuerza.</i>\n<i>“En Mí nada se agota. Así como no se disminuye el océano porque se le saque agua. ¿Sería Yo realmente Dios si Mi Riqueza se disminuyera por los Dones que otorgo? ¿Y no voy a dar a un alma porque ya le di antes? ¿Debe esa alma mantenerse en una tímida reserva? No. Al contrario, debe animarse hasta el punto de pensar que cuanto ha recibido hasta ahora, para Mí es como nada. Porque Mi Felicidad está en colmar ‘según Mis Medios’, y Mis Medios son infinitos; puedo dar sin medida.</i>\n<i>“Cuando el alma entrevé que junto con el Poder tengo Yo la Voluntad de un Amigo que quiere embellecer a Su amiga, ya no tendrá el temor de abusar, ni de excederse en audacia ante su Dios; sino que, sintiéndose pequeña comprenderá la Alegría que Dios tiene de ser grande para ella.”</i>","20 de octubre. Hora Santa. <i>“¡Cuántas veces, en Mi Tabernáculo, he tenido las Manos llenas de Dones, pero nadie ha venido por Ellos! Y sin embargo, algunos habían entrado en la iglesia para una corta visita, distraída, lejana, como si Mi Cuerpo estuviera muerto en la Eucaristía y Mi Alma allá arriba, en el Cielo… Esforzaos por pensar en la realidad de Mi Presencia eucarística: solo así podéis amarme.”</i>"],[21,24,43]],[1806,["25 de octubre. En la terraza. <i>“No seas como esas mariposas de octubre que ya no saben volar porque llegó el otoño y el viento es inflexible. Tú sube y sube más, conforme se prolonga tu vida.”</i>"],[1]],[1808,["3 de noviembre. Hora Santa.<i> “¿Qué punto de madurez has alcanzado en nuestro Amor? ¿Te Me acercas siempre con pensamientos de amor cada vez más frecuentes e íntimos? ¿Te sientes alegre de poderme ofrecer algún sacrificio? ¿Tienes más ardor en el deseo de Mi Reino? ¿Eres buena con los demás, pero con limitaciones?</i>\n<i>“Como ves, a los niños hay que hacerles muchas preguntas para estimular su aplicación. Y tú, sabedora de tu debilidad y miseria, pregúntate si tus pobres fuerzas se mantienen todavía, y cómo podrás aumentarlas. Los principiantes necesitan siempre un elogio que los estimule y tú, hija, nunca dejas de ser una principiante... Cuando eras pequeñita, te llevaban la mano para ayudarte a escribir y así, tu Dios, te llevará el corazón para que aprendas a amar. Y eso lo hará con más Alegría cuando vea que tú Se lo pides con frecuencia, pues bien conoce Él la limitación de tus medios. No hay maestro que sea más atento que Yo a los esfuerzos de Su alumno predilecto.”</i>","3 de noviembre. Yo: ‘Señor, hace ya tanto tiempo que Te amo y todavía no sé hacerlo.’ Él: <i>“Para amar al Padre y al Espíritu, pídeme prestado Mi Corazón y para amar a tu Cristo, ofrécele Su Pasión.”</i>"],[24,48]],[1809,["10 de noviembre de 1949. Hora Santa. Le dije: ‘Señor, hay siempre entre nosotros una espesa cortina que me impide ir hacia Ti.’ Me contestó: <i>“Persuádete de Mi Presencia en ti. No es una alegoría, ni una fantasía, ni una mera comparación. No es algo que se escucha como un cuento, ni situación que haya sucedido a otra persona. Se trata de ti y de Mí. Se trata de una verdad que debes vivir. Vívela pues, con seguridad y alegría; no encontrarás en ella sino felicidad, y a Mí Me darás inmenso gusto. Salúdame con frecuencia en ti misma, a tu manera. Yo te amaré con todas las maneras que tengas. Persígueme en ti misma, considérame como Padre, como Esposo y como Salvador. Mírame al mirarte tú y sábete esperada; aprovecha todos los momentos. Lanza en vuelo libre tu pensamiento, como si te dijeran que las puertas del Cielo están abiertas para ti de par en par. Porque el Cielo Soy Yo y Yo estoy en ti.</i>\n<i>“Tienes ante ti siempre dos caminos: uno que desciende hacia las distracciones egoístas y otro que sube hacia Mí y para Mí. Sois vosotros siempre los que hacéis la elección. Pide a los santos que te ayuden a establecer en Él tu morada. ¿No sabes que puedes entrar en ella sin llamar a la puerta? ¡Vivimos los dos en la misma casa!”</i>"],[26]],[1810,["‘Señor, ¿y qué decir de los que Te hacen conocer a otros, como los misioneros, los predicadores, los escritores?’ <i>“Ellos tendrán un doble banquete: el suyo propio y el de los que por ellos Me conocieron. Aun alguno que no haya enseñado sino el Padrenuestro a un niño, o que le haya enseñado a decir: ‘Dios mío, os doy mi corazón’; aun ese conocerá Mi Gozo y Mi Reconocimiento. Gozará de un cielo nuevo, porque Me habrá hecho crecer”.</i>","17 de noviembre. Yo: ‘Señor, lo que nos falta es ver a Aquel a Quien amamos. Por no verlo, Lo amamos como en la penumbra del crepúsculo...’ Él: <i>“¿No conocéis acaso, y en detalle, lo que fueron Mi Vida y Mi Muerte? ¿No podéis intuirme en tal o cual página del Evangelio? Por otra parte, vuestra Fe está necesitada de ejercicio, para adquirir méritos. Bienaventurados los que creen sin haber visto, porque de ellos es el Reino de los santos, es decir, Yo.”</i>","17 de noviembre. Hora Santa. <i>“¿Por qué te pido tanto que ores? Porque es la plegaria lo que pone la Gracia en movimiento, como un cirio que se enciende. El hombre pone el esfuerzo primero y luego llega Dios. Siempre la Unión. Nunca Dios solo, ni el hombre solo, sino juntos los dos. Es la Ley de Mi Amor… muy dulce, ¿no te parece?</i>\n<i>“Por eso, hija, ora sin interrupción; como tu Cristo, que oró durante toda Su Vida, siempre por los otros. Tú haz lo mismo y Dios se ocupará de ti.”</i>"],[4,21,33]],[1811,["1º de diciembre de 1949. Hora Santa. <i>“Mantente siempre en el pensamiento de subir, de subir siempre, hacia la Santísima Trinidad. Es tu Familia. Es tu Fin y tu Centro. Es la Morada en la que debes establecerte. ¿Quién podrá describir lo que es esa Morada de los Tres? Danos las gracias por el llamamiento que te hemos hecho. Alaba y canta a la Trinidad, considerando tu nada y la Ternura del llamamiento. Hace mucho tiempo que se hizo la invitación, ¿no estimas que todos tus deseos deberían converger para la respuesta? El Seno de la Trinidad se abre para ti con Sus insondables Delicias, en el Amor indecible del Padre y del Hijo. ¡Dichosa Morada! ¿Cómo es posible que no pienses en Ella todos los días con toda la vehemencia de que seas capaz?</i>\n<i>“Pide a Mi Madre que te enseñe lo que tan bien comprendió Ella. Que introduzca tu corazón en el Seno de la Trinidad. Ella, la Esposa del Espíritu, la Madre del Hijo, la Hija del Padre, hacia Quien tendía sin cesar su Corazón inmaculado. Que Ella te acompañe a la presencia de esta Trinidad Santa.</i>\n<i>“Tú te dices: ‘Estas Tres Personas son algo tan grande… ¿Qué puedo decirles yo, que soy tan pequeña?’ Pero olvidas que es tu debilidad lo que atrae a Dios. Dale, por encima de todo, una confianza perdida, absolutamente sin límites. No contengas tus impulsos, pequeña. Sube por encima de la Tierra, porque en la Trinidad está tu Morada.”</i>"],[48]],[1812,["6 de diciembre. Yo buscaba una manera nueva de amarlo. Él:<i> “¿No se te ocurre pensar que la delicadeza es como el encanto del amor?”</i>"],[16]],[1813,["8 de diciembre. Yo: ‘Señor, haz que tu recuerdo no se aparte de mí. Mi pensamiento se me escapa de continuo, atraído por las bagatelas del Mundo…’ Él: <i>“Corre la cortina sobre tu escenario interior. Tú eres gente de teatro y sabes la importancia de que el telón caiga en el momento oportuno. Establece, pues, una separación entre los instantes de la Tierra y los momentos de tu Dios. Tu Madre te ayudará; Ella conocía muy bien los momentos de Dios. Los instantes de Dios, entonces, debes vivirlos con amor perfecto, y el amor perfecto debes comprármelo a Mí, que Soy Quien lo posee.</i>\n<i>“Me lo comprarás con deseos, con plegarias, con una grande intimidad. Y como ves, siempre volvemos a lo mismo: el amor de intimidad. Es el que quiero de vosotros, el que Me deleita en vosotros. En él está todo el programa de la vida, desde el nacimiento hasta la muerte.</i>\n<i>“Y por lo contrario, Me siento herido cuando veo que tenéis miedo de Mí. De vuestra parte necesito un gesto de confianza y de total abandono. Vosotros, Mis amadísimos amigos íntimos…”</i>","8 de diciembre. Hora Santa.<i> “Haz pasar, hija, tu vida entera, hasta tu último instante, por las Manos y el Corazón doloroso de tu Madre Inmaculada. Esos dos atributos, ‘Inmaculada’ y ‘Dolorosa’, son los que más le agradan; porque Yo le di, antes que nada, su Concepción purísima y luego, el Dolor, que tuvo la mayor parte de su Vida. Y todo lo que Dios le enviaba, Ella lo recibía con amor y respeto, y en la mayor humildad. Comprenderás, entonces, que las Tres divinas Personas de la Trinidad debían habitar en Ella con la misma felicidad que habían previsto al crearla. Y entenderás que Ella fue siempre la respuesta perfecta a las exigencias del Amor. Por eso consiguió ser la Reina del Cielo.</i>\n<i>“Entrégate a Ella, hija Mía, para que puedas recorrer sus senderos. Ella está dispuesta a ayudarte, pues bien conoce los deseos de Dios y a ti te conoce en todas tus dificultades, que en su mayor parte provienen del orgullo humano. Entrégatele, pues, desde el fondo de tu corazón y díselo con frecuencia.”</i>"],[17,28]],[1815,["9 de diciembre.<i> “¿No te sería posible suprimir todos esos pensamientos pequeños e inútiles que no sirven de nada ni para ti, ni para el prójimo, ni para Dios? Podrías substituirlos con la adoración amorosa, el deseo de Mi Reino, el ardor por la salvación de tus hermanos… Pensamientos como estos serían como las plantas y flores de adorno que dan vida y atractivo a los salones interiores de las casas.”</i>"],[52]],[1816,["11 de diciembre. Fin de la Novena a la Inmaculada. Yo estaba encantada por el coro a cinco voces de la Misa. Me dijo: <i>“¿Y qué te va a parecer Mi Música cuando la oigas en el Cielo, en alabanzas cantadas por millares de voces? Porque cada alma santa tiene su voz.”</i>"],[6]],[1817,["Yo escuchaba las reflexiones entusiastas de algunos lectores de ÉL Y YO. Y Le decía: Gracias, Señor mío, por todos esos favores íntimos que vas repartiendo en silencio.’ Él:<i> “Y no lo sabes todo. ¡La sorpresa gozosa que tendrás en el Cielo, cuando conozcas todo el itinerario secreto que voy siguiendo en los corazones por medio de ‘nuestro’ pequeño libro!</i>\n<i>“Algunos, al leerlo, sienten de Mí un flechazo directo. Otros no se atreven a creer posible un Amor tan grande y se quedan a la orilla de la Verdad. Hay quienes cierran el libro porque se niegan a comprenderlo. Y también sucede que algunos, asombrados, tratan de modelar su amor bajo la forma de esa intimidad que no abandona nunca, que busca ingeniosamente otros modos de consolar con los encantos de una ternura nueva.</i>\n<i>“En muchas ocasiones te he dicho que, tratándose de Mí, la exageración es imposible… Nunca os pasaréis de la raya ni con la locura. ¿No pasé por ella Yo mismo en Mi Amor a vosotros? ¡Nunca Me podréis corresponder en la misma medida! Cerca de vosotros Me siento en verdad muy pobre; Me afectan vuestras muchas indiferencias y tantas francas aversiones de parte de algunos.”</i>"],[15]],[1819,["22 de diciembre. Hora Santa. ‘Señor, haz que nada en mí Te impida hacer oír Tu Voz a los hombres.’ Él: <i>“Pon todo tu celo en amplificar el eco de Mi Voz y les llevarás a todos la alegría. Y en la alegría Me oirán mejor. Pobres almas, con frecuencia tan atormentadas por lo que a Mí respecta, o devoradas por las preocupaciones de la vida; la atmósfera os resultaría más respirable si todos a una hablarais de Mí. Cuando hagáis esto, Yo estaré entre vosotros, invisible, pero presente y vosotros sentiréis Mi Dulzura.</i>\n<i>“En el Cielo no se habla sino de Mí y los santos viven en la exultación. Porque la boca no habla sino de la abundancia del corazón. Por eso Me gozo cuando Mi Nombre aparece en vuestros labios; es como si hicierais traición a un secreto muy dulce, por no poderos contener. Es como si dijerais: ‘Hablemos de Dios, que es toda mi vida y que es el Único que merece los latidos de mi corazón’.”</i>","22 de diciembre. <i>“Piensas para ti misma: ‘Entonces, ¿toda la Religión se reduce al amor?’ Y así es. Ya te he explicado que el Juicio se hará sobre el amor. Porque toda virtud es amor consentido, al paso que toda falta es un amor burlado. Y el Amor Soy Yo. ¿Comprendes la magnitud de este principio? Despójate de ti y revístete de Mí. Deja de pensar en ti misma para pensar en Mí. Como los santos, que se hicieron tales por pensar en Mí durante toda su vida.</i>\n<i>“Y pide el auxilio de Mi Madre. Y que tus pensamientos Me ofrezcan todo el cariño de que seas capaz; el cariño Me honra mucho más que el temor. Me consuela. Iba a decir que ‘Me paga’. Yo tengo para vosotros mil delicadas atenciones que vosotros no veis; os parece del todo natural cuanto os acontece de bueno y pensáis que eso vino por sí solo. Pero un ‘gracias’ sonriente de parte vuestra Me causaría tanto gozo, que los Dones seguirían derramándose sobre vosotros. Pensad, cuando llega la noche, en arrojaros entre Mis Brazos con un corazón desbordante de gratitud. Y Me diréis que queréis más, y Yo vendré con más. De este modo llegaremos al fin de la vida y a la última de Mis Gracias. Agradécemela ya, desde ahora.”</i>"],[4,22]],[1820,["Misa de Media Noche. Yo me ponía con el pensamiento cerca del Pesebre. Él: <i>“Una mirada simple y tierna. No necesitas ni siquiera palabras. Una sola mirada puede darme, todo entero, tu corazón.”</i>"],[29]],[1821,["29 de diciembre de 1949. Yo: ‘Señor, esta es nuestra última cita íntima del año; gracias por la fuerza de amor que me has dado, por todos los encuentros que hemos tenido, con tanta Paciencia de tu parte.’ Él: <i>“Más tarde podrás apreciar plenamente esta Paciencia de tu Cristo, que ahora solamente sospechas. Comprenderás que la paciencia es el amor en forma suave. Que es suave solamente porque hay una fuerza muy grande que lo sujeta. Pero, ¿de qué no será capaz el Amor de Dios?” </i>Yo: ‘Señor, yo querría poner en práctica todo lo que me has dicho durante este año. Pero, en vez de correr, me arrastro.’<i> </i>Él: <i>“Acuérdate de una frase que dice: ‘He sentido Tus Favores en el peso de mi carga’. Porque mientras más doy, más claridad hay en vuestra percepción de la propia miseria: y esa es la luz de la Verdad.</i>\n<i>“Gime por no haber todavía llegado más que a este pobre punto muerto de tus esfuerzos hacia algo mejor, pero conserva la esperanza, pues todo te será posible si Yo te fortalezco. Y recuerda que Yo deseo vuestra perfección mucho más que vosotros mismos.</i>\n<i>“Los que tienen mucha sed piden agua sin cesar. ¿Me pides tú la perfección todos los días? ¿Te entristece tu mediocridad habitual? Pero si tú no fueras mediocre, ¿cómo podría Yo socorrerte? ¡Qué dulces son para Mí tus deseos llenos de esperanza!”</i>"],[19]],[1822,["Últimos días de 1949. <i>“Expulsa de tu corazón el amor egoísta, para que pueda habitarte el Amor sacrificado de tu Dios.”</i>"],[17]],[1825,["5 de enero de 1950. Llegué a Le Fresne después de atravesar la campiña, con el cielo y el Loira color de plomo. <i>“Ya ves cómo tus árboles y tus flores aguardan la savia que les dará nueva vida. Ahora todo se ve sombrío y como muerto, pero poquito a poco llegará la primavera. Abandónate a la Gracia. Ella y tú. Dulce alianza, como la hay en la vela henchida de brisa, que impulsa la barca.</i>\n<i>“Tú escuchas el ruido del Loira que pasa cerca de tus muros y oyes el aire que roza tus ventanas; pero no percibes la Fuerza divina que te impulsa cuando tú Le dejas la dirección de tu vida. A veces te detienes un momento y te preguntas: ‘¿Será Él?’ Y sí, Soy Yo.</i>\n<i>“Tú, entonces, como tus flores y tus árboles, tiende toda hacia Mí. Trata de alcanzarme. Ofréceme tu vida; todavía hay en ella páginas blancas. Pídeme que guíe tu mano y escribiremos entre los dos. Será como cuando eras niña, pues en realidad no has dejado de serlo.”</i>"],[47]],[1826,["12 de enero. Hora Santa. Yo estaba admirada de la rapidez con que se había agotado la primera edición de ÉL Y YO. Me dijo: <i>“Eso se debe a Mi Voluntad, secundada por la del Corazón Dolorido e Inmaculado de Mi Madre.</i>\n<i>“¿Y sabes tú lo que hacemos al escribir esas páginas? Destruimos el prejuicio de que la intimidad del alma no es posible sino para el religioso en su claustro, mientras que Mi Amor secreto y cariñoso busca en realidad a todos los que viven en este Mundo. Toda alma tiene en sí, misteriosamente, ese deseo; todos querrían tener el ejemplo y los medios para llegar a la santa intimidad.</i>\n<i>“Pequeña: ¡qué alegría para Mí y para ti si cada hombre llegara a ser un amigo fiel y confiado que Me ofreciera su corazón como morada habitual! Yo provocaría en él expansiones hasta entonces contenidas en lo más oculto de sus profundidades. Y cuando se llega a comprender que el Cristo, el Salvador, puede ser y desea ser este Amigo único, indecible, mendicante y agradecido; cuando se llega a adivinar Su felicidad si es acogido por Su creatura hasta entonces alejada de Él por una falsa humildad, entonces, en el impulso de un entusiasmo totalmente nuevo, el alma se entrega con todo el amor de que es capaz, para honrar a Dios dentro de sí. Y Le suplica que aumente en ella su pobre amor recién nacido. Y ya no confía en sí misma, sino que pone toda su Esperanza, una Esperanza perdida, en las manos de Cristo, que observa con ternura los movimientos de esa alma que acaba de despertar.</i>\n<i>“¡Amadas creaturas Mías, todavía temerosas, atreveos a creer, a esperar, a amar! Y arrastrad a otras en esta cadena de amor. Y que el movimiento continúe hasta el último día, siempre más rápido, como una corriente que se pierde en el mar.”</i>"],[15]],[1827,["19 de enero. <i>“Hace ya algún tiempo que no nos hemos amado en la intimidad de Corazón a corazón. No seas tímida para amarme. Me das gusto y Me consuelas de las frialdades de la Tierra. Yo he contado contigo desde hace mucho tiempo. ¿Me decepcionarás? También Yo tengo Mis Sueños; no olvides que también Soy Hombre. ¿No te has fijado cómo por la noche las estrellas se prestan su luz unas a otras? Así tú, Mi Gabriela. Cuando estés delante de Mí, mírame con una muy grande ternura y piensa que es tan dulce ser visto como como ver.”</i>"],[3]],[1828,["20 de enero, Cuarenta Horas. Nantes. ‘Señor, quiero con toda intensidad reparar por mis pecados y por los de los otros. Te quiero consolar, y Tú me has dicho que lo que vale es la intención, y que eres indulgente cuando no hacemos las cosas bien. Él:<i> “Pero también te he dicho que debes esperar con una Esperanza absoluta.”</i>"],[19]],[1829,["26 de enero. Hora Santa. El frío era muy intenso y yo no quise encender un fuego para unirme al Año Santo. Me dijo: <i>“Tú no sientes ya el frío de ayer, ni el que va a hacer mañana. No se trata, pues, sino de este minuto, y este minuto de sufrimiento es nada en comparación con un alma que evitará el Infierno, que Me alabará eternamente, que te dará las gracias con un transporte que tú referirás a Mi Misericordia.</i>\n<i>“¡Cuan poco piensa la gente en hacer penitencia! Y sin embargo, mucho mejor sería hacer las penitencias libremente, que no sufrirlas necesariamente. Y que la alegría no te abandone: es el esplendor de la mortificación y la dulzura íntima del amor.”</i>"],[44]],[1830,["28 de enero. En una recepción donde había mucha gente. Él:<i> “Mientras más sufres, más útil eres.”</i>"],[37]],[1832,["En la Hora Santa. <i>“No pides bastante. ¿Por qué eres tan tímida? ¿Por qué no oigo tu voz? ¿Es que no alcanzas a comprender la alegría que tengo cuando cumplo un deseo? Pero si no has comprendido plenamente, ensaya, al menos, penetrar un poco más.</i>\n<i>“Hay exploradores que viajan de prisa, y otros que van despacio para estudiar los detalles. Sé tú la exploradora de las infinitas Necesidades de Mi Corazón, para poder satisfacerlas mejor. Encontrarás que Yo espero tus peticiones ensanchadas, humildes, pero poderosas; contritas, pero llenas de certidumbre. Sé para Mí como un mozo de encargos, que monta guardia hasta que sus brazos estén llenos. Y Mis Ángeles llevarán Mis Gracias a domicilio; pero habrá sido preciso que tú Las merezcas.</i>\n<i>“¿Y los pecadores? Yo te espero para ayudarlos. Y, ¿las misiones? Y, ¿los paganos de Francia y de otras partes? ¿Y Mis sacerdotes, que necesitan ayuda para conservarse según Mi Corazón? ¿Mis Obispos, que necesitan conservar siempre la mirada de la paternidad? ¿Y todas esas almas que viven en tu tiempo y que deben adquirir el empeño de entrar en Mi Intimidad?</i>\n<i>“Cada alma tiene su manera propia de pedir: que la tuya sea amplia y cálida, alegre, como si supiera que ya ha sido escuchada, afectuosa como la de quien está seguro de ser amado; encantadora, pues está llena de Mis Dones; generosa, penitente, audaz, puesto que pides en Mi Nombre. Y Yo te escucharé con tanta alegría que tú no podrás dejar de sentirlo, y tendrás un nuevo valor para llamarme y conseguir incesantes victorias.</i>\n<i>“Y cuando pidas algo que es más que mucho, dirígete a tu Cristo-Hombre, y Él transmitirá tu petición al Padre, mediante el Espíritu de Amor. ¿Cómo podría, entonces, quedar sin respuesta tu petición?”</i>"],[33]],[1834,["París. Al despertar. Yo: ‘Y ahora, ¿qué hay de nuevo?’ Él: <i>“Dios”</i>. En mi aposento de París.<i> “Cuando has oído Mi Voz, el silencio que sigue está todavía lleno de Mí.” </i>Y más tarde, en la Capilla de la Rué de la Source, a la hora del Sanctus: <i>“Tú, que Me invitaste a hacer lo que tú hacías, haz ahora lo que Yo hago rodeado de Mis ángeles: Alaba, diciendo ‘Santo, Santo, Santo’. Ama y adora.”</i>\nEn el museo del Louvre: <i>“Imagina cómo Yo pronuncio en Mí mismo tu nombre. Que tu amor se ensaye en pronunciar en tu intimidad, el Mío.” </i>Luego, vagaba sola por las calles. Él:<i> “La soledad no existe en ninguna parte. Yo estoy Presente en todo.”</i>"],[25]],[1835,["En París, miraba yo los escaparates de una tienda. <i>“No permitas que cosas fútiles ocupen tu espíritu y te impidan verme. Pondrías con ello a tu alma una máscara.”</i>","En Nuestra Señora de las Victorias cerca de una persona que oraba. <i>“¡Lo que es el alma! Puede estar encerrada en el marco del cuerpo, pero bien se ve que alcanza mucho más allá.”</i>","En el Orfanatorio de Auteuil.<i> “No debes ser una santa a medias, porque eso querría decir que la otra mitad está llena de defectos. Ser cristiano no es solamente haber nacido en Dios, sino renacer incesantemente en Él. No es simplemente vivir delante de Él, sino vivir y morir de Él.</i>\n<i>“Cuando un santo viene al Mundo, viene para el Mundo entero. No dejes nunca de desear y de pedir lo que te falta.”</i>"],[17,33,47]],[1836,["19 de febrero. En el Jardín de Luxemburgo.<i> “¿No crees que Yo te amo mucho más de lo que supones? No puedes comparar Mi Poder el tuyo, por eso te he dicho que ‘Me ames con Mi propio Amor’. ¿No será posible que en adelante obremos ambos a una? Pero Yo respeto siempre vuestra libertad y cuando Me la sometéis, es para Mí el regalo más grande que pueda recibir; nada Me causa tanta alegría. Vuestra libertad Me recuerda la Mía, la que Yo os entregué de manera tan total cuando viví sobre la Tierra.”</i>"],[2]],[1837,["2 de marzo. Nantes. Hora Santa. <i>“Yo pongo en tus pensamientos lo que conviene. Repásalos uno por uno, como cuando se deshoja una margarita, y ellos irán a los demás cargados de Mi Perfume. Ese Perfume ya Lo conoces. Es el vivo sentimiento de ser amados por Dios; es creer que Él Se ocupa de vosotros con el mayor cuidado. Todos los renglones que entre tú y Yo hemos escrito lo dicen y despiertan la confianza. Y la confianza del hombre hace la Gloria de Dios; así como el Reino de Dios es el amor del hombre.”</i>"],[2]],[1839,["9 de marzo.<i> </i>Señor, no encuentro en mí nada que sea digno de ofrecértelo. Él: <i>“Soy un coleccionista de miserias; algo así como un restaurador de objetos de porcelana, que no es feliz sino cuando puede desplegar su arte rehaciendo una hermosa pieza rota en mil pedazos. O como un pintor que goza al reavivar los colores de una vieja pintura. O como un cirujano que consigue soldar bien unos miembros rotos. Nada ni nadie está fuera del alcance de Mi Solicitud. Y Mis Cuidados son gratuitos. Recibo Mi paga cuando vosotros Me decís: ‘Mil gracias, mi Dios amado’. ¿Te parece esto demasiado difícil?” </i>Desde el fondo del alma Le dije: ‘Señor, quédate conmigo, tengo necesidad de Ti. Y Tú no tienes necesidad de mí’. Él respondió con mucha viveza: <i>“¡Sí, sí, Mi Amor te necesita!”</i>","9 de marzo. Hora Santa. <i>“Mientras más avanzas en tu vida, más te quiero en Mí. Los arroyos corren más de prisa conforme se acercan al mar, como que van a perderse. Tú ven a Mí de ese modo, alegremente, en tu totalidad. Dime: ‘Señor, Te tomo y Te me doy’. Así tu alma se mece en Dios como un niñito en su cuna y te anudas más estrechamente a tu Dios.”</i>"],[30,31]],[1841,["24 de marzo. Enferma. <i>“¡Qué útil os resulta sentiros cerca de la puerta de salida! ¡Qué tristeza, hija, si llegarais solos! Protegeos con un cortejo de almas salvadas por vuestros cuidados; sea en las misiones, sea en vuestra propia cercanía.</i>\n<i>“En varias ocasiones pudiste observar esas luminosas noches del Oriente, como aquella vez que en Nazaret contemplabas, desde la terraza, las estrellas moviéndose solitarias en el espacio, y otras que parecían encajadas en discos de luz. Si vuestras almas tuvieran cada una un grupo y lo condujeran a la Mansión del Padre, ¡qué aclamaciones entusiastas habría en el dintel!”</i> Yo: ‘¿Cómo hacer, Señor? Él: <i>“Nombradme con frecuencia a vuestros protegidos, vuestros sordomudos, vuestros incrédulos. Y Yo los cubriré con Mi Túnica sin costuras, toda ensangrentada.”</i>"],[44]],[1842,["30 de marzo. Enferma otra vez.<i> “¿Por qué no empleas este tiempo de soledad en tu lecho como si estuvieras en adoración ante el Santísimo Sacramento? Nada te lo impide: un pequeño esfuerzo y eso es todo. ¿Por qué no habrías de convertir estos treinta días de prisión en treinta días de gozo, pues toda enfermedad destruye un poco vuestro cuerpo y os acerca a la salida?”</i>"],[31]],[1845,["Sábado Santo. <i>“Ve a buscarme pecadores y tráemelos. Cuida de Mi Cuerpo Místico. Ofréceme el Sepulcro en donde yazgo destrozado, por todos los infelices que tienen miedo de ser Míos.”</i>","Le dije: ‘Estando enferma tengo muy poco que ofrecerte.’ Me dijo: <i>“Una cosa pequeña y un amor grande hacen una cosa grande.”</i>"],[7,14]],[1846,["13 de abril. Enferma. <i>“¿Hay acaso un día, una hora que puedas estar lejos de Mí? ¿Puedes separar esa semana o este mes? ¿No ves que Mis Exigencias señoriales de Propietario se extienden hasta los cuartos de segundo? ¿No sientes en ti un deseo ardiente de entregarte toda entera? Dominada por la fiebre, sufre por Mí. En tu sueño entrecortado, reposa en Mí, y toma un acrecido valor.”</i>"],[37]],[1847,["20 de abril. Todavía enferma. <i>“Todos esos agudos sufrimientos los pongo Yo como flores en tu corona. No conviene que lleves sobre la cabeza rosas sin espinas. Une tu opresión a la Mía; Yo estuve ahogado todo el tiempo de Mi Agonía. Ahogado también cuando Me ataron los soldados, cuando se burlaron de Mí en la casa de Anás; lo estuve cuando Me trataron de loco en casa de Herodes, y durante la Flagelación en el Pretorio de Pilatos. Estuve sofocado cuando cargaba la Cruz y durante Mi Crucifixión. Y cuando levantaron la Cruz, sufrí la sofocación de la Muerte. Luego vinieron las últimas respiraciones, hasta el gran grito de Mi Amor triunfante, que Se llevó Mi Alma.</i>\n<i>“Así, en esta enfermedad te falta el aire, pero tienes a Dios. Sí, amiga, tómalo, para darlo a los demás. Él te guardará tu parte.”</i>"],[31]],[1849,["27 de abril. Todavía en cama. Le dije: ‘Señor, como Tú quieras.’ Él: <i>“Está bien que te abandones a Mi Cariño. Si vives o mueres, ¿qué importa? Estás en Mi Corazón. Estás en Mi Voluntad.</i>\n<i>“Y no es bastante con que lo aceptes; es preciso que pongas en la aceptación toda tu capacidad de amor. Extiende ese amor como un tejido suave hasta las extremidades de Mis Deseos. Entonces nuestro trabajo es común, bajo la Mirada del Padre y tú eres todopoderosa…”</i>"],[31]],[1850,["4 de mayo de 1950. Séptima semana de enfermedad. <i>“Alarga tu valentía hasta las dimensiones de Mi Valentía. Piensa que tú sola, nada eres. ¿No quieres adquirir la hermosa costumbre de estar siempre juntos? Ven a menudo e invítame a asistir a tu vida, como si Me mandaras una invitación para un concierto. Y allí Me concederás un lugar de primera fila, como si desearas que no Me perdiera nada del espectáculo de tus acciones, todas ellas vividas para Mí. ¡Hija de Mi Corazón! ¡Qué cosas tan bellas podemos hacer juntos! Recuérdalo siempre: ¡Juntos!”</i>"],[31]],[1851,["5 de mayo. Ahogo continuo. Le pregunté: ‘¿Señor, es ya mi última enfermedad?’ Él: <i>“¡Magnificat!”</i>"],[31]],[1852,["6 de mayo. Sigo ahogándome. Él: <i>“¿Por qué te inquietas? Ya sabes que Soy Yo. Ofrece con todas las fuerzas de tu amor el momento presente, ese instante que se te va de entre las manos. Pide en préstamo Mi Amor, el de Mi Madre, el de los santos que viven sobre la Tierra y ofrécemelo todo con tu momento presente. Yo lo espero como se espera el amor de un hijo muy querido.”</i>"],[31]],[1854,["12 de mayo de 1950. Durante la Extrema Unción. <i>“Estás toda cubierta por el manto de Mis Méritos y bajo el manto de Mi Madre. ¿Te sientes bien así?”</i>"],[31]],[1855,["12 de mayo. Más débil. ‘Señor, ¿es Tu Cruz suficientemente ancha para que yo me extienda en ella juntamente contigo?’ Él: <i>“Mi pobre pequeña. Piensa que invito a ello a todo el Mundo.”</i>"],[31]],[1856,["13 de mayo. Más débil. <i>“Sí. Tomo tu cuerpo como el trigo que se tritura. Es por tus hermanos.”</i> Yo: ‘Por mis hermanos, contigo.’"],[31]],[1857,["15 de mayo. Más débil. ‘Dulce Señor mío, tiéndeme los Brazos. Voy a entrar en nuestra Casa con pasitos de niña.’"],[31]],[1858,["16 de mayo. Viático. ‘Señor, ¿va a ser hoy el día en que Te entregue esta alma que Tú creaste con tanto Amor? Madre querida, embellece el atuendo de tu pobre hija, antes de que entre al salón.’"],[31]],[1859,["18 de mayo. Fiesta de la Ascensión. Me dijo: <i>“Los preparativos de amor regocijan al Amor. Y no Soy Yo el único que se regocija: también Mi Madre, los ángeles y los santos. ¿Qué Me vas a decir cuando llegues? ¿Y cuáles son las Palabras que Yo te voy a decir? ¡Ese gran momento del Encuentro! Prepárate a él con toda tu alma y cree en la Ternura infinita. Ya sabes que eres demasiado tímida; ensánchate, espera con fuerza. Y ahora, ven, Mi Amada, y dime lo que no te habías atrevido a decirme.”</i>"],[31]],[1860,["23 de mayo. Otra vez el Viático. <i>“Pobre alma pequeñita, que se ha esperado hasta el fin de su vida para creer en la infinita Misericordia y en los últimos Perdones.</i>\n<i>“Ahora no temas ya nada; Yo no estaría contento. Entrégate totalmente al Amor, tú, Mi amada.”</i>"],[31]],[1861,["24 de mayo. ‘No tengo ya fuerzas. Casi no veo, apenas puedo amarte.’ Él: <i>“Toma Mi Mirada y Mi Voz. Toma Mi Amor.”</i>"],[31]],[1862,["25 de mayo. ‘¿He llegado ya al fin de mi vida? ¿Celebro ya ahora mi primera y última Misa? ¿En dónde estás, amorosa Presencia? Y después, ¿qué es lo que va a pasar?’ Él: <i>“Seré Yo. Seré siempre Yo.”</i>\n(Última anotación de Gabriela. Moría la noche del 8 al 9 de junio de 1950)."],[31]]]};
