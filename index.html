<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101a2a">
<title>Diario</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#101a2a;--fg:#f2f5fa;--mut:#9fb0c8;--card:#263447;--bd:#34455e;--link:#8fb2ff;--bar:#101a2a;--hl:#5a4a12;--sel:#27456e;--fs:19px;--lh:1.6;--ff:Georgia,'Times New Roman',serif;--ui:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
body[data-theme=light]{--bg:#fbfbf8;--fg:#1c2330;--mut:#5d6b80;--card:#eef1f6;--bd:#d3dae6;--link:#1d4fb8;--bar:#fbfbf8;--hl:#fff1a8;--sel:#cfe0ff}
body[data-theme=sepia]{--bg:#f3e9d2;--fg:#3b2f1f;--mut:#7a6a50;--card:#e8dcc0;--bd:#d2c29c;--link:#8a4b12;--bar:#f3e9d2;--hl:#f6dd8a;--sel:#e2c98e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui)}
body{min-height:100vh}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 14px;background:var(--bar);border-bottom:1px solid var(--bd)}
header button{background:none;border:0;color:var(--fg);font-size:26px;width:44px;height:44px;cursor:pointer;border-radius:10px}
header h1{font:400 21px/1 var(--ff);margin:0;text-align:center;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
main{max-width:760px;margin:0 auto;padding:18px 16px 110px}
.hero{text-align:center;font:400 38px/1.15 var(--ff);margin:26px 0 8px}
.sub{text-align:center;font-size:21px;margin:0 0 20px}
h2.t{font:400 38px/1.15 var(--ff);margin:10px 0 18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid.ch{grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:10px}
.btn{display:flex;align-items:center;justify-content:center;text-align:center;min-height:64px;padding:10px;background:var(--card);border:1px solid var(--bd);border-radius:14px;color:var(--fg);font:600 20px/1.2 var(--ui);text-decoration:none;cursor:pointer}
.btn.bk{color:var(--link);font-weight:500;min-height:68px}
.btn.n{min-height:56px;font-size:19px;color:var(--link);font-weight:500}
.btn.n.on{background:var(--link);color:var(--bg)}
.back{display:inline-block;color:var(--mut);text-decoration:none;font-size:18px;margin:2px 0 14px}
.row{display:flex;gap:12px;margin-top:16px}.row .btn{flex:1;font-size:18px;min-height:56px}
.cont{margin:0 0 18px;padding:14px;border:1px solid var(--bd);border-radius:14px;background:var(--card);display:block;text-decoration:none;color:var(--fg)}
.cont small{color:var(--mut);display:block;font-size:14px;margin-bottom:2px}.cont b{font-size:20px;font-weight:600}
#txt{font-family:var(--ff);font-size:var(--fs);line-height:var(--lh)}
#txt h2{font:400 1.45em/1.2 var(--ff);margin:.2em 0 .6em;text-align:center}
#txt h3{font:700 .9em/1.3 var(--ui);letter-spacing:.04em;text-transform:uppercase;color:var(--link);margin:1.4em 0 .4em}
#txt h4{font:italic 600 1em/1.3 var(--ff);margin:1.1em 0 .3em;color:var(--mut)}
#txt p{margin:.45em 0}#txt p.c{margin:0;padding-left:1.2em}
.vs{padding:1px 4px;margin:0 -4px;border-radius:6px}.vs.hl{background:var(--hl)}.vs.sel{background:var(--sel)}.vs.flash{animation:fl 2s}
@keyframes fl{0%,60%{background:var(--sel)}100%{background:transparent}}
a.n{font:600 .62em/1 var(--ui);color:var(--link);vertical-align:super;margin-right:.18em;text-decoration:underline dotted;padding:4px 2px}
a.cm{display:inline-block;font:500 14px var(--ui);color:var(--link);text-decoration:none;border:1px solid var(--bd);border-radius:14px;padding:5px 12px;margin-top:6px}
.doc{font-family:var(--ff);font-size:var(--fs);line-height:var(--lh)}.doc p{margin:.5em 0}.doc a{color:var(--link)}.doc a.img{font:.72em var(--ui);border:1px solid var(--bd);border-radius:.3em;padding:0 .3em;text-decoration:none}.doc p.li{padding-left:1.2em}.doc p.flash{animation:fl 2.4s}
b.n{font:600 .62em/1 var(--ui);color:var(--link);vertical-align:super;margin-right:.18em}
body.nonum b.n{display:none}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;align-items:center;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:var(--bar);border-top:1px solid var(--bd)}
#bar .btn{min-height:46px;font-size:17px;flex:1}#bar .mid{flex:2;font-weight:500}
#bar .btn[disabled]{opacity:.35;pointer-events:none}
#sel{position:fixed;left:0;right:0;bottom:62px;z-index:26;display:none;gap:8px;padding:8px 12px;background:var(--bar);border-top:1px solid var(--bd)}#sel.on{display:flex}#sel .btn{min-height:42px;font-size:16px;flex:1}
#fab{position:fixed;right:16px;bottom:84px;z-index:24;width:56px;height:56px;border-radius:50%;border:1px solid var(--bd);background:#3a4d75;color:#fff;font-size:26px;cursor:pointer;box-shadow:0 4px 14px #0006}
#sheet{position:fixed;inset:0;z-index:40;display:none;background:#0008}#sheet.on{display:block}
#sheet .p{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--bd);border-radius:18px 18px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
#sheet h3{margin:0 0 12px;font:600 18px var(--ui)}#sheet label{display:block;margin:14px 0 6px;color:var(--mut);font-size:14px}
#sheet .seg{display:flex;gap:8px}#sheet .seg .btn{min-height:44px;font-size:16px;flex:1}#sheet .seg .btn.on{outline:2px solid var(--link)}
#sheet input[type=range]{width:100%}
.si{width:100%;padding:14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font:18px var(--ui)}
.res{display:block;padding:12px 4px;border-bottom:1px solid var(--bd);color:var(--fg);text-decoration:none;font-family:var(--ff);font-size:17px;line-height:1.45}
.res b{font:600 15px var(--ui);color:var(--link);display:block}.res mark{background:var(--hl);color:inherit;border-radius:3px}
.chips{display:flex;gap:8px;margin:10px 0}.chips .btn{min-height:40px;font-size:15px;flex:1}.chips .btn.on{outline:2px solid var(--link)}
.mut{color:var(--mut);font-size:15px}.x{float:right;background:none;border:0;color:var(--mut);font-size:22px;padding:0 6px}

.dhero{text-align:center;margin:6px 0 4px}.dnum{font:700 112px/1 var(--ff);letter-spacing:-.02em}.dmon{font:400 34px/1.1 var(--ff);text-transform:lowercase;margin-top:2px}.dwk{color:var(--mut);font-size:17px;margin-top:6px}
.dnav{display:flex;gap:10px;margin:16px 0 18px}.dnav .btn{min-height:46px;font-size:20px}.dnav .btn:nth-child(2){flex:2;font-size:17px}.dnav .btn{flex:1}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin:0 0 14px}
.lh{display:flex;gap:12px;align-items:flex-start}.lh h2{font:600 21px/1.3 var(--ff);margin:0}.dots{display:flex;align-items:center;gap:4px;padding-top:2px;flex:none}.or{color:var(--mut);font-size:14px}
.dot{display:inline-block;width:30px;height:30px;border-radius:50%;border:2px solid #0004;box-shadow:0 0 0 1px var(--bd)}.c-bl{background:#fbfaf3}.c-ve{background:#2f9e5e}.c-ro{background:#c6282b}.c-mo{background:#6b3fa3}.c-rs{background:#e88cb2}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}.tag{font:600 14px var(--ui);padding:5px 12px;border-radius:14px;border:1px solid var(--bd);background:var(--bg);color:var(--fg)}.tag.f{background:var(--link);color:var(--bg);border-color:var(--link)}.tag.g{border-color:var(--link);color:var(--link)}
.kv{margin:12px 0 0;font:17px/1.45 var(--ff)}.kv small{display:block;font:600 12px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-bottom:2px}.kv a{color:var(--link)}
.sh{font:700 13px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--link);margin:0 0 8px}
.rd{display:block;padding:10px 0;border-bottom:1px solid var(--bd);color:var(--fg);text-decoration:none;font:17px/1.45 var(--ff)}.rd:last-of-type{border-bottom:0}.rd b{font:700 16px var(--ui);color:var(--link);display:block;margin-bottom:2px}.rd span{display:block}
.cap{color:var(--mut);font-size:14px;margin:0 0 6px}.card .btn{margin-top:12px;min-height:52px;font-size:18px}.card a.cm{margin-top:12px}
.row.one{margin-top:22px}.row.one .btn{min-height:78px;font-size:23px}.row.two .btn{min-height:64px;font-size:20px}
#sfab{position:fixed;right:16px;bottom:152px;z-index:24;width:56px;height:56px;border-radius:50%;border:1px solid var(--bd);background:#3a4d75;color:#fff;font-size:24px;cursor:pointer;box-shadow:0 4px 14px #0006}
.pt{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;margin:0 0 14px}
.ph{display:flex;gap:10px;align-items:baseline;margin-bottom:6px}.ph b{font:700 18px var(--ui);color:var(--link)}.ph span{font:13px var(--ui);color:var(--mut)}
.pf{font:var(--fs)/var(--lh) var(--ff)}.pf+.pf{border-top:1px dashed var(--bd);margin-top:10px;padding-top:6px}.pf p{margin:.4em 0}
.doc mark{background:var(--hl);color:inherit;border-radius:3px}
</style>
</head>

. III (par)","r":[["#/r/9/5/12","2S 6, 12","b-15.17-19","David y todo Israel iban subiendo el Arca del Señor entre aclamaciones."],["#/r/22/22","Sal 23","","¿Quién es ese Rey de la gloria? Es el Señor."],["#/r/47/2/31","Mc 3, 31","-35","El que haga la voluntad de Dios, ese es mi hermano y mi hermana y mi madre."]],"ob":["o bien: cf. vol. IV."]},"2026-01-28":{"o":115029,"t":"MIÉRCOLES. SANTO TOMÁS DE AQUINO, presbítero y doctor de la Iglesia, memoria obligatoria","b":[["Lectura continuada",2098764]],"n":"PE III","v":"vol. III (par)","r":[["#/r/9/6/4","2S 7, 4","-17","Suscitaré descendencia tuya después de ti y afirmaré su reino."],["#/r/22/87","Sal 88","","Le mantendré eternamente mi favor."],["#/r/47/3/1","Mc 4, 1","-20","Salió el sembrador a sembrar."]],"ob":[]},"2026-01-29":{"o":115617,"t":"JUEVES DE LA III SEMANA DEL TIEMPO ORDINARIO, feria","b":[["Lectura continuada",2103969]],"n":"<a href=\"#/d/Misal/25779\"><i><span>Adoro Te devote</span></i></a> • (blanco) <a href=\"#/d/Misal/3245949\"><i><span>Eucaristía</span></i></a> • PE I","v":"vol. III (par)","r":[["#/r/9/6/18","2S 7, 18","-19. 24-29","¿Quién soy yo, mi Señor, y qué es mi familia?"],["#/r/22/130","Sal 131","","El Señor Dios le dará el trono de David, su padre."],["#/r/47/3/21","Mc 4, 21","-25","El candil se trae para ponerlo en el candelero. La medida que uséis la usarán con vosotros."]],"ob":[]},"2026-01-30":{"o":116099,"t":"VIERNES DE LA III SEMANA DEL TIEMPO ORDINARIO, feria","b":[["Lectura continuada",2107545]],"n":"(blanco) <a href=\"#/d/Misal/3250150\"><i><span>Sagrado Corazón</span></i></a> • PE II","v":"vol. III (par)","r":[["#/r/61/0/1","2Tm 1, 1","-8","Evoco el recuerdo de tu fe sincera. O bien: Tt 1, 1-5. A Tito, verdadero hijo en la fe que compartimos."],["#/r/22/94","Sal 95","","Contad las maravillas del Señor a todas las naciones."],["#/r/47/3/26","Mc 4, 26","-34","Un hombre echa semilla y duerme, y la semilla va creciendo sin que él sepa cómo."]],"ob":[]},"2026-01-31":{"o":116611,"t":"SÁBADO. SAN JUAN BOSCO, presbítero, m. obligatoria","b":[["Lectura continuada",2111704]],"n":"Antífona <i><span>Alma Redemptoris</span></i> • <i><span>ExSi</span></i> • PE III","v":"vol. III (par)","r":[["#/r/9/11/1","2S 12, 1","-7a.10-17","He pecado contra el Señor."],["#/r/22/49","Sal 50","","Oh, Dios, crea en mí un corazón puro."],["#/r/47/3/35","Mc 4, 35","-41","¿Quién es este? ¡Hasta el viento y el mar lo obedecen!"]],"ob":[]},"2026-02-01":{"o":117120,"t":"+ DOMINGO IV DEL TIEMPO ORDINARIO","b":[["Lecturas",2808652]],"n":"C • 1º <i><span>de San José</span></i> • [Flo] • PE III","v":"vol. I (A)","r":[["#/r/42/1/3","So 2, 3","","; So 3, 12-13. Dejaré en medio de ti un pueblo humilde y pobre."],["#/r/22/144","Sal 145","","Bienaventurados los pobres en el espíritu, porque de ellos es el reino de los cielos."],["#/r/52/0/26","1Co 1, 26","-31","Dios ha escogido lo débil del mundo."],["#/r/46/4/1","Mt 5, 1","-12a","Bienaventurados los pobres en el espíritu."]],"ob":[]},"2026-02-02":{"o":118254,"t":"LUNES. PRESENTACIÓN DEL SEÑOR, fiesta","b":[["Lecturas",3604393]],"n":"C • PE III","v":"vol. IV","r":[["#/r/45/2/1","Ml 3, 1","-4","Llegará a su santuario el Señor a quien vosotros andáis buscando. O bien: Hb 2, 14-18. Tenía que parecerse en todo a sus hermanos."],["#/r/22/22","Sal 23","","El Señor, Dios del universo, él es el Rey de la gloria."],["#/r/48/1/22","Lc 2, 22","-40","Mis ojos han visto a tu Salvador."]],"ob":[]},"2026-02-03":{"o":119448,"t":"MARTES DE LA IV SEMANA DEL TIEMPO ORDINARIO, feria o SAN BLAS, obispo y mártir o SAN ÓSCAR, obispo","b":[["Lectura continuada",2120692]],"n":"<a href=\"#/d/Misal/26712\"><i><span>Salmo 2</span></i></a> • Limpiar sagrario • PE I","v":"vol. III (par)","r":[["#/r/9/17/9","2S 18, 9","-10.14b.24-25a.31-19, 3","¡Hijo mío, Absalón! ¡Quién me diera haber muerto en tu lugar!"],["#/r/22/84","Sal 85","","Inclina tu oído, Señor, escúchame."],["#/r/47/4/21","Mc 5, 21","-43","Contigo hablo, niña, levántate."]],"ob":["o bien: cf. vol. IV."]}, lo antes de que me hayas negado tres veces."]],"ob":[]},"2026-04-01":{"o":163272,"t":"MIÉRCOLES SANTO, feria","b":[["Lecturas",749715]],"n":"PE II","v":"vol. II","r":[["#/r/29/49/4","Is 50, 4","-9a","No escondí el rostro ante ultrajes."],["#/r/22/67","Sal 68","","Señor, que me escuche tu gran bondad el día de tu favor."],["#/r/46/25/14","Mt 26, 14","-25","El Hijo del hombre se va como está escrito; pero, ¡ay de aquel por quien es entregado!"]],"ob":[]},"2026-04-02":{"o":163778,"t":"JUEVES SANTO EN LA CENA DEL SEÑOR","b":[["Lecturas",767705]],"n":"A • Quitar agua bendita • <a href=\"#/d/Misal/25779\"><i><span>Adoro Te devote</span></i></a> • Vela • PE I","v":"vol. I (A)","r":[["#/r/29/60/1","Is 61, 1","-3a.6a.8b-9","El Señor me ha ungido y me ha enviado para dar la buena noticia a los pobres, y darles un perfume de fiesta."],["#/r/22/87","Sal 88","","Cantaré eternamente tus misericordias, Señor."],["#/r/72/0/5","Ap 1, 5","-8","Nos ha hecho reino y sacerdotes para Dios Padre."],["#/r/48/3/16","Lc 4, 16","-21","El Espíritu del Señor está sobre mí, porque él me ha ungido."],["#/r/1/11/1","Ex 12, 1","-8.11-14","Prescripciones sobre la cena pascual."],["#/r/22/114","Sal 115","","El cáliz de la bendición es comunión de la sangre de Cristo."],["#/r/52/10/23","1Co 11, 23","-26","Cada vez que coméis y bebéis, proclamáis la muerte del Señor."],["#/r/49/12/1","Jn 13, 1","-15","Los amó hasta el extremo."]],"ob":[]},"2026-04-03":{"o":169192,"t":"VIERNES SANTO EN LA PASIÓN DEL SEÑOR","b":[["Lecturas",775135]],"n":"Después de Oficios, quitar velos","v":"vol. I (A)","r":[["#/r/29/51/13","Is 52, 13","-53, 12","Él fue traspasado por nuestras rebeliones (Tercer cántico del Siervo del Señor)."],["#/r/22/29","Sal 30","","Padre, a tus manos encomiendo mi espíritu."],["#/r/64/3/14","Hb 4, 14","","-16; Hb 5, 7-9. Aprendió a obedecer; y se convirtió, para todos los que lo obedecen, en autor de salvación. Para la lectura de la historia de la Pasión del Señor no se llevan cirios ni incienso, ni se hace al principio la salutación habitual, ni se signa el libro. Esta lectura la proclama el diácono o, en su defecto, el mismo celebrante. Pero puede también ser proclamada por lectores laicos, reservando, si es posible, al sacerdote la parte correspondiente a Cristo. • Jn 18, 1-19, 42. Pasión de nuestro Señor Jesucristo."]],"ob":[]},"2026-04-04":{"o":173451,"t":"SÁBADO SANTO. VIGILIA PASCUAL EN LA NOCHE SANTA","b":[["Lecturas",809655]],"n":"Por la noche se pone agua bendita · Donde se han cubierto las imágenes, se descubren • PE I","v":"vol. I (A) Para la Vigilia pascual se proponen nueve lecturas: siete del antiguo Testamento y dos del nuevo. Si lo exigen las circunstancias, y por causas particulares, se puede disminuir el número de las lecturas asignadas. Ténganse al menos tres lecturas del antiguo Testamento y, en casos más urgentes, por lo menos dos, antes de la epístola y el evangelio. Nunca se omita la lectura del Éxodo sobre el paso del mar Rojo (tercera lectura).","r":[["#/r/0/0/1","1ª Gn 1, 1","-2, 2","Vio Dios todo lo que había hecho, y era muy bueno."],["#/r/22/102","Sal 103","","Envía tu espíritu, Señor, y repuebla la faz de la tierra, o bien: Sal 32. La misericordia del Señor llena la tierra."],["#/r/0/21/1","2ª Gn 22, 1","-18","El sacrificio de Abrahán, nuestro padre en la fe."],["#/r/22/14","Sal 15","","Protégeme, Dios mío, que me refugio en ti."],["#/r/1/13/15","3ª Ex 14, 15","-15, 1 a","Los hijos de Israel entraron en medio del mar, por lo seco."],["#/r/1/14/1","Salmo: Ex 15, 1","-18","Cantaré al Señor, gloriosa es su victoria."],["#/r/29/53/5","4ª Is 54, 5","-14","Con amor eterno te quiere el Señor, tu libertador."],["#/r/22/28","Sal 29","","Te ensalzaré, Señor, porque me has librado."],["#/r/29/54/1","5ª Is 55, 1","-11","Venid a mí y viviréis. Sellaré con vosotros una alianza perpetua."],["#/r/29/11/2","Salmo: Is 12, 2","-6","Sacaréis aguas con gozo de las fuentes de la salvación."],["#/r/31/2/9","6ª Ba 3, 9","-15.32-4, 4","Camina al resplandor del Señor."],["#/r/22/17","Sal 18","","Señor, tú tienes palabras de vida eterna."],["#/r/32/35/16","7ª Ez 36, 16","-17a.18-28","Derramaré sobre vosotros un agua pura, y os daré un corazón nuevo."],["#/r/22/40","Sal 41","","Como busca la cierva corrientes de agua, así mi alma te busca a ti, Dios mío. o bien: Sal 50. Oh, Dios, crea en mí un corazón puro."],["#/r/51/5/3","Rm 6, 3","-11","Cristo, una vez resucitado de entre los muertos, ya no muere más."],["#/r/22/116","Sal 117","","Aleluya, aleluya, aleluya."],["#/r/46/27/1","Mt 28, 1","-10","Ha resucitado y va por delante de vosotros a Galilea."]],"ob":[]},"2026-04-05":{"o":178793,"t":"+ DOMINGO DE PASCUA RESURRECCIÓN DEL SEÑOR","b":[["Lecturas",818924]],"n":"A • Se reza el <i><span>Regina Coeli</span></i> • <i><span>ExSo</span></i> • Flo • PE III","v":"vol. I (A)","r":[["#/r/50/9/34","Hch 10, 34","a. 37-43","Hemos comido y bebido con él después de su resurrección de entre los muertos."],["#/r/22/116","Sal 117","","Este es el día que hizo el Señor: sea nuestra alegría y nuestro gozo."],["#/r/57/2/1","Col 3, 1","-4","Buscad los bienes de allá arriba, donde está Cristo. o bien: 1Co 5, 6b-8. Barred la levadura vieja para ser una masa nueva."],["","Secuencia: Ofrezcan los cristianos…","",""],["#/r/49/19/1","Jn 20, 1","-9","Él había de resucitar de entre los muertos. o bien, en las Misas vespertinas: Lc 24, 13-35. Quédate con nosotros, porque atardece."]],"ob":[]},"2026-04-06":{"o":180793,"t":"LUNES DE LA OCTAVA DE PASCUA","b":[["Lectura continuada",825232]],"n":"D • Consumir viril • PE II","v":"vol. II","r":[["#/r/50/1/14","Hch 2, 14",".22-33","A este Jesús lo resucitó Dios, de lo cual todos nosotros somos testigos."],["#/r/22/14","Sal 15","","Protégeme, Dios mío, que me refugio en ti."],["","Secuencia (opcional): Ofrezcan los cristianos…","",""],["#/r/46/27/8","Mt 28, 8","-15","Comunicad a mis hermanos que vayan a Galilea; allí me verán."]],"ob":[]},"2026-04-07":{"o":181748,"t":"MARTES DE LA OCTAVA DE PASCUA","b":[[" ":[["Lecturas",4361464]],"n":"C • <a href=\"#/d/Misal/28484\"><i><span>Quicumque</span></i></a> • [Flo] • PE I","v":"vol. I (A)","r":[["#/r/50/1/14","Hch 2, 14",". 22-33","No era posible que la muerte lo retuviera bajo su dominio."],["#/r/22/14","Sal 15","","Señor, me enseñarás el sendero de la vida."],["#/r/66/0/17","1P 1, 17","-21","Fuisteis liberados con una sangre preciosa, como la de un cordero sin mancha, Cristo."],["#/r/48/23/13","Lc 24, 13","-35","Lo reconocieron al partir el pan."]],"ob":[]},"2026-04-20":{"o":192249,"t":"LUNES DE LA III SEMANA DE PASCUA, feria","b":[["Lectura continuada",887686]],"n":"PE II","v":"vol. II","r":[["#/r/50/5/8","Hch 6, 8","-15","No lograban hacer frente a la sabiduría y al espíritu con que hablaba."],["#/r/22/117","Sal 118","","Dichoso el que camina en la ley del Señor."],["#/r/49/5/22","Jn 6, 22","-29","Trabajad no por el alimento que perece, sino por el que perdura para la vida eterna."]],"ob":[]},"2026-04-21":{"o":192832,"t":"MARTES DE LA III SEMANA DE PASCUA, feria o SAN ANSELMO, obispo y doctor de la Iglesia, memoria libre","b":[["Lectura continuada",892246]],"n":"<a href=\"#/d/Misal/26712\"><i><span>Salmo 2</span></i></a> • PE I","v":"vol. II","r":[["#/r/50/6/51","Hch 7, 51","-8, 1a","Señor Jesús, recibe mi espíritu."],["#/r/22/29","Sal 30","","A tus manos, Señor, encomiendo mi espíritu."],["#/r/49/5/30","Jn 6, 30","-35","No fue Moisés, sino que es mi Padre el que da el verdadero pan del cielo."]],"ob":["o bien: cf. vol. IV."]},"2026-04-22":{"o":193505,"t":"MIÉRCOLES DE LA III SEMANA DE PASCUA, feria","b":[["Lectura continuada",896403]],"n":"Fallecimiento de la Abuela • PE I","v":"vol. II","r":[["#/r/50/7/1","Hch 8, 1","b-8","Iban de un lugar a otro anunciando la Buena Nueva de la Palabra."],["#/r/22/64","Sal 65","","Aclamad al Señor, tierra entera."],["#/r/49/5/35","Jn 6, 35","-40","Esta es la voluntad del Padre: que todo el que (verde) al Hijo tenga vida eterna."]],"ob":[]},"2026-04-23":{"o":194000,"t":"JUEVES DE LA III  del mundo."],["#/r/49/15/23","Jn 16, 23","b-28","El Padre os quiere porque vosotros me queréis y creéis."]],"ob":[]},"2026-05-17":{"o":210029,"t":"+ VII DOMINGO DE PASCUA. ASCENSIÓN DEL SEÑOR, solemnidad","b":[["Vigilia",996535]],"n":"A • Beatificación de san Josemaría • <i><span>ExSo</span></i> • Flo • <a href=\"#/d/Misal/28484\"><i><span>Quicumque</span></i></a> • <i><span>Decenario</span></i> al Espíritu Santo 3 • PE III","v":"vol. I (A)","r":[["#/r/50/0/1","Hch 1, 1","-11","A la vista de ellos, fue elevado al cielo."],["#/r/22/45","Sal 46","","Dios asciende entre aclamaciones; el Señor, al son de trompetas."],["#/r/55/0/17","Ef 1, 17","-23","Lo sentó a su derecha en el cielo."],["#/r/46/27/1","Mt 28, 1","6-20","Se me ha dado todo poder en el cielo y en la tierra."]],"ob":[]},"2026-05-18":{"o":211892,"t":"LUNES DE LA VII SEMANA DE PASCUA, feria o SAN JUAN I, papa y mártir, memoria libre","b":[["Lectura continuada",1007923]],"n":"C • Beata Guadalupe Ortíz de Landázuri (ML) • Consumir viril • <i><span>Decenario</span></i> 4 • [Flo]","v":"vol. II","r":[["#/r/50/18/1","Hch 19, 1","-8","¿Recibisteis el Espíritu Santo al aceptar la fe?"],["#/r/22/66","Sal 67","","Reyes de la tierra, cantad a Dios."],["#/r/49/15/29","Jn 16, 29","-33","Tened valor: yo he vencido al mundo."]],"ob":["o bien: cf. vol. IV."]},"2026-05-19":{"o":212762,"t":"MARTES DE LA VII SEMANA DE PASCUA, feria","b":[["Lectura continuada",1011629]],"n":"<a href=\"#/d/Misal/26712\"><i><span>Salmo 2</span></i></a> • <i><span>Decenario</span></i> 5 • Flo • PE I","v":"vol. II","r":[["#/r/50/19/17","Hch 20, 17","-27","Completo mi carrera y consumo el ministerio que recibí del Señor Jesús."],["#/r/22/66","Sal 67","","Reyes de la tierra, cantad a Dios."],["#/r/49/16/1","Jn 17, 1","-11 a","Padre, glorifica a tu Hijo."]],"ob":[]},"2026-05-20":{"o":213202,"t":"MIÉRCOLES DE LA VII SEMANA DE PASCUA, feria o SAN BERNARDINO DE SIENA, presbítero, m. libre","b":[["Lectura continuada",1016159]],"n":"<i><span>Decenario</spa []},"2026-05-24":{"o":215993,"t":"+ DOMINGO DE PENTECOSTÉS, solemnidad","b":[["Vigilia de Pentecostés",1033660]],"n":"A • Consagración • <i><span>ExSo</span></i> • Flo • <i><span>Decenario</span></i> 10 • PE III","v":"vol. I (A)","r":[["#/r/0/10/1","Gn 11, 1","-9","Se llama Babel, porque allí confundió el Señor la lengua de toda la tierra."],["#/r/22/31","Sal 32","","Dichoso el pueblo que el Señor se escogió como heredad."],["#/r/1/18/3","Ex 19, 3","-8a. 16-20b","El Señor bajó al monte Sinaí a la vista del pueblo."],["#/r/33/2/52","Cántico: Dn 3, 52","-56","A ti, gloria y alabanza por los siglos. O bien: Sal 18, 8-11. Señor, tú tienes palabras de vida eterna."],["#/r/32/36/1","Ez 37, 1","-14","Huesos secos, traeré sobre vosotros espíritu, y viviréis."],["#/r/22/105","Sal 106","","Dad gracias al Señor, porque es eterna tu misericordia."],["#/r/35/2/1","Jl 3, 1","-5","Sobre mis siervos y siervas derramaré mi Espíritu."],["#/r/22/102","Sal 103","","Envía tu Espíritu, Señor, y repuebla la faz de la tierra."],["#/r/51/7/22","Rm 8, 22","-27","El Espíritu intercede con gemidos inefables."],["#/r/49/0/37","Jn 1, 37","-39","Manarán torrentes de agua viva."],["#/r/50/1/1","Hch 2, 1","-11","Se llenaron todos de Espíritu Santo y empezaron a hablar."],["#/r/22/102","Sal 103","","Envía tu Espíritu, Señor, y repuebla la faz de la tierra."],["#/r/52/11/3","1Co 12, 3","b-7. 12-13","Hemos sido bautizados en un mismo espíritu, para formar un solo cuerpo. O bien: Rm 8, 8-17. Los que se dejan llevar por el Espíritu de Dios, esos son hijos de Dios."],["","Secuencia: Ven, Espíritu divino..","",""],["#/r/49/19/1","Jn 20, 1","9-23","Como el Padre me ha enviado, así también os envío yo. Recibid el Espíritu Santo. O bien: Jn 14, 15-16. 23b-26. El Espíritu Santo os lo enseñará todo."]],"ob":[]},"2026-05-25":{"o":219679,"t":"LUNES. BIENAVENTURADA VIRGEN MARÍA, MADRE DE LA IGLESIA, memoria obligatoria","b":[["Lecturas",3256020]],"n":"C • Se reza el <i><span>Ángelus</span></i> • Consumir viril • "],["#/r/46/6/21","Mt 7, 21","-29","La casa edificada sobre roca y la casa edificada sobre arena."]],"ob":[]},"2026-06-26":{"o":243830,"t":"VIERNES DE LA XII SEMANA DEL TIEMPO ORDINARIO, feria o SAN PELAYO, mártir, memoria libre","b":[["Lectura continuada",2302154]],"n":"A • San Josemaría (S) • <i><span>ExSo</span></i> y veneración con la <i><span>reliquia</span></i> • Gl. • Cr. • (blanco) <a href=\"#/d/Misal/1131583\"><i><span>S Josemaría</span></i></a> • PE II","v":"vol. III (par)","r":[["#/r/11/24/1","2R 25, 1","-12","Fue deportado Judá lejos de su tierra."],["#/r/22/135","Sal 136","","Que se me pegue la lengua al paladar si no me acuerdo de ti."],["#/r/46/7/1","Mt 8, 1","-4","Si quieres, puedes limpiarme."]],"ob":["o bien: cf. vol. IV."]},"2026-06-27":{"o":244638,"t":"SÁBADO DE LA XII SEMANA DEL TIEMPO ORDINARIO, feria o SAN CIRILO DE ALEJANDRÍA, obispo y doctor de la Iglesia, memoria libre o SANTA MARÍA EN SÁBADO, memoria libre","b":[["Lectura continuada",2305889]],"n":"Antífona <i><span>Salve</span></i> Regina • <i><span>ExSi</span></i> • Consumir viril • (blanco) <a href=\"#/d/Misal/3325443\"><i><span>Virgen</span></i></a> • PE I","v":"vol. III (par)","r":[["#/r/24/1/2","Lm 2, 2",".10-14.18-19","Sus corazones claman al Señor sobre la muralla de la hija de Sión."],["#/r/22/72","Sal 73","","No olvides sin remedio la vida de los pobres."],["#/r/46/7/5","Mt 8, 5","-17","Vendrán muchos de oriente y occidente y se sentarán con Abrahán, Isaac y Jacob."]],"ob":["o bien: cf. vol. IV.","o bien cf. Leccionario de las «Misas de la Virgen María»."]},"2026-06-28":{"o":245512,"t":"+ DOMINGO XIII DEL TIEMPO ORDINARIO","b":[["Lecturas",2844993]],"n":"C • PE III","v":"vol. I (A)","r":[["#/r/11/3/8","2R 4, 8","-11.14-16a","Es un hombre santo de Dios; se retirará aquí."],["#/r/22/87","Sal 88","","Cantaré eternamente las misericordias del Señor."],["#/r/51/5/3","Rm 6, 3","-4. 8-11","Sepultados con él por el bautismo, andemos en una vida nueva."],["#/r/46/9/37","Mt 10, 37","-42"," ","¿Has venido aquí a atormentar a los demonios antes de tiempo?"]],"ob":[]},"2026-07-02":{"o":250167,"t":"JUEVES DE LA XIII SEMANA DEL TIEMPO ORDINARIO, feria","b":[["Lectura continuada",2319974]],"n":"<a href=\"#/d/Misal/25779\"><i><span>Adoro Te devote</span></i></a> • Vela • (blanco) <a href=\"#/d/Misal/1131583\"><i><span>S Josemaría</span></i></a> • PE I","v":"vol. III (par)","r":[["#/r/36/6/10","Am 7, 10","-17","Ve, profetiza a mi pueblo."],["#/r/22/17","Sal 18","","Los mandamientos del Señor son verdaderos y enteramente justos."],["#/r/46/8/1","Mt 9, 1","-8","La gente alababa a Dios, que da a los hombres tal potestad."]],"ob":[]},"2026-07-03":{"o":250610,"t":"VIERNES. SANTO TOMÁS, apóstol, fiesta","b":[["Lecturas",3876230]],"n":"C • Limpiar sagrario • [Flo] • PE I","v":"vol. IV","r":[["#/r/55/1/19","Ef 2, 19","-22","Estáis edificados sobre el cimiento de los apóstoles."],["#/r/22/115","Sal 116","","Id al mundo entero y proclamad el Evangelio."],["#/r/49/19/24","Jn 20, 24","-29","¡Señor mío y Dios mío!"]],"ob":[]},"2026-07-04":{"o":251083,"t":"SÁBADO DE LA XIII SEMANA DEL TIEMPO ORDINARIO, feria o SANTA ISABEL DE PORTUGAL, memoria libre o SANTA MARÍA EN SÁBADO, memoria libre","b":[["Lectura continuada",2327085]],"n":"Antífona <i><span>Salve</span></i> Regina • <i><span>ExSi</span></i> • (blanco) <a href=\"#/d/Misal/3325443\"><i><span>Virgen</span></i></a> • PE II","v":"vol. III (par)","r":[["#/r/36/8/11","Am 9, 11","-15","Repatriaré a los desterrados de mi pueblo y los plantaré en su tierra."],["#/r/22/83","Sal 84","","Dios anuncia la paz a su pueblo."],["#/r/46/8/14","Mt 9, 14","-17","¿Es que pueden guardar luto mientras el esposo está con ellos?"]],"ob":["o bien: cf. vol. IV.","o bien cf. Leccionario de las «Misas de la Virgen María»."]},"2026-07-05":{"o":251878,"t":"+ DOMINGO XIV DEL TIEMPO ORDINARIO","b":[["Lecturas",2849017]],"n":"C • PE IV","v":"vol. I (A)","r":[["#/r/44/8/9","Za 9, 9","-10","Mira a tu rey que viene a ti pobre."],["#/r/22/143","Sal 144", ar)","r":[["#/r/34/10/1","Os 11, 1","-4.8c-9","Mi corazón está perturbado."],["#/r/22/78","Sal 79","","Que brille tu rostro, Señor, y nos salve."],["#/r/46/9/7","Mt 10, 7","-15","Gratis habéis recibido, dad gratis."]],"ob":["o bien: cf. vol. IV."]},"2026-07-10":{"o":255327,"t":"VIERNES DE LA XIV SEMANA DEL TIEMPO ORDINARIO, feria","b":[["Lectura continuada",2340882]],"n":"PE D1 • (verde) <a href=\"#/d/Misal/3433725\"><i><span>Por la Iglesia local</span></i></a>","v":"vol. III (par)","r":[["#/r/34/13/2","Os 14, 2","-10","No llamaremos ya «nuestro Dios» a la obra de nuestras manos."],["#/r/22/49","Sal 50","","Mi boca proclamará tu alabanza."],["#/r/46/9/1","Mt 10, 1","6-23","No seréis vosotros los que habléis, sino el Espíritu de vuestro Padre."]],"ob":[]},"2026-07-11":{"o":255844,"t":"SÁBADO. SAN BENITO, abad, patrono de Europa, fiesta","b":[["Lecturas",3891022]],"n":"C • Ant. <i><span>Salve</span></i> Regina • <i><span>ExSi</span></i> • [Flo] • PE III","v":"vol. IV","r":[["#/r/25/1/1","Pr 2, 1","-9","Abre tu mente a la prudencia."],["#/r/22/32","Sal 33","","Bendigo al Señor en todo momento, o bien: Gustad y ved qué bueno es el Señor."],["#/r/46/18/27","Mt 19, 27","-29","Vosotros, los que me habéis seguido, recibiréis cien veces más."]],"ob":[]},"2026-07-12":{"o":256412,"t":"+ DOMINGO XV DEL TIEMPO ORDINARIO","b":[["Lecturas",2852495]],"n":"C • PE I","v":"vol. I (A)","r":[["#/r/29/54/10","Is 55, 10","-11","La lluvia hace germinar la tierra."],["#/r/22/63","Sal 64","","La semilla cayó en tierra buena, y dio fruto."],["#/r/51/7/18","Rm 8, 18","-23","La creación, expectante, está aguardando la manifestación de los hijos de Dios."],["#/r/46/12/1","Mt 13, 1","-23","Salió el sembrador a sembrar."]],"ob":[]},"2026-07-13":{"o":257620,"t":"LUNES DE LA XV SEMANA DEL TIEMPO ORDINARIO, feria o SAN ENRIQUE, memoria libre","b":[["Lectura continuada",2348013]],"n":"PE II","v":"vol. III (par)","r":[["#/r/29/0/10","Is 1, 10","-17","Lavaos, apartad de mi vista vuestras malas acciones."],["#/r/22/48","Sal 49","","Al que sigue buen camino le haré ver la salvación de Dios."],["#/r/46/9/34","Mt 10, 34","-11, 1","No he venido a sembrar paz, sino espada."]],"ob":["o bien: cf. vol. IV."]},"2026-07-14":{"o":258211,"t":"MARTES DE LA XV SEMANA DEL TIEMPO ORDINARIO, feria o SAN CAMILO DE LELIS, presbítero, memoria libre","b":[["Lectura continuada",2351687]],"n":"<a href=\"#/d/Misal/26712\"><i><span>Salmo 2</span></i></a> • PE I","v":"vol. III (par)","r":[["#/r/29/6/1","Is 7, 1","-9","Si no creéis no subsistiréis."],["#/r/22/46","Sal 47","","Dios ha fundado su ciudad para siempre."],["#/r/46/10/20","Mt 11, 20","-24","El día del juicio les será más llevadero a Tiro, a Sidón y a Sodoma que a vosotras."]],"ob":["o bien: cf. vol. IV."]},"2026-07-15":{"o":258897,"t":"MIÉRCOLES. SAN BUENAVENTURA, obispo y doctor de la Iglesia, memoria obligatoria","b":[["Lectura continuada",2354983]],"n":"PE III","v":"vol. III (par)","r":[["#/r/29/9/5","Is 10, 5","-7.13-16","¿Se enorgullece el hacha contra quien corta con ella?"],["#/r/22/92","Sal 93","","El Señor no rechaza a su pueblo."],["#/r/46/10/25","Mt 11, 25","-27","Has escondido estas cosas a los sabios y se las has revelado a los pequeños."]],"ob":[]},"2026-07-16":{"o":259454,"t":"JUEVES. B. VIRGEN MARÍA DEL MONTE CARMELO, memoria obligatoria","b":[["Lectura continuada",2358017]],"n":"C • Ip • Santo de Tía Carmen • <a href=\"#/d/Misal/25779\"><i><span>Adoro Te devote</span></i></a> • [Flo] • PE III","v":"vol. III (par)","r":[["#/r/29/25/7","Is 26, 7","-9.12.16-19","Despertarán jubilosos los que habitan en el polvo."],["#/r/22/100","Sal 101","","El Señor desde el cielo se ha fijado en la tierra."],["#/r/46/10/28","Mt 11, 28","-30","Soy manso y humilde de corazón."]],"ob":[]},"2026-07-17":{"o":260178,"t":"VIERNES DE LA XV SEMANA DEL TIEMPO ORDINARIO, feria","b":[["Lectura continuada",2360824]],"n":"(blanco) <a href=\"#/d/Misal/1131583\"><i><span>S Josemaría</span></i></a> • PE II","v":"vol. III (par)","r":[["#/r/29/37/1", "MARTES DE LA XVI SEMANA DEL TIEMPO ORDINARIO, feria o SAN LORENZO DE BRINDISI, presbítero y doctor de la Iglesia, memoria libre","b":[["Lectura continuada",2370858]],"n":"<a href=\"#/d/Misal/26712\"><i><span>Salmo 2</span></i></a> • PE I","v":"vol. III (par)","r":[["#/r/39/6/14","Mi 7, 14","-15.18-20","Arrojará nuestros pecados a lo hondo del mar."],["#/r/22/83","Sal 84","","Muéstranos, Señor, tu misericordia."],["#/r/46/11/46","Mt 12, 46","-50","Extendiendo su mano hacia sus discípulos, dijo: «Estos son mi madre y mis hermanos»."]],"ob":["o bien: cf. vol. IV."]},"2026-07-22":{"o":263941,"t":"MIÉRCOLES. SANTA MARÍA MAGDALENA, fiesta","b":[["Lecturas",3914730]],"n":"C • PE III","v":"vol. IV","r":[["#/r/23/2/1","Ct 3, 1","-4a","Encontré al amor de mi alma. o bien: 2Co 5, 14-17: Ahora ya no conocemos a Cristo según la carne"],["#/r/22/61","Sal 62","","Mi alma está sedienta de ti, mi Dios."],["#/r/49/19/1","Jn 20, 1",". 11-18","Mujer, ¿por qué lloras?, ¿a quién buscas?"]],"ob":[]},"2026-07-23":{"o":264481,"t":"JUEVES. SANTA BRÍGIDA, religiosa, patrona de Europa, fiesta","b":[["Lecturas",3917981]],"n":"C • <a href=\"#/d/Misal/25779\"><i><span>Adoro Te devote</span></i></a> • [Flo] • PE III","v":"vol. IV","r":[["#/r/54/1/19","Ga 2, 19","-20","Vivo, pero no soy yo el que vive, es Cristo quien vive en mí."],["#/r/22/32","Sal 33","","Bendigo al Señor en todo momento, o bien: Gustad y ved qué bueno es el Señor."],["#/r/49/14/1","Jn 15, 1","-8","El que permanece en mí y yo en él, ese da fruto abundante."]],"ob":[]},"2026-07-24":{"o":265147,"t":"VIERNES DE LA XVI SEMANA DEL TIEMPO ORDINARIO, feria o SAN SARBELIO MAKHLÛF, presbítero, memoria libre","b":[["Lectura continuada",2379718]],"n":"PE II","v":"vol. III (par)","r":[["#/r/30/2/14","Jr 3, 14","-17","Os daré pastores, según mi corazón; y todas las naciones se incorporarán a Jerusalén."],["#/r/30/30/10","Salmo: Jr 31, 10","-13","El Señor nos guardará como un pastor a su rebaño."],["#/r/46/12/1","Mt 13, 1","8-23","El que escucha la palabra y la entiende, ese da fruto."]],"ob":["o bien: cf. vol. IV."]},"2026-07-25":{"o":265868,"t":"+ SÁBADO. SANTIAGO, APÓSTOL, patrono de España, solemnidad","b":[["Lecturas",3923884]],"n":"B • Ant. <i><span>Salve</span></i> Regina • <i><span>ExSi</span></i> • Flo • PE I","v":"vol. IV","r":[["#/r/50/3/33","Hch 4, 33","","; Hch 5, 12.27-33; Hch 12, 2. El rey Herodes hizo pasar a cuchillo a Santiago."],["#/r/22/65","Sal 66","","Oh, Dios, que te alaben los pueblos, que todos los pueblos te alaben."],["#/r/53/3/7","2Co 4, 7","-15","Llevamos siempre y en todas partes en el cuerpo la muerte de Jesús."],["#/r/46/19/20","Mt 20, 20","-28","Mi cáliz lo beberéis."]],"ob":[]},"2026-07-26":{"o":267171,"t":"+ DOMINGO XVII DEL TIEMPO ORDINARIO","b":[["Lecturas",2859175]],"n":"C • PE IV","v":"vol. I (A)","r":[["#/r/10/2/5","1R 3, 5",". 7-12","Pediste para ti inteligencia."],["#/r/22/117","Sal 118","","¡Cuánto amo tu ley, Señor!"],["#/r/51/7/28","Rm 8, 28","-30","Nos predestinó a reproducir la imagen de su Hijo."],["#/r/46/12/44","Mt 13, 44","-52","Vende todo lo que tiene y compra el campo."]],"ob":[]},"2026-07-27":{"o":268217,"t":"LUNES DE LA XVII SEMANA DEL TIEMPO ORDINARIO, feria","b":[["Lectura continuada",2386520]],"n":"(morado) <a href=\"#/d/Misal/3531918\"><i><span>Difuntos</span></i></a> • PE II","v":"vol. III (par)","r":[["#/r/30/12/1","Jr 13, 1","-11","El pueblo será como ese cinturón que ya no sirve para nada."],["#/r/4/31/18","Salmo: Dt 32, 18","-21","Despreciaste al Dios que te engendró."],["#/r/46/12/31","Mt 13, 31","-35","El grano de mostaza se hace un árbol hasta el punto de que los pájaros del cielo anidan en sus ramas."]],"ob":[]},"2026-07-28":{"o":268697,"t":"MARTES DE LA XVII SEMANA DEL TIEMPO ORDINARIO, feria","b":[["Lectura continuada",2389906]],"n":"<a href=\"#/d/Misal/26712\"><i><span>Salmo 2</span></i></a> • (blanco) <a href=\"#/d/Misal/1131583\"><i><span>S Josemaría</span></i></a> • PE I","v":"vol. III (par)","r":[["#/r/30/13/17","Jr 14, 17","-22" 72,"t":"JUEVES DE LA XIX SEMANA DEL TIEMPO ORDINARIO, feria o SANTOS PONCIANO, papa, e HIPÓLITO, presbítero, mártires, memoria libre","b":[["Lectura continuada",2436080]],"n":"<a href=\"#/d/Misal/25779\"><i><span>Adoro Te devote</span></i></a> • PE I","v":"vol. III (par)","r":[["#/r/32/11/1","Ez 12, 1","-12","Emigra en pleno día, a la vista de todos."],["#/r/22/76","Sal 77","","¡No olvidéis las acciones del Señor!"],["#/r/46/17/21","Mt 18, 21","-19, 1","No te digo que perdones hasta siete veces, sino hasta setenta veces siete."]],"ob":["o bien: cf. vol. IV."]},"2026-08-14":{"o":279447,"t":"VIERNES. SAN MAXIMILIANO KOLBE, presbítero y mártir, memoria obligatoria","b":[["Lectura continuada",2440634]],"n":"PE III","v":"vol. III (par)","r":[["#/r/32/15/1","Ez 16, 1","-15.60.63","Eras perfecta con los atavíos que yo había puesto sobre ti; y te prostituiste."],["#/r/29/11/2","Salmo: Is 12, 2","-6","Ha cesado tu ira y me has consolado."],["#/r/46/18/3","Mt 19, 3","-12","Por la dureza de corazón permitió Moisés repudiar a las mujeres; pero, al principio, no era así."]],"ob":[]},"2026-08-15":{"o":279961,"t":"+ SÁBADO. ASUNCIÓN DE LA BIENAVENTURADA VIRGEN MARÍA, solemnidad","b":[["Lecturas",3988188]],"n":"A • Ordenación sacerdotal del Padre • Consagración • Ant. <i><span>Salve</span></i> Regina • <i><span>ExSo</span></i> • Flo • (blanco) <a href=\"#/d/Misal/3325443\"><i><span>Virgen</span></i></a> • PE III","v":"vol. IV","r":[["#/r/12/14/3","1Cro 15, 3","","-4.15-16; 1Cro 16, 1-2. Llevaron el Arca de Dios y la colocaron en el centro de la tienda que David le había preparado."],["#/r/22/130","Sal 131","","Levántate, Señor, ven a tu mansión, ven con el arca de tu poder."],["#/r/52/14/54","1Co 15, 54","-57","Nos da la victoria por medio de Jesucristo."],["#/r/48/10/27","Lc 11, 27","-28","Bienaventurado el vientre que te llevó."],["#/r/72/10/19","Ap 11, 19","","a; Ap 12, 1-6a.10ab. Una mujer vestida del sol, y la luna bajo sus pies."],["#/r/22/43","Sal 44","","De pie a tu derecha ."]],"ob":[]},"2026-08-19":{"o":284413,"t":"MIÉRCOLES DE LA XX SEMANA DEL TIEMPO ORDINARIO, feria o SAN JUAN EUDES, presbítero, memoria libre o SAN EZEQUIEL MORENO DÍAZ, obispo, memoria libre","b":[["Lectura continuada",2455832]],"n":"PE II","v":"vol. III (par)","r":[["#/r/32/33/1","Ez 34, 1","-11","Libraré mi rebaño de sus fauces, para que no les sirva de alimento."],["#/r/22/21","Sal 22","","El Señor es mi pastor, nada me falta."],["#/r/46/19/1","Mt 20, 1","-16","¿Vas a tener tú envidia porque yo soy bueno?"]],"ob":["o bien: cf. vol. IV."]},"2026-08-20":{"o":285165,"t":"JUEVES. SAN BERNARDO, abad y doctor de la Iglesia, memoria obligatoria","b":[["Lectura continuada",2460359]],"n":"<a href=\"#/d/Misal/25779\"><i><span>Adoro Te devote</span></i></a> • PE III","v":"vol. III (par)","r":[["#/r/32/35/23","Ez 36, 23","-28","Os daré un corazón nuevo y os infundiré mi espíritu."],["#/r/22/49","Sal 50","","Derramaré sobre vosotros un agua pura que os purificará de todas vuestras inmundicias."],["#/r/46/21/1","Mt 22, 1","-14","A todos los que encontréis, llamadlos a la boda."]],"ob":[]},"2026-08-21":{"o":285668,"t":"VIERNES. SAN PÍO X, papa, memoria obligatoria","b":[["Lectura continuada",2464375]],"n":"C • PE III","v":"vol. III (par)","r":[["#/r/32/36/1","Ez 37, 1","-14","Huesos secos, escuchad la palabra del Señor. Os sacaré de vuestros sepulcros, casa de Israel."],["#/r/22/105","Sal 106","","Dad gracias al Señor, porque es eterna su misericordia."],["#/r/46/21/34","Mt 22, 34","-40","Amarás al Señor tu Dios, y a tu prójimo como a ti mismo."]],"ob":[]},"2026-08-22":{"o":286150,"t":"SÁBADO. BIENAVENTURADA VIRGEN MARÍA REINA, memoria obligatoria","b":[["Lectura continuada",2468547]],"n":"C • Ant. <i><span>Salve</span></i> Regina • <i><span>ExSi</span></i> • [Flo] • (blanco) <a href=\"#/d/Misal/3325443\"><i><span>Virgen</span></i></a> • PE III","v":"vol. III (par)","r":[["#/r/32/42/1","Ez 43, 1","-7a","La Gloria del Señor entró en el templo."],["#/r/22/83","Sal 84","","La gloria del Señor habitará en nuestra tierra."],["#/r/46/22/1","Mt 23, 1","-12","Ellos dicen, pero no hacen."]],"ob":[]},"2026-08-23":{"o":286599,"t":"+ DOMINGO XXI DEL TIEMPO ORDINARIO","b":[["Lecturas",2873669]],"n":"C • Anuncio erección prelatura • [Flo] • PE I","v":"vol. I (A)","r":[["#/r/29/21/19","Is 22, 19","-23","Pongo sobre sus hombros la llave del palacio de David."],["#/r/22/136","Sal 137","","Señor, tu misericordia es eterna, no abandones la obra de tus manos."],["#/r/51/10/33","Rm 11, 33","-36","De él, por él y para él existe todo."],["#/r/46/15/13","Mt 16, 13","-20","Tú eres Pedro, y te daré las llaves del reino de los cielos."]],"ob":[]},"2026-08-24":{"o":287928,"t":"LUNES. SAN BARTOLOMÉ, apóstol, fiesta","b":[["Lecturas",4015913]],"n":"C • PE I","v":"vol. IV","r":[["#/r/72/20/9","Ap 21, 9","b-14","Sobre los cimientos están los nombres de los doce apóstoles del Cordero."],["#/r/22/143","Sal 144","","Tus santos, Señor, proclaman la gloria de tu reinado."],["#/r/49/0/45","Jn 1, 45","-51","Ahí tenéis a un israelita de verdad, en quien no hay engaño."]],"ob":[]},"2026-08-25":{"o":288448,"t":"MARTES DE LA XXI SEMANA DEL TIEMPO ORDINARIO, feria o SAN LUIS, memoria libre o SAN JOSÉ DE CALASANZ, presbítero, memoria libre","b":[["Lectura continuada",2475155]],"n":"<a href=\"#/d/Misal/26712\"><i><span>Salmo 2</span></i></a> • PE I","v":"vol. III (par)","r":[["#/r/59/1/1","2Ts 2, 1","-3a.14-17","Conservad las tradiciones que habéis aprendido."],["#/r/22/94","Sal 95","","Llega el Señor a regir la tierra."],["#/r/46/22/23","Mt 23, 23","-26","Esto es lo que habría que practicar, aunque sin descuidar aquello."]],"ob":["o bien: cf. vol. IV."]},"2026-08-26":{"o":289392,"t":"MIÉRCOLES. SANTA TERESA DE JESÚS JORNET E IBARS, virgen, memoria obligatoria","b":[["Lectura continuada",2477815]],"n":"PE III","v":"vol. III (par)","r":[["#/r/59/2/6","2Ts 3, 6","-10.16-18","Si alguno no quiere trabajar, que no coma."],["#/r/22/126","Sal 127","","Dichosos los que temen al Señor."],["#/r/46/22/27","Mt 23, 27","-32","Sois hijos de los que asesinaron a los profetas."]],"ob":[]},"2026-08-27":{"o":289865,"t":"JUEVES. SANTA MÓNICA, memoria obligatoria","b":[["Lectura continuada",2480520]],"n":"<a href=\"#/d/Misal/25779\"><i><span>Adoro Te devote</span></i></a> • PE III","v":"vol. III (par)","r":[["#/r/52/0/1","1Co 1, 1","-9","En él habéis sido enriquecidos en todo."],["#/r/22/143","Sal 144","","Bendeciré tu nombre por siempre, Señor."],["#/r/46/23/42","Mt 24, 42","-51","Estad preparados."]],"ob":[]},"2026-08-28":{"o":290281,"t":"VIERNES. SAN AGUSTÍN, obispo y doctor de la Iglesia, memoria obligatoria","b":[["Lectura continuada",2483758]],"n":"PE III","v":"vol. III (par)","r":[["#/r/52/0/1","1Co 1, 1","7-25","Predicamos a Cristo crucificado: escándalo para los hombres; pero para los llamados es sabiduría de Dios."],["#/r/22/31","Sal 32","","La misericordia del Señor llena la tierra."],["#/r/46/24/1","Mt 25, 1","-13","¡Que llega el esposo, salid a su encuentro!"]],"ob":[]},"2026-08-29":{"o":290743,"t":"SÁBADO. MARTIRIO DE SAN JUAN BAUTISTA, m. obligatoria","b":[["Lectura continuada",2487422]],"n":"Antífona <i><span>Salve</span></i> Regina • <i><span>ExSi</span></i> • PE I","v":"vol. III (par)","r":[["#/r/52/0/26","1Co 1, 26","-31","Lo débil del mundo lo ha escogido Dios."],["#/r/22/31","Sal 32","","Dichoso el pueblo que el Señor se escogió como heredad."],["#/r/46/24/1","Mt 25, 1","4-30","Como has sido fiel en lo poco, entra en el gozo de tu señor."]],"ob":[]},"2026-08-30":{"o":291227,"t":"+ DOMINGO XXII DEL TIEMPO ORDINARIO","b":[["Lecturas",2877273]],"n":"C • PE III","v":"vol. I (A)","r":[["#/r/30/19/7","Jr 20, 7","-9","La palabra del Señor me ha servido de oprobio."],["#/r/22/61","Sal 62","","Mi alma está sedienta de ti, Señor, Dios mío."],["#/r/51/11/1","Rm 12, 1","-2","Presentad vuestros cuerpos como sacrificio vivo."],["#/r/46/15/21","Mt 16, 21","-27","Si alguno quiere venir en pos de mí, que se niegue a sí mismo."]],"ob":[]},"2026-08-31":{"o":292452,"t":"LUNES DE LA XXII SEMANA DEL TIEMPO ORDINARIO, feria","b":[["Lectura continuada",2491523]],"n":"(blanco) <a href=\"#/d/Misal/1131583\"><i><span>S Josemaría</span></i></a> • PE II","v":"vol. III (par)","r":[["#/r/52/1/1","1Co 2, 1","-5","Os anuncié a Cristo crucificado."],["#/r/22/117","Sal 118","","¡Cuánto amo tu ley, Señor!"],["#/r/48/3/16","Lc 4, 16","-30","Me ha enviado a evangelizar a los pobres… Ningún profeta es aceptado en su pueblo."]],"ob":[]},"2026-09-01":{"o":293050,"t":"MARTES DE LA XXII SEMANA DEL TIEMPO ORDINARIO, feria","b":[["Lectura continuada",2495252]],"n":"<a href=\"#/d/Misal/26712\"><i><span>Salmo 2</span></i></a> • PE D2 • (verde) <a href=\"#/d/Misal/3452906\"><i><span>Por la familia</span></i></a>","v":"vol. III (par)","r":[["#/r/52/1/1","1Co 2, 1","0b-16","El hombre natural no capta lo que es propio del Espíritu de Dios; en cambio, el hombre espiritual lo juzga todo."],["#/r/22/143","Sal 144","","El Señor es justo en todos sus caminos."],["#/r/48/3/31","Lc 4, 31","-37","Sé quién eres: el Santo de Dios."]],"ob":[]},"2026-09-02":{"o":293578,"t":"MIÉRCOLES DE LA XXII SEMANA DEL TIEMPO ORDINARIO, feria","b":[["Lectura continuada",2498598]],"n":"(blanco) San José • PE II","v":"vol. III (par)","r":[["#/r/52/2/1","1Co 3, 1","-9","Nosotros somos colaboradores de Dios y vosotros, campo de Dios, edificio de Dios."],["#/r/22/31","Sal 32","","Dichoso el pueblo que Dios se escogió como heredad."],["#/r/48/3/38","Lc 4, 38","-44","Es necesario que evangelice también a las otras ciudades, pues para esto he sido enviado."]],"ob":[]},"2026-09-03":{"o":294071,"t":"JUEVES. SAN GREGORIO MAGNO, papa y doctor de la Iglesia, memoria obligatoria","b":[["Lectura continuada",2502003]],"n":"<a href=\"#/d/Misal/25779\"><i><span>Adoro Te devote</span></i></a> • Limpiar sagrario • Vela • PE III","v":"vol. III (par)","r":[["#/r/52/2/1","1Co 3, 1","8-23","Todo es vuestro, vosotros de Cristo y Cristo de Dios."],["#/r/22/22","Sal 23","","Del Señor es la tierra y cuanto a madre de Jesús."],["#/r/22/25","Sal 26","","El Señor me ha coronado sobre la columna me ha exaltado."],["#/r/48/10/27","Lc 11, 27","-28","Bienaventurado el vientre que te llevó."]],"ob":[]},"2026-10-13":{"o":324499,"t":"MARTES DE LA XXVIII SEMANA DEL TIEMPO ORDINARIO, feria","b":[["Lectura continuada",2612418]],"n":"<a href=\"#/d/Misal/26712\"><i><span>Salmo 2</span></i></a> • (blanco) <a href=\"#/d/Misal/3239981\"><i><span>Ssma Trinidad</span></i></a> • PE I","v":"vol. III (par)","r":[["#/r/54/4/1","Ga 5, 1","-6","Nada vale la circuncisión, sino la fe que actúa por el amor."],["#/r/22/117","Sal 118","","Señor, que me alcance tu favor."],["#/r/48/10/37","Lc 11, 37","-41","Dad limosna, y lo tendréis limpio todo."]],"ob":[]},"2026-10-14":{"o":324955,"t":"MIÉRCOLES DE LA XXVIII SEMANA DEL TIEMPO ORDINARIO, feria o SAN CALIXTO I, papa y mártir, memoria libre","b":[["Lectura continuada",2615028]],"n":"PE II","v":"vol. III (par)","r":[["#/r/54/4/1","Ga 5, 1","8-25","Los que son de Cristo han crucificado la carne con las pasiones."],["#/r/22/0","Sal 1","","El que te sigue, Señor, tendrá la luz de la vida."],["#/r/48/10/42","Lc 11, 42","-46","¡Ay de vosotros, fariseos! ¡Ay de vosotros también, maestros de la ley!"]],"ob":["o bien: cf. vol. IV."]},"2026-10-15":{"o":325616,"t":"JUEVES. SANTA TERESA DE JESÚS, virgen y doctora de la Iglesia, fiesta","b":[["Lecturas",4156734]],"n":"Ip • <a href=\"#/d/Misal/25779\"><i><span>Adoro Te devote</span></i></a> • PE III","v":"vol. IV","r":[["#/r/28/15/1","Si 15, 1","-6","Lo llenará del espíritu de sabiduría y de inteligencia."],["#/r/22/87","Sal 88","","Cantaré eternamente las misericordias del Señor."],["#/r/46/10/25","Mt 11, 25","-30","Soy manso y humilde de corazón."]],"ob":[]},"2026-10-16":{"o":326262,"t":"VIERNES DE LA XXVIII SEMANA DEL TIEMPO ORDINARIO, feria o SANTA EDUVIGIS, religiosa, memoria libre o SANTA MARGARITA MARÍA DE ALACOQUE, virgen, memoria libre","b":[["Lectura continuada",2621567]],"n":"PE II","v":"vol. III (par)","r":[["#/r/55/0/11","Ef 1, 11","-14","Antes esperábamos en el Mesías. Vosotros habéis sido marcados con el sello del Espíritu Santo."],["#/r/22/31","Sal 32","","Dichoso el pueblo que el Señor se escogió como heredad."],["#/r/48/11/1","Lc 12, 1","-7","Hasta los cabellos de vuestra cabeza están contados."]],"ob":["o bien: cf. vol. IV."]},"2026-10-17":{"o":327233,"t":"SÁBADO. SAN IGNACIO DE ANTIOQUÍA, obispo y mártir, memoria obligatoria","b":[["Lectura continuada",2624548]],"n":"Antífona <i><span>Salve</span></i> Regina • <i><span>ExSi</span></i> • PE I","v":"vol. III (par)","r":[["#/r/55/0/15","Ef 1, 15","-23","El Padre dio a Cristo como Cabeza, sobre todo, a la Iglesia, que es su cuerpo."],["#/r/22/7","Sal 8","","Diste a tu Hijo el mando sobre las obras de tus manos."],["#/r/48/11/8","Lc 12, 8","-12","El Espíritu Santo os enseñará en aquel momento lo que tenéis que decir."]],"ob":[]},"2026-10-18":{"o":327804,"t":"+ DOMINGO XXIX DEL TIEMPO ORDINARIO","b":[["Lecturas",2904707]],"n":"C • <a href=\"#/d/Misal/28484\"><i><span>Quicumque</span></i></a> • [Flo] • PE IV","v":"vol. I (A)","r":[["#/r/29/44/1","Is 45, 1",". 4-6","Yo he tomado de la mano a Ciro, para doblegar ante él las naciones."],["#/r/22/94","Sal 95","","Aclamad la gloria y el poder del Señor."],["#/r/58/0/1","1Ts 1, 1","-5b","Recordamos vuestra fe, vuestro amor y vuestra esperanza."],["#/r/46/21/1","Mt 22, 1","5-21","Dad al César lo que es del César y a Dios lo que es de Dios."]],"ob":[]},"2026-10-19":{"o":329216,"t":"LUNES DE LA XXIX SEMANA DEL TIEMPO ORDINARIO, feria o SAN PEDRO DE ALCÁNTARA, presbítero, m. libre o SANTOS JUAN DE BREBEUF e ISAAC JOGUES, presbíteros, y compañeros, mártires, m. libre o SAN PABLO DE LA CRUZ, presbítero, m. libre","b":[["Lectura continuada",2627822]],"n":"PE II","v":"vol. III (par)","r":[["#/r/55/1/1","Ef 2, 1","-10","Nos ha hecho revivir con Cristo y nos ha sentado en el cielo."],["#/r/22/98","Sal 99","","El Señor nos hizo y somos suyos."],["#/r/48/11/1","Lc 12, 1","3-21"," const EY={"th":["Alegría","Amar A Jesucristo","Amor De Jesucristo","Ansias","Apostolado","Caridad","Cielo","Comunión De Los Santos","Comunión","Confianza","Consolar A Jesús","Contemplación","Contrición","Corazón De Jesús","Cosas Pequeñas","¿Crees Que Jesús Te Habla?","Delicadezas De Jesús","Distracciones en la oración","El Amor","Esperanza","Eucaristía","Fe","Gratitud","Humildad","Infancia Espiritual","Instante Presente","Intimidad","Llagas De Cristo","María","Miradas","Misericordia","Muerte","Navidad","Oración De Petición","Oración","Padre Celestial","Pasión De Nuestro Señor Jesucristo","Penitencia","Postrimerías","Presencia De Dios","Providencia Divina","Recogimiento","Rosto De Cristo","Sagrarios","Salvación De Los Hombres","Sangre De Cristo","Santa Misa","Santidad","Santísima Trinidad","Ser Jesús","Trabajo","Via Crucis","Vigilar Los Pensamientos","Virtudes Teologales","Vivir En Jesús"],"p":[[6,["3 de octubre. En la región de Saskatchewan. Él:<i> “Enciérrame en tu corazón con una señal de la Cruz, como entre dos barrotes”.</i>"],[41]],[7,["4 de octubre. En Montreal. Él: <i>“Cuando te falta recogimiento, el que sufre la privación Soy Yo” </i>(Esto lo dijo con suma delicadeza en la Voz)."],[41]],[10,["3 de noviembre de 1936. A la hora de la Misa, en el barco que me traía de América.<i> “Cree en la purificación infinita por Mi Sangre.”</i>"],[45]],[15,["14 de diciembre. <i>“Esfuérzate por llevarles a todos Mi Sonrisa, la Voz amable”.</i>"],[5]],[17,["16 de diciembre. <i>“Sal de tus medidas habituales. Ámame más”.</i>"],[1]],[18,["17 de diciembre. <i>“Comencemos el Cielo desde ahora. Ámame sin descanso, como Yo te amo”.</i>"],[38]],[21,["<i>“Hay veces que dudas que sea Yo Quien te habla, así de simples y como propias tuyas te parecen Mis Palabras. Pero, ¿es que tú y Yo no somos uno mismo?”</i>"],[15]],[23,["<i>“Conmigo sé simple, como en familia”.</i>"],[34]],[26,["25 de diciembre. <i>“Escóndete en Mí. Alimenta al mundo con tus sufrimientos”.</i>"],[37]],[27,["26 de diciembre. <i>“¿Tu imaginación? Es el perro de la casa que merodea en torno. ¿Se le puede acaso recriminar a un perro andar merodeando? Haz como si hubieras estado siempre atenta.”</i>"],[41]],[28,["28 de diciembre. <i>“Cuando Me amas te purificas”.</i>"],[1]],[30,["<i>“Vuelve siempre a Mí como si nunca Me hubieras dejado. Así Me darás gusto”.</i>"],[9]],[31,["<i>“Yo convierto tus oraciones en Oraciones mías. Pero si tú no quieres orar... ¿puedo Yo hacer que florezca una planta si no la siembras?”</i>"],[34]],[35,["3 de enero de 1937. <i>“Cuando estás de viaje Yo Me las arreglo para tomar en tu vida otros sacrificios distintos de los que Me ofreces en casa.”</i>"],[37]],[37,["5 de enero. <i>“Sal de ti misma y entra en Mí”.</i>"],[26]],[40,["<i>“Dales gusto; así Me lo darás a Mí”.</i>"],[5]],[47,["14 de febrero de 1937. En una capilla: ‘Señor, ¿quieres que permanezcamos aquí los dos?’ Él: <i>“Dondequiera que estés podemos estar los dos. Haz lo que debes hacer y no te preocupes de lo que se diga.”</i>"],[39]],[48,["48.<i> “Tus deseos de amar son ya amor.”</i>"],[3]],[49,["<i>“Envuélveme en tu amor.”</i>"],[1]],[50,["<i>“Tu alma tiene una puerta que se abre hacia la contemplación de Dios. Pero es indispensable que la abras.”</i>"],[11]],[51,["17 de febrero. <i>“No Me prives de tus sufrimientos, que tanto ayudan a los pecadores”.</i>"],[37]],[53,["19 de febrero (1937). Angers, en la capilla de la Plaza de la Alianza, donde estaba expuesto el Santísimo. “<i>Ya ves cómo estamos los dos dondequiera que tú estés. Mi Amor está aquí: compenétrate.”</i>"],[20]],[54,["1º de marzo. En la estación, a la orilla del Ródano. <i>“Tú miras con fijeza en la dirección por donde va a llegar el tren. De igual manera, Yo tengo Mis Ojos fijos en ti, esperando que vengas a Mí”.</i>"],[29]],[56,["Ante una inundación del Loira.<i> “Sé siempre dulce y tranquila. El cielo no se retrata en el río sino cuando el agua está serena”.</i>"],[41]],[57,["3 de marzo, en el tren. <i>“Estos atardeceres son también obra de Amor. Son pocas, entre Mis criaturas, las que los contemplan para alabarme por ellos. Y sin embargo, en ellos está Mi Amor”.</i>"],[16]],[58,["<i>“Si tú no tuvieras ‘pequeñas’ pruebas, ¿cómo podría Yo darte ‘grandes’ recompensas?”</i>"],[37]],[59,["3 de marzo. <i>“Yo Soy siempre el que ama más”.</i>"],[2]],[65,["9 de marzo (1937). Yo pensaba retirarme pasada la Elevación. Él me dijo con ternura:\n<i>“No te vayas tan pronto. No podría Yo darte todas mis Gracias...”</i>"],[46]],[81,["<i>“Escucha, que Yo te hablaré. ¿No quieres ser Mi confidente?”</i>"],[15]],[82,["Montreale, de Palermo. <i>“Yo estoy más en ti que tú misma…”</i>"],[49]],[96,["(En la sala de un teatro) <i>“¿Por qué me hablas como si estuviera Yo muy lejos? Estoy muy cerca... en tu corazón.”</i>"],[34]],[106,["30 de abril, en el tren de regreso. <i>“Cuando un objeto necesita alguna reparación, se le pone en manos de un experto. Pon, pues, tu alma, silenciosa e inmóvil, ante Mis Ojos. ¡Yo reparo!”</i>"],[29]],[108,["En el tren. <i>“Hay que dejar los amores por ‘el Amor’.”</i>"],[1]],[114,["En la capilla de Santa Ana. <i>“¿Por qué no Me reconoces en tu prójimo?”</i>"],[5]],[115,["En el campo, a la hora del catecismo. <i>“Sé más tierna con ellos. Los niños necesitan ternura.”</i>"],[5]],[119,["12 de mayo.<i> “Yo ando en busca de sufrimientos que quieran unirse a los Míos.”</i>"],[37]],[123,["19 de mayo. París, en el Metro. “<i>Yo Soy la Hostia. Tú eres la custodia. Los rayos de oro son Mis Gracias a través de ti.”</i>"],[20]],[124,["20 de mayo. Montmartre. Pensando en el recogimiento, Él me dijo: <i>“El esposo no se acerca a la esposa mientras la ve distraída mirando por la ventana. Espera que ella se encamine hacia la cámara de los secretos...”</i>"],[41]],[129,["27 de mayo. Fiesta de Corpus en Le Fresne. “<i>Cobíjate bajo el Manto Blanco </i>(la Hostia). <i>Extiéndete sobre el Madero y pon tu cabeza sobre Mi Corazón” </i>(Como la muchachita de ayer, en el vagón, cerca de su madre)."],[20]],[130,["27 de mayo. Le Fresne, después de la comunión. Yo: ‘Quiero ser una hostia, Señor, ven conmigo’. Él: “Yo estoy en todas las hostias de la Tierra. ¿Sabes lo que quiere decir la paz, estar en el Reino de la Paz?”"],[20]],[131,["28 de mayo. Yo pensaba en su Fiesta de Corpus Christi, cuando Él me dijo: <i>“Mi verdadera fiesta de Corpus la tendré cuando goce Yo de todas las preferencias. Todas las preferencias de todas las almas.”</i>"],[20]],[133,["<i>“¿Sabes tú lo que es la Bondad? La Bondad es Mi Madre.”</i>"],[28]],[136,["30 de mayo, Día de Corpus. Después de la comunión: “<i>Yo no dejé en el Cielo nada de Mí. Me doy a ti todo entero, Dáteme pues tú también toda entera.”</i>"],[8]],[138,["En un vagón. Me vino la tentación de ponerme puntillosa con una pasajera. Entonces Él me dijo con dulzura: <i>“Cuando más cristiana es un alma, es decir más Mía, es más amable. Sé amable entre todas las mujeres.”</i>"],[5]],[140,["3 de junio. En la estación de Austerlitz miraba yo una pequeña mosca que caminaba sobre el piso, y decía a Dios. ‘Tú también, Señor, me miras desde Allá Arriba.’ Me contestó: <i>“No solamente te miro, sino que te amo.”</i>"],[29]],[141,["4 de junio. Fiesta del Sagrado Corazón. <i>“Toma Mi Sangre, esa Sangre que tengo sed de darte, para borrar tus faltas. Toma Mi Sangre en Mi Corazón.”</i> Entonces me hizo comprender una palabra que ya me había dicho: <i>“No descanses”</i>. Esto quería decir: <i>“No busquéis el reposo, pues no podría venir de vosotros, sino solamente de Mí.”</i>"],[45]],[142,["4 de junio, fiesta del Sagrado Corazón. En una estación de ferrocarril: <i>“Hoy tomo para Mí todas tus sonrisas.”</i> Entonces me propuse sonreír a todo y a todos."],[5]],[143,["8 de junio, en el campo. <i>“No te detengas en los pequeños detalles de la vida. Piensa solamente en el amor, en el amor que recibes de Mí. Y en aquel que tú Me das.”</i>"],[1]],[144,["<i>“Ten Caridad en tus pensamientos. De los pensamientos proceden las palabras.”</i>"],[52]],[149,["11 de junio. Durante un sufrimiento, oí que me decía: <i>“Ahora eres tú quien ofrece.”</i>"],[37]],[151,["12 de junio. <i>“Divide tu día en tres tiempos: por la mañana, al despertar, entrégate al Padre Creador que te ofrece a Su propio Hijo como alimento. Después de la Misa, entrégate al Hijo que está en ti. Y por la noche, duérmete en el Espíritu Santo, que es el Amor.”</i>"],[48]],[152,["Por la calle: <i>“Has sido colmada de Gracias. Por eso debes ser la más pequeña.”</i>"],[24]],[153,["<i>“La música levanta al hombre por encima de este mundo. ¿Por qué habría de extrañarte que Mi contemplación lleve al éxtasis?”</i>"],[11]],[154,["<i>“Considera todas las cosas a la luz de la Eternidad.”</i>"],[38]],[156,["Después de rezar ‘Oh, mi amado y buen Jesús’, mientras decía los Padrenuestros y las Avemarías: <i>“¿Puede tu corazón quedarse cerrado frente a Mis Llagas abiertas?”</i>"],[27]],[157,["Por la calle. Él: <i>“Escúchame bien: el bien no se hace solamente con palabras; una mirada puede penetrar en un alma y tocarla.”</i>"],[5]],[158,["<i>“Para hacerte pequeña no es preciso que disminuyas tus dones; piensa solamente que todos te vienen de Mí.”</i>"],[24]],[159,["13 de junio. Nantes. <i>“¿Puedes dudar del Poder de Mi Sangre? Pero sabes que una sola gota bastaría para borrar los pecados de todo el Universo. Lávate en Mi Sangre.”</i>"],[45]],[160,["Después de una representación que tuvo mucho éxito, Le dije: ‘Señor, ¡qué vida tan colmada esta que me has dado! ¿Qué podré ofrecer a Dios como sacrificio?’ Él: <i>“Ofrécele los Míos.”</i>","Nantes, 14 de junio. <i>“Habrás visto que en ocasiones te pido que sacrifiques un sacrificio.”</i>"],[36,37]],[162,["17 de junio. <i>“Todo en la naturaleza es solamente imagen y emblema. ¿Has pensado alguna vez que todo el que ama es imagen de Mi Amor?”</i>"],[5]],[163,["<i>“Para oír es preciso escuchar. Escucha.”</i>"],[15]],[164,["<i>“Nunca exagerarás en el amor que Me tengas.”</i>"],[1]],[165,["165.<i> “Cuando recibes con una sonrisa las pequeñas contrariedades de la vida diaria, curas Mis Llagas.”</i>"],[27]],[166,["<i>“Si Yo te he escogido es porque eres pequeña y llena de miserias.”</i>"],[24]],[167,["La institución de la Eucaristía, en la víspera de la Pasión. <i>“¡Qué bien he ganado el pan de Mis hijos! Puedes comer de ese Pan. Me costó caro; pero ¡soy tan feliz de podértelo ofrecer!”</i>"],[8]],[168,["En la casa vacía. <i>“¡Pero estamos aquí en compañía, tú y Yo!”</i>"],[41]],[169,["<i>“¿Quién te ha amado nunca como Yo? ¿Crees esto, cuando menos?”</i>"],[2]],[170,["170.<i> “Sufre en tu cuerpo en unión conmigo. Como si Yo mismo hubiera sido burlado y flagelado esta mañana.”</i>"],[37]],[171,["18 de junio (1937). Le Fresne, después de la comunión. <i>“Aquí están Mis Llagas, no solamente la abertura. Entra. Están hendidas. Ve cómo está la Carne abierta y los Músculos desgarrados. Bebe Mi Sangre. Es para vosotros, para ti. Entra.”</i>","18 de junio (1937). Le Fresne, después de la comunión. <i>“No interrumpas nuestra conversación ni siquiera en medio de la aridez. Te admiraste con los tapices multicolores que Me hicieron para Mi Fiesta de Corpus; pues bien, prepárame otros todavía más hermosos a lo largo del día, hechos de sacrificios y otros actos de virtud.”</i>"],[27,37]],[172,["21 de junio. <i>“¿No te causa asombro el que te digan que has hecho el bien en este país o en aquel otro, o a tal o tal alma? Es porque no eres tú la que hace el Bien. Soy Yo, por tu medio. ¡Si supieras lo que pasa en un alma cuando Mi Sangre la purifica! Mi Gracia va más allá que tu alma.”</i>"],[45]],[173,["22 de junio. Nantes, en el cine. <i>“Dondequiera que estás, consérvame en tu amor. Si supieras lo que es la belleza de un alma…”</i>"],[1]],[174,["24 de junio. <i>“Son pocos los que contemplan y honran Mi Alma. Los esposos, ligados como están por la vida, acaban por experimentar una cierta monotonía en el amor. Yo, en cambio, siento una alegría siempre nueva con vuestros actos y efusiones de amor; porque sois ‘seres libres’.”</i>"],[2]],[178,["<i>“¿Crees que Yo puedo permanecer en silencio cuando alguien quiere hablar conmigo? ¡Háblame!”</i>"],[15]],[181,["27 de junio. <i>“Que tu vida sea un recogimiento continuo, una ininterrumpida conversación con tu Señor.”</i>"],[41]],[185,["28 de junio.<i> “Respeta la piedad de los demás. Cada quien tiene su propia manera de venir a Mí.”</i>"],[34]],[186,["<i>“Te pedí que te durmieras en el Espíritu Santo porque tu último suspiro tiene que exhalarse en el Amor.”</i>"],[48]],[187,["29 de junio. Mientras ponía yo un poco de orden en mis cosas, Le decía: ‘Señor, Tú no me hablas.’ Entonces Él me respondió con dulzura: <i>“Cuando estás muy ocupada temo interrumpirte.”</i>"],[16]],[188,["<i>“Hay muchas maneras de hablarme. Por lo que a ti toca, háblame con tu corazón.”</i>"],[34]],[190,["<i>“Ofréceme todos los días tu muerte, así como Yo ofrezco la Mía diariamente a Mi Padre</i> (en la Misa)<i>”</i>"],[46]],[195,["<i>“Que la oración no sea para ti una fatiga. ¿Por qué te tomas tantos trabajos? Todo debe ser sencillo, bueno, como una charla de familia.”</i>"],[34]],[197,["10 de julio, durante la comunión. “<i>Si tú pudieras ver Mi Esplendor en este momento...”</i>"],[8]],[198,["<i>“Dame sufrimientos. Dámelos, porque en el Cielo nadie me los puede dar.”</i>"],[37]],[204,["4 de julio.<i> “Ahora que Me has ofrecido tus sufrimientos, considera los Míos.”</i>"],[36]],[206,["206.<i> “Yo le hablaría a cualquiera que en realidad quisiera oírme, y vendría al encuentro de quien de veras Me quisiera encontrar.”</i>"],[15]],[211,["“<i>No te ocupes en decir oraciones de muchas palabras. Simplemente ámame. Con una mirada interior, con una sonrisa tierna de amistad.”</i>"],[34]],[213,["12 de julio. <i>“¿Tu conversación conmigo? Que sean palabras breves, ¿comprendes? Sin esfuerzo; mientras menor es el esfuerzo, más grande es el amor.”</i>"],[34]],[214,["18 de julio. <i>“Date a Mí como Yo Me doy a ti. Si te quedas en ti misma, nuestra Unión no es completa. Dáteme como Yo te Me doy.”</i>"],[37]],[215,["<i>“¿Tus éxitos? ¿Tu alegría y tu encanto? Refiérelo todo a Mí, porque Soy Yo Quien te lo ha dado todo.”</i>"],[23]],[217,["22 de julio. Al bajar del tren en una estación. <i>“Ejercítate en dirigirte siempre al prójimo con la actitud de quien es inferior.”</i>"],[5]],[219,["<i>“¿Ves a esa muchachita? Mira a su padre sonriendo. No le dice nada. Pero ¡qué feliz hace a su padre con esa sonrisa!”</i>"],[5]],[220,["En la estación de Paray-le-Monial. Yo pensaba que ese no era precisamente el mejor paisaje en Francia para recibir al Sagrado Corazón. Él me dijo: <i>“Lo que Me atraía no era el paisaje, sino el alma tan humilde de Margarita María.”</i>"],[23]],[221,["<i>“Siempre que hablas o piensas con altivez, te mueve tu bajeza. Pero cuando te conduces como la servidora de todos, esto te engrandece.”</i>"],[23]],[222,["24 de julio. <i>“Sonríe a tu prójimo como si Me sonrieras a Mí. Yo Soy tu prójimo.”</i>"],[5]],[223,["24 de julio. Isère. Entre solteros ya grandes, pero tímidos: <i>“No les escatimes la bondad; adelántate con gracia y amabilidad. ¿Sabes lo que es adelantarse? También en esto sal de tus medidas habituales.”</i>"],[5]],[228,["<i>“Mientras más te des a los otros, más te Me daré.”</i>"],[5]],[229,["28 de julio. Le Fresne. Yo dudaba en reconocer Su Voz. Me dijo: <i>“¿Acaso no crees en Mí?” Luego, desde la hostia: “Yo Soy el Dios indefenso. ¿Ves esos pajaritos que se posan sobre tu silla o en la mesa del jardín? Si viene alguien que es malo, podrían escapar volando; pero Yo no Me escapo. Y Mi Cabeza, que no tenía donde reclinarse, descánsala...”</i>"],[20]],[237,["12 de agosto. En l’Ardéche. Yo: ‘¿Cómo es posible que desciendas hasta este poco de vino que hay en el cáliz?’ Él: <i>“Con inmensa Alegría.”</i>"],[46]],[241,["20 de agosto, en el tren. <i>“De lo que Yo te pongo en la mano, pon tú en las manos de los demás.”</i>"],[5]],[242,["20 de agosto. Le Fresne. <i>“Cuando mueras pondrás tu corazón tendido sobre las heridas del Mío. En el Antiguo Testamento había corazones inflamados por el deseo de la venida del Mesías. Únete a ellos para reclamar el advenimiento del Reino de Dios.”</i>"],[38]],[243,["21 de agosto. <i>“¿Por qué piensas tanto en esas naderías?”</i> (Se me había roto un tubo en la cañería del agua). <i>“Míralas desde arriba.”</i>"],[38]],[244,["21 de agosto. <i>“Cuando te tomas tiempos para detenerte ante Mí, tú te entregas y Yo puedo hablar contigo. Toma tus tiempos.”</i>"],[41]],[245,["24 de agosto.<i> “Cuando te tomas algún tiempo para detenerte ante Mí, tú te entregas y Yo puedo hablar contigo. Toma tus tiempos.”</i>"],[34]],[246,["25 de agosto. <i>“Hazme compañía, soy vuestro Íntimo. Cuando leas no estés en compañía del autor del libro, sino en la Mía. Soy un Dios celoso. Ponme como un sello en tu corazón. Y no temas mirar Mis Heridas: son tuyas; entra en Ellas como en tu casa.</i>\n<i>“Saca de Mí lo nuevo y lo viejo y no Me dejes nunca… no Me dejes nunca… háblame con suspiros: Yo oigo siempre a los que suspiran.”</i>","25 de agosto. <i>“Hazme compañía, soy vuestro Íntimo. </i>Más tarde al hacer la visita al santísimo Sacramento, me dijo simplemente: <i>“Aquí estoy.”</i>"],[10,43]],[247,["25 de agosto, en la terraza. “<i>¿Dudas de que sea Yo? Haz como si lo fuera.”</i>"],[15]],[253,["<i>“Toma la Sangre que corre de las espinas y lava el mundo con Ella. Escucha, que entenderás.”</i>"],[45]],[255,["<i>“Ve más allá de ti misma.”</i>"],[26]],[257,["2 de septiembre. <i>“El amor de ayer te da más amor para el día de hoy; y el amor de hoy te dispone para el amor de mañana.”</i>"],[1]],[258,["Mientras hacía oración, me dijo con aire de propietario: <i>“Estos momentos son Míos”. </i>Yo también estaba en su Corazón tratando de lavar mis faltas. Me dijo: <i>“Lava también las de los otros”.</i>\nLe pregunté: ‘Señor, ¿es que Tu Sangre no me lava sino en el momento de recibir el sacramento de la Reconciliación?’. Me contestó: <i>“Tus deseos de purificarte en Mi Corazón bajo la fuente de la Cruz te purifican desde antes”.</i>"],[13]],[260,["3 de septiembre. Yo: ‘¿Y qué hago con mis defectos?’ Él: <i>“Ven con ellos. Ven siempre. Cree en Mí, cree en el poder de Mi Corazón.”</i>"],[30]],[266,["5 de septiembre. <i>“Si las distracciones no vienen por culpa tuya, Yo te doy las mismas Gracias que te daría si no las hubieras tenido.”</i>"],[17]],[268,["8 de septiembre, en Lourdes. Durante la Misa, con los 40,000 peregrinos reunidos ante el cardenal Suhard de Reims, pensaba en la alegría de la Santa Madre de Dios. Él me dijo: <i>“Todas las mujeres tienen algo de mi Madre.”</i>"],[28]],[271,["Lourdes. En la Gruta. <i>“Debes esforzarte por modificar tu naturaleza. Un gesto, una palabra, son otras tantas penitencias continuadas.”</i>"],[37]],[279,["15 de septiembre. <i>“Aun cuando Yo no te hable, Me das gusto si tratas de escucharme. Escúchame. ¿Quién podría ser más dichosos que vosotros los cristianos? Tenéis un mismo Padre, que es el Mío y una misma Madre, que es la Mía. Y yo Soy vuestro Hermano, ¡Comprended, pues, en la alegría!”</i>"],[15]],[280,["17 de septiembre. En el tren, rumbo a París. Él: <i>“Vive de todo lo que Yo te he dicho. Habrás dado un paso más cuando vivas conmigo simplemente, como un único Amigo invisible, pero siempre presente.”</i>"],[15]],[283,["Yo Le decía: ‘Realmente no comprendo cómo puedes amar tanto a criaturas tan miserables’. Me contestó: <i>“¿Cómo podrías tú entender lo que es el Corazón de un Dios?”</i>"],[13]],[286,["Yo dejaba de mortificar mi cuerpo. <i>“Yo no Me quité Mi Corona de espinas.”</i>"],[37]],[288,["<i>“Para llegar a amar mejor tienes que cambiar tus formas de amor”</i>. Entonces abrí mi corazón sobre el Suyo esperando captar una llama. Me dijo:<i> “Si esto lo hicieras con mayor frecuencia, serías muy dichosa. Piensa que Lo tienes a tu disposición”.</i>"],[13]],[291,["En la Misa: ‘Que el Señor esté con vosotros’ <i>“El Señor está contigo por tu estado de gracia.”</i>"],[46]],[292,["De salida para Ile-et-Vilaine.<i> “Haz como si Yo estuviera de pie a tu izquierda, viajando contigo. Soy Yo Quien hizo el corazón de un padre, el corazón de una madre... ¡entonces!”</i>"],[39]],[294,["Con acento acongojado, como alguien que se va: <i>“No quieren creer en Mi Amor.”</i>"],[10]],[295,["Mientras yo rendía honores a Su Sagrado Rostro. <i>“Si esto lo hicieras con mayor frecuencia... pero no os atrevéis.”</i>"],[42]],[299,["1º de octubre de 1937. Al tiempo de la aurora, al despertar. <i>“No nos hemos visto desde ayer por la tarde. Ten mayor confianza en Mis Méritos. Yo no pensé sino en vosotros cuando vivía sobre la Tierra. No pienses sino en Mí. Que Yo sea tu Vida.”</i>","1º de octubre de 1937. <i>“Pide sin cesar que el Espíritu de Santidad, el Espíritu Santo, venga a poseerte. Y pídelo por medio de Aquella que Él cubrió con Su Sombra, Mi Madre, vuestra Madre. Honra a Mi Madre hasta en el Pensamiento eterno de Dios.”</i>"],[9,48]],[300,["En la Misa: “<i>¿Tendrías tú la humildad de esconderte bajo un pedacito de pan y un poco de vino?</i>\n<i>“Hoy, jueves, vive para la Hostia como otra hostia. Y cuando tus sentimientos sean insuficientes, toma los Míos. Nunca sabrás con cuanto respeto Me dirijo Yo a las almas. ¡El respeto por su libertad!”</i>"],[46]],[301,["<i>“Si pensaras más en Mí, cometerías menos faltas... ¡Entiende el placer que Me das cuando todo lo abandonas a Mi Providencia! Confíate completamente. Teje el tejido de tu alma, el que la va a revestir por toda la Eternidad.</i>\n<i>“Hazme conocer de aquellos que no se atreven. Porque es amándome como se aprende a amarme. No vivas sino para Mí. Que tu vida sea Yo.”</i>"],[40]],[302,["3 de octubre de 1937. <i>“La medida de tu amor para Mí ha de ser amarme sin medida. Te pagaré con Amor. Divide tu día para que tengas mayor seguridad de ofrecérmelo todo. Ofréceme esa visita, esa otra ocupación. Mírame siempre a Mí, nunca a ti. Sube por encima de tus pequeñas preocupaciones para no pensar sino en Mí.”</i>"],[1]],[304,["7 de octubre. <i>“Mis Méritos son suficientemente grandes para tu pecador. Pide su conversión en nombre de Mis Méritos.”</i>"],[44]],[305,["8 de octubre. En el tren yo rezaba el rosario. <i>“Honra a Mi Madre en el Eterno Pensamiento del Padre, pues ella cumplió exactamente la misión que Le asignaba ese Pensamiento.”</i>"],[28]],[308,["Yo pensaba demasiado humanamente en el éxito. Él me dijo: <i>“Recuerda que un día vendrá en el cual darás a las cosas de la Tierra un valor muy diferente del que les das ahora.”</i>"],[38]],[309,["Yo me quejaba de tener que hacer todos los días las mismas cosas: comisiones, viajes, visitas. Él: <i>“Para Mí, es siempre algo nuevo el que tú Me ames.”</i>"],[1]],[310,["Yo dije: ‘Es la chiquilla X’. Él:<i> “Te quiero pequeña.”</i>"],[24]],[311,["Yo decía: ‘¡Qué poca esperanza tengo y qué poco amor!’ Él: <i>“Mi Madre hizo crecer Mi Cuerpo físico. Tú trabaja para hacer crecer Mi Cuerpo místico.”</i>"],[28]],[315,["Yo había tenido algunos pensamientos de orgullo. Me dijo:<i> “Recuerda que se ha dicho que en el infierno hay vírgenes, pero no almas humildes.”</i>"],[23]],[318,["28 de octubre. Después de la comunión. <i>“Nada para ti, todo para Mí. Y nada sin Mí. No busques nunca las recompensas de la Tierra, son demasiado pobres.”</i>","28 de octubre. Esta mañana, entre las ocho y las ocho cuarenta y cinco meditaba yo en Su Flagelación. Le decía: ‘Señor, déjame que apriete Tus Llagas sobre el mundo.’ Me dijo:<i> “No tienes necesidad de apretarlas, Mi Sangre corre libremente de todo Mi Cuerpo.”</i>\nA propósito de esos crímenes que se quedan sin castigo: <i>“Deja rodar el mundo: yo cuento con la Eternidad. Sola tú con solo Dios. Mira Mis Ojos, llenos de Sangre y de Lágrimas. Yo tengo siempre necesidad de vosotros.”</i>\nY como Él me lo había dicho, con el deseo de obtener un poco de Su Dulzura, Le decía: ‘Dame la Mano.’ Entonces Él me llenó de un intenso pensamiento de Su pobre Mano perforada y ensangrentada."],[23,45]],[321,["Nantes, 3 de noviembre. “<i>Un alma es como un álbum. ¿Por qué presentas solo las páginas edificantes?”</i>"],[34]],[322,["3 de noviembre de 1937. Después de la comunión. <i>“La oración es como un canal, y uno de los extremos de la atención ha de estar fijo en Dios. De lo contrario, la Gracia no fluye en las almas.”</i>"],[34]],[324,["11 de noviembre. En Niza, durante el servicio presidido en Notre Dame por monseñor Rémond, yo me apoyaba en espíritu sobre el hombro derecho de Mi Salvador. Me dijo: <i>“¿Si Yo no te mirara sino cuando tú Me miras?”</i> Con eso me invitaba a levantar los ojos con más frecuencia a Su Rostro."],[42]],[326,["<i>“Hay almas que Yo llamo a la soledad aún en medio de la multitud, para que vivan en la intimidad de Mi Amor y Yo goce de ellas como de las más fieles. ¡Que no Me hagan la injuria, ni Me den la pena de no comprender! Tú, ¡ven!”</i>"],[26]],[327,["En la capilla de las Clarisas. Después de la comunión. Bastia. <i>“Si una niña pequeñita se dirigiera a su padre con frases escogidas, se diría que recitaba una felicitación. Su padre preferiría verla esconderse tiernamente entre sus brazos.”</i>"],[8]],[329,["14 de noviembre. En Bastia, en la capilla del Buen Pastor, en medio de Arrepentidas y Magdalenas, me dijo: <i>“Sígueme durante mi Pasión.” </i>Y durante toda la Misa, me daba la Mano; desde el Huerto de los Olivos, hasta la casa el sumo sacerdote, ante Pilatos y hasta la subida al Calvario. Pero al llegar al primer toque de la campanilla antes de la Elevación, me dijo ya clavado: <i>“Ya no puedo darte la Mano” </i>(Era tan delicadamente tierno)."],[46]],[330,["16 de noviembre. Bastia. Durante un ensayo largo y fastidioso, me dijo, como para darme ánimo: <i>“Aquí estoy.”</i>"],[39]],[336,["24 de noviembre de 1937. <i>“Ama tu celda: tu aposento, si estás en casa; tu propio corazón, si estás en medio de la multitud. Ahí estoy yo.”</i>"],[41]],[337,["Ajaccio. <i>“¿Qué dirías si Yo obrara contigo como tú lo haces con los otros?”</i>"],[5]],[338,["Travesía de Bastia a Niza con un mar tan suave como la Mano de Dios. Me dijo: <i>“¿Y qué, si Yo quiero manifestar en ti Mi extrema Bondad? Auméntame en los otros. Recibe toda prueba como venida de Mi Mano. Recuerda que yo abracé Mi Cruz. Cuando estés fatigada, piensa en Mí, fatigado. Para ser Mi discípulo, es preciso no solamente llevar su cruz; es necesario ‘tomarla’.”</i>"],[36]],[339,["Ajaccio, 24 de noviembre. Él: <i>“Cuando ames de veras a tu prójimo, te las ingeniarás para darle gusto, y lo harás con afecto. Recuerda tal o cual circunstancia en que perdiste una buena ocasión.”</i>","Ajaccio, 24 de noviembre. Ante la puesta del sol detrás de las Islas Sanguinarias, me dijo: <i>“¿Acaso eres ya otro Cristo? La santidad está en serlo.”</i>"],[5,49]],[342,["28 de noviembre de 1937. Esperando el tren en la estación de Niza, rodeada de paquetes, oraba por el advenimiento de Su Reino. Él: <i>“Es tu corazón el lugar en que Yo Me refugio; eres la única que ora en este andén”.</i>"],[10]],[343,["29 de noviembre de 1937. De Lyon a Nantes. <i>“Mis creaturas existen para Mí, para expresar Mi Gloria. No te hurtes a tu destino.”</i>"],[39]],[344,["30 de noviembre. Nantes, Ancenis. <i>“Bórrate. Contempla. Contemplar es la ocupación eterna.”</i>","30 de noviembre. Nantes, Ancenis. <i>“Tus relaciones de cariño para con el prójimo, iluminarán tus relaciones con las Tres Divinas Personas que habitan en ti.”</i>"],[11,48]],[346,["7 de diciembre, después de la comunión. <i>“Repite con frecuencia: ‘Padre, que se haga Tu Voluntad. ¡Que se haga Tu Voluntad!’ ¿Te imaginas que sería la Tierra si en todas partes se cumpliera la Voluntad de Dios?”</i>"],[35]],[347,["8 de diciembre. Yo estaba bajo Su Sangre que manaba de la Cruz. Me dijo: <i>“Sé ‘Yo’. Sé ‘Yo’ para todos. Auméntame en los otros.”</i>"],[49]],[348,["17 de diciembre. Después de la comunión: <i>“Delicadeza, alegría, encanto: desarrolla para Mí lo que Yo te he dado, y vive de esto más en lo interior. Una creatura debe darlo todo a su Creador y dárs
