<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101a2a">
<title>Diario</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#101a2a;--fg:#f2f5fa;--mut:#9fb0c8;--card:#263447;--bd:#34455e;--link:#8fb2ff;--bar:#101a2a;--hl:#5a4a12;--sel:#27456e;--fs:19px;--lh:1.6;--ff:Georgia,'Times New Roman',serif;--ui:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
body[data-theme=light]{--bg:#fbfbf8;--fg:#1c2330;--mut:#5d6b80;--card:#eef1f6;--bd:#d3dae6;--link:#1d4fb8;--bar:#fbfbf8;--hl:#fff1a8;--sel:#cfe0ff}
body[data-theme=sepia]{--bg:#f3e9d2;--fg:#3b2f1f;--mut:#7a6a50;--card:#e8dcc0;--bd:#d2c29c;--link:#8a4b12;--bar:#f3e9d2;--hl:#f6dd8a;--sel:#e2c98e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui)}
body{min-height:100vh}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 14px;background:var(--bar);border-bottom:1px solid var(--bd)}
header button{background:none;border:0;color:var(--fg);font-size:26px;width:44px;height:44px;cursor:pointer;border-radius:10px}
header h1{font:400 21px/1 var(--ff);margin:0;text-align:center;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
main{max-width:760px;margin:0 auto;padding:18px 16px 110px}
.hero{text-align:center;font:400 38px/1.15 var(--ff);margin:26px 0 8px}
.sub{text-align:center;font-size:21px;margin:0 0 20px}
h2.t{font:400 38px/1.15 var(--ff);margin:10px 0 18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid.ch{grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:10px}
.btn{display:flex;align-items:center;justify-content:center;text-align:center;min-height:64px;padding:10px;background:var(--card);border:1px solid var(--bd);border-radius:14px;color:var(--fg);font:600 20px/1.2 var(--ui);text-decoration:none;cursor:pointer}
.btn.bk{color:var(--link);font-weight:500;min-height:68px}
.btn.n{min-height:56px;font-size:19px;color:var(--link);font-weight:500}
.btn.n.on{background:var(--link);color:var(--bg)}
.back{display:inline-block;color:var(--mut);text-decoration:none;font-size:18px;margin:2px 0 14px}
.row{display:flex;gap:12px;margin-top:16px}.row .btn{flex:1;font-size:18px;min-height:56px}
.cont{margin:0 0 18px;padding:14px;border:1px solid var(--bd);border-radius:14px;background:var(--card);display:block;text-decoration:none;color:var(--fg)}
.cont small{color:var(--mut);display:block;font-size:14px;margin-bottom:2px}.cont b{font-size:20px;font-weight:600}
#txt{font-family:var(--ff);font-size:var(--fs);line-height:var(--lh)}
#txt h2{font:400 1.45em/1.2 var(--ff);margin:.2em 0 .6em;text-align:center}
#txt h3{font:700 .9em/1.3 var(--ui);letter-spacing:.04em;text-transform:uppercase;color:var(--link);margin:1.4em 0 .4em}
#txt h4{font:italic 600 1em/1.3 var(--ff);margin:1.1em 0 .3em;color:var(--mut)}
#txt p{margin:.45em 0}#txt p.c{margin:0;padding-left:1.2em}
.vs{padding:1px 4px;margin:0 -4px;border-radius:6px}.vs.hl{background:var(--hl)}.vs.sel{background:var(--sel)}.vs.flash{animation:fl 2s}
@keyframes fl{0%,60%{background:var(--sel)}100%{background:transparent}}
a.n{font:600 .62em/1 var(--ui);color:var(--link);vertical-align:super;margin-right:.18em;text-decoration:underline dotted;padding:4px 2px}
a.cm{display:inline-block;font:500 14px var(--ui);color:var(--link);text-decoration:none;border:1px solid var(--bd);border-radius:14px;padding:5px 12px;margin-top:6px}
.doc{font-family:var(--ff);font-size:var(--fs);line-height:var(--lh)}.doc p{margin:.5em 0}.doc a{color:var(--link)}.doc a.img{font:.72em var(--ui);border:1px solid var(--bd);border-radius:.3em;padding:0 .3em;text-decoration:none}.doc p.li{padding-left:1.2em}.doc p.flash{animation:fl 2.4s}
b.n{font:600 .62em/1 var(--ui);color:var(--link);vertical-align:super;margin-right:.18em}
body.nonum b.n{display:none}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;align-items:center;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:var(--bar);border-top:1px solid var(--bd)}
#bar .btn{min-height:46px;font-size:17px;flex:1}#bar .mid{flex:2;font-weight:500}
#bar .btn[disabled]{opacity:.35;pointer-events:none}
#sel{position:fixed;left:0;right:0;bottom:62px;z-index:26;display:none;gap:8px;padding:8px 12px;background:var(--bar);border-top:1px solid var(--bd)}#sel.on{display:flex}#sel .btn{min-height:42px;font-size:16px;flex:1}
#fab{position:fixed;right:16px;bottom:84px;z-index:24;width:56px;height:56px;border-radius:50%;border:1px solid var(--bd);background:#3a4d75;color:#fff;font-size:26px;cursor:pointer;box-shadow:0 4px 14px #0006}
#sheet{position:fixed;inset:0;z-index:40;display:none;background:#0008}#sheet.on{display:block}
#sheet .p{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--bd);border-radius:18px 18px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
#sheet h3{margin:0 0 12px;font:600 18px var(--ui)}#sheet label{display:block;margin:14px 0 6px;color:var(--mut);font-size:14px}
#sheet .seg{display:flex;gap:8px}#sheet .seg .btn{min-height:44px;font-size:16px;flex:1}#sheet .seg .btn.on{outline:2px solid var(--link)}
#sheet input[type=range]{width:100%}
.si{width:100%;padding:14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font:18px var(--ui)}
.res{display:block;padding:12px 4px;border-bottom:1px solid var(--bd);color:var(--fg);text-decoration:none;font-family:var(--ff);font-size:17px;line-height:1.45}
.res b{font:600 15px var(--ui);color:var(--link);display:block}.res mark{background:var(--hl);color:inherit;border-radius:3px}
.chips{display:flex;gap:8px;margin:10px 0}.chips .btn{min-height:40px;font-size:15px;flex:1}.chips .btn.on{outline:2px solid var(--link)}
.mut{color:var(--mut);font-size:15px}.x{float:right;background:none;border:0;color:var(--mut);font-size:22px;padding:0 6px}

.dhero{text-align:center;margin:6px 0 4px}.dnum{font:700 112px/1 var(--ff);letter-spacing:-.02em}.dmon{font:400 34px/1.1 var(--ff);text-transform:lowercase;margin-top:2px}.dwk{color:var(--mut);font-size:17px;margin-top:6px}
.dnav{display:flex;gap:10px;margin:16px 0 18px}.dnav .btn{min-height:46px;font-size:20px}.dnav .btn:nth-child(2){flex:2;font-size:17px}.dnav .btn{flex:1}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin:0 0 14px}
.lh{display:flex;gap:12px;align-items:flex-start}.lh h2{font:600 21px/1.3 var(--ff);margin:0}.dots{display:flex;align-items:center;gap:4px;padding-top:2px;flex:none}.or{color:var(--mut);font-size:14px}
.dot{display:inline-block;width:30px;height:30px;border-radius:50%;border:2px solid #0004;box-shadow:0 0 0 1px var(--bd)}.c-bl{background:#fbfaf3}.c-ve{background:#2f9e5e}.c-ro{background:#c6282b}.c-mo{background:#6b3fa3}.c-rs{background:#e88cb2}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}.tag{font:600 14px var(--ui);padding:5px 12px;border-radius:14px;border:1px solid var(--bd);background:var(--bg);color:var(--fg)}.tag.f{background:var(--link);color:var(--bg);border-color:var(--link)}.tag.g{border-color:var(--link);color:var(--link)}
.kv{margin:12px 0 0;font:17px/1.45 var(--ff)}.kv small{display:block;font:600 12px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-bottom:2px}.kv a{color:var(--link)}
.sh{font:700 13px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--link);margin:0 0 8px}
.rd{display:block;padding:10px 0;border-bottom:1px solid var(--bd);color:var(--fg);text-decoration:none;font:17px/1.45 var(--ff)}.rd:last-of-type{border-bottom:0}.rd b{font:700 16px var(--ui);color:var(--link);display:block;margin-bottom:2px}.rd span{display:block}
.cap{color:var(--mut);font-size:14px;margin:0 0 6px}.card .btn{margin-top:12px;min-height:52px;font-size:18px}.card a.cm{margin-top:12px}
</style>
</head>

. III (par)","r":[["#/r/9/5/12","2S 6, 12","b-15.17-19","David y todo Israel iban subiendo el Arca del Señor entre aclamaciones."],["#/r/22/22","Sal 23","","¿Quién es ese Rey de la gloria? Es el Señor."],["#/r/47/2/31","Mc 3, 31","-35","El que haga la voluntad de Dios, ese es mi hermano y mi hermana y mi madre."]],"ob":["o bien: cf. vol. IV."]},"2026-01-28":{"o":115029,"t":"MIÉRCOLES. SANTO TOMÁS DE AQUINO, presbítero y doctor de la Iglesia, memoria obligatoria","b":[["Lectura continuada",2098764]],"n":"PE III","v":"vol. III (par)","r":[["#/r/9/6/4","2S 7, 4","-17","Suscitaré descendencia tuya después de ti y afirmaré su reino."],["#/r/22/87","Sal 88","","Le mantendré eternamente mi favor."],["#/r/47/3/1","Mc 4, 1","-20","Salió el sembrador a sembrar."]],"ob":[]},"2026-01-29":{"o":115617,"t":"JUEVES DE LA III SEMANA DEL TIEMPO ORDINARIO, feria","b":[["Lectura continuada",2103969]],"n":"<a href=\"#/d/Misal/25779\"><i><span>Adoro Te devote</span></i></a> • (blanco) <a href=\"#/d/Misal/3245949\"><i><span>Eucaristía</span></i></a> • PE I","v":"vol. III (par)","r":[["#/r/9/6/18","2S 7, 18","-19. 24-29","¿Quién soy yo, mi Señor, y qué es mi familia?"],["#/r/22/130","Sal 131","","El Señor Dios le dará el trono de David, su padre."],["#/r/47/3/21","Mc 4, 21","-25","El candil se trae para ponerlo en el candelero. La medida que uséis la usarán con vosotros."]],"ob":[]},"2026-01-30":{"o":116099,"t":"VIERNES DE LA III SEMANA DEL TIEMPO ORDINARIO, feria","b":[["Lectura continuada",2107545]],"n":"(blanco) <a href=\"#/d/Misal/3250150\"><i><span>Sagrado Corazón</span></i></a> • PE II","v":"vol. III (par)","r":[["#/r/61/0/1","2Tm 1, 1","-8","Evoco el recuerdo de tu fe sincera. O bien: Tt 1, 1-5. A Tito, verdadero hijo en la fe que compartimos."],["#/r/22/94","Sal 95","","Contad las maravillas del Señor a todas las naciones."],["#/r/47/3/26","Mc 4, 26","-34","Un hombre echa semilla y duerme, y la semilla va creciendo sin que él sepa cómo."]],"ob":[]},"2026-01-31":{"o":116611,"t":"SÁBADO. SAN JUAN BOSCO, presbítero, m. obligatoria","b":[["Lectura continuada",2111704]],"n":"Antífona <i><span>Alma Redemptoris</span></i> • <i><span>ExSi</span></i> • PE III","v":"vol. III (par)","r":[["#/r/9/11/1","2S 12, 1","-7a.10-17","He pecado contra el Señor."],["#/r/22/49","Sal 50","","Oh, Dios, crea en mí un corazón puro."],["#/r/47/3/35","Mc 4, 35","-41","¿Quién es este? ¡Hasta el viento y el mar lo obedecen!"]],"ob":[]},"2026-02-01":{"o":117120,"t":"+ DOMINGO IV DEL TIEMPO ORDINARIO","b":[["Lecturas",2808652]],"n":"C • 1º <i><span>de San José</span></i> • [Flo] • PE III","v":"vol. I (A)","r":[["#/r/42/1/3","So 2, 3","","; So 3, 12-13. Dejaré en medio de ti un pueblo humilde y pobre."],["#/r/22/144","Sal 145","","Bienaventurados los pobres en el espíritu, porque de ellos es el reino de los cielos."],["#/r/52/0/26","1Co 1, 26","-31","Dios ha escogido lo débil del mundo."],["#/r/46/4/1","Mt 5, 1","-12a","Bienaventurados los pobres en el espíritu."]],"ob":[]},"2026-02-02":{"o":118254,"t":"LUNES. PRESENTACIÓN DEL SEÑOR, fiesta","b":[["Lecturas",3604393]],"n":"C • PE III","v":"vol. IV","r":[["#/r/45/2/1","Ml 3, 1","-4","Llegará a su santuario el Señor a quien vosotros andáis buscando. O bien: Hb 2, 14-18. Tenía que parecerse en todo a sus hermanos."],["#/r/22/22","Sal 23","","El Señor, Dios del universo, él es el Rey de la gloria."],["#/r/48/1/22","Lc 2, 22","-40","Mis ojos han visto a tu Salvador."]],"ob":[]},"2026-02-03":{"o":119448,"t":"MARTES DE LA IV SEMANA DEL TIEMPO ORDINARIO, feria o SAN BLAS, obispo y mártir o SAN ÓSCAR, obispo","b":[["Lectura continuada",2120692]],"n":"<a href=\"#/d/Misal/26712\"><i><span>Salmo 2</span></i></a> • Limpiar sagrario • PE I","v":"vol. III (par)","r":[["#/r/9/17/9","2S 18, 9","-10.14b.24-25a.31-19, 3","¡Hijo mío, Absalón! ¡Quién me diera haber muerto en tu lugar!"],["#/r/22/84","Sal 85","","Inclina tu oído, Señor, escúchame."],["#/r/47/4/21","Mc 5, 21","-43","Contigo hablo, niña, levántate."]],"ob":["o bien: cf. vol. IV."]}, "ob":["o bien cf. Leccionario de las «Misas de la Virgen María»."]},"2026-02-08":{"o":122722,"t":"+ DOMINGO V DEL TIEMPO ORDINARIO","b":[["Lecturas",2812415]],"n":"C • 2º <i><span>de San José</span></i> • [Flo] • PE IV","v":"vol. I (A)","r":[["#/r/29/57/7","Is 58, 7","-10","Surgirá tu luz como la aurora."],["#/r/22/110","Sal 111","","El justo brilla en las tinieblas como una luz."],["#/r/52/1/1","1Co 2, 1","-5","Os anuncié el misterio de Cristo crucificado."],["#/r/46/4/1","Mt 5, 1","3-16","Vosotros sois la luz del mundo."]],"ob":[]},"2026-02-09":{"o":123734,"t":"LUNES DE LA V SEMANA DEL TIEMPO ORDINARIO, feria","b":[["Lectura continuada",2140630]],"n":"(blanco) <a href=\"#/d/Misal/1131583\"><i><span>S Josemaría</span></i></a> • PE II","v":"vol. III (par)","r":[["#/r/10/7/1","1R 8, 1","-7.9-13","Acarrearon el Arca de la Alianza al Santo de los Santos, y la nube llenó el templo del Señor."],["#/r/22/130","Sal 131","","¡Levántate, Señor, ven a tu mansión!"],["#/r/47/5/53","Mc 6, 53","-56","Los que lo tocaban se curaban."]],"ob":[]},"2026-02-10":{"o":124166,"t":"MARTES. SANTA ESCOLÁSTICA, virgen, m. obligatoria","b":[["Lectura continuada",2143794]],"n":"<a href=\"#/d/Misal/26712\"><i><span>Salmo 2</span></i></a> • PE III","v":"vol. III (par)","r":[["#/r/10/9/1","1R 10, 1","-10","La reina de Saba percibió la sabiduría de Salomón."],["#/r/22/35","Sal 36","","La boca del justo expone la sabiduría."],["#/r/47/6/14","Mc 7, 14","-23","Lo que sale de dentro es lo que hace impuro al hombre."]],"ob":[]},"2026-02-11":{"o":124694,"t":"MIÉRCOLES DE LA V SEMANA DEL TIEMPO ORDINARIO, feria o B. VIRGEN MARÍA DE LOURDES, memoria libre","b":[["Lectura continuada",2147827]],"n":"D • (blanco) <a href=\"#/d/Misal/3325443\"><i><span>Virgen</span></i></a> • PE II","v":"vol. III (par)","r":[["#/r/10/9/1","1R 10, 1","-10","La reina de Saba percibió la sabiduría de Salomón."],["#/r/22/35","Sal 36","","La boca del justo expone la sabiduría."],["#/r/47/6/14","Mc 7, 14","-23","Lo que sale de dentro es lo que hace impuro al hombre."]],"ob":["o bien: cf. vol. IV."]},"2026-02-12":{"o":125468,"t":"JUEVES DE LA V SEMANA DEL TIEMPO ORDINARIO, feria","b":[["Lectura continuada",2151474]],"n":"<a href=\"#/d/Misal/25779\"><i><span>Adoro Te devote</span></i></a> • (blanco) <a href=\"#/d/Misal/3245949\"><i><span>Eucaristía</span></i></a> • PE I","v":"vol. III (par)","r":[["#/r/10/10/4","1R 11, 4","-13","Por no guardar la alianza, voy a arrancar el reino de tus manos; pero daré a tu hijo una tribu, en atención a David."],["#/r/22/104","Sal 105","","Acuérdate de mí, Señor, por amor a tu pueblo."],["#/r/47/6/24","Mc 7, 24","-30","Los perros, debajo de la mesa, comen las migajas que tiran los niños."]],"ob":[]},"2026-02-13":{"o":125985,"t":"VIERNES DE LA V SEMANA DEL TIEMPO ORDINARIO, feria","b":[["Lectura continuada",2155024]],"n":"C • Santos <a href=\"#/d/Misal/1064233\"><i><span>Cirilo y Metodio</span></i></a> (trasladada) • [Flo] • PE III","v":"vol. III (par)","r":[["#/r/10/10/29","1R 11, 29","","-32; 1R 12, 19. Israel se rebeló contra la casa de David."],["#/r/22/79","Sal 80","","Yo soy el Señor, Dios tuyo: escucha mi voz."],["#/r/47/6/31","Mc 7, 31","-37","Hace oír a los sordos y hablar a los mudos."]],"ob":[]},"2026-02-14":{"o":126424,"t":"SÁBADO. SANTOS CIRILO, monje, y METODIO, obispo, patronos de Europa, fiesta","b":[["Lecturas",3633205]],"n":"A • <a href=\"#/d/Misal/1065584\"><i><span>Sta. Mª, Madre del Amor Hermoso</span></i></a> • Ip • <a href=\"#/d/Misal/34473\"><i><span>Te Deum</span></i></a> • [Misa de media noche] • Ant. <i><span>Ave Regina</span></i> Coelorum • <i><span>ExSo</span></i> • Flo • PE III","v":"vol. IV","r":[["#/r/50/12/46","Hch 13, 46","-49","Sabed que nos dedicamos a los gentiles."],["#/r/22/115","Sal 116","","Id al mundo entero y proclamad el Evangelio."],["#/r/48/9/1","Lc 10, 1","-9","La mies es abundante y los obreros pocos."]],"ob":[]},"2026-02-15":{"o":127248,"t":"+ DOMINGO VI DEL TIEMPO ORDINARIO","b":[["Lecturas",2815508]],"n":"C • Co , 12-20)."],["#/r/49/7/1","Jn 8, 1","-11","El que esté sin pecado, que le tire la primera piedra."]],"ob":["o bien: cf. vol. IV."]},"2026-03-24":{"o":156208,"t":"MARTES DE LA V SEMANA DE CUARESMA, feria","b":[["Lectura continuada",709373]],"n":"D • Fiesta en familia (S. Gabriel) • <a href=\"#/d/Misal/26712\"><i><span>Salmo 2</span></i></a> • PE I","v":"vol. II","r":[["#/r/3/20/4","Nm 21, 4","-9","Los mordidos de serpientes quedarán sanos al mirar a la serpiente de bronce."],["#/r/22/100","Sal 101","","Señor, escucha mi oración, que mi grito llegue hasta ti."],["#/r/49/7/21","Jn 8, 21","-30","Cuando levantéis en alto al Hijo del hombre, sabréis que «Yo soy»."]],"ob":[]},"2026-03-25":{"o":156789,"t":"MIÉRCOLES. ANUNCIACIÓN DEL SEÑOR, solemnidad","b":[["Lecturas",3676578]],"n":"A • La Anunciación • <i><span>ExSo</span></i> • Flo • PE III","v":"vol. IV","r":[["#/r/29/6/10","Is 7, 10","","-14; Is 8, 10b. Mirad: la virgen está encinta."],["#/r/22/38","Sal 39","","Aquí estoy, Señor, para hacer tu voluntad."],["#/r/64/9/4","Hb 10, 4","-10","Así está escrito en el comienzo del libro acerca de mí: para hacer, ¡oh, Dios!, tu voluntad."],["#/r/48/0/26","Lc 1, 26","-38","Concebirás en tu vientre y darás a luz un hijo."]],"ob":[]},"2026-03-26":{"o":158329,"t":"JUEVES DE LA V SEMANA DE CUARESMA, feria","b":[["Lectura continuada",719861]],"n":"<a href=\"#/d/Misal/25779\"><i><span>Adoro Te devote</span></i></a> • Consumir viril • PE I","v":"vol. II","r":[["#/r/0/16/3","Gn 17, 3","-9","Serás padre de muchedumbre de pueblos."],["#/r/22/103","Sal 104","","El Señor se acuerda de su alianza eternamente."],["#/r/49/7/51","Jn 8, 51","-59","Abrahán, vuestro padre, saltaba de gozo pensando ver mi día."]],"ob":[]},"2026-03-27":{"o":158937,"t":"VIERNES DE LA V SEMANA DE CUARESMA, feria","b":[["Lectura continuada",724429]],"n":"C • Santo de la Abuela • PE III","v":"vol. II","r":[["#/r/30/19/10","Jr 20, 10","-13","El Señor es mi fuerte defensor."],["#/r/22/16","Sal 17","","En el peligro invoqué lo antes de que me hayas negado tres veces."]],"ob":[]},"2026-04-01":{"o":163272,"t":"MIÉRCOLES SANTO, feria","b":[["Lecturas",749715]],"n":"PE II","v":"vol. II","r":[["#/r/29/49/4","Is 50, 4","-9a","No escondí el rostro ante ultrajes."],["#/r/22/67","Sal 68","","Señor, que me escuche tu gran bondad el día de tu favor."],["#/r/46/25/14","Mt 26, 14","-25","El Hijo del hombre se va como está escrito; pero, ¡ay de aquel por quien es entregado!"]],"ob":[]},"2026-04-02":{"o":163778,"t":"JUEVES SANTO EN LA CENA DEL SEÑOR","b":[["Lecturas",767705]],"n":"A • Quitar agua bendita • <a href=\"#/d/Misal/25779\"><i><span>Adoro Te devote</span></i></a> • Vela • PE I","v":"vol. I (A)","r":[["#/r/29/60/1","Is 61, 1","-3a.6a.8b-9","El Señor me ha ungido y me ha enviado para dar la buena noticia a los pobres, y darles un perfume de fiesta."],["#/r/22/87","Sal 88","","Cantaré eternamente tus misericordias, Señor."],["#/r/72/0/5","Ap 1, 5","-8","Nos ha hecho reino y sacerdotes para Dios Padre."],["#/r/48/3/16","Lc 4, 16","-21","El Espíritu del Señor está sobre mí, porque él me ha ungido."],["#/r/1/11/1","Ex 12, 1","-8.11-14","Prescripciones sobre la cena pascual."],["#/r/22/114","Sal 115","","El cáliz de la bendición es comunión de la sangre de Cristo."],["#/r/52/10/23","1Co 11, 23","-26","Cada vez que coméis y bebéis, proclamáis la muerte del Señor."],["#/r/49/12/1","Jn 13, 1","-15","Los amó hasta el extremo."]],"ob":[]},"2026-04-03":{"o":169192,"t":"VIERNES SANTO EN LA PASIÓN DEL SEÑOR","b":[["Lecturas",775135]],"n":"Después de Oficios, quitar velos","v":"vol. I (A)","r":[["#/r/29/51/13","Is 52, 13","-53, 12","Él fue traspasado por nuestras rebeliones (Tercer cántico del Siervo del Señor)."],["#/r/22/29","Sal 30","","Padre, a tus manos encomiendo mi espíritu."],["#/r/64/3/14","Hb 4, 14","","-16; Hb 5, 7-9. Aprendió a obedecer; y se convirtió, para todos los que lo obedecen, en autor de salvación. Para la lectura de la historia de la Pasión del Señor no se llevan cirios ni incienso, ni se hace al principio la salutación habitual, ni se signa el libro. Esta lectura la proclama el diácono o, en su defecto, el mismo celebrante. Pero puede también ser proclamada por lectores laicos, reservando, si es posible, al sacerdote la parte correspondiente a Cristo. • Jn 18, 1-19, 42. Pasión de nuestro Señor Jesucristo."]],"ob":[]},"2026-04-04":{"o":173451,"t":"SÁBADO SANTO. VIGILIA PASCUAL EN LA NOCHE SANTA","b":[["Lecturas",809655]],"n":"Por la noche se pone agua bendita · Donde se han cubierto las imágenes, se descubren • PE I","v":"vol. I (A) Para la Vigilia pascual se proponen nueve lecturas: siete del antiguo Testamento y dos del nuevo. Si lo exigen las circunstancias, y por causas particulares, se puede disminuir el número de las lecturas asignadas. Ténganse al menos tres lecturas del antiguo Testamento y, en casos más urgentes, por lo menos dos, antes de la epístola y el evangelio. Nunca se omita la lectura del Éxodo sobre el paso del mar Rojo (tercera lectura).","r":[["#/r/0/0/1","1ª Gn 1, 1","-2, 2","Vio Dios todo lo que había hecho, y era muy bueno."],["#/r/22/102","Sal 103","","Envía tu espíritu, Señor, y repuebla la faz de la tierra, o bien: Sal 32. La misericordia del Señor llena la tierra."],["#/r/0/21/1","2ª Gn 22, 1","-18","El sacrificio de Abrahán, nuestro padre en la fe."],["#/r/22/14","Sal 15","","Protégeme, Dios mío, que me refugio en ti."],["#/r/1/13/15","3ª Ex 14, 15","-15, 1 a","Los hijos de Israel entraron en medio del mar, por lo seco."],["#/r/1/14/1","Salmo: Ex 15, 1","-18","Cantaré al Señor, gloriosa es su victoria."],["#/r/29/53/5","4ª Is 54, 5","-14","Con amor eterno te quiere el Señor, tu libertador."],["#/r/22/28","Sal 29","","Te ensalzaré, Señor, porque me has librado."],["#/r/29/54/1","5ª Is 55, 1","-11","Venid a mí y viviréis. Sellaré con vosotros una alianza perpetua."],["#/r/29/11/2","Salmo: Is 12, 2","-6","Sacaréis aguas con gozo de las fuentes de la salvación."],["#/r/31/2/9","6ª Ba 3, 9","-15.32-4, 4","Camina al resplandor del Señor."],["#/r/22/17","Sal 18","","Señor, tú tienes palabras de vida eterna."],["#/r/32/35/16","7ª Ez 36, 16","-17a.18-28","Derramaré sobre vosotros un agua pura, y os daré un corazón nuevo."],["#/r/22/40","Sal 41","","Como busca la cierva corrientes de agua, así mi alma te busca a ti, Dios mío. o bien: Sal 50. Oh, Dios, crea en mí un corazón puro."],["#/r/51/5/3","Rm 6, 3","-11","Cristo, una vez resucitado de entre los muertos, ya no muere más."],["#/r/22/116","Sal 117","","Aleluya, aleluya, aleluya."],["#/r/46/27/1","Mt 28, 1","-10","Ha resucitado y va por delante de vosotros a Galilea."]],"ob":[]},"2026-04-05":{"o":178793,"t":"+ DOMINGO DE PASCUA RESURRECCIÓN DEL SEÑOR","b":[["Lecturas",818924]],"n":"A • Se reza el <i><span>Regina Coeli</span></i> • <i><span>ExSo</span></i> • Flo • PE III","v":"vol. I (A)","r":[["#/r/50/9/34","Hch 10, 34","a. 37-43","Hemos comido y bebido con él después de su resurrección de entre los muertos."],["#/r/22/116","Sal 117","","Este es el día que hizo el Señor: sea nuestra alegría y nuestro gozo."],["#/r/57/2/1","Col 3, 1","-4","Buscad los bienes de allá arriba, donde está Cristo. o bien: 1Co 5, 6b-8. Barred la levadura vieja para ser una masa nueva."],["","Secuencia: Ofrezcan los cristianos…","",""],["#/r/49/19/1","Jn 20, 1","-9","Él había de resucitar de entre los muertos. o bien, en las Misas vespertinas: Lc 24, 13-35. Quédate con nosotros, porque atardece."]],"ob":[]},"2026-04-06":{"o":180793,"t":"LUNES DE LA OCTAVA DE PASCUA","b":[["Lectura continuada",825232]],"n":"D • Consumir viril • PE II","v":"vol. II","r":[["#/r/50/1/14","Hch 2, 14",".22-33","A este Jesús lo resucitó Dios, de lo cual todos nosotros somos testigos."],["#/r/22/14","Sal 15","","Protégeme, Dios mío, que me refugio en ti."],["","Secuencia (opcional): Ofrezcan los cristianos…","",""],["#/r/46/27/8","Mt 28, 8","-15","Comunicad a mis hermanos que vayan a Galilea; allí me verán."]],"ob":[]},"2026-04-07":{"o":181748,"t":"MARTES DE LA OCTAVA DE PASCUA","b":[[" "b-15","Nadie ha subido al cielo sino el que bajó del cielo, el Hijo del hombre."]],"ob":[]},"2026-04-15":{"o":189114,"t":"MIÉRCOLES DE LA II SEMANA DE PASCUA, feria","b":[["Lectura continuada",868242]],"n":"PE II","v":"vol. II","r":[["#/r/50/4/17","Hch 5, 17","-26","Mirad, los hombres que metisteis en la cárcel están en el templo, enseñando al pueblo."],["#/r/22/32","Sal 33","","El afligido invocó al Señor, y Él lo escuchó."],["#/r/49/2/1","Jn 3, 1","6-21","Dios envió a su Hijo para que el mundo se salve por él."]],"ob":[]},"2026-04-16":{"o":189615,"t":"JUEVES DE LA II SEMANA DE PASCUA, feria","b":[["Lectura continuada",873074]],"n":"<a href=\"#/d/Misal/25779\"><i><span>Adoro Te devote</span></i></a> • PE I","v":"vol. II","r":[["#/r/50/4/27","Hch 5, 27","-33","Testigos de esto somos nosotros y el Espíritu Santo."],["#/r/22/32","Sal 33","","El afligido invocó al Señor, y Él lo escuchó."],["#/r/49/2/31","Jn 3, 31","-36","El Padre ama al Hijo y todo lo ha puesto en su mano."]],"ob":[]},"2026-04-17":{"o":190045,"t":"VIERNES DE LA II SEMANA DE PASCUA, feria","b":[["Lectura continuada",876931]],"n":"PE II","v":"vol. II","r":[["#/r/50/4/34","Hch 5, 34","-42","Salieron contentos de haber merecido aquel ultraje por el Nombre."],["#/r/22/25","Sal 26","","Una cosa pido al Señor: habitar en su casa."],["#/r/49/5/1","Jn 6, 1","-15","Repartió a los que estaban sentados todo lo que quisieron."]],"ob":[]},"2026-04-18":{"o":190428,"t":"SÁBADO DE LA II SEMANA DE PASCUA, feria","b":[["Lectura continuada",882183]],"n":"Antífona <i><span>Ave Regina</span></i> Coelorum • Ant. <i><span>Regina coeli</span></i> • <i><span>ExSi</span></i> • PE III","v":"vol. II","r":[["#/r/50/5/1","Hch 6, 1","-7","Eligieron a siete hombres llenos del Espíritu Santo."],["#/r/22/31","Sal 32","","Que tu misericordia, Señor, venga sobre nosotros, como lo esperamos de ti."],["#/r/49/5/1","Jn 6, 1","6-21","Vieron a Jesús caminando sobre el mar."]],"ob":[]},"2026-04-19":{"o":190866,"t":"+ III DOMINGO DE PASCUA","b":[["Lecturas",4361464]],"n":"C • <a href=\"#/d/Misal/28484\"><i><span>Quicumque</span></i></a> • [Flo] • PE I","v":"vol. I (A)","r":[["#/r/50/1/14","Hch 2, 14",". 22-33","No era posible que la muerte lo retuviera bajo su dominio."],["#/r/22/14","Sal 15","","Señor, me enseñarás el sendero de la vida."],["#/r/66/0/17","1P 1, 17","-21","Fuisteis liberados con una sangre preciosa, como la de un cordero sin mancha, Cristo."],["#/r/48/23/13","Lc 24, 13","-35","Lo reconocieron al partir el pan."]],"ob":[]},"2026-04-20":{"o":192249,"t":"LUNES DE LA III SEMANA DE PASCUA, feria","b":[["Lectura continuada",887686]],"n":"PE II","v":"vol. II","r":[["#/r/50/5/8","Hch 6, 8","-15","No lograban hacer frente a la sabiduría y al espíritu con que hablaba."],["#/r/22/117","Sal 118","","Dichoso el que camina en la ley del Señor."],["#/r/49/5/22","Jn 6, 22","-29","Trabajad no por el alimento que perece, sino por el que perdura para la vida eterna."]],"ob":[]},"2026-04-21":{"o":192832,"t":"MARTES DE LA III SEMANA DE PASCUA, feria o SAN ANSELMO, obispo y doctor de la Iglesia, memoria libre","b":[["Lectura continuada",892246]],"n":"<a href=\"#/d/Misal/26712\"><i><span>Salmo 2</span></i></a> • PE I","v":"vol. II","r":[["#/r/50/6/51","Hch 7, 51","-8, 1a","Señor Jesús, recibe mi espíritu."],["#/r/22/29","Sal 30","","A tus manos, Señor, encomiendo mi espíritu."],["#/r/49/5/30","Jn 6, 30","-35","No fue Moisés, sino que es mi Padre el que da el verdadero pan del cielo."]],"ob":["o bien: cf. vol. IV."]},"2026-04-22":{"o":193505,"t":"MIÉRCOLES DE LA III SEMANA DE PASCUA, feria","b":[["Lectura continuada",896403]],"n":"Fallecimiento de la Abuela • PE I","v":"vol. II","r":[["#/r/50/7/1","Hch 8, 1","b-8","Iban de un lugar a otro anunciando la Buena Nueva de la Palabra."],["#/r/22/64","Sal 65","","Aclamad al Señor, tierra entera."],["#/r/49/5/35","Jn 6, 35","-40","Esta es la voluntad del Padre: que todo el que (verde) al Hijo tenga vida eterna."]],"ob":[]},"2026-04-23":{"o":194000,"t":"JUEVES DE LA III SEMANA DE PASCUA, feria o SAN JORGE, mártir, memoria libre o SAN ADALBERTO DE PRAGA, obispo y mártir, memoria libre","b":[["Lectura continuada",900208]],"n":"B • Primera Comunión de san Josemaría • <a href=\"#/d/Misal/25779\"><i><span>Adoro Te devote</span></i></a> • <i><span>ExSi</span></i> • Flo • PE I","v":"vol. II","r":[["#/r/50/7/26","Hch 8, 26","-40","Mira, agua. ¿Qué dificultad hay en que me bautice?"],["#/r/22/64","Sal 65","","Aclamad al Señor, tierra entera."],["#/r/49/5/44","Jn 6, 44","-51","Yo soy el pan vivo que ha bajado del cielo."]],"ob":["o bien: cf. vol. IV."]},"2026-04-24":{"o":195021,"t":"VIERNES DE LA III SEMANA DE PASCUA, feria o SAN FIDEL DE SIGMARINGA, presbítero y mártir, memoria libre","b":[["Lectura continuada",904766]],"n":"PE II","v":"vol. II","r":[["#/r/50/8/1","Hch 9, 1","-20","Ese hombre es un instrumento elegido por mí para llevar mi nombre a los pueblos."],["#/r/22/115","Sal 116","","Id al mundo entero y proclamad el Evangelio."],["#/r/49/5/52","Jn 6, 52","-59","Mi carne es verdadera comida, y mi sangre es verdadera bebida."]],"ob":["o bien: cf. vol. IV."]},"2026-04-25":{"o":195695,"t":"SÁBADO. SAN MARCOS, evangelista, fiesta","b":[["Lecturas",3708156]],"n":"C • Ant. <i><span>Regina coeli</span></i> •<i><span>ExSi</span></i> • [Flo] • PE III","v":"vol. IV","r":[["#/r/66/4/5","1P 5, 5","b-14","Os saluda Marcos, mi hijo."],["#/r/22/87","Sal 88","","Cantaré eternamente tus misericordias, Señor."],["#/r/47/15/15","Mc 16, 15","-20","Proclamad el Evangelio a toda la creación."]],"ob":[]},"2026-04-26":{"o":196156,"t":"+ IV DOMINGO DE PASCUA","b":[["Lecturas",4368091]],"n":"C • PE III","v":"vol. I (A)","r":[["#/r/50/1/14","Hch 2, 14","a. 36-41","Dios lo ha constituido Señor y Mesías."],["#/r/22/21","Sal 22","","El Señor es mi pastor, nada me falta."],["#/r/66/1/20","1P 2, 20","b-25","Os habéis convertido al pastor de vuestras almas."],["#/r/49/9/1","Jn 10, 1","-10","Yo soy la puerta de las ovejas."]],"ob":[]},"2026-04-27":{"o":197548,"t":"LUNES DE LA IV SEMANA DE PASCUA, feria","b":[["Lectura continuada",915690]],"n":"D • Nuestra Señora de Montserrat. Curación n Padre • PE II","v":"vol. II","r":[["#/r/50/10/1","Hch 11, 1","-18","Así pues, también a los gentiles les ha otorgado Dios la conversión que lleva a la vida."],["#/r/22/40","Sal 41","","Mi alma tiene sed de ti, Dios vivo."],["#/r/49/9/1","Jn 10, 1","-10","Yo soy la puerta de las ovejas."]],"ob":[]},"2026-04-28":{"o":198014,"t":"MARTES DE LA IV SEMANA DE PASCUA, feria o SAN PEDRO CHANEL, presbítero y mártir, o SAN LUIS MARÍA GRIGNION DE MONTFORT, presbítero","b":[["Lectura continuada",921060]],"n":"<a href=\"#/d/Misal/26712\"><i><span>Salmo 2</span></i></a> • PE I","v":"vol. II","r":[["#/r/50/10/1","Hch 11, 1","9-26","Se pusieron a hablar a los griegos, anunciándoles la Buena Nueva del Señor Jesús."],["#/r/22/85","Sal 86","","Alabad al Señor todas las naciones."],["#/r/49/9/22","Jn 10, 22","-30","Yo y el Padre somos uno."]],"ob":["o bien: cf. vol. IV."]},"2026-04-29":{"o":198937,"t":"MIÉRCOLES. SANTA CATALINA DE SIENA, virgen y doctora de la Iglesia, patrona de Europa, fiesta","b":[["Lecturas",3720282]],"n":"C • PE III","v":"vol. IV","r":[["#/r/68/0/5","1Jn 1, 5","-2,2","La sangre de Jesús nos limpia de todo pecado"],["#/r/22/101","Sal 102","","Bendice alma mía al Señor."],["#/r/46/10/25","Mt 11, 25","-30","Has escondido estas cosas a los sabios, y las has revelado a los pequeños."]],"ob":[]},"2026-04-30":{"o":199397,"t":"JUEVES DE LA IV SEMANA DE PASCUA, feria o SAN PÍO V, papa, memoria libre","b":[["Lectura continuada",929375]],"n":"<a href=\"#/d/Misal/25779\"><i><span>Adoro Te devote</span></i></a> • Vela • PE I","v":"vol. II","r":[["#/r/50/12/13","Hch 13, 13","-25","Dios sacó de la descendencia de David un salvador: Jesús."],["#/r/22/87","Sal 88","","Cantaré eternamente tus misericordias, Señor."],["#/r/49/12/1","Jn 13, 1","6-20","El que recibe a quien yo envíe me recibe a mí."]],"ob":["o bien: cf. vol. IV."]},"2026-05-01":{"o":199992,"t":"V s y os convirtáis al Dios vivo."],["#/r/22/112","Sal 113","","No a nosotros, Señor, sino a tu nombre da la gloria."],["#/r/49/13/21","Jn 14, 21","-26","El Paráclito, que enviará el Padre, será quien os lo enseñe todo."]],"ob":[]},"2026-05-05":{"o":203126,"t":"MARTES DE LA V SEMANA DE PASCUA, feria","b":[["Lectura continuada",949034]],"n":"<a href=\"#/d/Misal/26712\"><i><span>Salmo 2</span></i></a> • Flo • PE I","v":"vol. II","r":[["#/r/50/13/19","Hch 14, 19","-28","Contaron a la Iglesia lo que Dios había hecho por medio de ellos."],["#/r/22/143","Sal 144","","Tus amigos, Señor, proclaman la gloria de tu reinado."],["#/r/49/13/27","Jn 14, 27","-31a","Mi paz os doy."]],"ob":[]},"2026-05-06":{"o":203493,"t":"MIÉRCOLES DE LA V SEMANA DE PASCUA, feria","b":[["Lectura continuada",953192]],"n":"Flo • PE II","v":"vol. II","r":[["#/r/50/14/1","Hch 15, 1","-6","Se decidió que subieran a Jerusalén a consultar a los apóstoles y presbíteros sobre esta controversia."],["#/r/22/120","Sal 121","","Vamos alegres a la casa del Señor."],["#/r/49/14/1","Jn 15, 1","-8","El que permanece en mí y yo en él, ese da fruto abundante."]],"ob":[]},"2026-05-07":{"o":203911,"t":"JUEVES DE LA V SEMANA DE PASCUA, feria","b":[["Lectura continuada",957289]],"n":"<a href=\"#/d/Misal/25779\"><i><span>Adoro Te devote</span></i></a> • Flo • PE I","v":"vol. II","r":[["#/r/50/14/7","Hch 15, 7","-21","A mi parecer, no hay que molestar a los gentiles que se convierten a Dios."],["#/r/22/94","Sal 95","","Contad las maravillas del Señor a todas las naciones."],["#/r/49/14/9","Jn 15, 9","-11","Permaneced en mi amor para que vuestra alegría llegue a plenitud."]],"ob":[]},"2026-05-08":{"o":204375,"t":"VIERNES DE LA V SEMANA DE PASCUA, feria","b":[["Lectura continuada",961824]],"n":"B • Elección del Papa • ExSi • Flo • PE III","v":"vol. II","r":[["#/r/50/14/22","Hch 15, 22","-31","Hemos decidido, el Espíritu Santo y nosotros, no imponeros más cargas que las indispensables."],["#/r/22/55","Sal 56","","Te daré gracias ante los pueblos, Señor."],["#/r/49/14/1","Jn 15, 1","2-17","Esto os mando: que os améis unos a otros."]],"ob":[]},"2026-05-09":{"o":204858,"t":"SÁBADO DE LA V SEMANA DE PASCUA, feria","b":[["Lectura continuada",966050]],"n":"Antífona <i><span>Regina coeli</span></i> • <i><span>ExSi</span></i> • Flo • PE III","v":"vol. II","r":[["#/r/50/15/1","Hch 16, 1","-10","Pasa a Macedonia y ayúdanos."],["#/r/22/98","Sal 99","","Aclama al Señor, tierra entera."],["#/r/49/14/1","Jn 15, 1","8-21","No sois del mundo, sino que yo os he escogido sacándoos del mundo."]],"ob":[]},"2026-05-10":{"o":205238,"t":"+ VI DOMINGO DE PASCUA","b":[["Lecturas",4377293]],"n":"C • Flo • PE I","v":"vol. I (A)","r":[["#/r/50/7/5","Hch 8, 5","-8. 14-17","Les imponían las manos y recibían el Espíritu Santo."],["#/r/22/64","Sal 65","","Aclamad al Señor, tierra entera."],["#/r/66/2/15","1P 3, 15","-18","Muerto en la carne pero vivificado en el Espíritu."],["#/r/49/13/1","Jn 14, 1","5-21","Le pediré al Padre que os dé otro Paráclito."]],"ob":[]},"2026-05-11":{"o":206373,"t":"LUNES DE LA VI SEMANA DE PASCUA, feria","b":[["Lectura continuada",971070]],"n":"Flo • PE II","v":"vol. II","r":[["#/r/50/15/1","Hch 16, 1","1-15","El Señor le abrió el corazón para que aceptara lo que decía Pablo."],["#/r/22/148","Sal 149","","El Señor ama a su pueblo."],["#/r/49/14/26","Jn 15, 26","-16, 4a","El Espíritu de la verdad dará testimonio de mí."]],"ob":[]},"2026-05-12":{"o":206836,"t":"MARTES DE LA VI SEMANA DE PASCUA, feria o SANTOS NEREO Y AQUILES, mártires, memoria libre o SAN PANCRACIO, mártir, memoria libre","b":[["Lectura continuada",974707]],"n":"B • <a href=\"#/d/Misal/1099856\"><i><span>Beato Álvaro</span></i></a> del Portillo (MO) • <a href=\"#/d/Misal/26712\"><i><span>Salmo 2</span></i></a> • <i><span>ExSi</span></i> • Flo • PE I","v":"vol. II","r":[["#/r/50/15/22","Hch 16, 22","-34","Cree en el Señor Jesús y te salvarás tú y tu familia."],["#/r/22/136","Sal 137","","Tu derecha me salva, Señor."],["#/r/49/1  del mundo."],["#/r/49/15/23","Jn 16, 23","b-28","El Padre os quiere porque vosotros me queréis y creéis."]],"ob":[]},"2026-05-17":{"o":210029,"t":"+ VII DOMINGO DE PASCUA. ASCENSIÓN DEL SEÑOR, solemnidad","b":[["Vigilia",996535]],"n":"A • Beatificación de san Josemaría • <i><span>ExSo</span></i> • Flo • <a href=\"#/d/Misal/28484\"><i><span>Quicumque</span></i></a> • <i><span>Decenario</span></i> al Espíritu Santo 3 • PE III","v":"vol. I (A)","r":[["#/r/50/0/1","Hch 1, 1","-11","A la vista de ellos, fue elevado al cielo."],["#/r/22/45","Sal 46","","Dios asciende entre aclamaciones; el Señor, al son de trompetas."],["#/r/55/0/17","Ef 1, 17","-23","Lo sentó a su derecha en el cielo."],["#/r/46/27/1","Mt 28, 1","6-20","Se me ha dado todo poder en el cielo y en la tierra."]],"ob":[]},"2026-05-18":{"o":211892,"t":"LUNES DE LA VII SEMANA DE PASCUA, feria o SAN JUAN I, papa y mártir, memoria libre","b":[["Lectura continuada",1007923]],"n":"C • Beata Guadalupe Ortíz de Landázuri (ML) • Consumir viril • <i><span>Decenario</span></i> 4 • [Flo]","v":"vol. II","r":[["#/r/50/18/1","Hch 19, 1","-8","¿Recibisteis el Espíritu Santo al aceptar la fe?"],["#/r/22/66","Sal 67","","Reyes de la tierra, cantad a Dios."],["#/r/49/15/29","Jn 16, 29","-33","Tened valor: yo he vencido al mundo."]],"ob":["o bien: cf. vol. IV."]},"2026-05-19":{"o":212762,"t":"MARTES DE LA VII SEMANA DE PASCUA, feria","b":[["Lectura continuada",1011629]],"n":"<a href=\"#/d/Misal/26712\"><i><span>Salmo 2</span></i></a> • <i><span>Decenario</span></i> 5 • Flo • PE I","v":"vol. II","r":[["#/r/50/19/17","Hch 20, 17","-27","Completo mi carrera y consumo el ministerio que recibí del Señor Jesús."],["#/r/22/66","Sal 67","","Reyes de la tierra, cantad a Dios."],["#/r/49/16/1","Jn 17, 1","-11 a","Padre, glorifica a tu Hijo."]],"ob":[]},"2026-05-20":{"o":213202,"t":"MIÉRCOLES DE LA VII SEMANA DE PASCUA, feria o SAN BERNARDINO DE SIENA, presbítero, m. libre","b":[["Lectura continuada",1016159]],"n":"<i><span>Decenario</spa []},"2026-05-24":{"o":215993,"t":"+ DOMINGO DE PENTECOSTÉS, solemnidad","b":[["Vigilia de Pentecostés",1033660]],"n":"A • Consagración • <i><span>ExSo</span></i> • Flo • <i><span>Decenario</span></i> 10 • PE III","v":"vol. I (A)","r":[["#/r/0/10/1","Gn 11, 1","-9","Se llama Babel, porque allí confundió el Señor la lengua de toda la tierra."],["#/r/22/31","Sal 32","","Dichoso el pueblo que el Señor se escogió como heredad."],["#/r/1/18/3","Ex 19, 3","-8a. 16-20b","El Señor bajó al monte Sinaí a la vista del pueblo."],["#/r/33/2/52","Cántico: Dn 3, 52","-56","A ti, gloria y alabanza por los siglos. O bien: Sal 18, 8-11. Señor, tú tienes palabras de vida eterna."],["#/r/32/36/1","Ez 37, 1","-14","Huesos secos, traeré sobre vosotros espíritu, y viviréis."],["#/r/22/105","Sal 106","","Dad gracias al Señor, porque es eterna tu misericordia."],["#/r/35/2/1","Jl 3, 1","-5","Sobre mis siervos y siervas derramaré mi Espíritu."],["#/r/22/102","Sal 103","","Envía tu Espíritu, Señor, y repuebla la faz de la tierra."],["#/r/51/7/22","Rm 8, 22","-27","El Espíritu intercede con gemidos inefables."],["#/r/49/0/37","Jn 1, 37","-39","Manarán torrentes de agua viva."],["#/r/50/1/1","Hch 2, 1","-11","Se llenaron todos de Espíritu Santo y empezaron a hablar."],["#/r/22/102","Sal 103","","Envía tu Espíritu, Señor, y repuebla la faz de la tierra."],["#/r/52/11/3","1Co 12, 3","b-7. 12-13","Hemos sido bautizados en un mismo espíritu, para formar un solo cuerpo. O bien: Rm 8, 8-17. Los que se dejan llevar por el Espíritu de Dios, esos son hijos de Dios."],["","Secuencia: Ven, Espíritu divino..","",""],["#/r/49/19/1","Jn 20, 1","9-23","Como el Padre me ha enviado, así también os envío yo. Recibid el Espíritu Santo. O bien: Jn 14, 15-16. 23b-26. El Espíritu Santo os lo enseñará todo."]],"ob":[]},"2026-05-25":{"o":219679,"t":"LUNES. BIENAVENTURADA VIRGEN MARÍA, MADRE DE LA IGLESIA, memoria obligatoria","b":[["Lecturas",3256020]],"n":"C • Se reza el <i><span>Ángelus</span></i> • Consumir viril • [Flo] • PE II","v":"vol. IV","r":[["#/r/0/2/9","Gn 3, 9","-15","Pongo hostilidad entre tu descendencia y la descendencia de la mujer. O bien: Hch 1, 12-14. Todos se dedicaban a la oración con María, la madre de Jesús."],["#/r/22/85","Sal 86","","De ti se dicen maravillas, ciudad de Dios."],["#/r/49/18/25","Jn 19, 25","-34","Ahí tienes a tu hijo. Ahí tienes a tu madre."]],"ob":[]},"2026-05-26":{"o":220557,"t":"MARTES. SAN FELIPE NERI, presbítero, memoria obligatoria","b":[["Lectura continuada",2204284]],"n":"<a href=\"#/d/Misal/26712\"><i><span>Salmo 2</span></i></a> • Flo • PE III","v":"vol. III (par)","r":[["#/r/66/0/10","1P 1, 10","-16","Profetizaron sobre la gracia destinada a vosotros, por eso, manteniéndoos sobrios, confiad plenamente."],["#/r/22/96","Sal 97","","El Señor da a conocer su salvación."],["#/r/47/9/28","Mc 10, 28","-31","Recibiréis en este tiempo cien veces más, con persecuciones, y en la edad futura, vida eterna."]],"ob":[]},"2026-05-27":{"o":221063,"t":"MIÉRCOLES DE LA VIII SEMANA DEL TIEMPO ORDINARIO, feria o SAN AGUSTÍN DE CANTERBURY, obispo, memoria libre","b":[["Lectura continuada",2207245]],"n":"Flo • PE II","v":"vol. III (par)","r":[["#/r/66/0/18","1P 1, 18","-25","Fuisteis liberados con una sangre preciosa, como la de un cordero sin mancha, Cristo."],["#/r/22/146","Sal 147","","Glorifica al Señor, Jerusalén."],["#/r/47/9/32","Mc 10, 32","-45","Mirad, estamos subiendo a Jerusalén, y el Hijo del hombre va a ser entregado."]],"ob":["o bien: cf. vol. IV."]},"2026-05-28":{"o":221732,"t":"JUEVES. NUESTRO SEÑOR JESUCRISTO, SUMO Y ETERNO SACERDOTE, fiesta","b":[["Lecturas",2933951]],"n":"C • <a href=\"#/d/Misal/25779\"><i><span>Adoro Te devote</span></i></a> • [Flo] • PE III","v":"vol. IV","r":[["#/r/0/21/9","Gn 22, 9","-18","El sacrificio de Abrahán, nuestro padre en la fe."],["#/r/22/39","Sal 40","","Aquí estoy, Señor, para hacer tu voluntad."],["#/r/46/25/36","Mt 26, 36","-42","Mi alma está triste hasta la muerte."]],"ob":[]},"2026-05-29":{"o": El que no carga con la cruz no es digno de mí. El que os recibe a vosotros, me recibe a mí."]],"ob":[]},"2026-06-29":{"o":247017,"t":"LUNES. SANTOS PEDRO Y PABLO, apóstoles, solemnidad","b":[["Lecturas",3867891]],"n":"B • Ip • <i><span>ExSi</span></i> • Flo • PE I","v":"vol. IV","r":[["#/r/50/2/1","Hch 3, 1","-10","Te doy lo que tengo: en nombre de Jesús, levántate y anda."],["#/r/22/17","Sal 18","","Toda la tierra alcanza su pregón."],["#/r/54/0/11","Ga 1, 11","-20","Dios me escogió desde el seno de mi madre."],["#/r/49/20/1","Jn 21, 1","5-19","Apacienta mis corderos, pastorea mis ovejas."],["#/r/50/11/1","Hch 12, 1","-11","Ahora sé realmente que el Señor me ha librado de las manos de Herodes."],["#/r/22/32","Sal 33","","El Señor me libró de todas mis ansias."],["#/r/61/3/6","2Tm 4, 6","-8.17-18","Me está reservada la corona de la justicia."],["#/r/46/15/13","Mt 16, 13","-19","Tú eres Pedro, y te daré las llaves del reino de los cielos."]],"ob":[]},"2026-06-30":{"o":249043,"t":"MARTES DE LA XIII SEMANA DEL TIEMPO ORDINARIO, feria o SANTOS PROTOMÁRTIRES DE LA IGLESIA DE ROMA, memoria libre","b":[["Lectura continuada",2313757]],"n":"<a href=\"#/d/Misal/26712\"><i><span>Salmo 2</span></i></a> • PE I","v":"vol. III (par)","r":[["#/r/36/2/1","Am 3, 1","","-8; 4, 11-12. Habla el Señor, ¿quién no profetiza?"],["#/r/22/4","Sal 5","","Señor, guíame con tu justicia."],["#/r/46/7/23","Mt 8, 23","-27","Se puso en pie, increpó a los vientos y al lago, y vino una gran calma."]],"ob":["o bien: cf. vol. IV."]},"2026-07-01":{"o":249685,"t":"MIÉRCOLES DE LA XIII SEMANA DEL TIEMPO ORDINARIO, feria","b":[["Lectura continuada",2316485]],"n":"(morado) <a href=\"#/d/Misal/3531918\"><i><span>Difuntos</span></i></a> • PE II","v":"vol. III (par)","r":[["#/r/36/4/14","Am 5, 14","-15.21-24","Aparta de mí el estrépito de tus canciones, y fluya la justicia como arroyo perenne."],["#/r/22/48","Sal 49","","Al que sigue buen camino le haré ver la salvación de Dios."],["#/r/46/7/28","Mt 8, 28","-34","¿Has venido aquí a atormentar a los demonios antes de tiempo?"]],"ob":[]},"2026-07-02":{"o":250167,"t":"JUEVES DE LA XIII SEMANA DEL TIEMPO ORDINARIO, feria","b":[["Lectura continuada",2319974]],"n":"<a href=\"#/d/Misal/25779\"><i><span>Adoro Te devote</span></i></a> • Vela • (blanco) <a href=\"#/d/Misal/1131583\"><i><span>S Josemaría</span></i></a> • PE I","v":"vol. III (par)","r":[["#/r/36/6/10","Am 7, 10","-17","Ve, profetiza a mi pueblo."],["#/r/22/17","Sal 18","","Los mandamientos del Señor son verdaderos y enteramente justos."],["#/r/46/8/1","Mt 9, 1","-8","La gente alababa a Dios, que da a los hombres tal potestad."]],"ob":[]},"2026-07-03":{"o":250610,"t":"VIERNES. SANTO TOMÁS, apóstol, fiesta","b":[["Lecturas",3876230]],"n":"C • Limpiar sagrario • [Flo] • PE I","v":"vol. IV","r":[["#/r/55/1/19","Ef 2, 19","-22","Estáis edificados sobre el cimiento de los apóstoles."],["#/r/22/115","Sal 116","","Id al mundo entero y proclamad el Evangelio."],["#/r/49/19/24","Jn 20, 24","-29","¡Señor mío y Dios mío!"]],"ob":[]},"2026-07-04":{"o":251083,"t":"SÁBADO DE LA XIII SEMANA DEL TIEMPO ORDINARIO, feria o SANTA ISABEL DE PORTUGAL, memoria libre o SANTA MARÍA EN SÁBADO, memoria libre","b":[["Lectura continuada",2327085]],"n":"Antífona <i><span>Salve</span></i> Regina • <i><span>ExSi</span></i> • (blanco) <a href=\"#/d/Misal/3325443\"><i><span>Virgen</span></i></a> • PE II","v":"vol. III (par)","r":[["#/r/36/8/11","Am 9, 11","-15","Repatriaré a los desterrados de mi pueblo y los plantaré en su tierra."],["#/r/22/83","Sal 84","","Dios anuncia la paz a su pueblo."],["#/r/46/8/14","Mt 9, 14","-17","¿Es que pueden guardar luto mientras el esposo está con ellos?"]],"ob":["o bien: cf. vol. IV.","o bien cf. Leccionario de las «Misas de la Virgen María»."]},"2026-07-05":{"o":251878,"t":"+ DOMINGO XIV DEL TIEMPO ORDINARIO","b":[["Lecturas",2849017]],"n":"C • PE IV","v":"vol. I (A)","r":[["#/r/44/8/9","Za 9, 9","-10","Mira a tu rey que viene a ti pobre."],["#/r/22/143","Sal 144","","Bendeciré tu nombre por siempre, Dios mío, mi rey."],["#/r/51/7/9","Rm 8, 9",". 11-13","Si con el Espíritu dais muerte a las obras del cuerpo, viviréis."],["#/r/46/10/25","Mt 11, 25","-30","Soy manso y humilde de corazón."]],"ob":[]},"2026-07-06":{"o":253051,"t":"LUNES DE LA XIV SEMANA DEL TIEMPO ORDINARIO, feria o SANTA MARÍA GORETTI, virgen y mártir, memoria libre","b":[["Lectura continuada",2329885]],"n":"PE II","v":"vol. III (par)","r":[["#/r/34/1/16","Os 2, 16",".17b-18.21-22","Me desposaré contigo para siempre."],["#/r/22/143","Sal 144","","El Señor es clemente y misericordioso."],["#/r/46/8/1","Mt 9, 1","8-26","Mi hija acaba de morir, pero ven tú y vivirá."]],"ob":["o bien: cf. vol. IV."]},"2026-07-07":{"o":253782,"t":"MARTES DE LA XIV SEMANA DEL TIEMPO ORDINARIO, feria","b":[["Lectura continuada",2332661]],"n":"<a href=\"#/d/Misal/26712\"><i><span>Salmo 2</span></i></a> • (morado) <a href=\"#/d/Misal/3531918\"><i><span>Difuntos</span></i></a> • PE I","v":"vol. III (par)","r":[["#/r/34/7/4","Os 8, 4","-7.11-13","Siembran viento, cosecharán tempestades."],["#/r/22/112","Sal 113","","Israel confía en el Señor."],["#/r/46/8/32","Mt 9, 32","-38","La mies es abundante, pero los trabajadores son pocos."]],"ob":[]},"2026-07-08":{"o":254230,"t":"MIÉRCOLES DE LA XIV SEMANA DEL TIEMPO ORDINARIO, feria","b":[["Lectura continuada",2335600]],"n":"(blanco) <a href=\"#/d/Misal/1131583\"><i><span>S Josemaría</span></i></a> • PE II","v":"vol. III (par)","r":[["#/r/34/9/1","Os 10, 1","-3.7-8.12","Es tiempo de consultar al Señor."],["#/r/22/103","Sal 104","","Buscad continuamente el rostro del Señor."],["#/r/46/9/1","Mt 10, 1","-7","Id a las ovejas descarriadas de Israel."]],"ob":[]},"2026-07-09":{"o":254662,"t":"JUEVES DE LA XIV SEMANA DEL TIEMPO ORDINARIO, feria o SANTOS AGUSTÍN ZHAO RONG, presbítero, y compañeros, mártires, memoria libre","b":[["Lectura continuada",2338282]],"n":"<a href=\"#/d/Misal/25779\"><i><span>Adoro Te devote</span></i></a> • PE I","v":"vol. III (par)","r":[["#/r/34/10/1","Os 11, 1","-4.8c-9","Mi corazón está perturbado."],["#/r/22/78","Sal 79","","Que brille tu rostro, Señor, y nos salve."],["#/r/46/9/7","Mt 10, 7","-15","Gratis habéis recibido, dad gratis."]],"ob":["o bien: cf. vol. IV."]},"2026-07-10":{"o":255327,"t":"VIERNES DE LA XIV SEMANA DEL TIEMPO ORDINARIO, feria","b":[["Lectura continuada",2340882]],"n":"PE D1 • (verde) <a href=\"#/d/Misal/3433725\"><i><span>Por la Iglesia local</span></i></a>","v":"vol. III (par)","r":[["#/r/34/13/2","Os 14, 2","-10","No llamaremos ya «nuestro Dios» a la obra de nuestras manos."],["#/r/22/49","Sal 50","","Mi boca proclamará tu alabanza."],["#/r/46/9/1","Mt 10, 1","6-23","No seréis vosotros los que habléis, sino el Espíritu de vuestro Padre."]],"ob":[]},"2026-07-11":{"o":255844,"t":"SÁBADO. SAN BENITO, abad, patrono de Europa, fiesta","b":[["Lecturas",3891022]],"n":"C • Ant. <i><span>Salve</span></i> Regina • <i><span>ExSi</span></i> • [Flo] • PE III","v":"vol. IV","r":[["#/r/25/1/1","Pr 2, 1","-9","Abre tu mente a la prudencia."],["#/r/22/32","Sal 33","","Bendigo al Señor en todo momento, o bien: Gustad y ved qué bueno es el Señor."],["#/r/46/18/27","Mt 19, 27","-29","Vosotros, los que me habéis seguido, recibiréis cien veces más."]],"ob":[]},"2026-07-12":{"o":256412,"t":"+ DOMINGO XV DEL TIEMPO ORDINARIO","b":[["Lecturas",2852495]],"n":"C • PE I","v":"vol. I (A)","r":[["#/r/29/54/10","Is 55, 10","-11","La lluvia hace germinar la tierra."],["#/r/22/63","Sal 64","","La semilla cayó en tierra buena, y dio fruto."],["#/r/51/7/18","Rm 8, 18","-23","La creación, expectante, está aguardando la manifestación de los hijos de Dios."],["#/r/46/12/1","Mt 13, 1","-23","Salió el sembrador a sembrar."]],"ob":[]},"2026-07-13":{"o":257620,"t":"LUNES DE LA XV SEMANA DEL TIEMPO ORDINARIO, feria o SAN ENRIQUE, memoria libre","b":[["Lectura continuada",2348013]],"n":"PE II","v":"vol. III (par)","r":[["#/r/29/0/10","Is 1, 10","-17","Lavaos, apartad de mi vista vuestras malas acciones."],["#/r/22/48","Sal 49","","Al que sigue buen camino le haré ver la salvación de Dios."],["#/r/46/9/34","Mt 10, 34","-11, 1","No he venido a sembrar paz, sino espada."]],"ob":["o bien: cf. vol. IV."]},"2026-07-14":{"o":258211,"t":"MARTES DE LA XV SEMANA DEL TIEMPO ORDINARIO, feria o SAN CAMILO DE LELIS, presbítero, memoria libre","b":[["Lectura continuada",2351687]],"n":"<a href=\"#/d/Misal/26712\"><i><span>Salmo 2</span></i></a> • PE I","v":"vol. III (par)","r":[["#/r/29/6/1","Is 7, 1","-9","Si no creéis no subsistiréis."],["#/r/22/46","Sal 47","","Dios ha fundado su ciudad para siempre."],["#/r/46/10/20","Mt 11, 20","-24","El día del juicio les será más llevadero a Tiro, a Sidón y a Sodoma que a vosotras."]],"ob":["o bien: cf. vol. IV."]},"2026-07-15":{"o":258897,"t":"MIÉRCOLES. SAN BUENAVENTURA, obispo y doctor de la Iglesia, memoria obligatoria","b":[["Lectura continuada",2354983]],"n":"PE III","v":"vol. III (par)","r":[["#/r/29/9/5","Is 10, 5","-7.13-16","¿Se enorgullece el hacha contra quien corta con ella?"],["#/r/22/92","Sal 93","","El Señor no rechaza a su pueblo."],["#/r/46/10/25","Mt 11, 25","-27","Has escondido estas cosas a los sabios y se las has revelado a los pequeños."]],"ob":[]},"2026-07-16":{"o":259454,"t":"JUEVES. B. VIRGEN MARÍA DEL MONTE CARMELO, memoria obligatoria","b":[["Lectura continuada",2358017]],"n":"C • Ip • Santo de Tía Carmen • <a href=\"#/d/Misal/25779\"><i><span>Adoro Te devote</span></i></a> • [Flo] • PE III","v":"vol. III (par)","r":[["#/r/29/25/7","Is 26, 7","-9.12.16-19","Despertarán jubilosos los que habitan en el polvo."],["#/r/22/100","Sal 101","","El Señor desde el cielo se ha fijado en la tierra."],["#/r/46/10/28","Mt 11, 28","-30","Soy manso y humilde de corazón."]],"ob":[]},"2026-07-17":{"o":260178,"t":"VIERNES DE LA XV SEMANA DEL TIEMPO ORDINARIO, feria","b":[["Lectura continuada",2360824]],"n":"(blanco) <a href=\"#/d/Misal/1131583\"><i><span>S Josemaría</span></i></a> • PE II","v":"vol. III (par)","r":[["#/r/29/37/1","Is 38, 1","-6.21-22.7-8","He escuchado tu plegaria y visto tus lágrimas."],["#/r/29/37/1","Salmo: Is 38, 1","0-16","Tú, Señor, detuviste mi alma para que no pereciese."],["#/r/46/11/1","Mt 12, 1","-8","El Hijo del hombre es señor del sábado."]],"ob":[]},"2026-07-18":{"o":260607,"t":"SÁBADO DE LA XV SEMANA DEL TIEMPO ORDINARIO, feria o SANTA MARÍA EN SÁBADO, memoria libre","b":[["Lectura continuada",2364338]],"n":"Antífona <i><span>Salve</span></i> Regina • <i><span>ExSi</span></i> • (blanco) <a href=\"#/d/Misal/3325443\"><i><span>Virgen</span></i></a> • PE I","v":"vol. III (par)","r":[["#/r/39/1/1","Mi 2, 1","-5","Desean los campos y se apoderan de las casas."],["#/r/22/8","Sal 9","","No te olvides de los humildes, Señor."],["#/r/46/11/1","Mt 12, 1","4-21","Les mandó que no lo descubrieran. Así se cumplió lo dicho por el profeta."]],"ob":["o bien cf. Leccionario de las «Misas de la Virgen María»."]},"2026-07-19":{"o":261307,"t":"+ DOMINGO XVI DEL TIEMPO ORDINARIO","b":[["Lecturas",2855958]],"n":"C • <a href=\"#/d/Misal/28484\"><i><span>Quicumque</span></i></a> • [Flo] • PE III","v":"vol. I (A)","r":[["#/r/27/11/13","Sb 12, 13",". 16-19","Concedes el arrepentimiento a los pecadores."],["#/r/22/84","Sal 85","","Tú, Señor, eres bueno y clemente."],["#/r/51/7/26","Rm 8, 26","-27","El Espíritu intercede por nosotros con gemidos inefables."],["#/r/46/12/24","Mt 13, 24","-43","Dejadlos crecer juntos hasta la siega."]],"ob":[]},"2026-07-20":{"o":262507,"t":"LUNES DE LA XVI SEMANA DEL TIEMPO ORDINARIO, feria o SAN APOLINAR, obispo y mártir, memoria libre","b":[["Lectura continuada",2367398]],"n":"Ip • PE II","v":"vol. III (par)","r":[["#/r/39/5/1","Mi 6, 1","-4.6-8","Hombre se te ha hecho saber lo que el Señor quiere de ti."],["#/r/22/48","Sal 49","","Al que sigue el buen camino le haré ver la salvación de Dios"],["#/r/46/11/38","Mt 12, 38","-42","Cuando juzguen a esta generación, la reina del Sur se levantará."]],"ob":["o bien: cf. vol. IV."]},"2026-07-21":{"o":263252,"t":"MARTES DE LA XVI SEMANA DEL TIEMPO ORDINARIO, feria o SAN LORENZO DE BRINDISI, presbítero y doctor de la Iglesia, memoria libre","b":[["Lectura continuada",2370858]],"n":"<a href=\"#/d/Misal/26712\"><i><span>Salmo 2</span></i></a> • PE I","v":"vol. III (par)","r":[["#/r/39/6/14","Mi 7, 14","-15.18-20","Arrojará nuestros pecados a lo hondo del mar."],["#/r/22/83","Sal 84","","Muéstranos, Señor, tu misericordia."],["#/r/46/11/46","Mt 12, 46","-50","Extendiendo su mano hacia sus discípulos, dijo: «Estos son mi madre y mis hermanos»."]],"ob":["o bien: cf. vol. IV."]},"2026-07-22":{"o":263941,"t":"MIÉRCOLES. SANTA MARÍA MAGDALENA, fiesta","b":[["Lecturas",3914730]],"n":"C • PE III","v":"vol. IV","r":[["#/r/23/2/1","Ct 3, 1","-4a","Encontré al amor de mi alma. o bien: 2Co 5, 14-17: Ahora ya no conocemos a Cristo según la carne"],["#/r/22/61","Sal 62","","Mi alma está sedienta de ti, mi Dios."],["#/r/49/19/1","Jn 20, 1",". 11-18","Mujer, ¿por qué lloras?, ¿a quién buscas?"]],"ob":[]},"2026-07-23":{"o":264481,"t":"JUEVES. SANTA BRÍGIDA, religiosa, patrona de Europa, fiesta","b":[["Lecturas",3917981]],"n":"C • <a href=\"#/d/Misal/25779\"><i><span>Adoro Te devote</span></i></a> • [Flo] • PE III","v":"vol. IV","r":[["#/r/54/1/19","Ga 2, 19","-20","Vivo, pero no soy yo el que vive, es Cristo quien vive en mí."],["#/r/22/32","Sal 33","","Bendigo al Señor en todo momento, o bien: Gustad y ved qué bueno es el Señor."],["#/r/49/14/1","Jn 15, 1","-8","El que permanece en mí y yo en él, ese da fruto abundante."]],"ob":[]},"2026-07-24":{"o":265147,"t":"VIERNES DE LA XVI SEMANA DEL TIEMPO ORDINARIO, feria o SAN SARBELIO MAKHLÛF, presbítero, memoria libre","b":[["Lectura continuada",2379718]],"n":"PE II","v":"vol. III (par)","r":[["#/r/30/2/14","Jr 3, 14","-17","Os daré pastores, según mi corazón; y todas las naciones se incorporarán a Jerusalén."],["#/r/30/30/10","Salmo: Jr 31, 10","-13","El Señor nos guardará como un pastor a su rebaño."],["#/r/46/12/1","Mt 13, 1","8-23","El que escucha la palabra y la entiende, ese da fruto."]],"ob":["o bien: cf. vol. IV."]},"2026-07-25":{"o":265868,"t":"+ SÁBADO. SANTIAGO, APÓSTOL, patrono de España, solemnidad","b":[["Lecturas",3923884]],"n":"B • Ant. <i><span>Salve</span></i> Regina • <i><span>ExSi</span></i> • Flo • PE I","v":"vol. IV","r":[["#/r/50/3/33","Hch 4, 33","","; Hch 5, 12.27-33; Hch 12, 2. El rey Herodes hizo pasar a cuchillo a Santiago."],["#/r/22/65","Sal 66","","Oh, Dios, que te alaben los pueblos, que todos los pueblos te alaben."],["#/r/53/3/7","2Co 4, 7","-15","Llevamos siempre y en todas partes en el cuerpo la muerte de Jesús."],["#/r/46/19/20","Mt 20, 20","-28","Mi cáliz lo beberéis."]],"ob":[]},"2026-07-26":{"o":267171,"t":"+ DOMINGO XVII DEL TIEMPO ORDINARIO","b":[["Lecturas",2859175]],"n":"C • PE IV","v":"vol. I (A)","r":[["#/r/10/2/5","1R 3, 5",". 7-12","Pediste para ti inteligencia."],["#/r/22/117","Sal 118","","¡Cuánto amo tu ley, Señor!"],["#/r/51/7/28","Rm 8, 28","-30","Nos predestinó a reproducir la imagen de su Hijo."],["#/r/46/12/44","Mt 13, 44","-52","Vende todo lo que tiene y compra el campo."]],"ob":[]},"2026-07-27":{"o":268217,"t":"LUNES DE LA XVII SEMANA DEL TIEMPO ORDINARIO, feria","b":[["Lectura continuada",2386520]],"n":"(morado) <a href=\"#/d/Misal/3531918\"><i><span>Difuntos</span></i></a> • PE II","v":"vol. III (par)","r":[["#/r/30/12/1","Jr 13, 1","-11","El pueblo será como ese cinturón que ya no sirve para nada."],["#/r/4/31/18","Salmo: Dt 32, 18","-21","Despreciaste al Dios que te engendró."],["#/r/46/12/31","Mt 13, 31","-35","El grano de mostaza se hace un árbol hasta el punto de que los pájaros del cielo anidan en sus ramas."]],"ob":[]},"2026-07-28":{"o":268697,"t":"MARTES DE LA XVII SEMANA DEL TIEMPO ORDINARIO, feria","b":[["Lectura continuada",2389906]],"n":"<a href=\"#/d/Misal/26712\"><i><span>Salmo 2</span></i></a> • (blanco) <a href=\"#/d/Misal/1131583\"><i><span>S Josemaría</span></i></a> • PE I","v":"vol. III (par)","r":[["#/r/30/13/17","Jr 14, 17","-22" 72,"t":"JUEVES DE LA XIX SEMANA DEL TIEMPO ORDINARIO, feria o SANTOS PONCIANO, papa, e HIPÓLITO, presbítero, mártires, memoria libre","b":[["Lectura continuada",2436080]],"n":"<a href=\"#/d/Misal/25779\"><i><span>Adoro Te devote</span></i></a> • PE I","v":"vol. III (par)","r":[["#/r/32/11/1","Ez 12, 1","-12","Emigra en pleno día, a la vista de todos."],["#/r/22/76","Sal 77","","¡No olvidéis las acciones del Señor!"],["#/r/46/17/21","Mt 18, 21","-19, 1","No te digo que perdones hasta siete veces, sino hasta setenta veces siete."]],"ob":["o bien: cf. vol. IV."]},"2026-08-14":{"o":279447,"t":"VIERNES. SAN MAXIMILIANO KOLBE, presbítero y mártir, memoria obligatoria","b":[["Lectura continuada",2440634]],"n":"PE III","v":"vol. III (par)","r":[["#/r/32/15/1","Ez 16, 1","-15.60.63","Eras perfecta con los atavíos que yo había puesto sobre ti; y te prostituiste."],["#/r/29/11/2","Salmo: Is 12, 2","-6","Ha cesado tu ira y me has consolado."],["#/r/46/18/3","Mt 19, 3","-12","Por la dureza de corazón permitió Moisés repudiar a las mujeres; pero, al principio, no era así."]],"ob":[]},"2026-08-15":{"o":279961,"t":"+ SÁBADO. ASUNCIÓN DE LA BIENAVENTURADA VIRGEN MARÍA, solemnidad","b":[["Lecturas",3988188]],"n":"A • Ordenación sacerdotal del Padre • Consagración • Ant. <i><span>Salve</span></i> Regina • <i><span>ExSo</span></i> • Flo • (blanco) <a href=\"#/d/Misal/3325443\"><i><span>Virgen</span></i></a> • PE III","v":"vol. IV","r":[["#/r/12/14/3","1Cro 15, 3","","-4.15-16; 1Cro 16, 1-2. Llevaron el Arca de Dios y la colocaron en el centro de la tienda que David le había preparado."],["#/r/22/130","Sal 131","","Levántate, Señor, ven a tu mansión, ven con el arca de tu poder."],["#/r/52/14/54","1Co 15, 54","-57","Nos da la victoria por medio de Jesucristo."],["#/r/48/10/27","Lc 11, 27","-28","Bienaventurado el vientre que te llevó."],["#/r/72/10/19","Ap 11, 19","","a; Ap 12, 1-6a.10ab. Una mujer vestida del sol, y la luna bajo sus pies."],["#/r/22/43","Sal 44","","De pie a tu derecha ."]],"ob":[]},"2026-08-19":{"o":284413,"t":"MIÉRCOLES DE LA XX SEMANA DEL TIEMPO ORDINARIO, feria o SAN JUAN EUDES, presbítero, memoria libre o SAN EZEQUIEL MORENO DÍAZ, obispo, memoria libre","b":[["Lectura continuada",2455832]],"n":"PE II","v":"vol. III (par)","r":[["#/r/32/33/1","Ez 34, 1","-11","Libraré mi rebaño de sus fauces, para que no les sirva de alimento."],["#/r/22/21","Sal 22","","El Señor es mi pastor, nada me falta."],["#/r/46/19/1","Mt 20, 1","-16","¿Vas a tener tú envidia porque yo soy bueno?"]],"ob":["o bien: cf. vol. IV."]},"2026-08-20":{"o":285165,"t":"JUEVES. SAN BERNARDO, abad y doctor de la Iglesia, memoria obligatoria","b":[["Lectura continuada",2460359]],"n":"<a href=\"#/d/Misal/25779\"><i><span>Adoro Te devote</span></i></a> • PE III","v":"vol. III (par)","r":[["#/r/32/35/23","Ez 36, 23","-28","Os daré un corazón nuevo y os infundiré mi espíritu."],["#/r/22/49","Sal 50","","Derramaré sobre vosotros un agua pura que os purificará de todas vuestras inmundicias."],["#/r/46/21/1","Mt 22, 1","-14","A todos los que encontréis, llamadlos a la boda."]],"ob":[]},"2026-08-21":{"o":285668,"t":"VIERNES. SAN PÍO X, papa, memoria obligatoria","b":[["Lectura continuada",2464375]],"n":"C • PE III","v":"vol. III (par)","r":[["#/r/32/36/1","Ez 37, 1","-14","Huesos secos, escuchad la palabra del Señor. Os sacaré de vuestros sepulcros, casa de Israel."],["#/r/22/105","Sal 106","","Dad gracias al Señor, porque es eterna su misericordia."],["#/r/46/21/34","Mt 22, 34","-40","Amarás al Señor tu Dios, y a tu prójimo como a ti mismo."]],"ob":[]},"2026-08-22":{"o":286150,"t":"SÁBADO. BIENAVENTURADA VIRGEN MARÍA REINA, memoria obligatoria","b":[["Lectura continuada",2468547]],"n":"C • Ant. <i><span>Salve</span></i> Regina • <i><span>ExSi</span></i> • [Flo] • (blanco) <a href=\"#/d/Misal/3325443\"><i><span>Virgen</span></i></a> • PE III","v":"vol. III (par)","r":[["#/r/32/42/1","Ez 43, 1","-7a","La Gloria del Señor entró en el templo."],["#/r/22/83","Sal 84","","La glo /r/46/22/27","Mt 23, 27","-32","Sois hijos de los que asesinaron a los profetas."]],"ob":[]},"2026-08-27":{"o":289865,"t":"JUEVES. SANTA MÓNICA, memoria obligatoria","b":[["Lectura continuada",2480520]],"n":"<a href=\"#/d/Misal/25779\"><i><span>Adoro Te devote</span></i></a> • PE III","v":"vol. III (par)","r":[["#/r/52/0/1","1Co 1, 1","-9","En él habéis sido enriquecidos en todo."],["#/r/22/143","Sal 144","","Bendeciré tu nombre por siempre, Señor."],["#/r/46/23/42","Mt 24, 42","-51","Estad preparados."]],"ob":[]},"2026-08-28":{"o":290281,"t":"VIERNES. SAN AGUSTÍN, obispo y doctor de la Iglesia, memoria obligatoria","b":[["Lectura continuada",2483758]],"n":"PE III","v":"vol. III (par)","r":[["#/r/52/0/1","1Co 1, 1","7-25","Predicamos a Cristo crucificado: escándalo para los hombres; pero para los llamados es sabiduría de Dios."],["#/r/22/31","Sal 32","","La misericordia del Señor llena la tierra."],["#/r/46/24/1","Mt 25, 1","-13","¡Que llega el esposo, salid a su encuentro!"]],"ob":[]},"2026-08-29":{"o":290743,"t":"SÁBADO. MARTIRIO DE SAN JUAN BAUTISTA, m. obligatoria","b":[["Lectura continuada",2487422]],"n":"Antífona <i><span>Salve</span></i> Regina • <i><span>ExSi</span></i> • PE I","v":"vol. III (par)","r":[["#/r/52/0/26","1Co 1, 26","-31","Lo débil del mundo lo ha escogido Dios."],["#/r/22/31","Sal 32","","Dichoso el pueblo que el Señor se escogió como heredad."],["#/r/46/24/1","Mt 25, 1","4-30","Como has sido fiel en lo poco, entra en el gozo de tu señor."]],"ob":[]},"2026-08-30":{"o":291227,"t":"+ DOMINGO XXII DEL TIEMPO ORDINARIO","b":[["Lecturas",2877273]],"n":"C • PE III","v":"vol. I (A)","r":[["#/r/30/19/7","Jr 20, 7","-9","La palabra del Señor me ha servido de oprobio."],["#/r/22/61","Sal 62","","Mi alma está sedienta de ti, Señor, Dios mío."],["#/r/51/11/1","Rm 12, 1","-2","Presentad vuestros cuerpos como sacrificio vivo."],["#/r/46/15/21","Mt 16, 21","-27","Si alguno quiere venir en pos de mí, que se niegue a sí mismo."]],"ob":[]},"2026-08-31":{"o":292452,"t":"LUNES DE LA XXII SEMANA DEL TIEMPO ORDINARIO, feria","b":[["Lectura continuada",2491523]],"n":"(blanco) <a href=\"#/d/Misal/1131583\"><i><span>S Josemaría</span></i></a> • PE II","v":"vol. III (par)","r":[["#/r/52/1/1","1Co 2, 1","-5","Os anuncié a Cristo crucificado."],["#/r/22/117","Sal 118","","¡Cuánto amo tu ley, Señor!"],["#/r/48/3/16","Lc 4, 16","-30","Me ha enviado a evangelizar a los pobres… Ningún profeta es aceptado en su pueblo."]],"ob":[]},"2026-09-01":{"o":293050,"t":"MARTES DE LA XXII SEMANA DEL TIEMPO ORDINARIO, feria","b":[["Lectura continuada",2495252]],"n":"<a href=\"#/d/Misal/26712\"><i><span>Salmo 2</span></i></a> • PE D2 • (verde) <a href=\"#/d/Misal/3452906\"><i><span>Por la familia</span></i></a>","v":"vol. III (par)","r":[["#/r/52/1/1","1Co 2, 1","0b-16","El hombre natural no capta lo que es propio del Espíritu de Dios; en cambio, el hombre espiritual lo juzga todo."],["#/r/22/143","Sal 144","","El Señor es justo en todos sus caminos."],["#/r/48/3/31","Lc 4, 31","-37","Sé quién eres: el Santo de Dios."]],"ob":[]},"2026-09-02":{"o":293578,"t":"MIÉRCOLES DE LA XXII SEMANA DEL TIEMPO ORDINARIO, feria","b":[["Lectura continuada",2498598]],"n":"(blanco) San José • PE II","v":"vol. III (par)","r":[["#/r/52/2/1","1Co 3, 1","-9","Nosotros somos colaboradores de Dios y vosotros, campo de Dios, edificio de Dios."],["#/r/22/31","Sal 32","","Dichoso el pueblo que Dios se escogió como heredad."],["#/r/48/3/38","Lc 4, 38","-44","Es necesario que evangelice también a las otras ciudades, pues para esto he sido enviado."]],"ob":[]},"2026-09-03":{"o":294071,"t":"JUEVES. SAN GREGORIO MAGNO, papa y doctor de la Iglesia, memoria obligatoria","b":[["Lectura continuada",2502003]],"n":"<a href=\"#/d/Misal/25779\"><i><span>Adoro Te devote</span></i></a> • Limpiar sagrario • Vela • PE III","v":"vol. III (par)","r":[["#/r/52/2/1","1Co 3, 1","8-23","Todo es vuestro, vosotros de Cristo y Cristo de Dios."],["#/r/22/22","Sal 23","","Del Señor es la tierra y cuanto ,"r":[["#/r/55/0/11","Ef 1, 11","-14","Antes esperábamos en el Mesías. Vosotros habéis sido marcados con el sello del Espíritu Santo."],["#/r/22/31","Sal 32","","Dichoso el pueblo que el Señor se escogió como heredad."],["#/r/48/11/1","Lc 12, 1","-7","Hasta los cabellos de vuestra cabeza están contados."]],"ob":["o bien: cf. vol. IV."]},"2026-10-17":{"o":327233,"t":"SÁBADO. SAN IGNACIO DE ANTIOQUÍA, obispo y mártir, memoria obligatoria","b":[["Lectura continuada",2624548]],"n":"Antífona <i><span>Salve</span></i> Regina • <i><span>ExSi</span></i> • PE I","v":"vol. III (par)","r":[["#/r/55/0/15","Ef 1, 15","-23","El Padre dio a Cristo como Cabeza, sobre todo, a la Iglesia, que es su cuerpo."],["#/r/22/7","Sal 8","","Diste a tu Hijo el mando sobre las obras de tus manos."],["#/r/48/11/8","Lc 12, 8","-12","El Espíritu Santo os enseñará en aquel momento lo que tenéis que decir."]],"ob":[]},"2026-10-18":{"o":327804,"t":"+ DOMINGO XXIX DEL TIEMPO ORDINARIO","b":[["Lecturas",2904707]],"n":"C • <a href=\"#/d/Misal/28484\"><i><span>Quicumque</span></i></a> • [Flo] • PE IV","v":"vol. I (A)","r":[["#/r/29/44/1","Is 45, 1",". 4-6","Yo he tomado de la mano a Ciro, para doblegar ante él las naciones."],["#/r/22/94","Sal 95","","Aclamad la gloria y el poder del Señor."],["#/r/58/0/1","1Ts 1, 1","-5b","Recordamos vuestra fe, vuestro amor y vuestra esperanza."],["#/r/46/21/1","Mt 22, 1","5-21","Dad al César lo que es del César y a Dios lo que es de Dios."]],"ob":[]},"2026-10-19":{"o":329216,"t":"LUNES DE LA XXIX SEMANA DEL TIEMPO ORDINARIO, feria o SAN PEDRO DE ALCÁNTARA, presbítero, m. libre o SANTOS JUAN DE BREBEUF e ISAAC JOGUES, presbíteros, y compañeros, mártires, m. libre o SAN PABLO DE LA CRUZ, presbítero, m. libre","b":[["Lectura continuada",2627822]],"n":"PE II","v":"vol. III (par)","r":[["#/r/55/1/1","Ef 2, 1","-10","Nos ha hecho revivir con Cristo y nos ha sentado en el cielo."],["#/r/22/98","Sal 99","","El Señor nos hizo y somos suyos."],["#/r/48/11/1","Lc 12, 1","3-21","  continuada",2641345]],"n":"PE II","v":"vol. III (par)","r":[["#/r/55/3/1","Ef 4, 1","-6","Un solo cuerpo, un Señor, una fe, un bautismo."],["#/r/22/22","Sal 23","","Esta es la generación que busca tu rostro, Señor."],["#/r/48/11/54","Lc 12, 54","-59","Sabéis interpretar el aspecto de la tierra y del cielo, pues ¿cómo no sabéis interpretar el tiempo presente?"]],"ob":["o bien: cf. vol. IV."]},"2026-10-24":{"o":332740,"t":"SÁBADO DE LA XXIX SEMANA DEL TIEMPO ORDINARIO, feria o SAN ANTONIO MARÍA CLARET, obispo, memoria libre o SANTA MARÍA EN SÁBADO, memoria libre","b":[["Lectura continuada",2644117]],"n":"D • Fiesta en familia (S. Rafael). • (blanco) <a href=\"#/d/Misal/3263318\"><i><span>Ángeles</span></i></a> • Ant. <i><span>Salve</span></i> Regina • <i><span>ExSi</span></i> • PE III","v":"vol. III (par)","r":[["#/r/55/3/7","Ef 4, 7","-16","Cristo es la cabeza, del cual todo el cuerpo se procura el crecimiento."],["#/r/22/120","Sal 121","","Vamos alegres a la casa del Señor."],["#/r/48/12/1","Lc 13, 1","-9","Si no os convertís, todos pereceréis lo mismo."]],"ob":["o bien: cf. vol. IV.","o bien cf. Leccionario de las «Misas de la Virgen María»."]},"2026-10-25":{"o":333603,"t":"+ DOMINGO XXX DEL TIEMPO ORDINARIO","b":[["Lecturas",2908425]],"n":"C • PE I","v":"vol. I (A)","r":[["#/r/1/21/20","Ex 22, 20","-26","Si explotáis a viudas y a huérfanos, se encenderá mi ira contra vosotros."],["#/r/22/16","Sal 17","","Yo te amo, Señor; tú eres mi fortaleza."],["#/r/58/0/5","1Ts 1, 5","c-10","Os convertisteis, abandonando los ídolos, para servir a Dios y vivir aguardando la vuelta de su Hijo."],["#/r/46/21/34","Mt 22, 34","-40","Amarás al Señor tu Dios, y a tu prójimo como a ti mismo."]],"ob":[]},"2026-10-26":{"o":334900,"t":"LUNES DE LA XXX SEMANA DEL TIEMPO ORDINARIO, feria","b":[["Lectura continuada",2647650]],"n":"(blanco) <a href=\"#/d/Misal/1131583\"><i><span>S Josemaría</span></i></a> • PE II","v":"vol. III (par)","r":[["#/r/55/3/32","Ef 4, 32","-5, 8","Vivid en el amor como Cristo."],["#/r/22/0","Sal 1","","Seamos imitadores de Dios, como hijos queridos."],["#/r/48/12/1","Lc 13, 1","0-17","A esta, que es hija de Abrahán, ¿no era necesario soltarla de tal ligadura en día de sábado?"]],"ob":[]},"2026-10-27":{"o":335416,"t":"MARTES DE LA XXX SEMANA DEL TIEMPO ORDINARIO, feria","b":[["Lectura continuada",2650915]],"n":"B • Cumpleaños del Padre • (blanco) <a href=\"#/d/Misal/3242737\"><i><span>Jesucristo, sumo y eterno sacerdote</span></i></a> • <a href=\"#/d/Misal/26712\"><i><span>Salmo 2</span></i></a> • <i><span>ExSi</span></i> • Flo • PE I","v":"vol. III (par)","r":[["#/r/55/4/21","Ef 5, 21","-33","Es este un gran misterio: y yo lo refiero a Cristo y a la Iglesia."],["#/r/22/126","Sal 127","","Dichosos los que temen al Señor."],["#/r/48/12/1","Lc 13, 1","8-21","El grano creció y se hizo un árbol."]],"ob":[]},"2026-10-28":{"o":335896,"t":"MIÉRCOLES. SANTOS SIMÓN Y JUDAS, apóstoles, fiesta","b":[["Lecturas",4185712]],"n":"C • PE I","v":"vol. IV","r":[["#/r/55/1/19","Ef 2, 19","-22","Estáis edificados sobre el cimiento de los apóstoles."],["#/r/22/17","Sal 18","","A toda la tierra alcanza su pregón."],["#/r/48/5/1","Lc 6, 1","2-19","Escogió entre ellos a doce, a los que nombró también apóstoles."]],"ob":[]},"2026-10-29":{"o":336447,"t":"JUEVES DE LA XXX SEMANA DEL TIEMPO ORDINARIO, feria","b":[["Lectura continuada",2656969]],"n":"<a href=\"#/d/Misal/25779\"><i><span>Adoro Te devote</span></i></a> • (blanco) <a href=\"#/d/Misal/3245949\"><i><span>Eucaristía</span></i></a> • PE I","v":"vol. III (par)","r":[["#/r/55/5/10","Ef 6, 10","-20","Tomad las armas de Dios para poder manteneros firmes después de haber superado todas las pruebas."],["#/r/22/142","Sal 143","","¡Bendito el Señor, mi alcázar!"],["#/r/48/12/31","Lc 13, 31","-35","No cabe que un profeta muera fuera de Jerusalén"]],"ob":[]},"2026-10-30":{"o":336911,"t":"VIERNES DE LA XXX SEMANA DEL TIEMPO ORDINARIO, feria","b":[["Lectura continuada",2660163]],"n":"(rojo) <a href=\"#/d/Mi
