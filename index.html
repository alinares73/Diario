cárgate, aligérate, para que puedas subir. En un encuentro de dos, ambos avanzan por el camino. ¿Te gustaría que fuera solo Yo Quien recorriera el trayecto? No te prives del placer de ganar tiempo y llegar a la cita con anticipación. Y no Me prives del placer de saber que Soy esperado.”</i>"],[15,31]],[1503,["21 de marzo Hora Santa. <i>“Durante toda la noche te estuve esperando en Mi Eucaristía, para podérteme dar por la mañana. No tienes por qué asombrarte, pues crees en Mi Presencia en el Tabernáculo y en la inmensidad de Mi Amor. Junta los cabos. Y cuando despiertes en el curso de la noche, que tu pensamiento vuele hacia Quien ya te está deseando para el amanecer. Eso animará tu amor y abrirá tu confianza.”</i>"],[8]],[1505,["4 de abril de 1946. Hora Santa. Se habían olvidado de volver a poner el mantel sobre el altar. En mi pensamiento, yo Lo cubría con mis brazos. Me dijo: <i>“Si tú Me cubres así esta tarde, puedes creer que en el Cielo, donde las tardes son eternos amaneceres, Yo te ofreceré esta misma túnica en cuyos pliegues están abrigados los secretos de nuestras conversaciones. No pienses que Mis Gracias se agotan sobre la Tierra; ¿acaso tú misma no deseas constantemente recibir otras nuevas y más grandes? Sí, deséalas, cuenta con Ellas para aumentar tu Fe.”</i>\nYo: ‘Señor, yo creo que Tú me das todas las Gracias que necesito para mi salvación’.<i> </i>Él:<i> “¿Y qué si Yo quiero sobrepasar tus medidas e incluso las Mías? ¿Qué, si apoyándote en Mi Fuerza tiendes a lo excesivo? ¿Hay realmente excesos posibles para Mí, a Quien nada puede poner límite? Piensa más bien que, siendo Mi Amor algo infinito, desea dar infinitamente. La Infinitud es Mi Elemento.”</i>","4 de abril de 1946. <i>“No te asustes de nada. A la hora de tu muerte recibirás la Gracia de revestirte de ella; entrarás en la muerte como en una tarea que Yo te he impuesto y para la cual te he ayudado siempre. Es la ‘Gracia actual’, la Gracia de cada momento y la Gracia Soy Yo.</i>\n<i>“¿Has tenido miedo alguna vez estando conmigo? ‘¡No temáis!’ decía Yo siempre a Mis apóstoles. Y, de parte tuya, Mi pequeña, el temor Me ofendería.”</i>"],[6,31]],[1506,["11 de abril de 1946. <i>“Cree, y todo se hará simple. Será sencillo amarme, servirme, estar contenta de sufrir algo por Mí. Creer es a veces casi como ver. ¡Verme! Un avance, una riqueza para explotar cada vez que Me hablas y Me dices que Me amas. Y has de saber que la prueba del amor de tu Dios está en el cuidado que te tomes por atender afectuosamente a tu prójimo. Cree verme en él y que Me agradas a Mí cuando lo agradas a él. Y entonces, permanecerás humilde ante él. Sé siempre tú la más pequeña. Piensa en las dimensiones de la Hostia. Ensaya desde ahora a dirigirte a Mí cuando hablas con tu prójimo.”</i>"],[21]],[1508,["Jueves Santo. Sola delante del Santísimo Sacramento. Él: <i>“Acerca cuanto puedas Mi Corazón a tu corazón. ¿Conoces el secreto de este acercamiento? ¿Está en el silencio exterior o en el interior? ¿Has aprendido ya cómo hacer que tus facultades guarden silencio para penetrar únicamente en Mi Alma cada momento? Como en la Institución de la Eucaristía en el Cenáculo. En ese momento Mi Alma os veía a todos como te veo a ti ahora. Y con un indecible Amor...”</i>"],[13]],[1509,["Jueves Santo. Yo Lo adoraba ante el Monumento. <i>“Cuando Me diriges una sonrisa de amor, Yo te la correspondo. Cuando tú Me hablas, te escucho y te respondo, aunque no siempre percibes Mi Voz. Y cuando te humillas por el recuerdo de tus faltas, Yo las borro… aunque no sientas el Perdón que te doy.</i>\n<i>“Cuando en espíritu besas Mis Manos y Mis Pies, la Sangre que de ellos brota te lava y te purifica. Cuando allá en tu interior tus ojos Me buscan para contemplar alguna de Mis Cualidades, Yo te miro con un Amor más grande, aunque no veas Mi Rostro. Piensa, pues, que aun cuando hagas todo lo que te resulta posible para consolarme y amarme, este ‘todo’ es poco comparado con lo que Yo te doy al recibir algo de ti.</i>\n<i>“¡Desea, hija! Deséame que hoy tenga Yo corazones vacíos de sí mismos, pero llenos de Mí. Y sé tú uno de ellos. Muchos pasarán hoy frente a Mi Monumento por costumbre, para ver las flores y los adornos; pero pocos serán los que Me traigan un corazón encendido de amor, de celo y de agradecimiento. ¿De cuántos podré Yo decir: ‘estos son Míos’? Por eso te digo tanto que ‘seas Mía’, para que disfrutes hasta el fin de Mi extremado Amor, capaz de llevarte a dulzuras no imaginadas... Amor de Cristo...”</i>"],[20]],[1510,["Jueves Santo. Yo estaba sola en la iglesia, cerca del Santísimo Sacramento. Me dijo: <i>“Para consolarme de los que no creen en Mí, dime que empiezas a estar realmente segura de la Fuerza de Mi Amor, aun cuando te reconoces indigna. Con esto Me consolarás.”</i>"],[20]],[1511,["26 de abril. Hora Santa. <i>“Cuando se ama, se piensa incesantemente en la persona amada. ¿Qué debería Yo deducir, entonces, si no piensas en Mí? Te espero siempre, ven directamente. Aviva esa vida entre los dos.</i>\n<i>“Trata de que haya variedad en tus encantos para Mí; humíllate a Mis Pies, como Magdalena; o sobre Mi Pecho, como Juan; tomándote cuidados por Mí, como Mi Madre; o glorificándome, como se hace en el Cielo; o agradeciendo al Padre la victoria sobre la muerte; o colocándote a Mi lado, bajo el Espíritu que se cierne sobre nuestras cabezas.</i>\n<i>“Y cuando algo sufres, que sea en unión con Mis Sufrimientos. Compréndelo: Unión siempre, nunca separación, ni siquiera una separación que se esboza en las penumbras del olvido. Sé algo viviente para Mí. Hazme sentir que al estar en ti estoy en Mi Casa. Aun con tus faltas, pues Yo Soy todo Misericordia y tengo el poder de borrarlo y restaurarlo todo.”</i>"],[39]],[1513,["2 de mayo. Hora Santa.<i> “Lo que te pido es amor en los instantes más fugaces. Tú no les das importancia, pero para Mí las cosas más mínimas son grandes. Piensa que en esas pequeñeces está el amor de Mis hijos. Yo te tiendo Mi Mano: llénala de cosas leves, de pensamientos momentáneos, de impresiones, de pequeños deseos o de sufrimientos al verme ofendido. Y en los momentos de la noche en que despiertas, en tus ratos solitarios en el jardín, ante la rueca, exprésame tu amor. ¿No sientes acaso el Ardor con que te lo pido? No ha habido nunca un pobre tan necesitado como Yo, Soy el más pobre entre los pobres, y vivo cubierto por el odio de muchos. Dame refugio bajo un manto de amor, repara y consuélame.</i>\n<i>Pídeme amorosamente muchas conversiones e través de palabras y actos de amor. Y como fundamento pondrás el amor, que nunca debes dejar. Es la trama de tus días, y será también la trama de tu muerte. No desprecies los instantes de tiempo, pues Me aseguran la magnitud de tu intimidad amorosa y de tu vida de Fe. ¡Si pudieras ver cómo te sigo con la Mirada! ¡Si pudieras medir el calor de Mi Cariño! ¡Qué respuestas inventarías! Hazme lugar en tu corazón. Yo entraré en él con todas Mis Gracias.”</i>"],[14]],[1514,["9 de mayo. Yo decía al entrar en la iglesia: ‘Señor, ¡cómo quisiera yo hacer algo por Ti! Pero aun cuando Te me dé toda, no Te doy nada. ¿Qué hacer?’ Él: <i>“Tómame y ofréceme a Mí mismo con toda la confianza que espero de vosotros. Puesto que Yo Soy vuestro, sois ricos. Solo sois miserables cuando contáis con vosotros mismos y no aceptáis obrar sino con vuestras propias fuerzas. ¡Qué pobres sois entonces!</i>\n<i>“Pero si con humildad y Esperanza os apoderáis de Mis Méritos, vuestra fortuna es grande. Sobre todo, nunca dudes de Mí. Yo no adquirí Mis Méritos sino para dároslos, Mis pobres pequeños. Vosotros no pensáis en ello porque vivís en medio de una niebla que os oculta las encantadoras Delicadezas de vuestro Amigo divino.”</i>","9 de mayo. Yo decía al entrar en la iglesia: ‘Señor, aquí está tu pobrecita nada, que va entrando.’ Él: <i>“¿Qué es toda cosa ante el Dios infinitamente grande? Y tú misma, que has sido particularmente elegida para ser colmada de Gracias, no eres sino pura miseria. Y es esta miseria la que Yo alimento cada mañana con Mi Eucaristía, para mantenerla en Mi Amistad; pues lo más débil y miserable es lo que más Me atrae. Todo lo que tienes que reprocharte, dámelo. Yo Soy el que convierte lo más bajo, desagradable y vil, en el oro puro de la Gloria. ¿Cómo es posible semejante transformación? Solo por el Amor.”</i>"],[9,12]],[1515,["16 de mayo de 1946. Hora Santa. <i>“Préstame tu mano para escribir con ella. Préstame tu voz para enseñar a los niños del catecismo. Préstame tus ademanes para mostrarles Amor. Y para consolar al Párroco en sus agobios, préstame tu amabilidad. De este modo y por tu medio, estaré Yo en medio de ellos. Tu influencia se enriquecerá y tú te harás pequeña en tu propia estimación. Porque te dirás: ‘Eso no fue el fruto de mi esfuerzo, Jesús estaba conmigo’. Repítelo para ti misma; te facilitará permanecer en la humildad y la humildad es la verdad.</i>\n<i>“Préstame también tu cuerpo cuando viajas, cuando algo te duele, cuando comes y cuando duermes. Todo eso lo hice Yo cuando vivía entre los hombres. Hazme vivir todavía en medio de ellos; es preciso que Me sientan vivir con ellos.”</i>"],[49]],[1516,["23 de mayo de 1946. <i>“Recuerda el consejo del profeta: ‘lávate en el río’. Y recuerda cómo aquel rey leproso, encontrando demasiado fácil ese consejo, quería retirarse. Pero sus servidores le decían: ‘Padre, si el profeta te hubiera mandado una cosa difícil, la habrías hecho; ¡cuánto más si lo que te manda es algo tan sencillo!’</i>\n<i>“A vosotros os pido vuestras acciones más ordinarias; el caminar, el beber, el sueño, el trabajo, toda vuestra jornada, en unión a Mis Jornadas de otros tiempos; os pido vuestras acciones empapadas en Mi Sangre y revestidas de Mis Méritos. No es difícil. Esto os cura de vuestra miseria habitual y os envuelve en el más rico manto.</i>\n<i>“Acepta, pues, Mi pequeña, una cosa tan simple y ensáyala. Que se te convierta en hábito mirando Mis Ojos. ¿Te sientes contenta de que Yo te mire? Mi Mirada es la del gran Amigo, que te toca como una caricia y es siempre una Fuerza, como Mis Palabras, como Mi Eucaristía.”</i>","23 de mayo de 1946. <i>“Todo lo que procede de Mí es una Fuerza para vivir, es una Alegría, un Impulso de Amor, una comprensión más grande del Ser de Dios. Es la razón por la que los santos han llevado una vida diferente, porque lo veían todo con otros ojos. El ambiente mundano es tan mentiroso que la verdad no se le puede adaptar. Penetra, pues, en los dominios de Mi Amor, y enciérrate ahí.”</i>"],[14,18]],[1524,["28 de junio. Fiesta del Sagrado Corazón. Yo: ‘Amor mío, descansa en mi corazón. Duérmete en él’. Me contestó: <i>“¿Y si Yo te dijera estas mismas palabras y tú vinieras a reposar en Mi Corazón? ¡Qué alegría para Mí!</i>\n<i>“Olvida, te lo ruego, todas las cosas, porque ante Mi Ternura hacia vosotros todo merece ser olvidado. ¿No puedes darme las gracias por haberte enseñado a saborear el Amor desde tu juventud? El hábito no ha podido hacer que el gusto se desvanezca; siempre hay en él algo nuevo y prodigioso. Si el corazón de un hombre de buenas cualidades es ya en sí algo encantador, ¿qué decir del Corazón del Hombre-Dios que no fue creado sino para el Amor y el Perdón? Apoya, hija, tu oído sobre Mi Corazón y escucha. Porque vosotros no escucháis casi nunca. ¿Cómo, entonces, podríais oír? ¿Y de qué otro modo se darían nuestras conversaciones íntimas? Las que no son solamente de Boca a boca, sino di Corazón a corazón, sin palabras, con el suspiro del alma. ¡Hermosa intimidad en la absoluta pureza!”</i>"],[13]],[1528,["12 de julio. Capilla de Pen-Chateau. Yo. ‘Muéstrame, Señor, la inmensidad de Tus Perfecciones, para que conociéndote mejor Te ame más.’ Él:<i> “Contempla el mar. Todo en la Creación es imagen de tu Dios; las obras revelan al Artífice. Tú misma, pequeña imagen Mía, Me revelas. Piensa que así es, para que consigas hacer que piensen en tu Dios los que te vean. Aun cuando no sea sino a través de una sonrisa, que es una de tus maneras de predicar, ¿quieres hacer pensar en Dios?”</i>"],[11]],[1531,["25 de julio. Hora Santa. <i>“Algunos de tus esfuerzos son un secreto entre tú y Yo. Y tanto más interesantes cuanto más íntimos. Sobre todo, no te canses de nuestra intimidad. Inventa. Modifica. Aumenta. Y llama en tu auxilio al Espíritu de Amor. Pídele a Mi Madre que te enseñe a hacer lo que Ella, que nunca aparta de Mí su pensamiento. Aun en esos momentos en que no te sientes capaz de nada, dame esa nada, pues de la nada te saqué. Lo único que te pido es la voluntad de ser Mía en todo tiempo, de calma o tempestad. Y Yo te introduciré en el Cenáculo feliz de Mis buenos servidores y amigos.”</i>"],[26]],[1533,["7 de agosto. <i>“Tú Me Pides Mi Ayuda para hacer mejor las cosas. Ayer le escribías a una persona: ‘Dios ayuda siempre cuando se espera en Él’. Vive tú de esa expectación que tanta Gloria Me da.</i>\n<i>“¿Me esperas con frecuencia? O por el contrario, ¿esperas algo de tus propias fuerzas? Ciertamente hay que desear el agradarme, pero con la convicción de que eso está fuera de alcance para tus solas fuerzas. Es esta actitud humilde la que Me invita a descender. Y digo ‘descender’, aunque ya estoy en ti. Y cuando te hayas apoyado así en tu Dios verás con asombro las alturas a que subes. Yo existo y obro en ti.”</i>"],[19]],[1534,["7 de agosto. <i>“¿Es tan difícil, después de todo, recogerte en medio de tus visitas? Mírame pensando en Mí, y como tú sabes que siempre te tengo presente en Mi Pensamiento, te resultará sencillo mirarme como al Todo de tu vida. No veas en esto simples palabras. Ve la realidad: Yo existo, tú existes por Mí, nos amamos… y eso es todo.”</i>"],[29]],[1540,["11 de septiembre. Yo me entretenía quitando las malas hierbas en el jardín. Me dijo: <i>“Sí. En vez de pensar en tu propio servicio, piensa que Soy Yo Aquel a Quien sirves. Que todo sea Mío y para Mí, a lo largo de tu día. Que sean Mis Comidas, Mis Paseos, Mis Jardines, Mi Aposento, Mis Remiendos. Yo en ti. Te será mucho más dulce...”</i>"],[25]],[1542,["19 de septiembre. Yo: ‘Señor, hay momentos en que me siento toda llena de Ti, pero hay otros en que estoy seca y me siento abandonada a mí misma.’ Él: <i>“Siempre estás llena de Mí, porque tú eres la nada. Existes por Mí, que Soy la Vida. Pero a veces os hago sentir vuestra pequeñez, para que aprendáis a apreciar todo lo que os falta y para que se formen en vosotros esos llamamientos secretos, que proceden de un sincero y humilde cariño… y que Me dan tanta alegría.”</i>"],[23]],[1549,["24 de octubre de 1946. Yo bajaba a la terraza diciéndole ‘Ven conmigo’. Él: <i>“Dime eso muchas veces y cuando sea llegado el gran día de tu viaje a la muerte, te seguiré acompañado. </i>(Yo pensé que para ese momento me seria también indispensable la Santísima Virgen)<i>. </i>Él añadió: <i>“¿Cómo podría Ella no estar presente en el momento más importante de la vida de quienes recitaron el Rosario cada día? Tú le pides ciento cincuenta veces al día. ¿Te parece insuficiente?”</i>"],[28]],[1553,["3l de octubre. Hora Santa. <i>“Considera a tus hermanitas del Cielo, esas almas modestas de las que nadie habla, pero que Yo he querido coronar de Gloria. Y considera su amor agradecido. Hay amores de muchas clases y Yo estoy en todos. No temas inventar, pues siempre será verdad: el amor tiene mil rostros, todos hermosos.</i>\n<i>“En el Cielo verás ese Amor triunfante, verás el Mérito de Mis Sufrimientos, aclamados por la incontable multitud de bienaventurados, que ningún lenguaje puede describir. En tu pequeñez únete a esas multitudes festivas. Aclámame con ellas, porque Yo Soy el Santo de los Santos y el Animador de la santidad de todos. Une tu agradecimiento al suyo, porque tú eres del número de los que han conocido Mis Bondades secretas y Mis Favores delicados. Tú sabes de Mí más que otros. Ámame pues, mejor. No Me hables sino en el lenguaje del amor.</i>\n<i>“Y ahora, hija, deja la pluma. Ámame. Adórame. Cántame sin palabras: Yo te oigo.”</i>"],[6]],[1554,["7 de noviembre de 1946. Hora Santa. Yo pensaba en la abundancia de Sus Beneficios en los últimos años de mi vida. Me dijo: <i>“Agradéceme, sobre todo, Mi Amor. Y, ¿sabes cuál es la mejor manera de hacerlo? Creyendo en Él. Y creer, no solamente en general, sino también en todos los detalles que se van desgranando uno por uno. En ocasiones lo percibes, pero otras no. Y sin embargo, ahí estoy.”</i>"],[18]],[1556,["19 de noviembre. Hora Santa. Afuera rugía la tempestad. Mucha lluvia y mucho frío. Me dijo: <i>“Agradéceme que te tenga en el abrigo de Mi Corazón, donde no llegan las tempestades. Mantente unida a Mí. Busca Mis Intenciones para hacerlas tuyas. Que tus deseos prolonguen los Míos y tiendan a realizarlos. Yo no he querido ser Yo mismo completo sin vosotros.”</i>"],[13]],[1558,["21 de noviembre. <i>“Cada alma tiene su manera de amar. No Me prives de la tuya. Yo no confundo las cosas. Yo disfruto vuestras maneras especiales. Desde el comienzo del Mundo, ninguna es igual a otra y eso hace la sinfonía de Mis Delicias. ¿No tengo derecho a ello? Y sin embargo, no avasallo. Espero. Y cuando vosotros Me lo dais, Mi Alegría es muy grande.”</i>"],[18]],[1560,["5 de diciembre de 1946. Hora Santa. <i>“Ven y acércate a Mí en el Huerto de la Agonía y del Sudor de Sangre. Me sentiré menos solo; los otros duermen.</i>\n<i>“No tuve a nadie entonces fuera de Mi Madre que pensaba en Mí; todos dormían. Imagen de los que viven su vida como un letargo. Indiferencia, distracción, olvido. ¡Qué daño el que padecen! Aun en Mis amigos, un poco más de fervor los mantendría despiertos.”</i>"],[36]],[1561,["12 de diciembre. <i>“Piensa Mis Pensamientos, así podrás decir Mis Palabras. ¡Qué edificación, hija Mía, qué poderosa palanca! Ensaya.”</i>"],[52]],[1564,["19 de diciembre. <i>“Yo espero de ti lo que tú quieras darme, como un pobre que está a la puerta... Piensa, ¿cuál fue el instante en que mayor gusto Me diste hoy? Fue cuando te comportaste como pequeña entre los pequeños.”</i>"],[24]],[1565,["26 de diciembre. <i>“En el Pesebre aparezco semejante a vosotros, para que vosotros lleguéis a ser semejantes a Mí. Esfuérzate; que esa semejanza ocupe sin cesar tu pensamiento. ‘¿Qué habría Él dicho, qué habría Él hecho? ¿En qué términos hablaría Él a Su Padre en esta circunstancia?’ Inspírate siempre en Mí y únete, pues Yo vine al Mundo para uniros a Mí, hasta llegar a ser un solo Ser. No deseches esta idea. Es cierto que no eres digna, pero la unión es Mi Deseo y esa Unión que te pido y que te ofrezco es algo que sobrepasa toda idea sobre la Tierra. Porque es Unión con Dios, con un Amor inconcebiblemente superior a todos los amores conocidos.”</i>"],[49]],[1567,["2 de enero de 1947. Hora Santa. Yo Lo adoraba deseándole almas. Me dijo: <i>“Nunca Me desearás tanto amor que pueda apagar Mi Sed. Sí. Búscame corazones con tu amabilidad para con todos, aun con los pecadores. Cautívalos para que puedas dármelos. Ocúpate en Mis obras, Mi pequeña colaboradora. No pierdas nada de nuestra Unión, en ningún tiempo.”</i>"],[4]],[1568,["2 de enero de 1947. <i>“No pierdas tu unión conmigo en ningún momento. Trata de llegar. Y cuando la hayas alcanzado, enciérrate ahí, sola conmigo. Esta es la soledad que buscas, la que se llama ‘soledad de dos’, y Yo, que la deseo todavía más estrecha, la encamino a que se convierta en ‘soledad en Uno’. Tú, perdida en Mí.”</i>"],[54]],[1574,["30 de enero. <i>“Da gracias por haber sido colmada por encima de cuanto creías posible.”</i>"],[22]],[1575,["6 de febrero de 1947. Hora Santa. ‘¡Cuánto desearía, Señor, que Te sintieras contento en mi corazón!’ Me dijo: <i>“Tu deseo, que es ya en sí un llamamiento, Me agrada y Me glorifica, y en ti es una reparación. Por lo tuyo y por lo de otros. ¡Si por lo menos una vez al año pensaran en Mí con algún afecto! ¡Ojalá admitieran el pensamiento de que Yo los amo a cada uno; el pensamiento de que la vida sobre la Tierra es demasiado corta, y de que Yo necesito para amarlos toda la Eternidad! ¡Ojalá entendieran que la vida presente no es el fin, sino solamente un medio que se les ofrece para ganar la Otra! Ora mucho por ellos. Puedes hacer mucho sin que lo vean. Yo Soy el que ve y oye.”</i>"],[12]],[1577,["14 de febrero. En un momento de tristeza. <i>“Recuerda que Yo anduve por todos vuestros caminos.” </i>Y luego, durante el día, me dijo:<i> “Si quieres tener la fuerza necesaria para hacer un sacrificio, no mires el sacrificio, piensa en darme gusto.”</i>"],[37]],[1581,["18 de febrero Hora Santa. <i>“Yo te estoy más presente que tú misma, pero hay momentos en que la abundancia de Mí se hace sentir por un acrecentamiento del Amor. Y cuando tú te dices: ‘Es Él’, Yo Me regocijo de que Me hayas reconocido.</i>\n<i>“Lo que siento mal es eso de quedar cerca de vosotros como un extraño, casi como un indeseable… la pena de no ser querido. Me veo obligado a depender en Mi Actitud de vuestro acogimiento, Yo que querría ser para toda alma el Pródigo del Amor. Pero, ¿cómo podría serlo si vosotros Me cerráis la puerta? Iba a decir: con mirada hostil y desconfiada... Muchos hay que temen que Yo les pida demasiado... ¡Si supieran lo felices que serían si Me lo dieran todo en un gozoso abandono!</i>\n<i>“El regalo mejor que podéis hacerme es la alegría de servirme. Aun cuando os venga el pensamiento de la muerte, no estéis tristes, porque Yo tomé el mismo camino. Mi Madre quiso también tomarlo, y la muerte es a menudo la gran reparación de una larga vida de negligencia egoísta.”</i>"],[0]],[1583,["20 de febrero.<i> “Concede más importancia a las cosas pequeñas, esas cositas que con frecuencia descuidas pensando que por lo pequeñas que son no pueden ser llenadas con amor. Sin embargo, Yo, que Soy Dios, no veo las cosas como vosotros las veis. ¿Crees que a Mis Ojos haya una gran diferencia entre las pequeñas acciones a que os obligan vuestros deberes de estado, vuestros pequeños momentos fugaces y lo que vosotros llamáis ‘grandes acontecimientos’?</i>\n<i>“Trata de adquirir ese secreto que te permitirá encantarme con cualquier cosa que hagas. Eso Me daría tanto placer que Me sentiría tentado a darte las gracias. Que Mi Agrado sea ‘tu razón suficiente’ para todo. Y así será cuando Me ames más que ahora. Pequeña, considera cuánto he hecho por ti y con esto se encenderá tu celo.”</i>"],[14]],[1584,["26 de febrero, mi cumpleaños. Él: <i>“Mírame, estoy clavado en la Cruz y ya no podré servirme de Mis Brazos aquí sobre la Tierra. Préstame los tuyos mientras te dure la vida. Y préstame tu cabeza llena de Mis Pensamientos para que Me valga de ella, si tú quieres, hasta el día del Encuentro.”</i>"],[49]],[1586,["6 de marzo de 1947. Yo había recibido telegramas y llamadas telefónicas por mil y un asuntos. Me dijo: <i>“La vida es así: cosas imprevistas, cambios de lugar. Tiempo variable, tiempo tormentoso. Afírmate en Mi Corazón. No Me dejes de mirar, bien para pedirme consejo, bien para decirme que Me amas. Mantente en la tranquilidad, recordando que nada sucede sin que Yo lo permita. Es la actitud para convencer a la gente del Bien. Que tu alma viva en la serenidad... ¿No te das cuenta, cuando recuerdas el pasado, que Mi Voluntad estaba siempre al servicio de tus intereses? Es que te amo. Y como a ti, amo a todas las almas; cada una recibe de Mí un Amor particular que es para ella sola. Desciendo a los detalles, ¿comprendes? Mi Amor no es un amor de masas. Por eso tengo necesidad de cada alma como si ella sola viviera en el Mundo, como si el Universo no hubiera sido creado sino para ella...”</i>"],[54]],[1587,["6 de marzo. <i>“Cada alma recibe de Mí un Amor particular. Por eso vivo tan reconocido con aquellos que se ingenian para atraer a Mí a los pecadores. Piensa: di Mi Vida por ellos y en las más atroces torturas. Pobrecitas almas, que con un humilde arrepentimiento estáis ya en Mi Corazón.</i>\n<i>“Háblales con dulzura, con afecto, porque un movimiento brusco podría alejarlas todavía más.”</i>\n‘Señor, mañana tendré que encontrarme con un pecador.’ <i>“Yo te daré el tacto necesario y estaré en ti, como siempre. Tú Me mirarás y Me llamarás. Me dirás: ‘habla por mí.’ Y Yo te escucharé.”</i>"],[44]],[1589,["20 de marzo. <i>“El cariñoso saludo que Me das cada mañana, o cuando te despiertas por la noche, ¡qué bien Me sabe! Porque tú Me lo ofreces sin que Yo te lo pida. Es como una cinta que enlaza y aprieta. Pero ya es muy tarde, vuélvete a dormir... sobre Mi Corazón.”</i>"],[13]],[1590,["20 de marzo de 1947. <i>“Tú no sabes el Gozo que Me causa un acto tuyo de amor. El Gozo de no sentirme extraño, ese ‘indiferente’ que Soy Yo para la mayoría. Tú debes comprenderme mejor. Dime tus palabras más íntimas; Yo las pondré sobre Mi Pecho como un ramo de mirra. Adora este Amor Mío que tiene necesidad de ti. Adora esa extremada Delicadeza que te confía Mis más escondidos Pensamientos. Sé un poco para Mí lo que Yo Soy para ti.</i>\n<i>“Y ve qué mal te lo pido... pues vuestra libertad no Me deja decir las palabras que Yo querría... Es como si aguardara a que por vosotros mismos intuyerais lo que Mi Corazón anhela. Por eso Mi Alegría as tan grande cuando Me siento adivinado...”</i>"],[10]],[1593,["27 de marzo, Hora Santa. Yo había recibido una muy grande Gracia de orden temporal. Le dije: ‘Mil gracias, mi Amor.’ Se lo dije con lágrimas. Él: <i>“Ya sabes cuánto Me gustan esos agradecimientos vuestros, alegres como de niños. Sabes que lo simple y sincero llega directamente a Mi Corazón.”</i>"],[22]],[1594,["29 de marzo. Yo Le hablaba a Mi Dios. <i>“Quiero que sonrías. Que en este momento haya cuando menos una sola alma en el Mundo que conversa conmigo con sonriente cariño. Comprende que Yo deseo relaciones nuevas, rejuvenecidas. No vives en la ley del temor, como antaño. Pequeña, que tu corazón entone un jubiloso Hosanna.”</i>"],[0]],[1595,["Jueves Santo de 1947. <i>“Así como los malos deseos son la fuente de todos los males, también los deseos buenos son el origen de todo bien. Ejercítate a lo largo del día en piadosos deseos de unión conmigo, de purificación de tus defectos, de lamentación por tus pecados. Y finalmente, de deseos continuos de estar conmigo en todo momento.”</i>"],[52]],[1597,["8 de abril. Yo había estado cuidando el jardín y Le pregunté: ‘Señor, ¿estas contento?’ Él: <i>“Estoy contento, pero no porque hayas trabajado en el jardín. Estoy contento porque pensaste continuamente en Mí. Lo que Me importa no es lo que haces, sino el abrazo de tu amor.”</i>"],[1]],[1598,["10 de abril. Hora Santa. Yo: “Te acompaño, mi Señor, en el Huerto de los Olivos.” Él: <i>“Tu fidelidad Me es preciosa, un homenaje que Me consuela. En Mi Amor encuentro natural sufrir los horrores de la muerte, pero cuando vosotros os ofrecéis para sufrir y compartir conmigo Me siento herido por una flecha en el Corazón, y quiero ser con vosotros un solo impulso de Amor, para que el Padre nos vea con la misma Mirada. Mi Sensibilidad es única; todo pensamiento compasivo resuena en Ella. Incluso cuando vosotros no sepáis bien lo que hacéis, aun cuando todo sea un mero ensayo. Siempre tomo en cuenta el menor movimiento bueno en vosotros y Me deleito en él.”</i>"],[36]],[1599,["17 de abril. Hora Santa. <i>“Nunca te encuentro, hija, suficientemente cerca de Mí, nunca te he comunicado todavía bastante Mi Palabra íntima. Sigo con Sed. Tú piensas: ‘¡Qué difícil es satisfacerlo!’ Pero debes creer que un pequeño esfuerzo vuestro y un gesto cualquiera Me arrebata, al modo como una madre se encanta cuando ve en el rostro de su hijito una expresión nueva.</i>\n<i>“Yo espero, como felicidad personal, vuestros progresos en el amor. Porque todo lo vuestro es para Mí algo personal. Vosotros, Mis amigos, sois parte de Mí mismo, así como Yo formo parte de vosotros. ¿Por qué tendría que ser Yo solo quien deseara esta Unión? ¿No La queréis vosotros también?</i>\n<i>“Para un Amigo es penoso tener que estar siempre insistiendo: ‘ámame, piensa en Mí, trabaja por Mi causa, dame tu vida’. ¿No crees que un Amigo así estaría feliz si Lo adivinaran? Y cuando esto sucede, es para Él como un flechazo de felicidad.”</i>"],[3]],[1600,["Montmartre, 25 de abril. Faltaba una de las lamparitas que arden ante el Santísimo Sacramento. Le dije: ‘Señor, ¿me permites que ponga allí mi corazón a arder para reemplazarla?’ Me contestó: <i>“Arder no sería suficiente: hay que consumirse hasta el fin. Es lo que hice por vosotros, ¿Sientes tú el deseo de hacerlo por Mí? Para ello, tienes que simplificarlo todo en ti, rumbo a una sola meta, y en un solo movimiento hacia tu gran Amigo. ¿No piensas que eso es tu reposo, tu fin, y que esto cambiaría tu ser entero? ¿No te parece que Mi Llamamiento es una bendición? ¿Y que si respondes a ella te establecerás en la alegría?</i>\n<i>“Responde, pequeña. Responde sin cesar y tus fuerzas crecerán. Y tendrás qué dar a los otros, y tu fuerza pasará de alma a alma, como una antorcha que pasa de mano en mano. Pero la Fuente Soy Yo. Bebe en Mí directamente.”</i>"],[1]],[1604,["2 de mayo de 1947. En Roma. <i>“Ve en Mí al Amor indulgente. Si Me ves como severo, Me causas pena y Me detienes. Yo Soy el Amor. Mírame como la Dulzura, la Delicadeza, la Ternura. ¿Me perdonarás si te lo digo y te lo repito? Modifica tu mirada. Ensaya.”</i>"],[30]],[1605,["3 de mayo. Roma. En la Capilla de las Esclavas del Santísimo Sacramento.<i> “No Me tenéis confianza suficiente. ¿Quién Me dará esas miradas de abandono que espero de vosotros?”</i>"],[9]],[1607,["5 de mayo, en las Catacumbas de Santa Domitila, durante la Misa. <i>“Otras veces te he hablado de tu mirada, ahora quiero hablarte de la manera de mirarme. Confianza. Donación.”</i>"],[29]],[1609,["Rocca di Papa. En el funicular que lleva a Nuestra Señora del Tuffo. <i>“Alcanza finalmente el grado de intimidad que Yo he querido pera ti. Echa abajo toda barrera. Entra en regiones insospechadas.”</i>"],[26]],[1610,["22 de mayo. En Roma.<i> “Debes llegar a desear la muerte, pues te lleva a tu Fin. Ya se acerca. Siente por ello una gran alegría. La muerte lleva a la Vida. Entonces, todo lo que ha de suceder tiene poca importancia para ti. Lo importante es agradarme.”</i>"],[31]],[1611,["22 de mayo. Yo estaba pasando por una serie de angustias. Me dijo: <i>“No te resistas a esta prueba. Es posible que Yo la necesite para la salvación de un pecador. Más tarde verás todo lo que ha salido de tus sufrimientos, para ti y para los demás.</i>\n<i>“Y ahora que has aceptado el sacrificio, ¿no te sientes más desligada de la Tierra, y como dispuesta para la partida?</i>\n<i>“Fija tus ojos en la Verdad... Que vivir sea para ti como un lenguaje de amor en Mí y para Mí. Que los instantes que te quedan no sean sino bondades, ternuras, don de ti. Recuerda cómo la víspera de Mi Muerte, en la Ultima Cena, todo Mi Ser se manifestó en Amor.</i>\n<i>“‘Como Él’, podría ser tu lema. Tendrás plenitud de alegría y de paz, pues Yo te voy a ayudar: el Amor no Se detiene. Y cuando veo el trabajo de un alma de buena voluntad, tomo sobre Mí, lleno de cariño, la mayor parte. Cree y llegarás a amar.”</i>"],[37]],[1613,["29 de mayo. Yo estaba llena de alegría esperando visitas. Me dijo: <i>“¿Piensas de cuando en cuando en la Alegría con que te espero en el Cielo? Si tú, tan limitada, sientes emoción cuando llegan tus visitas, ¿cuál no será la Mía al recibir a Mis hijos allá arriba? Ojalá que lo comprendas: Yo, siendo Dios, tengo también Mis Alegrías interiores, como vosotros las tenéis. Sois de Mi misma Raza. Yo conocí, como vosotros, los estremecimientos de la emoción. ¡Desea!”</i>"],[6]],[1614,["29 de mayo. <i>“Entrégate al pensamiento de la fiesta del Encuentro, tú que has organizado tantas fiestas. Hazme el honor de creer que Yo sé también organizar las Mías. Es el programa del Amor.”</i>"],[6]],[1616,["10 de junio. Octava de Corpus, desde la Custodia me dijo: <i>“Mira cómo te miro.”</i>"],[29]],[1617,["15 de junio. Fiesta del Sagrado Corazón. Él: <i>“Enciérrate en Mí. Si tú supieras Quién Soy, Me rogarías hoy por todos los pecadores; los que tú conoces y los que no. Enciérrate en Mí para no salir ya nunca, como una hermana enclaustrada y el Claustro es Mi Corazón. En Él vivirás, en medio del Mundo.</i>\n<i>‘‘No temas la transformación. Abandónate al cincel que talla: todo es para tu bien. Mi Amor llega a la locura, y el bien que quiero hacer a este o a aquel, lo quiero hacer por tu medio. No siempre te darás cuenta. Habrá ocasiones en que te preguntarás: ‘¿Quién fue el que habló aquí? ¿Fui yo o fue Él?’ Yo Me hago Uno con Mi creatura fiel. Es Mi Deseo. No el de una unidad pasajera, sino perdurable...”</i>"],[4]],[1618,["17 de julio. En la Hora Santa.<i> “No puedo retirar lo que te he dicho: que las almas que se Me entregan son las que más cerca están de Mi Corazón. ¿Por qué te asustas al ofrecerte cada mañana? ¿Te faltaría acaso Mi Gracia? Y luego, ¿las víctimas no son inmoladas todos los días? Se las guarda aparte, se las alimenta de manera especial para que su vida suba como un holocausto reparador y fecundante. Yo fui Víctima todos los días de Mi Vida. ¿No quieres ser Mi hermana?”</i>"],[37]],[1619,["19 de junio.<i> “¿Qué eres tú sin Mí? Y si no quieres separarte de Mí, ¿por qué no buscas unirte más a Mí? Nada te lo impediría. Tú comulgas por la mañana; puedes pasar el día en acción de gracias. ¿Qué te lo impide? Tú quieres amarme en toda ocasión ¿Y qué si te encuentras rodeada de gente? Puedes seguir amándome en tu prójimo.</i>\n<i>“Y cuando sobrevenga alguna circunstancia alegre, recíbela como a Mí Mismo. Cuando Me escondo, a vosotros os toca descubrirme. Trata de ganar en este juego, que es el Juego de Dios. Y cuando ganes, cree que Soy Yo Quien ha ganado más. Yo, el más sensible.”</i>"],[54]],[1620,["<i>“¿Estar atenta? Es hacer el vacío en ti para dar lugar al deseo de Mí. Entonces vengo.”</i>"],[41]],[1621,["19 de junio. Yo miraba millares de florecitas amarillas en forma de estrellitas y pensaba en el firmamento. Me dijo: <i>“Si Se consideraran Mis Obras con mayor frecuencia que las obras de los hombres, ¡qué fácil sería acercarse a Mí! Pero los pensamientos están fijos en la Tierra. Tú búscame. No una vez al día, sino en todo tiempo. Que tu vida sea Mía sin interrupciones. Si respiras es porque estoy contigo, porque continúo manteniéndote en el ser. Que tu aliento sea el Mío. ¡Es tan simple!”</i>"],[52]],[1624,["26 de junio. <i>“No son los labios los que deben orar, hija, sino que es tu corazón el que debe mirarme y hablarme. ¿Adviertes la diferencia? La hay para ti que Me hablas y para Mí que te escucho.</i>\n<i>“Primero, ponte en Mi Presencia. ¡Es tan dulce! O, ¿no Me amas lo suficiente como para estar feliz ante Mí? Adquiere el hábito de estar en Mis Brazos. ¿Quieres ensayarlo ahora mismo? Yo te ayudaré. Yo te enriquezco cuando tú Me muestras confianza.”</i>"],[34]],[1625,["En Redon, el 27 de junio. Al despertar. <i>“La manera del coloquio es más importante que el coloquio mismo: háblame con el entusiasmo del amor.”</i>"],[34]],[1626,["1º de julio da 1947. A las cuatro de la mañana cantaba un pájaro. Me dijo:<i> “¿Cuántos corazones Me cantan al despuntar el día? Tu no dejes nunca de hacerlo, pues la Naturaleza que os habla es Mi Voz.” </i>(En Misa)<i>. “¿Tu vida? Toda Unión.”</i>"],[39]],[1627,["10 da julio. Hora Santa. <i>“¿Vives para Mí? ¿Me amas lo bastante como para no querer otra cosa fuera de Mí?</i>\n<i>“Obra siempre como si Me vieras con los ojos y Me sintieras con el corazón. Siempre estoy contigo. Por eso, debes buscarme no solamente en lo exterior de Mi Vida, sino en Mi Interioridad, La que tengo con Mi Padre, Mi continuo ofrecimiento por vosotros. Mis Reparaciones, Mis Silencios de Amor. Mis humildes Sumisiones de Hombre-Dios ante Mi Padre.</i>\n<i>“Y como siempre, únete. Piensa que eso Me causa un deleite que tú no sospechas siquiera. ¿No te gusta complacer a tus amigos… entonces?”</i>"],[54]],[1630,["27 de julio. Durante la Misa Mayor. <i>“¿No te ha venido nunca el pensamiento de que todavía no has nacido? Porque el verdadero nacimiento es la entrada en la otra Vida. Prepárate... Prepárate…</i>\n<i>“Piensa en la vida del gusano que se arrastra sobre la tierra y luego se convierte en crisálida. Y la crisálida lleva una vida secreta y oculta, que finalmente se transforma en mariposa multicolor, que vuela libremente. Alégrate de que pronto vas a nacer a la Vida en Plenitud.”</i>"],[38]],[1631,["31 de julio. Hora Santa. <i>“No interrumpas nuestros coloquios con pensamientos extraños que podrías fácilmente alejar de ti. Entra en ti misma; allí Me encontrarás siempre, ya que Me amas y guardas Mi Palabra.</i>\n<i>“Entonces Yo vengo y Me instalo en ti. Y aun cuando no te hable, ahí estoy. Ponte a Mis Pies, dispuesta a escucharme. Pon tu voluntad al unísono de la Mía: esto es la Unión. Es así como Yo Me mantenía siempre ante Mi Padre: ‘Que se haga Tu Voluntad y no la Mía’.</i>\n<i>“Y en eso mismo reconozco Yo a los Míos: son los que renuncian a sus deseos para entrar en Mis Caminos. Esos Me irradian sin saber que Me irradian. El Espíritu los posee y Se expresa por ellos.</i>\n<i>“Pide con frecuencia esta invasión del Espíritu. Él sopla donde quiere, pero mucho más en aquellos que Lo llaman.”</i>"],[41]],[1633,["1633.<i> “Pide a Mi Madre la Gracia de vivir con Ella, en nuestra compañía.”</i>"],[28]],[1635,["9 de septiembre de 1947. Lourdes, en la Gruta. <i>“Los tres juntos: Yo, Ella y tú. Yo recibo con Amor, Ella lo transmite y tú te ofreces con toda la vehemencia que te sea posible. Y el Padre nos ve.”</i>"],[28]],[1636,["11 de septiembre, en la Gruta. <i>“Despréndete de ti misma y ve si aquí mismo estás obrando por Mí o por ti. No existas ante tu propia mirada. Converge toda tú hacia Mí. Sobre todo en tus pensamientos, porque de ellos dependen tus acciones. ¿No podrías hacer en medio de tu día un pequeño examen de conciencia que te pusiera en directa relación conmigo? ¡Te llamo con tanta frecuencia! Pide a Mi Madre la Gracia de vivir como Ella y en nuestra Compañía, que es mucho más real que el Mundo entero.</i>\n<i>“Entra en Mí. La vida de tu alma es la que importa y todo le debe quedar subordinado. Y Yo, en tu centro. Todo debe ser Mío y para Mí, pues somos Uno, como Yo lo Soy con Mi Padre. Te he dado el ejemplo, pequeña: en esta gruta bendita entrégate toda entera y para siempre. Y tu Madre será la que firme el trato.”</i>"],[23]],[1637,["18 de septiembre. Le Fresne. Hora Santa. <i>“¿Has comprendido bien que puedes venir a reposar en Mi Corazón? Y si ya lo comprendiste, ¿por qué no vienes? Me causas una privación. Me veo obligado a esperar y a no insistir, pues Yo respeto vuestra libertad. Aquí estoy. Deseo que seas Mía. ¡Y tú no vienes! Te pido solamente que pienses en esto más frecuentemente; entonces, vendrás más a Mí.</i>\n<i>“Y Yo te daré Mi Amor, Mi Paciencia para con el prójimo. Comprenderás que el prójimo Soy Yo, y tú irás a él por amor mío, con sencillez, y siempre consciente que vales menos, como si fueras la última entre todas las almas.”</i>"],[13]],[1638,["21 de septiembre (en Misa adoraba Sus Ojos). Él dijo: <i>“Son Ojos que ven.”</i>"],[29]],[1639,["25 de septiembre. <i>“Semejante al amor a Mí es el amor al prójimo. ¡Qué programa, pequeña, si lo entiendes! ¡Cómo buscarás al prójimo para encontrarme a Mí y servirme en él con delicadezas que lo sorprenderán y lo conmoverán! Porque nada logra tanto como la bondad, la bondad que va por delante.”</i>"],[5]],[1640,["25 de septiembre.<i> “Dedícate a la bondad. A esa bondad que toma la delantera y prevé las cosas. Y en el don, añade también la simpatía. Así pacificarás y consolarás a tus hermanos.</i>\n<i>“¡Cuánto daño puede causar, en cambio, una palabra áspera! Nadie puede calcular su alcance, pero Yo lo veo. Que tu influencia sea la de la dulzura más exquisita, así obtendrás más. Recuerda cómo era Yo con los niños, con los pecadores, con la mujer adúltera, con Magdalena, y como Soy contigo. Infinitamente paciente y dulce. Sé Yo para los otros. ¡Pobre pequeña, tan débil! Yo estaré en tu corazón cuando hables con el corazón.”</i>"],[5]],[1641,["2 de octubre de 1947. Yo sabía que Él estaba muy cerca. Me dijo:<i> “¿Por qué habrías de admirarte si te invado? Yo querría invadir a todas las amas. ¡Qué júbilo para Mí si lo consiguiera! ¡Imagínate lo que sería la vida en el Mundo si todos los hombres Me amaran e hicieran Mi Voluntad! La vida sería dulcísima, pero nunca podrán comprender lo que pierden al odiarme a Mí, al odiarse entre ellos. Tú, siembra bondad, siembra; y de manera especial entre los malvados. Acuérdate de Mí e imítame. Reprodúceme, más en los actos que con las palabras.</i>\n<i>“Mi Amor se complace en el vuestro, como espejos que se reflejan mutuamente hasta el Infinito. ¿No te hace feliz pensar que reflejas a tu Dios? Un Dios tan tuyo que quiso crearte a Su Imagen. Este es el motivo por el cual pido incesantemente la Unión. ¡Qué fuerza hay en un Deseo divino! Sobrepasa todo cuanto puedas imaginar. Hazme el honor de admitirlo. Tengo Sed, ¿comprendes? Sed de vosotros. Dadme de beber.”</i>"],[26]],[1642,["2 de octubre. <i>“¿No crees que Mi Madre, tan silenciosa, dejaba por todas partes una huella elocuente de santidad?”</i>"],[28]],[1643,["9 de octubre. Él: <i>“Dime que hay momentos en que te sientes segura de Mí. Esto Me consolará de tu inseguridad de otros...”</i>"],[9]],[1644,["9 de octubre. Hora Santa.<i> “Nacer para Dios. Conocer a Dios. Todo sucede en tu interior, bajo la moción del Espíritu. ¿Te acuerdas de aquella piscina en que un ángel movía el agua para curar a los enfermos? Nadie sabía en qué momento iba el agua a moverse. Está pues, siempre atenta y dispuesta, con respeto y amor. Y el Espíritu pasará. Con Su Fuego de luz interior, ese Fuego de dulzura y de bondad que te invade de repente. Espera, pues, Su paso en ti, con recogimiento y atención. Este nacimiento tuyo en el fondo de ti misma, más fiel que de costumbre, te hará conocer un poco mejor ‘lo Incognoscible’. ¿No crees que vale la pena prepararte?”</i>"],[48]],[1645,["17 de octubre. En París. Me vino la idea de que resulta monótono empezar cada día con el ofrecimiento de obras. Él me dijo con viveza.<i> “¿Por ventura no comienzo Yo cada día ofreciéndome en la Misa? ¿Acaso Me pareció que con una sola vez era bastante? ¡Cómo te cuesta darte a Mí con frecuencia; a Mí, que siempre te estoy esperando...! Él amor multiplica las palabras sin por eso repetirse…”</i>"],[25]],[1646,["23 de octubre, ‘Señor, ¡soy tan poca cosa! Aun lo que tengo lo tengo porque Tú me lo diste.’ Él: <i>“Pídeme más. Pídeme cosas mejores, Y aunque estés todavía lejos de la perfección pídemela sin cesar, para acercarte a Mí. ¡Cuántas Gracias perdéis simplemente por no pedirlas!”</i>"],[33]],[1647,["23 de octubre. Le Fresne. Hora Santa. <i>“Dime, ¿te he abandonado alguna vez? ¿Te has llegado a arrepentir de haberte entregado al Amor? ¿Has podido decirte alguna vez: ‘Yo había creído que había Dios, pero me equivoque?’ Mis Favores han hablado por Mí y tú Me has podido reconocer en la delicada urdimbre de tu vida. Entonces, ¿por qué la confianza no ha crecido en ti conforme crecían Mis Dones?”</i>"],[9]],[1648,["30 de octubre. Hora Santa. <i>“Es triste es la falta de comunicación entre el Creador y la creatura, es como un silencio de muerte. Trata de comprender Mi Presencia en tus actividades. Yo obraré en ti si tú consientes. Vendré si Me invitas. Que nada te turbe. Date a Mí tal como eres. ¿Por qué tendrías que esperar? Tu empeño por llegar a Mí tendrá una especial recompensa. Cuando se camina se avanza poco; hay que correr hacia Dios.”</i>"],[34]],[1649,["30 de octubre. Yo tenía un dolor en la espalda y pensaba en el peso de Su Cruz. Me dijo: <i>“Todo sufrimiento que Me ofreces por amor, Me alivia Mis Sufrimientos. Porque Yo lo veía todo por anticipado, hasta el fin del mundo.</i>\n<i>“Si Me amas, regocíjate en sufrir, pues así estamos unidos. Trabajemos juntos por la conversión de los pecadores y por la extensión de Mi Reino. Ten confianza en Mis Ojos, que ven lo que tú no ves. Y que tu intención sea siempre la de servir a Mis intenciones. Con esto aumentará tu fuerza para sufrir. Pídeme esta fuerza, mi pequeña. Es siempre una fiesta para Mí cuando tú Me pides a1go, porque Me das la ocasión de concedértelo, y eso es la Vida entre nosotros dos.”</i>"],[36]],[1650,["9 de noviembre. <i>“Refiérelo todo a Mí. Yo presido tu vida, puesto que estoy en ti y tú estás en Mí. No como dos frentes que se tocan, sino como uno en el Otro.”</i>"],[54]],[1651,["9 de noviembre. En Misa. Yo miraba entrar a una persona. <i>“¿No podrías mortificar tus ojos? Haz que Me miren a Mí en tu interior. Teme aquello que te aleja de Mi Pensamiento, y busca lo que a él te acerca. ¡Hay tantas cosas que se siguen de una mirada! Y tantas que proceden de un pensamiento. Hazlo todo para conservar Mi recuerdo. Refiérelo todo a Mí.”</i>"],[29]],[1652,["13 de noviembre. Pensaba: ‘¿Que voy a escribir?’ <i>“¿Habrá habido alguna sola vez que haya dejado de venir a ti? ¿No estás segura de Mi Fidelidad? ¿No tengo siempre para ti cosas viejas y nuevas en las Riquezas innumerables de Mi Corazón? Son un Fuego incesante de Amor, un Rayo intenso que no puede extinguirse.”</i>"],[15]],[1653,["13 de noviembre. <i>“¡Cómo ignoráis vosotros la Fuerza de vuestro Dios! ¿Tenéis miedo de conocerlo puesto que Lo buscáis tan poco? Pero la alegría de vuestras almas está en la comunicación habitual con vuestro Creador y Salvador. Abandonaos a Dios, haga Él lo que hiciere, dejaos llevar y secundad con celo Su Soplo.</i>\n<i>“Tú ve a Él con entusiasmo; Él tiene todas las respuestas para tus necesidades de cariño, de reposo, de inteligencia. Pero vuestros pensamientos son cortos. Prolongad cuando menos vuestros deseos a fin de alcanzar el nivel superior donde el Espíritu os aguarda para haceros subir aún más.</i>\n<i>“Pero que todo se haga en alegría, pues la alegría aumenta la Gloria de Dios. Un padre de familia no estaría contento si sus hijos fueran a presentarle sus obsequios por temor y con rostro sombrío. Dilata tu corazón, Mi pequeña, cuando te acerques a Mí, como una niña feliz. Tú piensas: ‘Él me pide siempre sonrisas interiores’. Pues, ¡sí! ¿Me creerás si te digo que siendo Dios como Soy necesito de la sonrisa de los hombres y experimento una urgencia extrema de que sean felices? Esto no lo podéis comprender; ni siquiera resistir semejante pensamiento. Cree. Es Mi Amor el que te habla y hay que escuchar Mi Voz por encima de toda otra voz.”</i>"],[0]],[1654,["20 de noviembre. Hora Santa. <i>“A vosotros, cuando se os colma, os acostumbráis a ello. Yo, en cambio, nunca Me acostumbro a vuestro afecto, siempre lo recibo y lo siento como si fuera la primera vez.</i>\n<i>“Si lo pensarais multiplicaríais las palabras que Me alegran y entre ellas, las más simples, las que se ofrecen sin buscarlas, pues salen espontáneas cuando Me miráis en vuestro corazón. Haz cuanto puedas por Mi Reino en la intimidad de los corazones. A algunos les he sido presentado, pero no Me reciben. ¡Y Yo, que querría vivir con toda sencillez vuestra vida cotidiana!”</i>"],[2]],[1655,["20 de noviembre. Le Fresne. Hora Santa. <i>“¿Crees en Mí? ¿De veras? ¿Estás segura de que estoy en ti y de que te he amado hasta la Locura de la Cruz? ¿Te acuerdas de Mis Bondades, de las que he tenido para ti y para el universo entero? Repasa la cuenta de Mis Favores y dime si tu vida puede ser lo bastante larga como para agradecérmelos todos... “Dime que en todos los instantes de vida que te quedan tu agradecimiento Me expresará su amor; esto Me será dulce. Tu cariño Me ‘pagará’.”</i>"],[22]],[1657,["26 de noviembre, después de la comunión.<i> “Oro al Padre desde ti”.</i>"],[35]],[1658,["27 de noviembre, Hora Santa. Yo regresaba de tomar el té en la casa del conde de S. <i>“Ahora olvídate del Mundo y mírame. He estado contento de que hayas hablado de la soledad fructuosa de los prisioneros, que los acerca al contacto divino. ¿Notaste cómo se fue elevando el tono de la conversación? En esto has sido Mi instrumento. Que así sea siempre. Considera que tengo en la Tierra pocos instrumentos. Pide al Espíritu Santo que guíe tu espíritu. No hables según lo que tú piensas, sino según pienso Yo y en Mi lugar.</i>\n<i>“¿Sabes cuándo hablas como Yo? Cuando pones bondad en lo que dices. Cuando conmueves. Cuando respondes con simpatía a una observación acre. Cuando disculpas. Cuando sirves. Cuando das. Cuando pacificas un carácter enojoso. Cuando consuelas. Cuando mantienes una inalterable igualdad de humor. Cuando permaneces humilde sin buscar sobresalir. Cuando te muestras reconocida por la amabilidad de otros. Cuando eres generosa. ¿Quién más generoso que Yo? ¿Y más dulce y más humilde? Todo esto es para ti. Eres parte de Mi Cuerpo Místico.”</i>"],[5]],[1659,["27 de noviembre. <i>“Mis Atributos son tuyos, pues formas parte de Mi Cuerpo Místico. Debes recibirlos con amor, porque Yo Los poseo y deseo tanto cubrirte con Ellos. Soy como un Esposo que sufriera por la pobreza mendicante del traje de su esposa, y entonces emplea todo su arte para enriquecer su belleza, en vista de la Gloria de Dios.”</i>"],[54]],[1660,["4 de diciembre de 1947. <i>“Cuando hayas entrado en la Luz, comprenderás. Mientras tanto, andarás a tientas en la Verdad, no tendrás Amor sino a migajas, pues de otro modo serían heridos tus ojos mortales.</i>\n<i>“Cuando tu mirada se hunda en lo infinito, conocerás tu miseria por primera vez, y te invadirá una inmensa gratitud de que Dios mismo Se haya puesto en movimiento por la nada que eres.”</i>","4 de diciembre de 1947. Yo: ‘Quizás ya no pueda yo vivir sino para agradecer...’ Él: <i>“Se agradece amando, uniéndote a Mí en todo momento. Teniendo por imposible que tú estés ahí y Yo quede afuera. Donde estás tú, estoy Yo. Mi Amor por ti es inmenso y tu trabajo consiste en esforzarte por llegar a creerlo. ¿Es tan difícil? Ensaya, pues.</i>\n<i>“Considera con mayor frecuencia Mi Vida humana; eso te dará fuerza para la imitación. Y puesto que quieres imitarme, debes usar los medios: mirarme, llamarme y amarme.”</i>"],[6,22]],[1661,["11 de diciembre. Hora Santa. <i>“Hija, aun cuando todo lo perdieras en tu cuerpo y en tus bienes, aun cuando se desvanecieran todos los afectos de tu corazón y te encontraras sola y desconocida por todos, Yo seguiría siendo tu Tesoro, el Amigo único, tu Principio y tu Fin.</i>\n<i>“Nada te turbe. Fija tu corazón en el Mío, lo mismo en la alegría que en la pena. Cuando te colmo de Favores, Soy tu paz; y si te someto a la prueba, Soy tu compañero. Nada de Mí se interrumpe en ti… si tú Me aceptas. ¿Entiendes, finalmente, que naciste para la Unión? Comienza, pues, desde ahora. Aprieta el nudo. Que alcances la Gracia que fue concedida a la Inmaculada, que nunca Me abandonó en Su Corazón. Tú tampoco Me dejes. ¡Nunca! Y Me vendría la tentación de darte las gracias...”</i>"],[1]],[1662,["11 de diciembre. <i>“El peso de Mi Amor por los hombres se hace siempre más grande. Y crecerá hasta el fin de los tiempos. ¿Quién lo puede creer? ¡Cómo no se reirán! Si supieras cuántos malvados hay que Me destrozan. Y no solamente en sus almas, sino en las de los otros, en las de los niños. Si lo supieras, Me darías alojamiento en ti. En tu memoria, en tu entendimiento, en tu voluntad.”</i>"],[2]],[1664,["25 de diciembre de 1947.<i> “¿Has comprendido la Gracia de la Navidad? No dejarme a Mí, ni a Mi Madre, durante todos los momentos de tu vida. ¿No crees que somos dignos de acompañarte en todo tiempo y lugar? ¿Crees tú acaso que José, en Belén, podía olvidar un solo instante sus dos Tesoros? En su corazón, todo se refería a Ellos. Haz tú lo mismo. Será inmensa tu alegría de servir a un Dios-Niño, el más amable de los niños... Penétrate de Mi Humildad de niño, porque Yo fui humilde por vosotros.</i>\n<i>“¿No querrás venir todos los días al Pesebre en busca de una lección? Ven diariamente, hasta la Purificación: ahí te cito. Una cita de Amor. Es el Amor, que quiere ataviarte con Mis Vestiduras, que son las virtudes. Y Mis Virtudes son tan poderosas que el Mundo mismo las admira al pasar. Pero es indispensable dejarse vestir y adornar con una voluntad siempre dirigida a lo mejor.”</i>"],[32]],[1665,["25 de diciembre. <i>“No hay que tener miedo de tender a la perfección. Yo estoy ahí, y Mi Delicia está en tomar posesión de vuestras almas. Entonces, ya no estáis solos, Me tenéis a Mí. El Amor llama al amor. Tú respóndeme. Tengo Sed de ti. ¿Qué es lo que te intimida? ¿Tus negligencias repetidas? ¿Tus insuficiencias? ¿Tu falta de percepción o tu ausencia de pensamientos, o los malos recuerdos? De todo eso Me encargo Yo. Recojo del suelo las miserias y las convierto en esplendores. Dámelo todo. ¿Te atreverías a decirme que hay algo en tu vida que no sea Mío? Cuando se llega a ser una sola cosa...”</i>"],[47]],[1668,["3 de enero de 1948. <i>“Vuelve a tener confianza en tu humilde camino. Siempre más cerca de Mí. Ya sabes que no eres sólida y que tus cimientos no pueden estar sino en Mí. Cuando tú te derrumbas, Yo recojo los fragmentos y hago con ellos un templo nuevo más hermoso, porque tú te habrás humillado. Piensa en esto para que llegues a amar la humillación. Yo, que Soy Dios, la viví durante todo Mi Tiempo en la Tierra. Estás así en buena compañía. Lo que hace sufrir al Amor es la indiferencia, la apatía, la no actividad. Muchas almas están conmigo como si Yo estuviera muerto. Pero Yo, hija, estoy vivo, cerca de ellas, en ellas, esperando que Me hablen y Me sonrían, y que su corazón palpite por Mí. ¡Es tan poco lo que exijo! ¡Me contento tan fácilmente! Lo único que pido es ser invitado. Del festín Me encargo Yo.”</i>"],[23]],[1669,["3 de enero de 1948.<i> “Aun cuando no hayas podido cumplir tus propósitos, aun cuando hayas caído más bajo que ayer, si te desprecias, si te arrepientes y vienes a decírmelo, no dudes en creer que te tengo en Mi Corazón...</i>\n<i>“Yo no Soy rencor, sino Misericordia. Os llevé como lleva una madre a sus hijos cuando cargaba Mi Cruz. Imagínate entonces, si puedes, la Ternura con que os oigo cuando Me contáis vuestras faltas, y la avidez con que las perdono... ¿quién podría comprender la Ternura de un Salvador?</i>\n<i>“No Me ofendas con el temor y la huida: ambas lastiman al Amor. Al contrario, entra en Mi Inmensidad como el niñito que bebe alegremente y se duerme en el seno de su madre. Descansa y fortalécete. Bebe alegría. Todo eso lo tengo en Mí y todo es para ti.”</i>"],[12]],[1670,["10 de enero. Hora Santa.<i> “¿No es verdad que te encanta esa hora en que nos acercamos Uno al otro con tanta intimidad que Mi Pensamiento lo sientes como tuyo, como si nuestras almas se fundieran? Pero mucho mayor es Mi Alegría. Porque Yo quiero esta Unión con tanta fuerza, que para lograr la fusión entre Mi creatura y Yo, inventé la Eucaristía.</i>\n<i>“¡Oh, Espíritu nuevo, que deroga la antigua ley del temor que pesaba sobre el Pueblo de Dios! Todo cambió cuando vine a la Tierra. Porque Yo morí, vosotros tuvisteis la Vida: y la Vida es el Amor. No hay otra.</i>\n<i>“Simplifícalo pues, todo en el Amor. Mi pequeña; cree y espera en Él, y Me consolarás del odio del Mundo. Y mientras más ames, más querrás amar. Proponte un cuarto de hora al día en que nada hagas sino amar. Cuando eras niña, hacías ejercicios de francés. Ahora, dedícate al divino ejercicio; ya de día, en la intimidad de tu corazón; ya de noche, si te despiertas y Me buscas. Despiértate en Mi Amor. Búscame con amor y Yo Me dejaré apresar. Y recomenzaremos de nuevo, hasta que, fatigada, te dormirás sobre Mi Corazón.”</i>"],[18]],[1672,["19 de enero. En medio de una íntima dulzura. <i>“En el momento de la muerte de Mis amigos Yo vengo a tomarlos suavemente, con las delicadezas que tú bien conoces, para introducir sus almas en el Reino.</i>\n<i>“Todo lo que puedas imaginarte sobre el encanto de Mi Corazón enamorado se queda muy por debajo de la realidad. Recuérdalo: tanto quise realizar vuestra alegría que vine al Mundo para conocer el sufrimiento. Y cuando os veo sufrir, y sufrir por Mí, recojo con Amor vuestros sufrimientos, como si los vuestros fueran mayores que los Míos, como si los vuestros tuvieran un valor que Yo hiciera infinito. Cuando vosotros Me lo permitís, Yo fusiono vuestra vida con la Mía.”</i>"],[31]],[1675,["Por la tarde. <i>“Ve más allá de la belleza, más allá del encantamiento. Llega hasta Mí.”</i>"],[3]],[1676,["22 de enero. Hora Santa. Yo: ‘¿Quieres, mi Señor, que hablemos de tu Amor?’ Él:<i> “Yo Soy como un tímido. Quisiera que Mi Amor lo adivinaran, temiendo que si Lo manifiesto se piense que Lo quiero imponer. Sois libres. Pero Mi Alegría es inmensa cuando por Vosotros mismos usáis vuestra libertad para buscar los medios de aumentar el número de nuestros encuentros y la hondura de nuestra Intimidad. Yo os dejo venir y llamarme. Me escondo para aumentar vuestro deseo. Y cuando os sentís perdidos, Yo he estado ahí, con todos Mis Dones.</i>\n<i>“Lo que os falta, hijitos queridos, es la Fe segura; esa Fe que es como otra segunda vista, la más fuerte, la que os pone en condiciones de juzgar las cosas de la Tierra según Mi Pensamiento. ¿No quieres hacer ejercicios de Fe? ¡Qué impulso recibiría tu plegaria! Y tus comuniones y la vida interior de todos tus días. ¿Quieres probar? Piensa que en la misma proporción que la Fe, crecerán en ti la Esperanza y la Caridad. Me estarás más cerca.”</i>"],[21]],[1677,["26 de enero. Yo estaba rodeada de gente.<i> “Cuando les sonríes, les das la comunión del espíritu.”</i>"],[5]],[1678,["29 de enero de 1948. Hora Santa. <i>“Cree, hija, que Soy feliz si estás una hora Conmigo. ¿Tu miseria te impide creerlo? Pero si es precisamente tu miseria lo que Me atrae hacia ti. Te habito y te purifico: tus facultades se llenan de Mí, tu memoria y tu entendimiento se limpian al contacto Conmigo. Tu voluntad está en la Mía. Quiero estar siempre en ti, como quiero que estés tú en Mí”.</i>"],[34]],[1679,["12 de febrero de 1948. Yo regresaba de París y en la soledad de la campiña Lo sentía tan cerca de mí que no sabía cómo darle gracias. Me dijo: <i>“No te admires de esta Presencia Mía, que obra en ti como una toma de posesión. Adquiere el ‘hábito de Mí’. Es un hábito muy dichoso, porque vivimos juntos. Penétrate de Mi Unión. Déjate conmover. Di para ti misma: ‘Es Él, que va pasando; que Se quede en mí, pues es Él Quien va a vencer’. Y así lo haré, como un águila que se lanza sobre la presa.</i>\n<i>“Hay ocasiones en las que se ofrece un regalo sin decir nada... A veces Me digo: ‘lo adivinarán...’ pero ¡cuántos reciben el regalo y no piensan en Quien se lo dio! Y no es Mi Honor el que sufre, sino Mi Amor. Tú, hija, no hagas nunca sufrir al Amor…”</i>"],[39]],[1681,["19 de febrero de 1948. <i>“Humíllate por tus faltas. Descended con el pensamiento hasta el fondo de vuestra miseria. Reconoced vuestros acostumbramientos rutinarios, vuestra negligencia en considerar el modelo que es Mi Vida. Vuestra fatuidad satisfecha en cualquier situación. Tú, hija, ¿tienes el alma llena de Mí? ¿No respiras sino para Mí? ¿Estimas tus intereses por encima de los Míos? ¿Te has envuelto en Mis Preocupaciones? ¿Te tomas la parte que te corresponde en la conversión del Mundo? ¿Puedes, pensando en Mis mártires, decir que tú estabas ahí con ellos, por lo menos con la intención y el pensamiento? ¿Quién Me ayudará si vosotros que comulgáis Mi Cuerpo no os apretáis conmigo?”</i>"],[23]],[1683,["5 de marzo de 1948. <i>“¿No crees tú que un alma debe reproducirme para poderme transmitir? Un espejito chico puede reflejar a otro espejo grande y si el espejito fuera un ser viviente, sería felicísimo de reproducir exactamente el espejo grande en una de sus partes. Todas las almas, hija, están invitadas a reproducirme; con una invitación que se les hace en el Bautismo y se les renueva en la recepción de los otros sacramentos. A vosotros os toca la respuesta; Yo estoy al margen, considerando con ansiedad cuál va a ser vuestro itinerario, desde el nacimiento hasta la muerte; siempre dispuesto a socorreros a la primera llamada. Nunca creáis, Mis pequeños, que Me encuentro lejos: ¡tenéis tantos peligros! ¡Cuán dulce es para Mí la humildad de vuestra voz!”</i>"],[49]],[1684,["11 de marzo de 1948. Hora Santa. <i>“Contémplame mucho, porque Yo tengo muchos Rostros. El rostro de los hombres expresa en mil matices la alegría, la tristeza y los demás sentimientos de la vida diaria. Con el Hombre-Dios pasa lo mismo; solo que Su Mirada es eterna y Su Corazón es, para decirlo de algún modo, ‘más múltiple’, pues contiene en Sí todos los corazones. Y esto, hija, no es un simple modo de hablar; Yo llevo realmente a todas las almas en Mí y las envuelvo con peso de Amor. Pero vosotros no conocéis el peso de este Amor, ni siquiera percibís que os llevo en Mí.</i>\n<i>“Y sin embargo, la prueba está en los Sufrimientos de Mi Pasión. ¿Tendrás ahora un poco de tiempo para pensar en Mi Rostro dolorido? Si lo haces, será para Mí como el suave lienzo de la Verónica.</i>\n<i>“Si Me ofreces tu espíritu, Yo lo impregnaré del Mío. Así podrás darlo a otros, y la ganancia será de todos. Más das tú y más te doy Yo. Ten para cada día herederos nuevos de la herencia que tú misma recibiste de Mí por la mañana. Entonces podrás contemplar la Alegría en Mi Rostro.</i>\n<i>“Cuando los Apóstoles regresaban contentos para darme cuentas de alguna misión, o cuando Me decían palabras como: ‘Tú eres el Cristo, el Hijo de Dios; ¿a quién iríamos, Señor?’, Mi Gozo era muy grande. De manera semejante, cuando sepas de alguna humilde conversión, adora en Mi Rostro la felicidad que esto Me da. Así, durante todo el curso de este día, considera las luces y las sombras que pasaban por Mi Rostro en uno cualquiera de Mis Días sobre la Tierra. Y adóralas. Espía las Emociones de tu gran Amigo.”</i>"],[42]],[1685,["11 de marzo de 1948. <i>“Hay pobres por quienes nadie se interesa. Si están a mitad de la calle, se les mira con disimulo y se pasa adelante. Pero si alguien se detiene y los mira con atención para decirles algo amable y darles una pequeña limosna, eso los conforta y les da valor y de esperanza.</i>\n<i>“Ese Pobre Soy Yo, ¿Me confortaréis un poco?”</i>"],[10]],[1686,["15 de marzo de 1948. Al regresar de Misa, yo pensaba en los pecadores. Hacía mucho frío y yo andaba descalza. Le dije: ‘Señor, ¿será mucho si te pido dos pecadores, por el frío de mis dos pies?’ Me contestó vivamente: <i>“¿Dos? ¡Dos mil!”</i> Entonces me recordó que una vez había concedido seis mil conversiones por una oración de santa Teresa de Ávila."],[37]],[1688,["18 de marzo.<i> “Tú piensas que Yo siempre te hablo de Amor. Y Yo sueño en el día que podré comenzar a hablarte de Él.” </i>Yo: ‘¡Comienza cuanto antes, Señor!’ Él: <i>“Sé como esos grandes barcos que antes de recibir una preciosa carga refuerzan sus puentes y calas y despliegan todas sus velas para mayor seguridad de que alcanzarán playas lejanas. Y el barco regresará de nuevo deslizándose sobre las aguas y dará una vez más todo lo que tiene. Ven a recibir. Cree que en verdad recibes. Ten de ello absoluta seguridad.”</i>","18 de marzo. En la calle, por la mañana, entre dos obreros que iban a su trabajo, yo le dije: ‘Yo también voy a mi jornada de este día, para Ti.’ Él: <i>“¿Te imaginas a todos los pecadores que puedes salvar en un solo día? Considera el esplendor de Mi Poder, Mi Riqueza y Mi Prodigalidad. ¿Qué podría impedirme darte almas si Yo te las quiero dar? Sobre la Tierra, Mi Justicia está como encadenada por la Misericordia con que acojo las plegarias de los que amo. Apóyate más en Mis Generosidades para contigo y para quienes Me encomiendas.”</i>"],[18,44]],[1689,["1º de abril de 1948. Le Fresne. <i>“He resucitado. ¿Habrá algo que detenga tu alegría? ¿No tienes ahora un honor nuevo que rendirme como estar gozosa por Mí y a causa Mía? Y si tú tienes la alegría, ¿cómo podría ser que no la irradiaras a otros?</i>\n<i>“Pero no encuentro la alegría en muchos corazones. Se piensa poco en este honor que tanta dulzura Me trae. Yo, como todos los que saben amar, comparto todas vuestras emociones.</i>\n<i>“En otros días, cuando dejabas de ver a un ser querido, solías decirle: ‘prométeme que serás feliz’ y esto era como una necesidad de tu corazón. Pues el Mío ama vuestra alegría. Y esta debéis tenerla aún en los momentos de la prueba y la tribulación; porque todo eso es para Mí.</i>\n<i>“Pequeña, ¡qué profundidades de júbilo hay en quienes viven totalmente para Mí! Gozos que nadie les pueda quitar... ¿No sientes el encanto incomparable?</i>\n<i>“Pero este pensamiento no ha de pesar en tu espíritu: quiero un simple impulso, un anhelo alegre. Tú subías con frecuencia las gradas del vestíbulo para abrazar a tu madre y llegabas corriendo, en medio de tus ocupaciones… Era muy sencillo, y esta sencillez lo decía todo. Pero tú no podías medir el gozo de tu madre al recibir estas caricias. Menos aún puedes medir el Mío. No Me prives de él, hija Mía.”</i>"],[0]],[1690,["8 de abril de 1948. <i>“¿Me has dado las gracias por cuanto he hecho por ti? ¿De lo que he hecho por los hombres, por los ángeles y por Mi Madre? Aprópiate de todos ellos como si fueran tuyos. Entra en la sinfonía del agradecimiento y la glorificación. Mezcla tu voz con la del coro innumerable y Yo la distinguiré. No hay sobre la Tierra dos voces iguales. En el Cielo sucede lo mismo: no hay dos santidades iguales, y si en tu jardín te sientes admirada por la diversidad de colores, puedes estar segura de que en el Paraíso los esplendores son múltiples y entre todos componen Mi Gloria. Allí también reconozco Yo los acentos, porque os conozco a todos. A todos os redimí y sé cómo fue vuestra Redención.”</i>\nYo: ‘Señor, ¿quién me podrá enseñar a darte gracias y con qué palabras?’ Él:<i> “Las mejores son las más sencillas, si salen de tu corazón. Dímelas en Misa. Vuélvemelas a decir después de la comunión, cuando tú y Yo somos Uno. Y seré todavía Yo Quien te dicte esas palabras.”</i>"],[22]],[1693,["26 de abril. A mi regreso de París había yo tenido la sorpresa de un nido de ruiseñores que se habían establecido encima de una ventana, frente a la avenida de los tilos. Y cantaban bellamente. Me dijo:<i> “¿Verdad que ninguna otra cosa te hubiera dado tanto gusto? También Yo doy sorpresas de cuando en cuando. Muchos no las perciben, por eso Me complace que la hayas adivinado. Vosotros, en la Tierra, os veis siempre obligados a adivinar. Pero Yo estoy siempre detrás de la puerta y tú, algunas veces, no Me percibes. ¡Trata de verme en todo, porque en todo estoy!”</i>","26 de abril. <i>“¡Oh, esa mirada vuestra, que tanto amo! Es como una confesión, como un trozo de vuestra alma que se Me da y que tomo inmediatamente, como un coleccionista de objetos preciosos que guarda celosamente cada una de sus adquisiciones, para que nadie pueda robárselas.</i>\n<i>“Dime que ahora ya eres completamente Mía. Tú Me dices que ya lo sé, pero no Me quites la alegría de oírlo de nuevo.”</i>"],[16,29]],[1695,["30 de abril, después de la comunión. <i>“¡Tus pensamientos! Vigila tus pensamientos, porque de ellos se derivan tus palabras y tus acciones. Piensa en Mis Pensamientos, todos benévolos y misericordiosos. Así obrarás según Mis Modos.”</i>"],[52]],[1697,["11 de mayo de l948. Yo invitaba a los ángeles de mi terraza a que vinieran a sentarse ante el magnífico panorama del Loira tranquilo y de sus islas vestidas con los verdes de mayo. Él: <i>“Hija, el Cielo no está lejos de la Tierra cuando Se lo rogáis. Vivid más en la sociedad de los santos. Ellos os ayudarán a amarme mejor, ellos, que ya poseen la ciencia del Amor. ¿Podrías decir que profundizas en él un poco más cada día? ¿Aunque fuera tan solo un cuarto de hora?”</i>","11 de mayo de l948. ‘Señor, sé Tú mi Profesor, pero ¿cómo lograrlo?’ Él: <i>“Mirándome en Mi Evangelio, en él está Mi Historia. En él Me sigues. Me ves consolar, curar, sufrir, obedecer por vosotros a Mi Padre. Me ves privarme, hablar y callar, buscar la soledad. Me ves enseñar, sufrir, defender la Verdad, reprender a los grandes, sostener a los pequeños. Lleno de Misericordia para los humildes, los arrepentidos y los oprimidos. No pensando sino en vosotros, nunca en Mí.</i>\n<i>“Mis Sacrificios… ¿cómo podrías tú contarlos? Las estrellas supieron de Mis Plegarias nocturnas; el frío lo sintieron Mis Miembros ateridos, Mis Pies desgarrados conocieron los guijarros del camino...</i>\n<i>“¿Quién supo de Mis Ardores por Mi Padre, Mi Celo por vosotros, hasta el último que vendrá? Yo quería dejaros Mi ejemplo cuando os decía: ‘Venid en pos de Mí’. Esto será la respuesta al Amor. ¡Amigos Míos escogidos, los del pequeño número, venid a encontrarme cada día en las páginas de Mi Evangelio! Buscad en ellas Mi Corazón y entregadme el vuestro...”</i>"],[7,54]],[1698,["13 de mayo. <i>“¿Verdad que hice bien en pedirte que vivieras este día con Mi Grandeza? ¿No adquirirás el gusto habitual de poner en tus pensamientos, como amable compañera de camino, en alguna de Mis Cualidades de Dios? Sería una nueva manera de atención hacia Mí. Porque cuando un alma quiere apoderarse de su Salvador, multiplica sus maneras de perseguirlo. Y Él, por su parte, encuentra mil pretextos para dejarse prender. Si supieras… Esta es la vida secreta que vosotros llamáis vida interior, pero que se sale de los esquemas de la Tierra. Al principio son meros ensayos de vuelo, que dan de sí las primeras liberaciones. Como aquella golondrina pequeñita que, al dejar su nido por primera vez, te pareció que subía hasta el sol. Cuida tu vida íntima. Ámala porque Yo la amo.”</i>"],[52]],[1700,["20 de mayo. <i>“Mírame. ¿Tienes confianza? ¿Esperas en Mí sin reticencias y sin intermitencias? La Esperanza que quiero de ti va más allá de la muerte. Porque Yo Soy todo para ti.”</i>"],[19]],[1701,["20 de mayo. <i>“Busca maneras ingeniosas de distribuir en torno tuyo la alegría. En el modo de hacerlo está el secreto. ¿Adviertes la diferencia entre hablar con afecto y sin él? Las palabras son las mismas, pero suenan de otro modo. Y si puedes hacer algo de esto, ¿por qué no habrías de hacerlo? No te sería difícil poner una gota de ternura en un corazón amargado. ¿Por qué descuidar esa posibilidad si recuerdas que Yo estoy en los otros? Tú Me buscas en la hermosura de las rosas, en los trinos del ruiseñor, en el canto que el cucú de la isla te manda por encima del Loira. Me buscas en las radiantes estrellas de una noche de mayo, en las ramazones distantes de los pantanos. Pero es que ¿acaso no estoy antes en las almas creadas a Mi Imagen y Semejanza? ¿En esos seres humanos de quien Soy Hermano y Salvador…? Ellos no sospecharán que Soy Yo la Persona que buscas, pero se sentirán confortados y Yo haré que su consuelo sea mayor...”</i>"],[5]],[1702,["27 de mayo. Fiesta de Corpus. Yo: ‘Señor, deseo tanto que se realicen Tus Deseos.’ Él: <i>“Colócate a Mi lado, en el sitio que ocupó Juan, en el momento en que instituí Mi Eucaristía. Considera Mi Gozo. Y ahí, cerca de Mí, en el lugar de Juan, puedes tener una idea del Sentimiento que Me hace estremecer: haber encontrado el medio de quedarme entre vosotros; vosotros, los que no estabais allí la noche de la Cena; vosotros, a quienes amo tanto que acepté morir con Muerte innoble; vosotros, que tenéis durante toda la vida la compañía de Mis Hostias, que harán vuestra muerte más dulce.</i>\n<i>“Y desde tu lugar, que es el de Juan, mira cómo los Apóstoles se han convertido ya en otros hombres, enternecidos y piadosos. Ya Me poseen; ya actúo Yo en ellos como lo haré en vosotros.</i>\n<i>“Soy el más rico, el que más intensamente desea vuestro bien. ¿Cómo podría ser que Yo estuviera presente en alguna parte y no la dejara colmada de bienes? Ponte al servicio de este Deseo, pidiéndole al Padre que todos Me dejen obrar en ellos. ¡Si tan solo consintieran dejarme entrar! Pero temen ser vistos. No tienen tiempo sino para sus negocios, a Mí no Me toca en ellos parte alguna. No creen. No piensan en Mí. Me desprecian.</i>\n<i>“Otros creen, pero Me odian y Me persiguen en Mi Presencia Eucarística. Por eso, vosotros, Mis Amigos, rodeadme; adorad Mis tabernáculos, decidme palabras que Me consuele. Desead que se vuestra muerte, para tener más tiempo de amarme. Habrá quien venga después de vosotros, pero no habrá quien pueda reemplazaros; cada uno de vosotros tiene para Mí un rostro y un camino que le son propios. Conserva tu rostro ante Mi Faz y apresura el paso sobre tu camino...”</i>"],[20]],[1703,["3 de junio de 1948. Hora Santa. Me preguntó: <i>“¿Has visto a Mis palomas?” </i>Es que yo regresaba de París, donde, en la Rue du Bac, había admirado la capilla llena de religiosas de san Vicente de Paul, en adoración ante el Santísimo expuesto. Prosiguió:<i> “Te regocijaste de ver cómo Me rodeaban con amor. Únete a ellas, pequeña. Ejercítate con mayor frecuencia en la intención de unirte a todos los santos de la Tierra y del Cielo. Con ellos eres fuerte; sola tú eres débil.</i>\n<i>“Formarás parte del ramillete, y Yo tendré la tentación de darte a ti sola toda la recompensa. Recuerda cuánto amo la Unión.</i>\n<i>“Esas gavillas, esas canastas de flores con que se adornan Mis Altares, no son sino imágenes pálidas de las almas que se reúnen en torno a Mí para amarme. Pon con el pensamiento cerca de Mi Tabernáculo a todas las almas que Me recomiendas: Yo las atraeré. Mi Amor no puede desentenderse de aquellos de quienes tú te ocupas. Y lo hago a la escala de Mi Amor.”</i>"],[20]],[1705,["9 de junio. Hora Santa. <i>“Continúa. Aumenta, Busca sorpresas que darme, con pequeños sacrificios. Será siempre el Espíritu Quien te las inspire. Es como una proposición que se te hace y a la cual prestas tu consentimiento. Es este acto de tu voluntad el que Me llega como la flecha del Cántico: ‘¡Oh, deleitosa herida!’ Esto te llena de admiración porque no puedes penetrar en el sentido de la palabra ‘Dios es Amor’.”</i>","9 de junio. <i>“No temas exagerar en el deseo de encontrarte conmigo, pues Mi Deseo es justamente que nunca os separéis de Mí. En todo caso, si no puedes comprenderme, esfuérzate por creerme. Como los niños, que creen siempre en la palabra de sus padres. Y una enamorada cree también en la palabra de quien la ama ¿Me creerás, entonces?</i>\n<i>“Es preciso ejercitar la alegría para que se ensanchen los corazones. Y, ¡qué fácil es la alegría cuando se piensa que se es infinitamente amado por un Dios Bondadoso! Y Mi propia Felicidad aumentaría sabiendo que sois felices. ¡Ah! Cuando veas, cuando sepas... Querrías volver a la Tierra para terminar lo que no dejaste sino esbozado.</i>\n<i>“No temas, pues, amarme, decírmelo, esperarme y llamarme. Cuando se ama, esto es sencillo. Hasta morir lo es.”</i>"],[14,53]],[1706,["17 de junio. Hora Santa. Yo buscaba en mi pensamiento una manera de agradarlo más. Me dijo: <i>“No pido lo imposible. Ni siquiera lo más difícil. Lo que deseo es que vengáis a Mí con simplicidad de niños. Niños que son </i>(<i>y se sienten</i>)<i> hijos de Dios.”</i>"],[24]],[1711,["15 de julio de 1948. Yo acababa de recibir por correo la primera página de las pruebas de ÉL Y YO. Me dijo: <i>“Es justo que estés alegre. Ora, pidiendo que cada una de estas líneas tenga resonancia al pasar por las almas. No imaginas lo que va a ser el itinerario de este librito. Pídeme que lo mande a los más miserables, a los espiritualmente paralizados, desolados sin esperanza, mudos delante de Dios, poseídos por las ansias del dinero.</i>\n<i>“Pídeme que pase por este librito como pasaba Yo en otros tiempos, curando a los enfermos y atrayendo a las almas hacia Mí. ¿No crees que ya desde ahora cuantos trabajan porque se publique y difunda, están respirando un aire nuevo? Que todos vengan para alimentarse y respirar más hondo. Así acabarán por comprender Mi Amor un poco más...</i>\n<i>“Yo Soy como un hombre rico que ha colmado a sus amigos con beneficios, y que en cierto momento se detiene con emoción para observar a sus favorecidos, preguntándose si concederán la debida atención a las delicadezas de su bienhechor, o pasarán de largo con una sonrisa burlona, como en el Calvario. Muchos moverán la cabeza con desprecio, otros quedarán indiferentes. Pero aquellos que ponen su espíritu con el sincero deseo de poseerme, experimentarán una ternura repentina que los dejará asombrados y subyugados.”</i>"],[15]],[1714,["29 de julio. Hora Santa. <i>“¿No es verdad que cuando relees estos cuadernos hay ciertas frases que te penetran como una flecha? Las Palabras te vuelven a hablar, con un sentido nuevo; el Espíritu les da otra forma.</i>\n<i>“En esto no te habías fijado. Tu pensamiento no estaba aún lleno. Tenías otra edad. Como si la persona que eres hoy encontrara a la persona que fuiste en otro tiempo. Porque las Gracias, cuando reciben la debida correspondencia, hacen un alma nueva.”</i>"],[15]],[1718,["19 de agosto. Yo pasaba por un momento de depresión. Me dijo:<i> “Marca el paso. Mantente firme.”</i>"],[37]],[1719,["20 de agosto. <i>“¿Cómo puedes tú no ver más claro en Mi Amor? Porque, aun cuando no pensaras más en Mí, Yo seguiría pensando en ti. Aun si tú Me abandonaras y Me renegaras, aun cuando llegaras a burlarte de Mis Pretensiones sobre ti y pisotearas nuestras cuadernos y arrastraras a otros en una campaña contra tu Dios, Yo te seguiría amando.</i>\n<i>“Y si te unieras a los que han resuelto morir insultándome para mostrar ante el Mundo un supremo esfuerzo de rebelión orgullosa, Yo te amaría aún, en espera de que tus últimos suspiros y una mirada de arrepentimiento te arrojaran en Mi Corazón.”</i>"],[2]],[1722,["9 de septiembre de 1948. Yo: ‘Señor, yo atormento mi espíritu buscando amarte y no lo consigo.’ Él: <i>“Ámame con simplicidad: Yo Soy el Siempre. Cuando estoy en tu pensamiento y tú sientes pena de no amarme mejor, ya con eso Me amas. Me amas también cuando haces las cosas no por tu gusto, sino porque son tu deber. Me amas cuando te haces pequeña ante los otros y ante ti misma. Me amas cuando quieres orar y te distraes, pero deploras tus distracciones. Me amas cuando quieres expresar tus deseos y no encuentras las palabras. Cuando disculpas una palabra que te hiere, cuando das gusto a otros por darme gusto a Mí. Me amas cuando ensayas el dejarlo todo, como si te murieras; cuando pones tu pensamiento entre los ángeles y los santos, como si quisieras anticipar tu llegada; y Me amas, en fin, cuando por la noche suspiras por el mañana en que estaremos unidos.</i>\n<i>“Todo esto es muy distinto de lo que tú te imaginas que es necesario para amarme. ¡Pequeña! Simplifícate dulcemente en Mi Presencia, con un amor despierto. Tú bien sabes que siempre estoy contigo.”</i>"],[1]],[1723,["16 de septiembre.<i> “Pequeña, nada existe fuera de Mí y nada debe limitar tu amor. ¿Cómo podrías amar la nada que son las cosas? ¿No piensas que siendo Yo la absoluta Perfección debo atraerte desde el fondo de tu ser? ¿De un ser que fue creado para la Belleza inmortal? Despréndete de ti misma. Enamórate de tu Dios, que es el Esplendor de la Verdad. Y si lo consigues, tu pensamiento estará fijo en Mí.</i>\n<i>“Yo quiero reinar en cada uno. Guarda tu corazón, no por la fuerza sino por el Amor que une nuestras voluntades. Aprende a encontrarme a lo largo del día. ¿Y cómo podrías encontrarme sin darme un saludo de amor? Cuando un extranjero solitario recorre un país lejano, le resulta penoso que nadie lo mire con afecto, teniendo que recorrer su camino como si anduviera entre los muertos. Ese Extranjero Soy Yo. Lo Soy cuando las almas no piensan en Mí, cuando están como cerradas y sin vida. Y sin embargo, Yo os llamo siempre mediante los acontecimientos y las circunstancias. Y la gente dice que es casualidad… ¿cuándo dirán que Soy Yo?”</i>"],[18]],[1724,["30 de septiembre. Al regresar de un magnífico paseo de otoño, admiraba yo unas nubes que tenían la forma de cabezas de animales gigantescos. Le dije: ‘Señor, ¡qué bellos son! Como si se tratara de Tu primera Creación.’ Me dijo:<i> “¡Cada día es una nueva creación! Yo creo sin cesar y no hay un dí
