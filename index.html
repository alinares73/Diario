  const t=await loadChunk(doc,k);if(location.hash!==hs)return;
  M.innerHTML='<div class="doc" id="dx">'+t+'</div>';sfDoc=doc;$('#sfab').style.display=doc==='Comentarios'?'none':'';if(o.i!==undefined)focusPar(o.i,o.q);
  if(o.off){let e=M.querySelector('#o'+o.off);let p=e&&(e.closest('p')||e);if(p&&!p.textContent.trim()&&!p.dataset.o){p=p.nextElementSibling||p}
    if(!p){const ps=[...M.querySelectorAll('p[data-o]')];for(const q of ps){if(+q.dataset.o<=o.off)p=q;else break}}
    if(p){p.scrollIntoView({block:'start'});window.scrollBy&&window.scrollBy(0,-70);p.classList.add('flash')}}
}
function notFound(){$('#main').innerHTML='<p class="mut" style="text-align:center">Página no encontrada.<br><br><a class="btn" href="#/">Inicio</a></p>'}
/* selección de versículos */
function toggleSel(e){e.classList.toggle('sel');if(e.classList.contains('sel'))selSet.add(e);else selSet.delete(e);$('#sel').classList.toggle('on',selSet.size>0);$('#fab').style.display=selSet.size?'none':''}
function closeSel(){selSet.forEach(e=>e.classList.remove('sel'));selSet.clear();$('#sel').classList.remove('on')}
function selVerses(){return [...selSet].sort((a,b)=>parseInt(a.dataset.v)-parseInt(b.dataset.v))}
$('#sx').onclick=()=>{closeSel();$('#fab').style.display=''};
$('#scopy').onclick=async()=>{const vs=selVerses();if(!vs.length)return;const t=vs.map(e=>[...e.querySelectorAll('p')].map(p=>p.textContent.replace(/^\s*\d+[a-z]?\s*/,'').trim()).join(' ')).join(' ');const nums=vs.map(e=>e.dataset.v);const ref=BK[cur.b].ab+' '+chLabel(cur.b,cur.c)+','+(nums.length>1?nums[0]+'-'+nums[nums.length-1]:nums[0]);const out='«'+t+'» ('+ref+')';try{await navigator.clipboard.writeText(out)}catch(e){const ta=document.createElement('textarea');ta.value=out;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(_){}ta.remove()}closeSel();$('#fab').style.display='';toast('Copiado')};
$('#shl').onclick=()=>{const hl=LS.get('hl',{});const vs=selVerses();const all=vs.every(e=>e.classList.contains('hl'));vs.forEach(e=>{const key=cur.b+':'+cur.c+':'+e.dataset.v;if(all){delete hl[key];e.classList.remove('hl')}else{hl[key]=1;e.classList.add('hl')}});LS.set('hl',hl);closeSel();$('#fab').style.display=''};
function toast(t){const d=document.createElement('div');d.textContent=t;d.style.cssText='position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 18px;border-radius:20px;z-index:60;font:15px var(--ui)';document.body.appendChild(d);setTimeout(()=>d.remove(),1400)}
/* búsqueda */
let IDX=null,scope='all';
async function buildIdx(prog){if(IDX)return IDX;const out=[];for(let b=0;b<BK.length;b++){const bk=await loadBook(b);bk.ch.forEach((ch,ci)=>{const re=/<div class="vs" data-v="([^"]+)">(.*?)<\/div>/gs;let m;while((m=re.exec(ch.h))){const t=m[2].replace(/<[^>]+>/g,' ').replace(/&quot;/g,'"').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/\s+/g,' ').replace(/^\s*\d+[a-z]?\s*/,'').trim();out.push({b,c:ci,v:m[1],t,n:norm(t)})}});if(prog)prog(b+1)}IDX=out;return out}
function parseRef(q){const m=norm(q.trim()).match(/^(\d?\s*[a-z.]+)\s*(\d+)(?:\s*[,:.]\s*(\d+))?$/);if(!m)return null;const tok=m[1].replace(/[\s.]/g,'');let b=BK.findIndex(x=>norm(x.ab).toLowerCase()===tok);if(b<0){const c=BK.map((x,i)=>[x,i]).filter(([x])=>norm(x.name).replace(/\s/g,'').startsWith(tok));if(c.length)b=c[0][1]}if(b<0)return null;const n=+m[2];let ci=BK[b].ch.findIndex(c=>new RegExp('^(Capítulo|Salmo) '+n+'(\\D|$)').test(c.t));if(ci<0&&BK[b].ch.length>=n&&b!==22)ci=n-1+(BK[b].ch[0].t==='Introducción'?1:0);if(ci<0||!BK[b].ch[ci])return null;return{b,c:ci,v:m[3]}}
async function renderSearch(q0){
  const M=$('#main');M.innerHTML=`<input id="q" class="si" type="search" placeholder="Palabra, frase o cita (Jn 3,16)" value="${esc(q0)}" autocomplete="off"><div class="chips"><button class="btn" data-s="all">Toda la Biblia</button><button class="btn" data-s="at">Antiguo T.</button><button class="btn" data-s="nt">Nuevo T.</button></div><div id="out" class="mut"></div>`;
  const q=$('#q');M.querySelectorAll('.chips .btn').forEach(b=>{b.classList.toggle('on',b.dataset.s===scope);b.onclick=()=>{scope=b.dataset.s;M.querySelectorAll('.chips .btn').forEach(x=>x.classList.toggle('on',x.dataset.s===scope));go()}});
  let t;q.oninput=()=>{clearTimeout(t);t=setTimeout(go,300)};
  async function go(){const val=q.value.trim();const out=$('#out');if(val.length<2){out.textContent='Escribe al menos 2 letras.';return}
    history.replaceState(null,'','#/search/'+encodeURIComponent(val));
    let html='';const ref=parseRef(val);if(ref)html+=`<a class="res" href="#/r/${ref.b}/${ref.c}${ref.v?'/'+ref.v:''}"><b>Ir a</b>${esc(BK[ref.b].name)} ${esc(chLabel(ref.b,ref.c))}${ref.v?', '+esc(ref.v):''}</a>`;
    out.textContent=IDX?'Buscando…':'Preparando el índice de búsqueda…';
    const idx=await buildIdx(n=>{if(!IDX)out.textContent='Preparando el índice de búsqueda… '+n+'/73'});
    if(q.value.trim()!==val)return;
    const terms=[];const re=/"([^"]+)"|(\S+)/g;let m;const nq=norm(val);while((m=re.exec(nq)))terms.push(m[1]||m[2]);
    const tre=terms.map(x=>new RegExp('(^|[^a-zñ0-9])'+x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')));const res=[];for(const r of idx){if(scope==='at'&&r.b>=46)continue;if(scope==='nt'&&r.b<46)continue;if(tre.every(x=>x.test(r.n))){res.push(r);if(res.length>=400)break}}
    const hi=(r)=>{let s=esc(r.t),ns=norm(s);const spans=[];terms.forEach(x=>{const ex=esc(x);let i=0;while((i=ns.indexOf(norm(ex),i))>=0){spans.push([i,i+ex.length]);i+=ex.length}});spans.sort((a,b)=>a[0]-b[0]);let o='',p=0;for(const [a,b] of spans){if(a<p)continue;o+=s.slice(p,a)+'<mark>'+s.slice(a,b)+'</mark>';p=b}return o+s.slice(p)};
    html+=res.map(r=>`<a class="res" href="#/r/${r.b}/${r.c}/${r.v}"><b>${esc(BK[r.b].ab)} ${esc(chLabel(r.b,r.c))},${esc(r.v)}</b>${hi(r)}</a>`).join('');
    out.innerHTML=(res.length?`<div style="margin:6px 0">${res.length>=400?'Más de 400':res.length} resultado(s)${res.length>=400?' (se muestran los primeros)':''}</div>`:(ref?'':'Sin resultados.'))+html}
  if(q0)go();else q.focus()
}
async function renderMarks(){
  const M=$('#main');const bm=LS.get('bm',[]),hl=LS.get('hl',{});
  let h='<h2 class="t">Marcadores</h2><h4 class="mut">Capítulos</h4>';
  h+=bm.length?bm.map((x,i)=>`<div class="res"><button class="x" data-bm="${i}" aria-label="Quitar">✕</button><a href="#/r/${x.b}/${x.c}" style="color:var(--link);text-decoration:none"><b style="display:inline">${esc(BK[x.b].name)} · ${esc(BK[x.b].ch[x.c].t)}</b></a></div>`).join(''):'<p class="mut">Aún no hay capítulos marcados (usa ☆ al leer).</p>';
  h+='<h4 class="mut" style="margin-top:24px">Versículos resaltados</h4><div id="hls"></div>';M.innerHTML=h;
  M.querySelectorAll('[data-bm]').forEach(b=>b.onclick=()=>{const l=LS.get('bm',[]);l.splice(+b.dataset.bm,1);LS.set('bm',l);renderMarks()});
  const keys=Object.keys(hl).map(k=>k.split(':').map(Number)).sort((a,b)=>a[0]-b[0]||a[1]-b[1]||a[2]-b[2]);const box=$('#hls');
  if(!keys.length){box.innerHTML='<p class="mut">Toca un versículo mientras lees para resaltarlo.</p>';return}
  let o='';for(const [b,c,v] of keys){const bk=await loadBook(b);const ch=bk.ch[c];const m=ch&&ch.h.match(new RegExp('<div class="vs" data-v="'+v+'">(.*?)</div>','s'));const t=m?m[1].replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').replace(/^\s*\d+[a-z]?\s*/,'').trim():'';o+=`<div class="res"><button class="x" data-hl="${b}:${c}:${v}" aria-label="Quitar">✕</button><a href="#/r/${b}/${c}/${v}" style="color:inherit;text-decoration:none"><b>${esc(BK[b].ab)} ${esc(chLabel(b,c))},${v}</b>${esc(t.slice(0,160))}</a></div>`}
  box.innerHTML=o;box.querySelectorAll('[data-hl]').forEach(x=>x.onclick=()=>{const l=LS.get('hl',{});delete l[x.dataset.hl];LS.set('hl',l);renderMarks()})
}
/* ajustes */
function openSheet(){const sp=$('#sp');sp.innerHTML=`<h3>Ajustes de lectura</h3><label>Tamaño de letra: <span id="fsv">${SET.fs}</span> px</label><input type="range" id="fs" min="14" max="32" value="${SET.fs}"><label>Interlineado</label><input type="range" id="lh" min="1.3" max="2.1" step="0.1" value="${SET.lh}"><label>Tema</label><div class="seg" id="th"><button class="btn" data-v="dark">Oscuro</button><button class="btn" data-v="light">Claro</button><button class="btn" data-v="sepia">Sepia</button></div><label>Tipografía</label><div class="seg" id="fo"><button class="btn" data-v="serif">Con serifa</button><button class="btn" data-v="sans">Sin serifa</button></div><label>Números de versículo</label><div class="seg" id="nu"><button class="btn" data-v="1">Mostrar</button><button class="btn" data-v="0">Ocultar</button></div><label>Uso sin conexión (la Biblia y Comentarios ya están guardados; el resto se guarda al abrirlo, o todo de golpe: ≈ ${Math.round(Object.values(DOCS).reduce((a,d)=>a+d.kb,0)/1024)} MB)</label><button class="btn" id="dl" style="width:100%;min-height:46px;font-size:16px">Descargar todos los libros enlazados</button><div class="mut" id="dlp" style="margin-top:6px"></div>`;
  const mark=()=>{sp.querySelectorAll('#th .btn').forEach(b=>b.classList.toggle('on',b.dataset.v===SET.theme));sp.querySelectorAll('#fo .btn').forEach(b=>b.classList.toggle('on',b.dataset.v===SET.font));sp.querySelectorAll('#nu .btn').forEach(b=>b.classList.toggle('on',(b.dataset.v==='1')===SET.num))};mark();
  const save=()=>{LS.set('set',SET);applySet();mark()};
  sp.querySelector('#fs').oninput=e=>{SET.fs=+e.target.value;$('#fsv').textContent=SET.fs;save()};sp.querySelector('#lh').oninput=e=>{SET.lh=+e.target.value;save()};
  sp.querySelectorAll('#th .btn').forEach(b=>b.onclick=()=>{SET.theme=b.dataset.v;save()});sp.querySelectorAll('#fo .btn').forEach(b=>b.onclick=()=>{SET.font=b.dataset.v;save()});sp.querySelectorAll('#nu .btn').forEach(b=>b.onclick=()=>{SET.num=b.dataset.v==='1';save()});
  sp.querySelector('#dl').onclick=downloadAll;
  $('#sheet').classList.add('on')}
async function downloadAll(){const p=$('#dlp'),names=Object.keys(DOCS);let tot=0,done=0;names.forEach(d=>tot+=DOCS[d].starts.length);p.textContent='Descargando…';let fail=0;
  for(const d of names)for(let k=0;k<DOCS[d].starts.length;k++){try{const r=await fetch('docs/'+d+'/'+k+'.html?v='+DOCS[d].v);if(!r.ok)fail++;else await r.arrayBuffer()}catch(e){fail++}done++;if(done%5===0||done===tot)p.textContent='Descargando… '+done+'/'+tot}
  p.textContent=fail?('Terminado con '+fail+' fallos; vuelve a intentarlo con conexión.'):'Listo: todo disponible sin conexión.'}
$('#fab').onclick=openSheet;$('#sheet').onclick=e=>{if(e.target.id==='sheet')$('#sheet').classList.remove('on')};
$('#hh').onclick=()=>{location.hash='#/'};
/* gestos: deslizar para cambiar de capítulo */
let tx=0,ty=0;document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{if(!cur||!location.hash.startsWith('#/r/')||selSet.size)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>90&&Math.abs(dy)<45){const t=dx<0?next(cur.b,cur.c):prev(cur.b,cur.c);if(t)location.hash='#/r/'+t[0]+'/'+t[1]}},{passive:true});
window.addEventListener('hashchange',render);
applySet();render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.register('sw.js').catch(()=>{});navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!had)return;const d=document.createElement('div');d.style.cssText='position:fixed;left:12px;right:12px;bottom:80px;z-index:70;background:#3a4d75;color:#fff;padding:12px 14px;border-radius:14px;display:flex;gap:10px;align-items:center;font:15px var(--ui)';d.innerHTML='<span style="flex:1">Hay contenido nuevo disponible.</span><button style="background:#fff;color:#1c2330;border:0;border-radius:10px;padding:8px 12px;font:600 15px var(--ui)">Recargar</button>';d.querySelector('button').onclick=()=>location.reload();document.body.appendChild(d)})}
</script>
