s con un amigo íntimo que conoce todos los secretos…”</i>"],[34]],[726,["18 de julio. <i>“Da gracias a Dios por el día que comienza. Puedes obtener tantos méritos, tanta gloria en un solo día... Te permito que Me ames y que Me sirvas. ¡Servir a Dios! Si tú pensaras lo que hay en ello de honor y de felicidad... imagínate: si pudiera concederse a un condenado un solo día más, ¡cómo lo aprovecharía! Platica conmigo, tú, Mi pequeña.”</i>"],[39]],[727,["19 de julio, después de la comunión:<i> “Yo Me entregué a los hombres y ellos hicieron de Mí lo que quisieron. Esto lo hice por Amor. Ahora Me les entrego en la Eucaristía. Y una vez más, ellos hacen de Mí lo que quieren... Y esto también lo hago por Amor. Hasta el fin. Hasta la consumación de los tiempos.”</i>"],[20]],[728,["19 de julio. <i>“Cuando con el pensamiento te pones cerca de Mí, Me haces descansar. Lo mismo cuando consideras Mis Sufrimientos, y cuando avivas interiormente tu celo. ¡Cuál no será la recompensa que voy a dar a las almas que con su amorosa piedad Me hacen descansar!”</i>"],[10]],[729,["21 de julio, en Nantes, avenida de Launay. <i>“La verdadera intimidad tiene una señal propia: la de que siempre está dispuesta a recibir. Recíbeme. Acércate a Mí en medio de cualquier ocupación”</i>."],[26]],[730,["22 de julio. De partida para representar en la Guerche. Me dijo: <i>“¡Llévame contigo para darme a todos!”</i>"],[54]],[732,["26 de julio, en el jardín. <i>“Si Yo tengo gusto en oír lo que Me dices no es por lo que Me dices, sino simplemente porque Me hablas. Con esto queda satisfecho Mi deseo de intimidad, y Yo te miro con el Amor de un Salvador. Tu agradecimiento y tus homenajes Me complacen, pero es sobre todo la apertura de corazón a Corazón lo que Yo busco en vosotros. Las expansiones del Amigo predilecto.”</i>"],[26]],[733,["733.<i> “Vigila bien los pensamientos de tu corazón; pues lo que se tiene en el corazón sale pronto a los labios.”</i>"],[52]],[734,["27 de julio. <i>“No te digas: ‘Esto es demasiado poco para ofrecérselo por un alma’. Cuando tú recibes para tu vestuario del teatro una suma pequeña te sientes contenta, pues sumada a otras, esa pequeñez te permite comprar hermosas vestiduras para servicio de la Iglesia. Yo hago lo mismo: añado tus pequeñas oraciones y sacrificios a otros y un pecador se salva.”</i>","27 de julio. Durante la Misa pensaba yo en Él, tan agotado en la subida al Calvario y consideraba Su Bondad al consolar a las santas mujeres: <i>“No lloréis por Mí sino por el pecado.”</i> Él: <i>“Yo hablé de ese modo pensando también en los verdugos que Me rodeaban y a los cuales quería Yo salvar. ¡Qué no habría Yo hecho por ellos! ¿Sabes lo que es un Deseo de un Hombre Dios?”</i>","27 de julio. En mi tiempo de descanso: <i>“Tú has dividido tu día en tres partes separadas por un descanso: ofrece cada una de ellas a una de las Tres divinas Personas, para avivar tu atención y tu fervor. La mañana al Padre Celestial, el medio día a tu Salvador y la tarde al Espíritu Santo, Amor. Así pertenecerás a los Tres y al Único.”</i>"],[33,36,48]],[735,["28 de julio, después de comulgar. <i>“Haz un ramillete de sacrificios para ofrecérmelo como si fueran flores. No descuides nada, pues todo tiene importancia a Mis Ojos desde el momento que tú piensas ofrecérmelo con el mayor amor. Desea que tu amor de cada día sea mayor que el de la víspera y dámelo para que Yo lo encienda. Cuenta siempre más conmigo que contigo, y camina en paz.”</i>"],[37]],[736,["29 de julio. <i>“Permanece, Mi Gabriela, en una alegría habitual. La alegría es la característica de la Mansión de tu Esposo y Señor. ¿Qué cosa puede haber más dulce sobre la Tierra que vivir conmigo en lo íntimo del corazón? ¿No dejarme nunca a Mí, que siempre estoy con vosotros dispuesto a daros Mi Amor? Un Amor del que son débil imagen los amores de la Tierra. ¿Concibes esta alegría? Yo en ti y tú en Mí. Así es, cuando vuestras almas se encuentran en estado de Gracia.</i>\n<i>“Y la Gracia Soy Yo. Saboread la alegría de saber que vivo en vosotros. Sentid esa superabundancia, que supera todas las alegrías de la Tierra. Y mientras más impregnada estés de Mi Alegría, más aumentarás la Mía en ti.”</i>"],[0]],[737,["30 de julio de 1939. Durante la Misa: <i>“Te doy Mi Sangre como manto que te envuelva; dame tu amor para cubrirme.”</i>","30 de julio. <i>“Que nada en ti se desprenda jamás de Mí. Si supieras cuán grande es Mi Deseo de teneros cerca. Que tu entendimiento esté conmigo, que tu voluntad esté conmigo y lo mismo tu memoria, que nuestra unión permanezca, como Mi Unión en el Padre. Y recuérdalo una vez más: el amor es toda ausencia de separación.”</i>"],[46,54]],[738,["31 de julio, después de la comunión. <i>“Vive solo para Mí. Vosotros tenéis la libertad de quererme o de no quererme. Yo estoy siempre ahí, con el Corazón agitado en espera de vuestra decisión. Mi Corazón, siempre ansioso con el Deseo de que Me elijáis... Que te dé placer sembrar Mi Nombre en las palabras que pronuncias; como una tierna reparación por el dolor que Me causan aquellos que quieren borrarme en todas partes, aún del alma de los niños pequeños. Siembra Mi Nombre… Yo daré el incremento.”</i>"],[10]],[739,["1° de agosto de 1939. <i>“Pide a Mi madre cada mañana que bendiga tu día. Ella tiene cuidado de vosotros, como lo tenía de Mí y Me apretaba contra su Corazón.”</i>"],[28]],[740,["4 de agosto. <i>“Da gracias al Padre por tu cuerpo, por tu espíritu, y por tu voluntad de sufrir lo que Él te pida. Recuerda que al subir al Calvario, por Su Gloria, oraba Yo por todos los que Me iban a imitar.”</i>"],[35]],[741,["5 de agosto. <i>“Cuando digas: ‘Hágase tu Voluntad en la Tierra como en el Cielo’, pide la santidad para todos tus hermanos de la Tierra. Haz con fervor esa petición. ¡Qué felicidad si la amable Voluntad del Padre se hiciera en la Tierra como se hace en el Cielo! Ofrece, para que así sea, los Sufrimientos de Mi Pasión. Que Mi Sangre no permanezca inactiva. Derrámala sobre las almas para la Gloria del Padre. Como Yo. Siempre juntos.”</i>"],[35]],[742,["6 de agosto. Yo Le recordaba mis pecados. Él: <i>“¿Por qué te admiras de cometer faltas cuando eres miserable? Pero Me gusta darme a la miseria.”</i>"],[12]],[744,["7 de agosto. Yo me humillaba por las faltas cometidas en esta semana. Él: <i>“Pídeme con toda tu alma que te las perdone y quédate apoyada sobre Mi Corazón para retomar fuerza y alegría.”</i>"],[12]],[745,["8 de agosto. Después de la comunión, pensando que tenía un desayuno en mi casa. <i>“No tienes necesidad de abandonarme para recibir a tus invitados. Yo también sé recibir y acoger. Cuando Yo andaba en la Tierra acogía a muchos desconocidos. Y ellos se iban contentos porque sentían Mi afectuoso interés por ellos.</i>\n<i>“Hazme el honor de conservarme cerca de ti cuando recibas a las personas, porque no hay momento alguno en tu vida, ¿lo entiendes? en que Yo salga sobrando.”</i>"],[54]],[746,["Yo subía la vieja escalera, contando los escalones. A cada escalón Me decía Él: <i>“Dime que, entre todos los momentos de tu vida, es precisamente este el que sientes más lleno de Fe y Esperanza; el momento del más grande Amor. ¡Que tu vida sea un crecer por instantes! ¡Y dímelo!”</i>"],[53]],[747,["Ante la Imagen del Divino Rostro. <i>“Amiga Mía… ¿Me amas? ¿Me amas más que las otras </i>(los otros, los demás)?”"],[42]],[748,["9 de agosto. <i>“Aproxímate más a Mí, abraza más apretadamente tu deber. De esos instantes fugitivos que parecen no valer nada pero que son cosa Mía si tú Me los das, sacarás tu eterno tesoro. De los momentos fugitivos que Me diste, Yo saco para ti una felicidad permanente que es Mía, pero que Yo te doy a ti.”</i>"],[25]],[749,["9 de agosto. Yo leía ‘El Verbo se hizo Carne y habitó entre nosotros.’ Él: <i>“¿Quieres de veras que siga habitando entre vosotros? ¿En ti? ¿En tu vida? Habitar significa estar siempre ahí. ¿Quieres que te habite?”</i>"],[26]],[750,["10 de agosto. En el carro para La Louvese. <i>“Sé como una brizna de paja en un viento poderoso. ¿Qué es lo que hace la brizna de paja? Una sola cosa: se abandona. Pero es un abandono total a la fuerza del viento, no tiene ningún movimiento propio.”</i>"],[40]],[751,["13 de agosto, Annonay. <i>“Yo quiero ser para ti ‘el Único’. Tu único pensamiento, tu exclusivo cuidado. Nada. Nadie. Yo.”</i>"],[3]],[752,["16 de agosto. <i>“Cree firmemente que las acciones más banales hechas con la intención de salvar almas, las salvan. Una Fe robusta hace honor a Mi Misericordia y a Mi Bondad. Créelo.”</i>"],[21]],[753,["Lyon. En un bar lleno de gente.<i> “Ofréceme aquí un Padrenuestro. ¡Será el único que se Me diga aquí en mucho tiempo!”</i>"],[35]],[754,["En una iglesia, cerca de la estación, Me dijo: <i>“Cuéntame lo que te habría interesado o te habría causado pena. Muchos creen que a Mí hay que hablarme en un lenguaje especial, y por eso no Me hablan. Pero todo sería diferente si se pensara en lo mucho que Me agradaría que Mis hermanos se llegaran a Mí con simplicidad y un poco de cariño… Vosotros todos, que sois Mis amigos más delicados, venid a apagar Mi sed. ¡Tengo sed de vosotros!”</i>"],[10]],[755,["l8 de agosto. En el carro de La Louvese a Annonay. <i>“Sé siempre alegre. Con tu corazón ardiendo en el Mío. Te amo hasta la locura; ¿no te lo demuestra la Locura de la Cruz?”</i>\nEn Lyon, en la iglesia. <i>“Tratadme como al más íntimo, que no solamente excusa las faltas que se Le confiesan, sino que toma en Sí mismo todas esas faltas para obtener el perdón del Padre.”</i>"],[36]],[756,["19 de agosto Lyon. En la estación, para tomar el tren para Fresne, pensaba yo que iba a entrar de nuevo en el cuadro habitual con todos mis defectos. Le dije: ‘Señor, cámbiame el alma, dame otra.’ El: “<i>Más bien, trabaja tú para modificarla. Deja tu estar en ti para estar en Mí. Establece en Mí tu pensamiento y tu actividad”.</i>"],[39]],[757,["23 de agosto. Nantes, después de la comunión. <i>“Este día vive en ofrecimiento de consuelos por el beso pérfido de Judas que tanto dolor Me causó, a Mí, que Soy la Delicadeza. Yo estaba roto ya por Mi Agonía cuando vino a herirme ese otro dolor indecible. ¿Comprendes? Él era un amigo, un elegido; un testigo de Mis Expansiones íntimas. Por eso fue tan doloroso.”</i>"],[36]],[759,["27 de agosto, después de la comunión. <i>“Esa persona sale de la iglesia sin haber dado gracias y va a pasar el día sin acordarse del favor que le hice por la mañana. Tú, piensa en Mí de hoy a mañana. Habla conmigo, dame las gracias, ámame. Ofréceme todas tus acciones para salvar pecadores… para eso estoy en tu vida. Cuando una persona está en tu casa, tú no la dejas sola, ¿verdad? Entonces, vive en Mi Presencia.”</i>"],[8]],[760,["31 de agosto de 1939. <i>“Hoy honrarás Mis Manos perforadas por Mi Locura de Amor. Las mirarás y amarás durante todo el día; Las pondrás en las tuyas y en tu corazón. Le pedirás al Padre que quiera derramar esa Sangre sobre el mundo en guerra, sobre los pecadores, sobre los dirigentes de las naciones, sobre las almas humildes, pequeñas y escondidas, que tienen necesidad de Mi Auxilio para aumentar Su Gloria.</i>\n<i>“¡Aumentar la Gloria de Dios! ¡Qué ideal para un alma hermana de la Mía!”</i>"],[27]],[761,["2 de septiembre de 1939.<i> “Bendíceme por tantas Gracias como te he concedido. La gente considera natural que Yo dé, pero no se acuerda de agradecer. Mi Corazón desea que se le den las gracias, pues la gratitud enciende el amor. Es una palabra de amor.”</i>","2 de septiembre de 1939. Mientras doblaba mi cobertor:<i> “Ofréceme tus acciones más ordinarias, las más pequeñas, como un ramillete de flores del campo. ¿A quién no le gustan esas florecitas modestas? Teje una corona para Mí. Para una guirnalda se necesitan muchas flores; no te canses de colocarlas sobre la Frente herida por las espinas. Con esto obtendrás fuerza para los pobres soldados que parten hoy a la guerra </i>(Se había decretado la movilización general)<i>. Esto es la Comunión de los Santos y su Fuente Soy Yo.”</i>"],[22,50]],[763,["7 de septiembre. Yo me humillaba por tantas distracciones. <i>“Ofrécemelas de todos modos; es siempre algo de ti. Dámelas, para que Yo las repare, y ponte con frecuencia delante de Mí, Mi pequeña.”</i>"],[17]],[764,["12 de septiembre. <i>“Sí, hay muchas municiones que distribuir, pero es preciso que antes haya fábricas. Sé tú como una fábrica de oraciones y Yo las distribuiré. Pues, ¿cómo podré distribuir si no tengo reservas?”.</i>","12 de septiembre. Yo rezaba el rosario por Francia y decía: ‘Gracia del misterio, desciende sobre nuestras almas.’ Él: <i>“Di eso tres veces, en honor de las Tres divinas Personas y cada una de ellas te escuchará.”</i>"],[33,48]],[765,["13 de septiembre. Después de visitas que me habían ocupado todo el día. <i>“No vuelvas al mundo. Si te volvieras mundana, Yo no tendría ya más tus pensamientos.”</i>"],[52]],[766,["19 de septiembre. Yo me sentía intimidada de pasar la mañana entera con el Padre. <i>“Todo lo que ha sido realizado por el Hijo fue querido por el Padre. Quien es amigo del Hijo es amigo también del Padre. Quien ama al Hijo, ama también al Padre.”</i>"],[35]],[767,["15 de septiembre, estando yo en oración. <i>“¡Si tuvierais Fe! Lo que vosotros obtenéis en largos años de oración podríais también obtenerlo en una sola petición. Creed que Yo os escucho siempre, dispuesto a daros lo que pedís. Esto, de una manera que os resulta desconocida, pero que responde a vuestra plegaria.”</i>"],[21]],[768,["<i>“No admitas en tus pensamientos otra cosa que la bondad, así tus actos serán mejores.”</i>"],[52]],[769,["19 de septiembre. <i>“Si sufres sola, eres pobre; pero si sufres conmigo, eres rica. Tu poder puede salvar la faz de la Tierra, aumentar el número de los cristianos y reducir a los malvados.”</i>"],[37]],[770,["20 de septiembre. En el campo. <i>“Cuando pase un día en que no hayas pensado en Mí, tu dolor debe ser grande por el temor de que Mi Dolor sea más grande todavía.”</i>"],[10]],[771,["24 de septiembre. “<i>Los calificativos más bellos quedan muy por debajo de la Belleza de Mi Madre. Tú la llamas Estrella de Oro, Fuente Sellada, Flor Perfumada. Pero no es posible decir sobre la Tierra sino muy poco de lo que es Ella. Esto te lo digo para que tengas confianza.”</i>"],[28]],[772,["26 de septiembre. En mi tiempo de descanso. <i>“Cuando tú te mortificas es como si se renovara Mi Flagelación ante el Padre para bien de los pecadores. Como si tu cuerpo fuera Mi Cuerpo. Porque vosotros todos sois miembros Míos, ¿comprendes? Yo hago Mías vuestras acciones cuando vosotros Me las dais, y con una verdad que no imaginas.”</i>"],[37]],[773,["Yo Lo buscaba. Él: <i>“Si no te hablo no es porque Me encuentre ocupado en otra parte. En todas partes estoy presente y Me ocupo de cada alma como si fuera la única en el mundo.”</i>","En mi tiempo de descanso: “<i>Hoy Me adorarás en la Hostia que San Pedro dio a Mi Madre y que permaneció en Su Corazón, el primer tabernáculo. Únete a Su amor fiel. Mira bien esta Hostia en ese Corazón.”</i>"],[15,28]],[774,["10 de octubre. <i>“No arrastres contigo continuamente tu pasado si eso te impide acercarte libremente a Mí. Arrójate en Mis Brazos con espontaneidad y tal como eres. Allí tendrás alegría, ya que Yo no puedo dar sino eso.”</i>"],[12]],[775,["<i>“Tú no te asombras de tener de cuando en cuando que sacudir algo de polvo en tus muebles; no te extrañe tampoco el que tengas cada día que quitar de tu alma algunos polvos. Ayúdate con las indulgencias, pues para eso las puse en Mi Iglesia.”</i>"],[37]],[776,["13 de octubre de 1939, mientras yo recitaba un acto de Amor. <i>“Si es algo bueno hacer un acto de Amor, ¿por qué no hacer muchos de ellos en Mi Presencia? Yo estoy en dondequiera que tú estás. Piensa en ello.”</i>"],[39]],[777,["17 de octubre. Me pareció que mis mañanas consagradas al Padre se hacían más distantes. Él: <i>“Pero, ¿es que no crees que el Padre y Yo somos una sola cosa? En cuanto a los demás, su juicio sobre ti importa poco. Vive para Mí.”</i>"],[35]],[778,["18 de octubre. Leía yo en la vida de Josefa Menéndez: ‘Si las almas vivieran continuamente unidas a Mí, Me conocerían mucho mejor.’ Yo Le pregunté: ‘Señor, ¿en qué consiste ese unirse a Ti?’ Él me respondió: <i>“Es simplemente pensar en Mí. Hablar conmigo como en el seno de una íntima amistad. Es buscar Mis Intereses. Es sufrir por causa Mía. Es tener el cuidado de Mi Reino. Es recordar Mis Sufrimientos. Es dejar que tu amor corra en todo momento hacia dentro de Mi propio Amor. La unión conmigo es todo lo que se desprende de esto.”</i>"],[54]],[779,["<i>“Ámame como puedas. Yo supliré lo que falte.”</i>"],[1]],[781,["21 de octubre, en Nantes. <i>“Cuando te pido que repitas con frecuencia: ‘Sé que estás presente, Te amo’, quiero que crezca tu piedad. A los soldados se le obliga a ejercitarse, hasta que conocen bien todos los movimientos. Es lo mismo en la vida del espíritu: a fuerza de repetir, de volver a empezar, se llegan a dominar los grandes impulsos y después de eso todo resulta fácil. Pero es indispensable el ejercicio.”</i>"],[1]],[782,["26 de octubre. Tuve una tarde mundana y llena de maledicencias. Cuando Le pedía perdón, Él me dijo: <i>“Para reparar, ora. Acuérdate de ese polvo que todos los días tienes que sacudir de tus muebles. Cántame un cántico de reparación por esas faltas.”</i>"],[12]],[783,["28 de octubre. Le daba las gracias por haberme dado medios de calefacción para el tiempo en que cosía los ornamentos. Él: <i>“Tengo que calentar a Mi pequeña obrera, ¿no? Mis servidores son siempre recompensados, tarde o temprano.”</i>"],[16]],[784,["28 de octubre. Después de la comunión. “<i>Gran alegría Me darías si en cada una de tus acciones de gracias le rogaras a Mi Madre que te ayudara.”</i>"],[28]],[785,["Ante un encantador despuntar del sol sobre el agua, yo cantaba: ‘¡Cuán admirable es el Nombre del Señor!’ Él me dijo: <i>“¿Verdad que Mis espectáculos son los mejores del mundo? Yo los hago para vosotros. ¡Con solo que supierais contemplar!... Dándome gracias… Encontrando en ellos Mi Amor. Tú, ¡págame!”</i>"],[11]],[786,["3 de noviembre, delante del fuego. “<i>Ya lo ves, nada arde sin contacto. Acércate a Mí, únete a Mí. Unirse significa llegar a ser la misma cosa”.</i>"],[49]],[787,["6 de noviembre, en la ciudad. Yo pasaba delante de una iglesia. Él: <i>“¿Por qué no entras a verme? ¿Qué tal si Yo tuviera algo que decirte? Tú no pasarías delante de la casa de una amiga íntima sin entrar alegremente. Incluso, te las arreglarías para poner esta visita en tu trayecto. Y sin embargo, esta persona amiga no te esperaría con el mismo deseo que tiene tu Salvador. Entra, esto no te retrasará. Mira cuánto te amo.”</i>"],[20]],[788,["<i>“¿Has escogido ya? ¿Soy Yo lo que quieres? ¿Haces tu vida para ti o para Mí? El Padre y Yo aguardamos vuestras respuestas.”</i>"],[1]],[789,["13 de noviembre de 1939. Él: <i>“Cuando Me tienes encerrado en tu pensamiento es como si guardaras y cuidaras Mi Cuerpo, como si Me cuidaras todo entero en una especie de sepulcro viviente. Me acoges. Y, después de todo, no es para ti difícil pensar en Mí.”</i>"],[41]],[790,["15 de noviembre. Hora Santa. Sola en Saint-Clair. <i>“Tú, que estando en Jerusalén pudiste pasearte por el Huerto de Mi Agonía, acércate ahora a Mí y consuélame. Encántame. Ofrece al Padre Mi Sudor para la conversión de los pecadores y por la liberación de las almas del Purgatorio. Eres Mi privilegiada: ora conmigo. Juntos los dos. Ofrezcamos también los padecimientos de Mi Madre, que desde lejos participaba en Mi Dolor. ¿Me ves bien en el Huerto? Recuerda la escena. Considera Mi Corazón angustiado, todo Él tendiendo violentamente a la salvación del Mundo.”</i>"],[36]],[791,["16 de noviembre. <i>“¿Temer? Claro que sí: hay que temer Mis Juicios, temer ante Mi Ley, temer ante la Grandeza de Mi Divinidad. Pero no debes tener miedo de Mí en tu vida. Yo Soy todo Bondad, Amor y Misericordia. Acércate a tu Zarza ardiente, que arde sin consumirse.”</i>"],[12]],[792,["19 de noviembre, a las 5:30 Via Crucis. Yo decía: ‘Grito tan fuerte mi amor, que Tú no oirás los martillazos.’ Él: <i>“Tengo una gran necesidad de ser consolado. Fui condenado a muerte, y a ese tipo de muerte, ¿te lo puedes imaginar?” </i>‘Yo querría ser condenada a muerte para poderte ofrecer, Señor, lo que sintiera.’<i> </i>Él: <i>“Entonces, ofréceme desde ahora tu aceptación de la muerte en obediencia a una ley divina y para la glorificación de Dios, para la disminución del mal sobre la Tierra, para la exaltación de la Santa Cruz. Cuando el Amor a la Cruz penetra en un alma, el Alma vive en un gozo que el Mundo no pueda conocer. Porque el Mundo no tiene sino placeres, pero la Alegría Me pertenece a Mí. Y también, amiga Mía, a los que son Míos.”</i>"],[51]],[793,["22 de noviembre. <i>“Es preciso que no se te pierda la alegría. Esa alegría que te es tan necesaria para volar a lo Alto.”</i>","22 de noviembre. Yo estaba cansada de contemplar. Él: <i>“Por eso existe también la oración vocal. Una manera de orar descansa de la otra, y así se está siempre conmigo.”</i>"],[0,34]],[794,["Yo pasaba en coche cerca de una iglesia de la Santísima Virgen. El: <i>“Di un Pater en unión con Mi Madre. ¿Te imaginas con qué fervor decía Ella una oración compuesta por su Hijo? ¡Y con qué frecuencia la rezaba! ¿Podrás imaginar la Alegría de Dios al oírsela decir con tanta perfección?”</i>"],[28]],[795,["22 de noviembre. Nantes. <i>“Gracias por haberme preparado ayer unas vestiduras. Gracias por haberme distraído y alegrado.”</i> (Lo dijo porque yo había cosido unos ornamentos y recibido a comer a unos sacerdotes-soldados).\nSaint-Clair, Hora Santa. <i>“¿Es algo tan complicado eso de vivir constantemente en Mí? ¡Soy tu Creador! El que te ha hecho ser lo que eres. He puesto en ti Mi Presencia y no podéis vosotros estar en un lugar en donde Yo no esté.”</i>"],[54]],[796,["27 de noviembre de 1939. Adviento. <i>“Tú sabes que en el Cielo no hay lugar para ninguna mancha ni imperfección. Vivamos pues juntos, Mi Gabriela, como medio de reparación, de súplica, de conversión. Hazme ininterrumpidamente compañía. Sería tan triste que Yo estuviera en ti y no Me respondieras. Yo nunca te dejo sola. Te habito. Tú también, no Me dejes nunca solo en tu corazón.”</i>"],[10]],[797,["28 de noviembre. En Notre Dame, después de comulgar. <i>“Hoy pondrás especial atención a tu lengua. Recuerda la Escritura que dice que ‘el que no peca con la lengua es un varón perfecto.’ Busca esta perfección con amor y con deseo de agradarme. ¡Cómo Me gustaría ver perfecta a una pequeña tan querida! Cuando llegue el medio día, examina cómo te fue.”</i>","28 de noviembre. En Notre Dame, después de comulgar. <i>“Anímate a vigilarte en todo. Debes vigilar tu Cielo por encima de tus ocupaciones de la Tierra.</i>\n<i>“Yo te había dicho: ‘Cada noche Me contarás cómo fue tu día’ y tú habías rechazado este pensamiento creyendo que era solo tu imaginación. ¿Te acuerdas?”</i>\nYo: ‘Señor, ¡cuánto más cerca de Ti me encontraría hoy si hubiera buscado esta cercanía todos los días!’ Él: <i>“Pero ya repondremos el tiempo perdido...”</i>"],[5,39]],[798,["29 de noviembre. <i>“Encomiéndame en tu corazón a todos aquellos que no viven en Mi Amor. Y cuando suenen las tres, recuérdame con una palabra de amor.”</i>"],[36]],[799,["3 de diciembre. <i>“¿Ves esa gran puerta hecha de hierro y de madera gruesa? ¡Qué pesada es! Es una puerta hecha con el miedo y la desconfianza que tiene el alma. ¿Cómo podría Yo entrar a través de semejante puerta? ¡Oh, vosotros todos, Mis íntimos! Tened una gran confianza en Mi riqueza de Amor. Entonces Yo Me precipitaré en vosotros con aquello que es vuestro deseo; porque entonces seréis para Mí irresistibles.”</i>"],[9]],[800,["Yo charlaba con alguien sobre casullas. <i>“Allá en el frente estaré contento si tengo ornamentos confeccionados por Mi pequeña. ¿No has visto lo orgulloso que se muestra un padre cuando uno de sus hijitos le da algo? Posiblemente no estará muy bien hecho, podría ser algo más bonito, pero el niño trabajó en ello con todo su corazón para dar un gusto a su padre. Entonces…</i>\n<i>“¿No vale, acaso, más esto, que una perfección lograda sin amor? ¡Ay! Vuestra ternura es lo que Yo busco en vosotros… en vuestras obras…”</i>"],[50]],[801,["4 de diciembre, después de la comunión.<i> “Busca la perfección en todos tus actos. Al principio esto parece difícil, pero luego se entiende que en ella están todas las alegrías, porque la alegría de poseerme trae consigo todas las demás.”</i>"],[50]],[802,["Me había costado mucho retener, en el curso de la conversación, una palabrita burlona. Pero Su Voz me decía: <i>“No la digas para darme gusto.”</i> Pasada la tentación me dijo: <i>“¿Ya ves? Ahora estás contenta. ¿Cómo podrías comparar el placer de decir una palabra desagradable con la alegría de haber conseguido una victoria? Estas pequeñas victorias reportan recompensas eternas. Piénsalo.”</i>"],[37]],[803,["<i>“No pierdas tu tiempo en pensamientos sobre ti. ¿No estoy Yo aquí para preocuparme de lo tuyo? Que en todos tus instantes haya un afecto, como cánticos en que Yo beba tu amor y amor por los pecadores; sacarás Gracias para ellos y para las almas del Purgatorio.</i>\n<i>“¿Qué es lo que te queda de todos esos pensamientos de la Tierra que has acariciado? ¡Cuánto habrías ganado si todos se hubieran convertido en impulsos hacia Mí! Reflexiona.”</i>"],[52]],[804,["5 de diciembre de 1939, después de la comunión. <i>“Reza hoy por conducto de Mi Madre la siguiente plegaria: ‘Dame, Señor, la santidad y concédeme santificar, no obstante mi pequeñez, a los otros’. Sí al decir esto crees que vas a ser escuchada, lo serás. Yo Soy, recuérdalo, infinito en Poder.”</i>"],[4]],[805,["8 de diciembre. Durante la procesión, recibí un tierno y dulce reproche de la Santísima Virgen: “¿<i>Por qué has tardado tanto tiempo en dárteme como una niña pequeñita?”</i> Y en espíritu me puse a llorar sobre Su Hombro. ¡Qué cosa tan simple y verdadera!"],[28]],[806,["9 de diciembre. Via Crucis, a las cinco y media. Estación de las Hijas de Jerusalén. <i>“Santifícate tú para santificar a los otros. Y santificar a los otros es darme a ellos, porque el Santo Soy Yo. Santo y Santificador.”</i>"],[47]],[808,["12 de diciembre. Después de la comunión, en la avenida: <i>“Cuando haces una visita a los niños, llevas siempre algo para darles. Y Yo, que Soy un Dios riquísimo, ¿podría acaso entrar en un alma sin dejarle nada? Y tú eres feliz cuando los pequeños te dan las gracias muy contentos. Dámelas a Mí con la misma simplicidad.”</i>","12 de diciembre. <i>“Ama. Ama. Haz a menudo actos de amor. Piensa en la alegría de poder amarme y piensa también en la desgracia de los condenados, que no pueden sino odiarme. ¡Qué cosa tan terrible es no poder amar a Dios!”</i>"],[16,38]],[809,["Santa Cruz. Hora santa. “<i>Permanece conmigo en el Seno de Mi madre durante todo este Adviento. Adórame en él, en donde estoy vivo como en el Cielo. Yo espero allí a que Mi Formación humana sea completa para salvar a los hombres. Ellos no sospechaban que su Salvador estuviera tan cerca.</i>\n<i>“De igual manera en el Sagrario. ¡Cuántos ni siquiera piensan que estoy ahí! Permanece conmigo y con Mi Madre, y déjate formar por Ella. Tengo una gran impaciencia por salir de Mi Prisión para acercarme a vosotros. Entonces, que sea grande también tu impaciencia por obtener, no obstante tu miseria, el perfecto estado de alma que es la santidad. Tú sola eres impotente, pero Mi Madre tiene sus secretos, que tomó de Mí. Ella obra en aquellos que se lo piden. ¡Es tan buena!”</i>"],[28]],[811,["24 de diciembre. A1 claro de luna, en una avenida. Alegre por la Navidad, cuya hora se acercaba. <i>“Pues sí, alégrate. ¡Si supieras lo que era el Mundo antes de Mi Venida! Estaba Dios y estaban los hombres. Pero ahora Dios se ha hecho uno entre los hombres. ¡Uno de vosotros! ¿Cómo medirás ese Amor? ¡Una Unión así, hecha posible entre vosotros y Él! ¿Ves la diferencia? Dame gracias con todas tus fuerzas, y sé Mía más que antes.”</i>"],[32]],[812,["24 de diciembre, después de la comunión. <i>“Aquí está el Mesías, el Salvador, tan deseado y esperado. El Salvador del Mundo, de todos, de ti.</i>\n<i>“Pídeme que te salve de tus faltas cotidianas, de tus hábitos reprensibles, de lo que hay en ti de malo, y Yo te salvaré. Trata de multiplicar los actos de Caridad, de evitar las faltas de la lengua, pensando que Yo estaré contento.”</i>"],[32]],[813,["Navidad de 1939. Misa de media noche. <i>“Ahora… debes nacer conmigo a una vida nueva. Vigila. Vela. Consérvate pura en intención,”</i>"],[32]],[814,["Navidad. En la Catedral. <i>“¡Cristianos de hoy! Otros han pasado antes que vosotros. Y otros vendrán después, añadiéndose al número de las almas en la presencia del Padre. ¡Cristianos de hoy! Dadme, durante el corto tiempo de vuestro paso por el Mundo, el máximo de vuestro amor por Mi Gloria. Que vuestra época sea para Mi Corazón la ‘Dulce Época’, la de la rica cosecha.”</i>","Navidad de 1939. Misa de media noche. <i>“Ahora… Debes nacer conmigo a una vida nueva. Vigila. Vela. Consérvate pura en intención.”</i>"],[32,46]],[815,["26 de diciembre, después de una reunión de juventudes. <i>“Toma tu alma entre tus manos y mira lo que ha sido este día. Pesa el amor que Me has dado en el transcurso de las horas. Y recuerda que seréis juzgados por el amor.”</i>"],[1]],[816,["Después de la comunión. <i>“Trata de evitar las faltas, incluidas las más pequeñas. Este es tu trabajo, pues has sido llamada a la santidad, y la santidad es la ausencia de toda mancha consentida. Trabajo del amor, ¿lo entiendes? ¡De amor!”</i>"],[47]],[817,["Via Crucis. Primera estación. <i>“Tú Me condenarías a muerte si en tu espíritu se oscureciera Mi recuerdo sofocado por la selva de los pensamientos terrenales.”</i>"],[51]],[820,["3 de enero. Via Crucis en Notre Dame, a las cinco y media. <i>“Considera lo que fueron a lo largo del camino Mis Sentimientos de abandono al Padre, Mis Deseos por vuestra salvación. Pídeme el amor a la Cruz, para asemejarte a Mí y para obedecer al Padre.”</i>\nEn mi tiempo de descanso, haciéndome percibir las palabras inútiles: <i>“Mis tres últimas horas de vida no dije sino siete palabras...”</i>"],[51]],[822,["6 de enero. En Notre Dame, durante un sermón. <i>“Piensa en todo el bien que tú podrías hacer mediante la conversación...”</i>"],[5]],[823,["17 de enero de 1940. <i>“Tú no Me sientes siempre de la misma manera; pero la oscuridad no debe impedirte la marcha. Humíllate y avanza con fidelidad. Marcha.</i>\n<i>“No Me ves, no Me sientes, pero Yo estoy ahí, lleno de Amor y te tiendo los Brazos. Nada en la Tierra Me distrae de pensar en vosotros, pero los pensamientos de los hombres son cortos y ellos piensan que así son los Míos... Pero Yo Soy el Ser estable, el Incambiable. Yo Soy la Presencia, Yo Soy la Mirada. Soy el que todo lo contiene. Soy el Instante, así como Soy también la Eternidad. Soy pura Riqueza de Amor. Yo Soy el que siempre os llama para que vengáis sin temor a arrojaros en Mi Corazón. Yo llamo. Al menos tú, respóndeme.”</i>"],[53]],[825,["22 de enero. Al<i>è</i>s, Gard. <i>“Toma entre tus dos manos Mi Cabeza coronada de espinas y ofrece al Padre todas las gotas de Mi Sangre por los pobres soldados que combaten. ¡Si supieras! Mi Sangre es un pacificación, una purificación, una fuerza…”</i>"],[45]],[826,["26 de enero. Valence, en un tren helado. <i>“Si Yo tuviera otro medio de acercarte a Mí fuera del sufrimiento, te lo daría.”</i>"],[37]],[827,["Cuarenta horas. <i>“¿No comprendes que Mi Unión con un alma tiene que estrecharse conforme ella se va acercando a la Eternidad?</i>"],[31]],[828,["Yo tenía una duda. <i>“Tú no tienes dificultad en admitir que en cada cuerpo hay un alma. ¿Verdad? Y sin embargo, tú no ves tu alma. Entonces, ¿por qué se te dificulta creer que Yo esté en tu alma en Gracia, aun cuando no Me ves? Yo estoy ahí, no Me dejes solo. Habla conmigo.”</i>"],[26]],[829,["27 de enero. Nantes. <i>“Yo habría podido amaros con menos fuerza. Ahora, alábame por este excedente de Amor. Agradece e invita a Mi Madre para que te ayude.”</i>"],[2]],[830,["1º de febrero de 1940. <i>“Hay almas que no van a comulgar sino por Pascua; otras Me reciben solamente en las grandes fiestas. Pero las hay también que comulgan todos los días. De igual manera, hay diferentes grados en el amor, muchos matices de delicadeza en Mi gran familia de almas. Tú sé de las que Me encantan con un amor puro y desinteresado.”</i>"],[8]],[831,["2 de febrero, por la mañana. <i>“Entregar el alma. Es una palabra justa, pues Yo os la di. ¡Y puse en ello tanto Amor! Es preciso devolvérmela con todo el afecto y la ternura de que seáis capaces, para honrar Mi Amor primero. Cuando Yo venga a recoger esta alma preciosa, que ella Me entregue ese ‘ser que se rompe’ y Me lo dé como un perfume.”</i>"],[31]],[833,["8 de febrero. Cuarenta Horas. Yo contemplaba el descendimiento de la Cruz. <i>“Pon a la humanidad entera, junto conmigo, en el Regazo de Mi Madre, para que Ella cure nuestras llagas, cierre nuestras heridas y nos embalsame para la Resurrección.”</i>"],[36]],[834,["9 de febrero. En la cuarta Estación del Via Crucis. <i>“Cuando Me abrazó, recibió Mi Madre la fuerza necesaria para asistir a la muerte horrible de Su Hijo.”</i>"],[51]],[835,["18 de febrero. Via Crucis, segunda estación. <i>“Recibe con grande amor tu cruz de cada día, lo mismo que Yo recibí la Mía. No te digo que no sientas el sufrimiento, sino más bien que llegues poco a poco a amarlo. Es el sufrimiento lo que acerca las almas a Mí, y nadie podrá igualarme en lo que padecí.”</i>"],[51]],[836,["18 de febrero de 1940, a la hora de la Elevación. <i>“Yo soy el que desagravia. Pon sobre el altar todas tus faltas, desde las primeras que tuviste y dile al Padre, como si se lo dijeras al oído, tiernamente, tu contrición.”</i>"],[46]],[837,["<i>“Parece que hubiera dos dioses: el del Cielo y el de la Tierra, que es el dinero. Tú no te sirvas de él sino para servir a tu Salvador, y a tus hermanos por amor a Él.”</i>"],[5]],[838,["“<i>En todo lo que hagas, pon tu pequeña parte de buena voluntad y déjame a Mí el resto.”</i>"],[50]],[840,["20 de febrero. Yo Le daba el nombre de ‘Dulcísimo Señor’. Él: <i>“Sí, dirígete a cada una de Mis Cualidades y entrégate a Ellas, una después de otra. Porque Mi Dulzura iguala a Mi Fuerza, y las Virtudes de Mi Alma, cuando son invocadas, impregnan las almas.”</i>","20 de febrero. En el tren para Fresne. <i>“¿Comprendes cómo Yo respeto a los hombres? Respeto su voluntad. Espero de ellos amor, pero no fuerzo su albedrío. Les doy cuanto necesitan, pero aguardo su respuesta. Me mantengo ahí, invisible, silencioso, como un pobre que espera una limosna. Es preciso que vosotros deis el primer paso. Pero, ¡con qué alegría daré Yo todos los que siguen!”</i>"],[8,10]],[841,["21 de febrero (1940). Nantes, Clausura de las Cuarenta Horas, con las Damas Blancas. En el momento de sacar el Santísimo Sacramento para llevarlo por la capilla, me dijo: <i>“Ya ves cómo soy dócil a los gestos del sacerdote. Salgo y entro al Tabernáculo según su voluntad. Y sin embargo, Yo Soy el Creador del Cielo y de la Tierra. Vive sometida a Mí, que Soy sumiso. Acéptalo todo de Mi Voluntad.”</i>"],[20]],[842,["24 de febrero, después de la comunión, yo le pedía que grabara en mi corazón sentimientos de Fe, de Esperanza y de Caridad. Él: <i>“Yo lo hago cuanto el alma cree que voy a hacer. Pero es indispensable que vosotros hagáis crecer la semilla. Un grabado no sirve de nada cuando nadie lo mira con frecuencia, para excitar los sentimientos que él inspira.”</i>"],[53]],[843,["27 de febrero. <i>“Tú concedes demasiada importancia a las cosas de la Tierra y no la suficiente a las cosas del Cielo. Pero la Tierra es meramente accidental, el Cielo es tu fin. El Cielo no es accidental, dura para siempre. Tú no fuiste hecha para la Tierra, ella no es para ti sino un pasaje rápido. Considera pues, en todas tus acciones, la Eternidad.”</i>"],[38]],[844,["Hora Santa. 29 de febrero. <i>“Comienza por pedir perdón de tus faltas, uniéndote a Mí en el Huerto. Perdón por tus maledicencias, por tus mentiras vanidosas, por las exageraciones en tu lenguaje. Pide perdón porque tu corazón ha estado seco ante los pecados del mundo, que tan profundamente Me hieren. Perdón por tu indiferencia ante Mis Intereses.</i>\n<i>“Humíllate y con esto Me alegrarás. Mírame en el Huerto. Verás Mi Dolor y Mi Vergüenza. Verás el dolor de Mis Sufrimientos, inútiles para muchos.</i>\n<i>“Ora conmigo: ‘¡Padre, ten piedad! Padre, perdónalos a todos. Padre, mira a Tu Jesús en Getsemaní’.”</i>"],[36]],[845,["1º de marzo. <i>“¿No se te ha ocurrido alguna vez el pensamiento de que tal o tal Gracia te haya sido concedida a causa de una plegaria que alguien hizo por ti? ¿O debido a esta o aquella bendición de un sacerdote? ¿O por los méritos en la vida de tus padres? ¿O simplemente por la divina Misericordia? ¿O por la bondad de Mi Madre? Con tal de que no creas nunca que la causa de esas Gracias eres tú misma, o tus virtudes…”</i>"],[23]],[848,["Por la tarde: <i>“Llámame Hermano. Y cuando hayas saboreado toda la dulzura que hay en ello, llámame Amigo. Y luego, cuando hayas agotado esa suavidad, llámame Esposo. Así se enriquecerá tu amor, sin cambiar.”</i>","5 de marzo. Via Crucis, a las cinco y media. <i>“Tú eres la gota de agua en Mi Cáliz. Únete a Mí en todas y cada una de tus acciones, sean las que, sean, a Mi Cruz, sobre Mi Hombro destrozado.”</i>\nDecimotercera Estación. <i>“Mi Madre tenía muy poco tiempo para sepultarme. Y sin embargo, halló manera de cerrar todas las heridas. ¡Y con qué Amor lo hizo!”</i>"],[1,51]],[850,["6 de marzo. <i>“¡Qué fría y dolorosa es una mansión deshabitada! ¡Y qué feliz es otra llena de juventud, de vida y de alegría! Esta es la diferencia que separa a un alma en donde Yo no habito porque ella Me rechaza por el pecado, y otra en la cual estoy presente.</i>\n<i>“Piensa a menudo que estás habitada y ama el Huésped que va contigo a todas partes. Y dile con simplicidad y llaneza todo lo que tu amor te sugiera...”</i>"],[41]],[851,["7 de marzo. <i>“Es posible que Yo no te haya creado para otra cosa, sino para que Me consueles dándome asilo en un corazón en donde Me cantas el cántico del Amor. ¿Por qué no habría Yo de tener una morada en esta Tierra? ¿Será todavía preciso que no tenga ni una piedra donde reclinar la Cabeza? Ábreme. Ábreme tus puertas de par en par, pequeña alma tan amada.”</i>"],[26]],[855,["12 de marzo. En la Catedral de Nantes. <i>“¿Comprendes lo que significa que Yo te haya comprado dolorosamente? Entonces, eres Mía. Mucho más de lo que tú misma crees.”</i>"],[36]],[857,["En la avenida. <i>“No reces tus oraciones como una tarea obligatoria. Dilas como se cuenta una historia encantadora, al oído del Amado. Y mejor si la dices con una sonrisa interior. ¡Qué bien serás escuchada si oras así!”</i>"],[34]],[858,["Viernes Santo. Arrodillada detrás del Señor Cura, frente al Repositorio. <i>“Toda Gracia ha venido siempre a la Tierra por los sacerdotes, en el nombre de los sacerdotes, en nombre del Sacerdote que es Cristo. Dame las gracias y ruega por ellos. Ayúdalos. Tú has visto edificios que se sostienen sobre columnas o por medio de soportes. Sé tú del número de Mis auxiliares. ¿Qué cosa es imposible de obtener cuando se ora?</i>\n<i>“Si Vosotros Me lo pedís, Yo iluminaré a los sacerdotes.”</i>"],[33]],[861,["“Señor, me gustaría charlar contigo como lo hacía la primera mujer, cuando Tú ibas al Paraíso a visitar a Adán y a Eva.” Él: <i>“Pero tú tienes más motivos de amor que tus primeros padres. Entonces Yo no era sino el Creador, el Bienhechor, el Iluminador; ahora Soy tu Salvador, tu Reparador, la dulce Víctima, el Amor revelado.</i>\n<i>“Lo que te doy ahora es más que una visita, pues habito en ti y tú comes Mi Cuerpo. Y nunca te abandono… Busca en ti palabras que te derritan de amor.”</i>"],[34]],[863,["29 de marzo. En el campo. En la sala grande yo Le decía: ‘Se me figura que Te hablo con demasiada familiaridad.’ Él me contestó: <i>“¡Estamos en familia! Nada puede agradarme más. Todo aquel que comprende cuál es Mi Deseo, Me abre su corazón en todo momento. Tanto Amor tengo por las almas que la más leve llamada de su parte encuentra eco en Mi Corazón. Acerca tu boca a mi Oído: Yo te escucho.”</i>"],[34]],[864,["Yo arreglaba unas hortensias. “<i>Únete a Mi Trabajo de obrero. No importa lo que hagas, sino el amor con que lo haces. Y el amor es unión. Tendré gran alegría si Me ofreces el espectáculo de una alma totalmente perdida en su Salvador.”</i>"],[50]],[865,["30 de marzo. “<i>Te gusta nuestra soledad, ¿no es así? Pero sábete que si Me dejas por cumplir un deber de caridad me agradas lo mismo. Si me dejas por ese motivo, me vuelves a encontrar. Y llegará un día en que tu alma no se apartará un solo instante de su Dios y Salvador.”</i>"],[5]],[866,["En una iglesia de campo. Viendo que no hacía yo progresos, Le decía: ‘Señor, ya me he ocupado de mí misma. Ahora me pongo en Tus Manos.’ Él me dijo: <i>“¡Si supieras cuánto estimo tener alguna importancia en vuestra vida! Yo puedo hacer de ti una mujer nueva. Cuando eras pequeña pedías que te dieran la mano para bajar los escalones. Pídeme con frecuencia la Mano porque sigues siendo pequeña. No pienses que eres capaz de algo bueno sin Mí.”</i>"],[24]],[868,["2 de abril de 1940. Visita al Santísimo Sacramento. Yo decía: ‘¡Si supiera al menos que Te amo! Pero qué amor tan curioso ese que se da a un ser que no se ve...’ Él contestó: <i>“Es precisamente este el amor que Me gusta. ¿Qué mérito habría en amarme después de haberme visto? Es una prueba por la que tenéis que pasar. Superadla como vencedores.”</i>"],[53]],[871,["8 de abril. Mientras removía la tierra esta mañana, meditaba en la Flagelación, cuando Él tuvo que arrastrarse por el suelo… Me dijo: <i>“Si tienes la Fe, ¿por qué no tienes una Esperanza mayor? Ayúdame a salvar a los pecadores. Espera en Mi Poder infinito. Tú has visto cómo ciertas palancas levantan pesos enormes y también has visto cómo se producen ciertas metamorfosis químicas. Y, ¿qué es eso en comparación con lo que Yo, el Todopoderoso, Soy capaz de hacer?”</i>"],[4]],[872,["9 de abril. <i>“Recuérdalo: todo lo que procede del orgullo es perecedero y desemboca en la vergüenza; al tiempo que todo lo que procede de la humildad fructifica y se convierte en Gloria para quien lo hizo.”</i>","9 de abril. <i>“No pienses que un santo debe necesariamente parecerlo ante los ojos de los hombres, porque conserva su naturaleza exterior y la santidad esta en lo interior. Así como hay frutos cuya corteza áspera y aún espinosa no hace pensar en su dulzura, así también Mis santos: lo que vale en ellos está en su corazón.”</i>","9 de abril. Via Crucis en la iglesia vacía. Él: <i>“No tengo a nadie fuera de ti.”</i>"],[23,47,51]],[873,["12 de abril (1940). A la Elevación: ‘Señor mío y Dios mío’. Él: <i>“Sí, tu Señor y tu Dios </i>(Como dándose). <i>Vuestro Señor y vuestro Dios.”</i>","12 de abril. Via Crucis. <i>“Bien quisiera Yo que no hubiese en ti ningún forzamiento, ninguna molestia para seguirme. Que sea para ti del todo sencillo recorrer Mi Via Crucis con ternura, siempre dispuesta a darme tu delicadeza. Y Yo le tomaré el sabor, como ‘si todo fuera cierto’...”</i>"],[20,51]],[874,["13 de abril. Mientras enceraba los armarios, le decía yo: ‘Señor, ¿será posible que salve yo un pecador por cada armario?’ Él: <i>“Salvas según la medida de tu amor y de tu confianza.”</i>"],[44]],[875,["14 de abril. <i>“Es preciso que entres en la etapa de la confianza plena. Es preciso que entiendas que las palabras de tus oraciones no fueron formadas para golpear el aire, sino para tocar como flechas el Corazón del Padre, que las recibe con Amor.”</i>"],[34]],[876,["15 de abril. Yo: ‘Señor mío, ¿es posible que se salven todas las almas que en este momento viven por el Mundo entero?’ Él: <i>“Todo es posible en el Nombre de Jesucristo y por Sus Méritos.”</i>"],[33]],[877,["15 de abril. Yo oía jugar a los niños. Él “<i>Amo a los niños. He puesto en sus almas sentimientos exquisitos. Y son estos los sentimientos que se deben cultivar a lo largo de toda la vida. Vienen de Mí, y Me encanta encontrarlos en vosotros cuando habéis llegado a ser adultos. Una confianza sin límites, docilidad, sed de Jesús, candor y pureza, abandono total, mirada directa y franca. Vuelve a tomar tu alma de niña para dármela.”.</i>"],[24]],[878,["Hora Santa. <i>“Hija, vive conmigo. Conversa conmigo y pídeme consejos. Y todo lo que te pase, cuéntamelo. Algunos podrían pensar que esto es infantil y absurdo, tú piensa simplemente que es verdad.”</i>"],[24]],[879,["17 de abril. <i>“Recuerda que empezaste tu vida de penitente con la esperanza de que Me uniera a ti. Entonces, ¿cómo podría Yo resistir? Toda llamada vuestra es recibida por Mí con inmenso Amor.</i>\n<i>“¿Tu cuerpo? Considéralo como un objeto necesario para la vida sobre la Tierra. Un día lo dejarás como cuando te quitas un zapato. Valora, en cambio, la altísima superioridad de tu alma, creada a Mi imagen.”</i>"],[37]],[882,["Señor, ¿has avanzado algo en este trabajo que te encomendé de la santificación de mi alma? Él: <i>“Ten una confianza inconmovible. Mírame con frecuencia. Mírame siempre, pues en eso está el camino directo que acorta distancias. Tú puedes, pequeña Mía, aprender muchas cosas en la oquedad de la Peña...”</i> (De Su Corazón).","22 de abril. <i>“Estás tan llena de miserias, que fácilmente se puede ver que si algo hay de bueno en ti, es por obra Mía. Pero tus miserias mismas servirán para Mi Gloria.”</i>"],[13,30]],[883,["22 de abril. Yo tenía una duda. <i>“Tú estás bien segura de tener una memoria. Pero, ¿la ves? Y estás también segura de que tienes una voluntad, pero ¿la ves? ¿Y tu entendimiento? Concédeme la confianza de creer que estoy en ti sin que Me veas.”</i>"],[21]],[884,["Viernes. <i>“Vive hoy con Mis Llagas. Entra en Ellas. Y si te entristecen, míralas en la Gloria. Comprende, Mi pequeña, que ninguna otra devoción es más grande que esta; en ella estoy todo Yo. Mi Corazón, Mis Miembros, Mi Cabeza. Y en Mi Corazón encuentras todas las Llagas de Mi Ternura dolorida, desconocida, ultrajada y rechazada. Tú, Mi pequeña, quédate todo el día conmigo. Canta, habla, escucha”.</i>"],[27]],[885,["Después de la comunión. <i>“Sí, puedes decir: ‘mi hermosa Trinidad’. ¿Quién más hermoso que el Padre? ¿Quién lo es más que el Hijo glorificado?, y ¿quién más que el Espíritu de Amor? Adora.”</i>"],[8]],[886,["“<i>No Me gustan las fórmulas dichas como recitación. Di tus oraciones como si Me hablaras. Con ternura, como el ‘gracias’ que me dijiste esta mañana cuando te despertaron los cucús y los gorriones. Entonces Me dijiste: ‘Señor, ¿te ha dado alguien las gracias por haberlos creado?’”</i>"],[17]],[887,["Visita, en una iglesia vacía. Le dije: ‘Señor, estoy contenta de que haya en torno a tu altar esos hermosos lirios’. Contestó: <i>“Tengo flores, pero </i>(triste) <i>Me faltan almas...”</i>"],[20]],[888,["25 de abril. Le Fresne. Yo iba entrando a la iglesia para la Hora Santa. Él: <i>“Lo que vale tu pequeña visita de todos los días, lo verás mejor cuando estés Allá. Que nunca te falte. Y que te sea natural y dulce, pues de ser así crecerá tu mérito. Ya sabes que Me rehúso a forzar las voluntades; y este respeto Mío por vuestra voluntad es una forma más de Amor.”</i>","25 de abril. Mientras yo trabajaba en el jardín: ‘Pronto va a ser domingo, Señor, Tu día.’ Él: <i>“Todos los días son ‘Mi Día’ para los que Me aman. ¡Semanas felices, meses dichosos, encanto de toda una vida!</i>\n<i>“El Padre te creó, cree en Él. Espera en el Hijo, que te salvó. Y ama al Amor que es el Espíritu Santo. Mira la Familia divina, Padre, Hijo y Espíritu Santo: son Uno. Continuad esta unidad con todos vuestros hermanos, con el Cielo, con vuestro Padre del Cielo: ¡Uno!”</i>","25 de abril. Le Fresne. Yo iba entrando a la iglesia para la Hora Santa. Él: <i>“Te estaba esperando. ¿Crees en Mí? ¿Esperas en Mí como merece un Dios que esperen en Él?</i> <i>Quisiera verte llevar en peso Mi Voluntad por la Fe, unida a una intensa Esperanza. Recuerda la fórmula: ‘Yo obro en Tu Nombre, Señor, y sé que soy poderosa’. Espera, pues, una vida profunda. ¿Cómo podría Yo daros Mis Abismos de bondad si vosotros no estáis dispuestos a recibirlos? Y luego, mantén tu mirada fija en Mí, a lo largo de los días y las noches. De otra manera, Me olvidarás. Y es horrible ser olvidado cuando se ama tanto. Este Amor tú no sabes lo que es...”</i>"],[20,48,53]],[889,["4 de mayo de 1940. <i>“Recuérdalo: Yo seré para ti el que tú quieras que sea. Si Me tratas como a un extraño, seré para ti solamente un Juez. Pero si Me tienes confianza seré tu Salvador. Y si vives en Mi Amor, seré tu Esposo amante, el Ser de tu ser.”</i>","4 de mayo de 1940.<i> “Para hoy te pido la austeridad del espíritu. Que tu pensamiento sea una lámpara cuya flama suba directa hacia Mi Potencia, Mi Majestad y también hacia Mi Amor de Padre y de Esposo.”</i>"],[1,37]],[890,["9 de mayo. Hora Santa. <i>“Hoy eres tú la que Me va a hablar. Aquí estoy viéndote y te escucho con todo Mi Corazón.”</i> Le dije: ‘Señor, ten piedad de mí, como yo tengo piedad de Ti.’ Él, como sonriendo, me dijo: <i>“¿No crees que Yo tenga mayor compasión que tú? ¡Es lo natural! Tú te pones ante Mí para que Yo te dé cosas, y al consolar de esta manera Mi Corazón ávido de dar, Me tienes piedad. ¡Oh, hijitos Míos, dejad que os enriquezca, ofrecedme la oportunidad de santificaros! Sin Mí nada podéis, pero dadme la mano, dedicadme una mirada simple y confiada. Pensad: ‘Él es tan grande, puede cuanto quiere y es mi Padre y mi Amigo.’ ¿Entonces?”</i>","9 de mayo. Hora Santa. “<i>Pide al Padre que Yo viva en las almas. No sería vivir si no se ocuparan de Mí dentro de ellas.</i>\n<i>“Qué bueno sería estar en ellas como un Huésped, como el más querido de todos los huéspedes; aquel a Quien se rodea de delicadezas sabiendo que toda atención conmueve Su Delicadeza, y que tanta es a menudo Su Pobreza que cualquier limosna insignificante Lo hiere de amor.”</i>"],[10,26]],[891,["Yo pensaba en la santidad de la Santísima Virgen, que correspondió a todas las Gracias. ‘Madre mía, le dije, dame un poquito de lo tuyo.’ Ella me contestó: “<i>Hija mía, muy querida, todos mis méritos son tuyos, son de todos vosotros. Tú eres mi heredera, mi hija por la Comunión de los Santos. Pero es indispensable que lo creas y le hables de ello al buen Dios.”</i>","11 de mayo, Víspera de Pentecostés. Yo pensaba que el Espíritu Santo concede Gracias especiales para el día de su Fiesta. Jesús me dijo. <i>“No son Gracias que Él conceda para el día de su Fiesta, sino que las concede para siempre. Nunca retira algo que haya dado. Porque el Amor no puede retirar Sus Dones. Pídele que te dé con abundancia y Él te colmará. Te colmará simplificándote.”</i>"],[28,48]],[894,["Nantes. Fiesta de la Santísima Trinidad. En la catedral. <i>“Di ‘Amor al Padre, Amor al Hijo, Amor al Espíritu Santo, ahora y por todos los siglos, amén’. ¿No estamos viviendo en la época del Amor?</i>\n<i>“La Santísima Trinidad. ¡He ahí a tu Familia!”</i>"],[48]],[900,["26 de mayo.<i> “Despierta tu confianza en Mi Poder absoluto. Tu confianza es lo que en ti Me honra, y lo que puede cambiar los acontecimientos. Confianza, juntamente con el sentimiento de tu nada. Acuérdate del centurión.”</i>"],[9]],[902,["29 de mayo. <i>“Mi Gracia no la ves sino en pocas ocasiones; pero germinará como una semilla. Tú, simplemente, prepara el terreno de cultivo.”</i>"],[4]],[904,["31 de mayo. Fiesta del Sagrado Corazón. <i>“Únete a todas las almas que Me celebran hoy, en la Tierra y en el Cielo. Canta con el Cielo el Amor de Mi Corazón. Ofréceme Mi propio Amor.”</i>"],[13]],[906,["1º de junio de 1940. <i>“Vivamos juntos. Es un medio admirable de reparación, de súplica, de conversión.”</i>"],[54]],[907,["2 de junio. “<i>Yo os lo di todo, incluso a Mi Madre</i>.”"],[28]],[908,["3 de junio de 1940. <i>“¿Cuál será el alma que Me dé esa alegría, la de comenzar sobre la Tierra la vida del Cielo, amándome en toda clase de ocupaciones? ¿Serás acaso tú? Ámame sin fin… eso es todo.”</i>"],[50]],[909,["Mientras yo barría, me dijo: <i>“Haz cuanto puedas para llegar a parecérteme: considera que el Padre busca en vosotros Mi Rostro y que, si lo encuentra, Su Justicia queda como olvidada, se convierte en puro Amor.”</i>"],[42]],[910,["6 de junio. Yo ofrecía el Via Crucis por Francia. Él:<i> “Recuerda que todo cuanto sucede, sucede por la Voluntad de Dios. Ve a Dios en ello. Te ayudará meditarlo.”</i>"],[40]],[913,["13 de junio de 1940. Hora Santa. <i>“¿Crees en Mi Amor?”</i> ‘Creo, mi Señor.’ <i>“¿Crees de veras y a fondo en Mi Amor?”</i> ‘Sí creo, Señor mío.’ <i>“¿Crees definitivamente y para siempre en Mi Amor?”</i> ‘Sí, definitivamente, y para siempre.’ <i>“Entonces, hazme la donación total de ti misma y no vuelvas a tomarte ya nunca. Negación de tus propios gustos; voluntad de que Yo tenga Alegría, de que venga Mi Reino de Amor; olvido de tu ser y recuerdo del Mío. Recuerdo de ese Ser que no es el de un tirano exigente, sino el de un Cordero que Se inmoló por Amor.”</i>","13 de junio de 1940. Hora Santa. <i>“Cree firmemente que no hay proporción entre tus preocupaciones de la Tierra y la recompensa que te aguarda. La recompensa Soy Yo.</i>\n<i>“Anímate a soportarlo todo por amor, para conquistar al Amor. Vuestra tarea es la de conquistar el Paraíso, conquistar a Dios, al Dios eterno. Ya has visto que todo lo que pasa es corto, pero piensa en su contenido de Eternidad. Todo lo volverás a encontrar, y para siempre.”</i>"],[2,38]],[914,["Al entrar en la iglesia vacía, yo pensaba: ‘¿Podré permanecer aquí un ahora?’ Él: <i>“¿Qué importa el tiempo? Tú estás aquí, Yo también. Lo importantes es que nos amemos.”</i>"],[2]],[925,["<i>“Mira: siempre tendrás un medio para no pensar en tus pequeñas preocupaciones y es el de pensar en las Mías.”</i>"],[39]],[929,["<i>“Ofrece todos tus pecados en Mi Cuerpo sobre el Madero, para que el Padre perdone. ¡Al Padre Le complace tanto perdonar! Permitidle, por vuestro humilde arrepentimiento de pobres pequeñuelos, conceder esos perdones que tanto Le gustan.”</i>"],[35]],[930,["27 de junio. En Curzon. Hora Santa. <i>“Adora en espíritu todas las hostias que has recibido desde tu Primera Comunión. Adora todas esas efusiones de Amor en que Yo Me uní a ti y adora también todas las que van a seguir hasta la última. Dime que has sido feliz y que no concibes la vida sin la comunión cotidiana. Ya lo sé, pero me gusta que Me lo digas. Soy como un tímido que necesita recibir seguridades... ¡Pequeños hijos Míos, tan amados!”</i>"],[8]],[931,["28 de junio. Via Crucis. <i>“Dime que no te vas a aburrir de recorrer el camino en Mi Compañía. Me gusta mucho más lo que haces por Mí con alegría.</i>\n<i>“Yo Me encuentro en la situación de uno que, temiendo violentar a su amigo, se siente feliz cuando el amigo le manifiesta un contento siempre nuevo de estar en su compañía.</i>\n<i>“No Soy un Dueño exigente. Soy el Todo-Lleno-de-Amor; ven pues a Mí con los brazos extendidos. Como esos niños que toman impulso para lanzarse y ser recibidos al vuelo en los brazos de su padre.”</i>"],[51]],[932,["1º de julio de 1940. Estación de la Roche-sur-Yon, a donde me llevó ayer un caritativo carro de Curzon. Dormí sobre un banco de hotel. Y cuando Le daba gracias por Sus Favores lamentando no poder comulgar durante el viaje de tren, me dijo: <i>“Haz una comunión espiritual. Es un acto de deseo y de voluntad enteramente simple y lleno de confianza en el Salvador.</i>\n<i>“Este es el mes consagrado a honrar Mi Sangre. Ten la constante intención y deseo de que Mi Sangre purifique tu alma y purifique al Mundo entero. Confía en ello, sabiendo que así entras en la línea de Mi propio Deseo.”</i>"],[45]],[933,["Nantes. San Nicolás. Cargando mis paquetes Le daba yo las gracias por mi feliz retorno. Él: <i>“Cuando vengas a verme, acerca de inmediato tu oído a Mi Corazón. Si no, podrías irte sin haberme oído.”</i>"],[13]],[934,["4 de julio. Regreso a mi casa, que encontré llena de oficiales alemanes. Comprendí Su frase del 20 de junio: ‘Si los alemanes vienen, Yo los recibiré.’ Su estatua de busto había sido descubierta y Él presidía en el salón en que dormían ellos. <i>“Dirígete siempre a Mi Bondad, pues ya la conoces. Estoy aquí para cuidarte. Si tú eres pequeña, Yo Soy grande y fuerte. Aprovéchate de la Grandeza de tu Hermano. Y sobre todo, ¡no dudes!, porque vuestro mérito consiste en ver en la obscuridad y en estar seguros con la seguridad del amor.”</i>"],[9]],[935,["4 de julio. ‘Señor, ¿es que voy a seguir caminando así, de pecado en pecado, hasta la muerte?’ Él: <i>“Tienes Mi Sangre. ¡Si supieras lo ansioso que estoy porque se sirvan de Ella! Esta Sangre puede limpiar a la perfección cualquier pecado que se lamenta. ¿Para qué, si no, La habría Yo derramado? Pero hay que ofrecerla al Padre. Hay que verterla sobre el mundo. ¿Quién piensa en eso? Y sin embargo, el enfermo tiene gran necesidad de la medicina. ¿No recuerdas que una vez te decía que Mi Corazón es un hospital?”</i>"],[45]],[939,["10 de julio. Le Fresne. Via Crucis. Decimocuarta estación. Yo pensaba que cuando esté en la tumba, Él va a estar extendido sobre la lápida. Me dijo: <i>“Durante toda tu vida. Durante toda tu muerte. Juntos.”</i>"],[51]],[941,["En el campo. Sola en la iglesia con un soldado enemigo, trataba de orar por él. <i>“Recuerda que os está mandado amar a vuestros enemigos. Yo morí por todos. ¿Por qué habrías tú de hacer excepciones? Yo quiero tener en Mi Cielo a todas las almas y tú no conoces los secretos de los corazones. Este enemigo tuyo puede necesitar de tus plegarias. Dame, pues, esa plegaria, fraternalmente, por él.</i>\n<i>“Que estos pensamientos aumenten la fuerza de tu resolución. Que te den el valor que Yo tuve durante Mi Agonía. Porque Mi Dolor más grande fue el pensar que Mi Agonía iba a ser inútil para muchos.</i>\n<i>“Dame almas, tú, Mi pequeña. Y para ello ora conmigo y déjame orar en ti.”</i>"],[4]],[942,["19 de julio. Distracciones después de la comunión. Él: <i>“Eso no importa. No se puede impedir que las hojas se muevan cuando sopla el viento. Pero vuélveme a tomar luego en tu pensamiento, como si no te hubieras distraído. Yo encuentro Mi Reposo en las almas que se entregan a Mí. En ellas, mientras más trabajo, más descanso. Mientras Yo trabajo en ti, conserva tus ojos fijos en Mí a lo largo de todo el día. Mi trabajo será mucho más eficaz.”</i>"],[8]],[943,["20 de julio de 1940. Después de la comunión. <i>“Si fuera tan difícil alcanzar la santidad, Yo no os la pediría. ¿Qué patrón inteligente exige de sus servidores algo imposible? Es pues algo que queda a vuestro alcance, como fruto del querer. Volver a comenzar cada día, como si se tratara siempre del principio de una obra; humildemente, con confianza en Mi Socorro de cada instante. Y no perder de vista la meta, ¡pequeña Mía!”</i>"],[47]],[944,["24 de julio de 1940. <i>“¿Trabajas por la expiación de tus pecados? ¿Me ofreces tu día para consolarme, y por la salvación del mundo? Con eso Consuelas y conviertes. Hijitos Míos, ¡no perdáis un tiempo precioso viviendo sin finalidad!”</i>"],[12]],[945,["25 julio. <i>“Ofrece por igual a los pequeños y a los grandes la misma sonriente amabilidad. Pon especial empeño en ser amable con aquellos que te parecen vulgares. Ve a todos con la misma suavidad. Todos vosotros sois hermanos en Mí, pues Yo Soy el Hermano de todos. ¡No apartes los ojos de este Modelo!”</i>"],[5]],[946,["25 de julio. <i>“En tu rezo del Via Crucis ofrece al Padre, en cada estación, la Sangre que Yo vertí para la salvación del mundo.”</i>"],[45]],[947,["26 de julio. Santa Ana, por la mañana; en la iglesia. Me recordó Sus Llagas y me dijo: <i>“¿Cómo podrías vacilar en aceptar sacrificios por Mí? Estas heridas las recibí todas para servirte.”</i>"],[27]],[948,["26 de julio de 1940. <i>“Vuestra Misa es vuestra vida entera, que se corona con toda sencillez con la muerte. Uníos a Mi Vida en vuestras acciones más ordinarias, que con eso quedan divinizadas. Lo deseo grandemente.”</i>"],[46]],[949,["1º de agosto de 1940. <i>“Háblame como Me hablas en la Hora Santa. Soy el mismo. Humíllate ante la consideración de Mi Grandeza; humíllate también considerando lo pequeña que eres. Humíllate, en fin, considerando Mis treinta años de silencio.”</i>"],[23]],[950,["2 de agosto. “<i>Cuando en la oración te diriges a mí rezando Avemarías, es como si Mi Madre misma te diera la mano para acercarte a mí.”</i>"],[28]],[952,["8 de agosto. Hora Santa. <i>“¿Has oído bien Mi Voz? ¿Y todo lo que contiene? ¿Conoces el Amor y la Ternura? Los conocerás si Me conoces a Mí.”</i>","8 de agosto. Hora Santa. <i>“¿Acaso no somos nosotros dos el uno para el otro? </i>Yo: ‘Señor, ¿no ha sido así desde mi Primera Comunión?’ Él: <i>“Sin duda, pero tú puedes dar más. Si le das a un Rico, puedes estar segura de que recibirás más. ¿O es que tu buen corazón prefiere dar a un Pobre? Yo Soy también el Pobre. El que necesita que lo calienten y lo consuelen. Abre bien grande tu morada.</i>\n<i>“Dile a ese Pobre que Soy Yo: ‘Todo es tuyo, porque nada me reservo para mí; estoy contenta simplemente con que Tú Te sirvas de todo para Tu Gloria y según Tu complacencia.’ </i>‘Señor, yo quiero devolverte todo lo que me das.’ Él: <i>“Págame con Mi propia Fortuna.”</i>"],[2,49]],[953,["8 de agosto. Hora Santa. <i>“No te desanimes. Hay muchas maneras de avanzar, incluso por medio de caídas. Clama a Mí y no temas gritar si caes, pero que ese grito vaya directo a tu único Amigo. Cree en Mi Fuerza. ¿Acaso no levanté a Pedro cuando se hundía en las aguas? ¿O no estaré Yo más dispuesto a ayudarte que a perderte? Pequeña, ¡cuán poco Soy conocido! Muchos me ignoran. Otros desean que no existiera. ¡Yo, que Soy el ser!</i>\n<i>“Tú añádete al número de aquellos que se entregan totalmente a Mi Amor. Apretaos en torno a Mí, como quien defiende un pobre tesoro. Digo ‘pobre’. Yo quisiera ser el gran rico de almas, pero el ladrón se Me lleva no pocas de Mis ovejas… Sin embargo, Yo llamo a cada una por su nombre. Ayúdame. Únete a Mis ovejas fieles mediante tus Via Crucis, tus buenos ejemplos y tus palabras amables. Prolóngame sobre la Tierra. Todavía estoy aquí y es por vosotros. Déjame vivir intensamente en ti. Préstame tu inteligencia y tu cuerpo; así en el Cielo tú poseerás Mi Esencia. Seremos todo el Uno para el otro.”</i>"],[49]],[954,["Yo consideraba mi miseria. Él: <i>“Mientras más pequeño y débil es un niño, tanto más fuerte se le aprieta contra el corazón.”</i>"],[24]],[955,["18 de agosto. Yo pensaba en tantos damnificados por la guerra entre los civiles, los evacuados, los arruinados. Él: <i>“En todo eso hay amor. Antes de ir al Cielo hay que pasar por la penitencia. ¡Mis pobres pequeños! ¡Cuán pocos entre vosotros harían penitencia si Yo no la enviara! Revestíos de este precioso espíritu de penitencia, para que nada se pierda.”</i>"],[37]],[957,["20 de agosto de 1940. <i>“Hazme compañía. En espíritu y en verdad. Tú no puedes saber la abundancia con que derramo Mis Gracias sobre Mis fieles, pero lo verás más tarde. Ahí está el gran motivo de la santidad. ¡Pocas cosas os impiden ser santos! Confiadme a Mí la parte que Me toca en este ‘trabajo entre dos’. Y, ¿cómo podría Yo resistir a una confianza humilde y amorosa?”</i>"],[9]],[958,["<i>“Sobre todo, nunca pienses que Yo Me olvido. Todo cuanto Me habéis ofrecido queda ‘escrito’ en Mi Corazón, según esa expresión que se usa en la Tierra, Y también lo que en adelante Me vais a ofrecer, pues para Mí todo es presente.”</i>"],[9]],[959,["21 de agosto. <i>“Puesto que vas a estar sola en tu casa de verano, piensa en hacer un retiro cerca de Mí. Para ello, permanece en ti misma, que es en donde Me vas a encontrar esperándote siempre. Suprime tus miradas hacia el exterior. Conversa conmigo, canta, vive cerca de Mí, tu Hermano y tu Esposo. Y Yo estaré también en retiro contigo, pues sabes cuánto Me gusta abajarme para percibir mejor vuestro amor, si vosotros queréis dármelo.</i>\n<i>“En tu retiro, ve en el fondo de tu corazón a las Tres divinas Personas de la Trinidad Santísima amándose y glorificándose las Unas a las Otras, como en oleadas de movimiento infinito. Únete a Su Vida en tu vida. Preludio de la Unión a Su Vida en el Reino celestial.”</i>"],[41]],[960,["21 de agosto. Yo: ‘Señor, puesto que todo Te está presente, ya ves ahora que Te quiero ofrecer mi muerte como un holocausto perfecto de amor y de arrepentimiento.’ Él: <i>“Recuérdalo: tu alma Me ha de dar su ruptura con el cuerpo como un perfume, como una flor que Yo hice crecer.”</i>"],[31]],[961,["<i>“No te admires de ser tan frágil. Pon en Mis fuertes Manos tu fragilidad.”</i>"],[24]],[962,["<i>“Seguid de cerca al Modelo. Que Yo pueda decir de cada cristiano: ‘He aquí a Mi hijo amado, en quien he puesto Mis Complacencias’. ¿Entiendes lo que es complacerme en alguien?”</i>"],[10]],[963,["‘Señor ¿no voy a tener antes de mi muerte mayores deseos de unirme contigo? ¿Algunos esfuerzos más heroicos? ¿O voy a seguir vegetando en mi nivel ordinario?’\n<i>“Toma tu fuerza de la fuerza de los santos; de la fuerza de quien es Santo. Únete a Mí, concédele a Mi Amor el placer de ayudarte y transformarte. Abandónate, suelta el paso, manifiéstame deseos vehementes y frecuentes. Si lo haces, yo no podría resistirme y solo quien no me conoce podría dudarlo. Si tú eres generosa, Yo lo seré más. Como un viento fuerte, como un pájaro de presa, así Yo. ‘Yo soy el que arrebata’.</i>\n<i>“No te resistas. Es vuestra confianza lo que desencadena Mi prodigiosa Potencia de Amor. Porque os habréis entregado, Yo os haré entrar en Mi Jardín secreto, entre las flores y los frutos. Tendréis un anillo en el dedo, y vuestro paso se ajustará al mío. Reduciré mi estatura a la vuestra, para que nuestras palabras se encuentren sin dificultad. Será muy dulce así, pequeña alma amiga. También tú, como Pedro, me pedirás hacer dos tiendas; pero no tendremos más que una. Y tu mirada leerá en la mía que el sufrimiento pasajero lleva a una vida sin fin y tú dirás: ‘Qué sencillo es’. Y dirás bien porque para el Amor todo es sencillo...”</i>"],[19]],[964,["22 de agosto, en el campo. Yo miraba el levante del sol, cuando Él me dijo: <i>“Mi luz se levantará sobre ti en el último día. ¡Cuál no será tu embeleso al conocer las bondades de la Salvación! Te verás envuelta y sumergida en Mi Misericordia. Canta ya desde ahora tu agradecimiento”.</i>"],[38]],[965,["21 de agosto, después de la comunión. <i>“Di: ‘Padre, mi Amado adora, ama, agradece por mí. Tan bueno y tan atento es mi Amado, que en la grandeza de Su Humildad toma mi lugar. En cuanto a mí, no soy digna de desatar el cordón de Su Sandalia. Y... Él está en mi corazón’.”</i>"],[35]],[966,["24 de agosto. <i>“Un solo Padrenuestro rezado por un santo puede más que muchas oraciones dichas sin amor. Que haya amor en tus palabras, como una efusión de tu corazón; entonces tus palabras Me consolarán. ¿No sientes mucha alegría al pensar que das reposo a tu Dios? Dímelo. Que Yo lo oiga como un secreto de amor.”</i>"],[34]],[967,["25 de agosto. Yo recibía a unos sobrinos.<i> “Recíbelos como si Me recibieras a Mí, e imagínate la ternura que a Mí Me darías. Trátalos, pues, como a Mí.”</i>"],[5]],[968,["26 de agosto. Yo tenía una duda. <i>“Aun cuando estas palabras salieran de la naturaleza humana, ¿no Soy Yo quien creó esa naturaleza? ¿No tienes tú que referirlo todo a Mí? Yo Soy la Raíz de tu ser, pobre creatura Mía.”</i>"],[15]],[969,["26 de agosto. <i>“No olvidéis ponerlo todo en común, como las oraciones de una gran familia. Buenas acciones en familia; dones, aquellos que puedan darlos. Así lo hice Yo: incluso Mi Familia os La di.”</i>","26 de agosto. <i>“Que lo invisible te sea más presente que lo visible.”</i>"],[7,11]],[970,["27 de agosto. Visita. Yo: ‘Señor, si Te fatiga hablarme, o me digas nada el día de hoy.’ Él: <i>“Pero si el hablarte es lo que Me hace reposar. Poner un poco de Mi Corazón en el tuyo. Dime con frecuencia: ‘Señor, Tu pequeña sierva Te escucha’. Y el saber que estás ahí silenciosa, con los ojos fijos en Mí, Me forzaría a hablarte si Mi Corazón necesitara de ser forzado, teniendo como tiene un inmenso peso de Amor. Descárgalo de su peso.”</i>"],[15]],[971,["28 de agosto. <i>“¡La oración! Cuando no puedas entrar en la casa de un enfermo o penetrar un corazón, tu plegaria entrará. No pocas veces entra ella antes que tú, y puede entrar aun cuando tú misma no entres. Y el alma es salva y cantará Mi Gloria. ¡Oh, lo que vale la oración!”</i>"],[33]],[972,["29 de agosto, Hora Santa. <i>“¡Cuánta fuerza hay para vosotros y cuánta alegría para Mí en una mirada de amor! Todos los que Me aman tienen derecho a verme. Pero aun cuando Me amarais cada día con un amor más heroico, todavía sería poco peso de amor comparado al Amor de Mí que será vuestra herencia para toda la Eternidad.</i>\n<i>“Amadme, pues, continuamente. Decídmelo a menudo y vivid vuestro ‘Amor-Yo’. Yo lo tomaré cada día como nuevo en vuestro corazón, como nuevo también para Mí, pues Yo nunca Me canso de vosotros.”</i>","29 de agosto, Hora Santa. Yo: ‘Gloria al Padre, al hijo y al Espíritu Santo que están en mí.’ Él: <i>“¿Ya lo ves? Aun cuando en una hora no hicieras sino repetir este deseo, no habrías perdido tu tiempo; pues ninguna plegaria vuestra es desoída. ¡Si supierais la atención que el Padre pone a lo que hacen y dicen Sus hijos, muchos de los cuales Le recuerdan a Su Hijo único cuando pasaba trabajos sobre la Tierra!</i>\n<i>“En cada uno de ellos está la Santísima Trinidad; más o menos, según el lugar que cada uno le concede porque, ya lo sabes, Dios no hace fuerza a nadie. Pide y espera. Y cuando un alma es fiel, ni siquiera sospecha la alegría que produce el Cielo. Recuérdalo bien: es mientras vivís sobre la Tierra cuando Yo gozo de vosotros, Mis amados fieles. Porque en la vida del Cielo seréis vosotros los que gozaréis de Mí.”</i>","29 de agosto, Hora Santa. <i>“Hijitos Míos: considerad Mi Simplicidad y lo fácil que os resulta agradarme. Basta con hacer bien lo que hacéis; hacerlo por Mi Amor, para crecer, para avanzar, para ascender. Tended hacia Mí vuestros débiles brazos: Yo os ayudaré; haremos el trabajo entre dos, con participación desigual… y si el niño mantiene sus ojos fijos en los ojos de su Padre, el cansancio del trabajo le parecerá poca cosa.”</i>"],[1,48,50]],[973,["30 de agosto. <i>“Yo Soy el que hizo la naturaleza humana; conozco su pequeñez y su debilidad. Y no te admires de que, de todas maneras, os ame tanto. No te admires, porque Soy vuestro Creador y viví entre los hombres. Lo que pido es que Me tengáis confianza en cualquiera situación del alma. Acordaos de una cosa: ¡Yo amé mucho a Judas! Y recuerda aquella otra buena palabra: ‘Aun cuando Tú me mataras, confiaría en Ti’.”</i>"],[9]],[974,["3 de septiembre, después de la comunión. <i>“Los lunes, vive en el Amor del Espíritu Santo y pídele Su Amor. Es Él quien te santifica.</i>\n<i>“Los martes pásalos con la Reina de los ángeles y con los ángeles. Para reparar tus pecados y los de los demás.</i>\n<i>“Los miércoles con San José, pidiéndole que te preste su vida interior.</i>\n<i>“Los jueves sé hostia, pequeña hostia Conmigo. Una hostia que cante. Busca ocasiones de sacrificio con la avidez de un avaro que busca un tesoro. Estos sacrificios te mantendrán en estado de víctima.</i>\n<i>“Los viernes, entrégate toda a Mi Corazón. El viernes, que fue para Mí de grandes sufrimientos, que sea ahora también de gran dulzura.</i>\n<i>“El sábado no estás sola, pues Mi Madre te acompaña. Despiértate en Su Amor.</i>\n<i>“El domingo entra en el seno de la Trinidad Santísima; como un granito de incienso que se quema en alabanza pura. Hazlo así, Mi pequeña.”</i>"],[11]],[975,["4 de septiembre de 1940. <i>“No concedas nada a la naturaleza. Y hazlo alegremente, feliz de estar aquí o allá para complacerme.”</i>"],[37]],[976,["4 de septiembre de 1940. Hora Santa. Yo le pedía al arcángel Gabriel que consolara a Jesús como lo consoló en Getsemaní. Él: “<i>Sí, hija, Mis ángeles me consuelan, pero un sufrimiento que Me viene de los hombres debe ser consolado por corazones humanos. Consoladme vosotros, Mis íntimos, Mis escogidos, según las maravillosas invenciones del amor. Todo lo que encontréis me será dulce, pues viene de vosotros. No temáis que desprecie vuestras maneras, o que les reproche su insuficiencia o su tosquedad, con tal que seáis sinceros.</i>\n<i>“Yo amo así. Habladme con la simplicidad de los niños; no necesito fórmulas. Vuestras palabras las tomo de vuestro corazón, antes de que lleguen a expresarse en una frase. Así de apremiado estoy por recibir vuestras palabras de niños.”</i>","4 de septiembre de 1940. Hora Santa.<i> “¿Ves Mis Brazos extendidos en la Cruz? Extendidos. Más que abiertos y hasta la dislocación. Y siempre quedarán abiertos para ser vuestro refugio dulce y perfecto.”</i> Yo: ‘Señor, ya desde ahora quiero ver en Tus brazos a mi familia, a mis amigos, a mis muertos.’ Él: “<i>Agrega también a los pecadores; a muchos pecadores, pues para todos abro Yo tan ampliamente Mis Brazos. No os dé miedo pedir: llenad Mis Brazos con pueblos enteros, con naciones, paganos, tu tiempo, el tiempo pasado, los siglos por venir. Yo quiero tener a los hombres, uno por uno. Hay muchos que no están ya sobre la Tierra, pero tampoco están en el Cielo; vuestras plegarias acortan su destierro. También con esto Me consolaréis en mi Agonía de moribundo por Amor.</i>\n<i>“¿Con qué agradecimiento cantaréis Mi agonía cuando la comprendáis? Por ahora, sin embargo, podéis darme la alegría de vuestra Fe y de vuestro cariño, para que el arcángel Me los dé a beber.”</i>"],[10,36]],[985,["20 de septiembre. Visita. Yo había sabido que tos alemanes no querían salir de mi casa en Nantes. Dije a mi Señor: ‘¿Estás contento? Aquí tienes un sacrificio que Te ofrezco por Tus pecadores’. Él: <i>“Pon tu cabeza sobre Mi Corazón, para que tus pensamientos se ocupen solamente de Mí. Deja las cosas de la Tierra, que de todas maneras tendrás que dejar un día. Entra ya en el Amor Eterno, de donde están excluidas todas las preocupaciones de la Tierra. Franquea los pasos. Despójate del sentimiento de las cosas perecederas y cuando lo consigas, nada te faltará, porque todo lo tendrás en Mí. ¿Lo entiendes? Es como el paso a un nivel superior. Y yo te ayudo, creaturita de nada.</i>\n<i>“¿Tienes en tu corazón algo como sangre machacada? Ofrécemela. Yo sabré aprovecharla, uniéndola a la Mía, por esas pobres almas que están en la miseria. Es como un libre cambio y Yo Soy el Cambista. Feliz de que Me den algo para dar Yo más.</i>\n<i>“En el silencio se oyen los menores ruidos. Mantén tu alma en el silencio y oirás los Latidos amorosos de Mi Corazón; Latidos dolorosos, Latidos felices. Un Amor viviente y entero.”</i>"],[13]],[988,["22 de septiembre de 1940. Yo: ‘¡Estoy tan contenta de que me hayas creado a Tu imagen!’ Él: <i>“Pequeños Míos, ¡con cuánto gozo Me reconocéis sin haberme visto antes! Y querréis entonces precipitaros sobre Mi Corazón, descubriendo en Él el principio y el fin de todas vuestras ubicaciones. Ese Corazón inagotable, eternamente joven. ¡Y seremos Uno, Mis amadas imágenes!”</i>"],[13]],[989,["Visita. Yo decía: ‘Señor, te amo’. Él me contestó: <i>“Vuélvelo a decir una y otra vez. Que resuene en Mis Oídos como una música. Yo no Me cansaré de oírla. Y, dime: ¿por qué Me amas? ¿Cómo empezó todo? ¿Qué es lo que quieres con ello? Yo ya lo sé, pero es para Mí una delicia oírtelo decir, como una historia que siempre recomienza.”</i>"],[1]],[995,["30 de septiembre. Visita. <i>“Es claro que tenéis que ocuparos en cosas variadas a lo largo del día. Pero aun esas cosas banales, hacedlas conmigo, cerca de Mí; porque Yo estoy en vosotros siempre y porque esas cosas las hice yo también mientras viví sobre la Tierra.</i>\n<i>“Es sumamente sencillo el conversar continuamente conmigo sin dar mayor importancia a lo demás. La unión hace que todo tenga el mismo valor espiritual ante Mis Ojos. Nada, hijitos Míos, es vulgar” </i>(Esto me lo dijo porque yo acababa de lavar la vajilla).\n“<i>Yo puedo divinizarlo todo si vosotros me lo permitís. Mi amor está siempre en acecho de todo lo que pueda hacer por vosotros.</i>\n<i>“Dádmelo pues todo, con la seguridad de que Me complacéis. ¡Cuál no será vuestro asombro cuando conozcáis vuestros tesoros! Con piedrecitas pequeñas se pueden hacer magníficos mosaicos.”</i>"],[50]],[1001,["11 de octubre. <i>“Llamadme con frecuencia. Un padre de la Tierra es siempre feliz cuando lo llama su hijito. A veces no responde, pero es para que el niño lo llame de nuevo. Recuerda Mi aparente rechazo a la mujer cananea. Lo hice porque quería llevarla a la hermosa y humilde respuesta que Me dio. Así, cuando parece que no os oigo, llamadme todavía más, y Me daréis un inmenso gozo: tengo siempre urgencia de vosotros, especialmente de los más pequeños, de los más pobres. ¡Cuántos han entrado ya en Mi Corazón de entre los más miserables! ¡Oh, felices desgraciados!”</i>","11 de octubre. Hora Santa.<i> “Sabes que Yo nunca Me impongo. Es indispensable que Me invitéis, que Me dejéis obrar en vosotros. Con esto se prolonga Mi Vida sobre la Tierra, y por eso te digo algunas veces: ‘prolóngame’.</i>\n<i>“Tu vida, Yo te la di. Dámela pues en todos tus actos. Es algo grande ‘hacer vivir a Dios’. Y es, además, tan simple. Imagínate por un instante a todos los que actualmente viven sobre la Tierra. ¡Qué maravilloso espectáculo sería para el Cielo si todos Me dejaran vivir en ellos! Porque todos vosotros sois un espectáculo para los ángeles y los santos.”</i>"],[33,39]],[1009,["En la cuarta estación del Via Crucis. <i>“Piensa en Mi Madre que avanza hacia Mí en un intento de ayudarme. Pero no podía. Y sin embargo, su gesto y su deseo Me consolaron grandemente. Haced esto mismo vosotros: lanzaos hacia Mí no obstante las oscuridades. Más tarde, veréis las alegrías que Me disteis.”</i>"],[9]],[1011,["24 de octubre. <i>“Tú sabes que existe el genio del mal. Aplícate a ser tú el genio del bien. Conságrate a prestar servicios y prepara el modo de antemano, ingeniosamente. Busca en tu corazón lo que puede complacer a las personas.</i>\n<i>“Para agradecerme Mis Palabras, di tú la palabra que sea como una sonrisa Mía. Para todos, sin distinción.”</i>"],[5]],[1014,["Notre Dame, Nantes. Después de la comunión. <i>“Recuerda cómo te llamé en la pequeña capilla de C. Tú deseabas que hubiera capillas en todas las casas. Y en ese momento tú no sabías que Yo estaba en ti y que no hay oratorio más íntimo que tu propio corazón. Ni siquiera tienes necesidad de abrir una puerta; con una sola mirada estás ya a Mis Pies. Y allí te digo: ‘Pequeña, sube más alto, apóyate sobre Mi Corazón, amiga Mía escogida; respira el aire de las cumbres para fortificarte con un impulso nuevo’. ¡Pequeña Mía, tan débil!”</i>"],[41]],[1022,["11 de noviembre. En la capilla de las Reparadoras, ante el Santísimo expuesto. <i>“Comienza por desprender tus sentidos del mundo exterior. Luego, ponme ante tu alma como una presencia cierta. Y en seguida, entra profundamente en Mí.”</i>"],[41]],[1023,["11 de noviembre. Hora Santa. <i>“Tú, que tienes la felicidad de recibirme cada día, pide esta misma Gracia para otros. Pide que Yo mismo los escoja, pues conozco todos los secretos de las almas, y dime que les aplique tu plegaria. Y si consigues que alguno o varios vengan a Mi Intimidad, ¿crees que puedo dejar de agradecértelo? No solamente por la gloria que eso Me da, sino también y por la alegría que Me causa. Alegría que Yo haré luego sentir en sus reflejos.</i>\n<i>“¡Qué dichosa estuviste el otro día, cuando te anunciaron que tu pobre vecino había preparado bien su última confesión y había comulgado! Como ves, es preciso tener paciencia y orar. Entonces Yo no
