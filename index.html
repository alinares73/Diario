resisto. Dame las gracias. Ofréceme en reconocimiento todos Mis Méritos. En cambio, Yo concedo grandes Gracias de retorno al final de una vida. Pide a Mi Corazón Eucarístico que multiplique esas conversiones; así permanecerás en los dominios del Amor. Por amor al prójimo y por amor al Amor que es el Corazón de tu Salvador.</i>\n<i>“¿Comprendes ahora mejor lo que es este Corazón, Su Simplicidad y Su Fuego? Acércate a Él y después de haber vivido para Él todo el día, duérmete apoyada en Él. Él te espera.”</i>"],[33]],[1026,["21 de noviembre. Hora Santa. Yo había ofrecido medios de información a unos padres que no tenían noticias de su hijo, que estaba en Inglaterra. Me dijo: <i>“Haz todo eso como si Me sirvieras a Mí. No lo hagas por sentir una complacencia, sino para darme gusto a Mí en ellos, porque tu pensamiento no debe apartarse de Mí, así como Mi Pensamiento no se aparta un instante de ti.</i>\n<i>“Dame la mano y pon tu corazón en el Mío. Ve hacia los demás con tu pobreza revestida de tu Señor. Él entonces te servirá a ti.”</i>"],[54]],[1029,["28 de noviembre. Santa Cruz. Hora Santa. <i>“Mi Amor se conmueve inmediatamente cuando veo que al hablarme estáis humildes, pobres y deseosos de uniros a Mí no por un momento, sino para siempre. Entonces Me hago esposo de esa alma que Me implora y la pongo, a través de los grados secretos de una escala de virtudes, en el lugar que le estaba reservado en Mi Corazón, y en donde ninguna otra puede entrar.”</i>","28 de noviembre. Santa Cruz. Hora Santa. <i>“Mi Agonía fue la más terrible entre todas las agonías de la Tierra, tanto por los Sufrimientos cuanto por la sensibilidad y la clarividencia de Mi Naturaleza. Acércate, entra en Mi Alma llena de angustias. Ofrécelas al Padre por tu tiempo, por todos los tiempos. ¡Si pudieras ayudarme a salvar a todos los de tu tiempo!”</i>"],[2,36]],[1032,["3 de diciembre de 1940. Novena a Nuestra Señora. <i>“Piensa más en la Trinidad Santísima que está presente en ti. Adórala, ámala, alégrala. Que las Tres Divinas Personas sean los Tres Compañeros de tu vida.”</i>"],[48]],[1033,["5 de diciembre.<i> “Si vosotros vivís en estrecha intimidad conmigo es porque sois realmente amados, objeto de Mi Complacencia. Buscad con avidez esa dulce intimidad como se busca un tesoro. Cualquiera que sea la vida que lleváis, podéis llevarla en Mi Corazón.</i>\n<i>“Pocos piensan en ello. Oíd la dulzura de Mis Palabras: Yo Soy Amor. No hagáis como los fariseos, que oyéndome se indignaban y se alejaban de Mí. Que Mi Amor, que es como la licuefacción de Mi Corazón, os enternezca hasta el punto de que no queráis ya dejar Mis Senderos, ni abandonarme a medio camino.</i>\n<i>“¿Es acaso más difícil mirarme a menudo, poner vuestras manos en las Mías y decirme esas palabras que os brotan del corazón y que tanto Me complacen? Me las diréis, aunque luego se os olviden. No importa, Yo las conservo como un tesoro: y más tarde seré Yo Quien os las repita cuando estemos ya unidos en el Cielo.”</i> Le dije: ‘Amor mío, ¡mil gracias!’ Él repuso: <i>“Te repetiré tus propias palabras: ‘Amor mío, ¡mil gracias!’”</i>"],[26]],[1034,["6 de diciembre, después de la comunión. Yo pensaba en Su Delicadeza de condescender a servirse de nuestras palabras humanas para amarnos en el Cielo. Él: <i>“¿No Soy Yo, acaso, la respuesta a todas vuestras aspiraciones? ¿No estoy acaso en el fondo de vuestros deseos más secretos? Yo Soy para cada uno el afecto de sus afectos. ¡Comprended Mi Amor!</i>\n<i>“Tú eres Mía para siempre. Acepta esta dulzura y pertenéceme desde ahora, sin prisa y sin lentitud, para la Eternidad. A todos vosotros os recibo en el albergue de Mi Corazón.”</i>"],[16]],[1035,["fin de la Novena. “<i>Establécete en la pureza como fruto de tu novena a la Inmaculada. Pureza de intención que ponga directamente en Mí todos tus pensamientos y acciones. Yo soy tu objetivo único.</i>”"],[28]],[1036,["8 de diciembre. Yo permanecía a los pies de la Santísima Virgen. Él me dijo. <i>“Voy a darte una medida para hacer bien todas las cosas: consiste en que hagas todo como si acabaras de comulgar. Con esto se ampliará tu vida interior en un apacible recogimiento.”</i>"],[41]],[1038,["<i>“Nunca abandones al amor. Es del todo sencillo comunicarte con tu Dios. Y, ¿qué otra cosa cabe entre dos íntimos? Y además, todo tema se resume en el cántico del Amor. Que el cántico de tu vida suba siempre nuevo cada día; y tu cántico no tendrá fin, porque tú lo cantarás en la Eternidad, con una saciedad inenarrable. Ama desde ahora, ama mucho. Tú no sabes todo lo que puedes obtener, adquirir y transformar con tu amor sobre la Tierra. Pero Yo lo sé.” </i>Entonces Le dije: ‘Señor, mi amor es tan pobre.’ Él: <i>“Toma el Mío. Ya sabes que es tuyo, que es de todos vosotros. Ofrécelo al Padre con la certidumbre de tu poder y entonces, pide, pide y pide.”</i>"],[1]],[1040,["19 de diciembre. Hora Santa. <i>“No te canses de Mí. No te canses... Yo Me voy, pero vuelvo a vosotros. Y cuando Me vaya, permaneced cerca de Mí. No seáis como esas almas que en los momentos de aridez me huyen y Me abandonan. Es que no conocen a su Salvador. Si Me escondo es porque os amo; tengo que poneros a prueba. Aun cuando haya tinieblas en vuestro corazón y parezca que Mi Voz se ha callado para siempre, pensad: Él me ama y se entregó por mí”.</i>","19 de diciembre. Hora Santa. Yo: ‘Señor, ven en ayuda de nuestra Fe, aumenta nuestra Esperanza y enciéndenos la Caridad.’ Él: <i>“No tengas en ti confianza ninguna, ni esperes nada de tus pobres recursos; entonces te ayudaré, pues si estás vacía de ti misma Me es posible llenarte.</i>\n<i>“Acepta que eres nada y que Yo Soy el Todo. Yo obraré en ti y por tu medio. Deposita tu pequeñez en Mis Manos poderosas. Es algo en verdad grande, Mi pequeña. ¡Cuánto te alegrarás más tarde de habérmelo dado todo, todo lo que Yo antes te había dado!</i>\n<i>“Y si lo haces con humildad y con gozo, ¡qué alegría tan grande Me procuras! Olvido entonces los sufrimientos que otros me causan y Me refugio con todos Mis Favores en vuestro corazón. Estamos en casa y allí, en tu corazón, tengo dónde reclinar Mi Cabeza.”</i>"],[17,53]],[1041,["Víspera de Navidad. En mi aposento. “¿<i>Has pensado alguna vez que el amor que te tenía tu madre, tu hermana Clemencia, y las personas que se interesaban por ti, era tan solo un poco del amor que Mi Madre te tiene? Un poco, nada más. Agradécele, con los más tiernos pensamientos, la solicitud de Su Corazón.”</i>"],[28]],[1042,["24 de diciembre de 1940. Yo leía: ‘María tenía una Fe como no la tendrá jamás ninguna otra creatura humana.’ Él me dijo: “<i>Todo lo que tiene una madre, lo tienen sus hijos. ¿Cuándo has visto que una madre se niegue a compartir lo que tiene? Ella te dará todo, si se lo pides. Enriquécete, pues, por Ella, para Mi gloria, Mi pobre pequeña.”</i>"],[28]],[1043,["25 de diciembre. Por la tarde. Yo pensaba en la pobreza de Su Vida. Me dijo: <i>“Yo tomé sobre Mí las más grandes penas de los hombres.”</i>"],[32]],[1044,["Navidad de 1940. <i>“Como regalo de Navidad para Mí, Niño pequeño, dame cada mañana los buenos días apenas despiertes. No Me dirás que es un regalo costoso. Recuerda a aquel buen sacerdote que te dijo a propósito de la señal de la Cruz en la mañana: ‘Todas sus actividades estarán en orden, como una bella procesión tras de la Cruz’.”</i>\nDespués de la comunión en la Misa de la aurora, decía yo: ‘Señor, Te adoro; a Ti, que has venido al Mundo para traer la salvación.’ Él: <i>“Es lo que vengo a traeros. Pero vosotros debéis venir a tomarla.”</i>"],[32]],[1045,["26 de diciembre de 1940. En Nantes, Avenida de Launay. Hora Santa. <i>“Considera el frío que hace en la Gruta de Belén, cómo falta la luz y muchas cosas necesarias. Y sin embargo, Mi Madre y San José son felices, porque están Conmigo, y con esto nada les falta. No cederían su lugar a ningún príncipe de la Tierra.</i>\n<i>“Que tu amor sea lo suficientemente grande como para comprender la plenitud de la alegría que hay en la Unión con Dios. Cuando nada se tiene pero se posee a Jesús, nada hace falta. Y eso de poseer a Jesús no es una ficción. Yo Soy real y mi posesión lo es. Yo Me apodero de aquellos que se Me dan. En ocasiones ni siquiera aguardo a que os ofrezcáis: os tomo antes, tan grande es Mi Deseo de poseeros. ¿Quién tendrá la suficiente simplicidad de corazón como para creerme? Hay una falsa humildad que impide creer en el Amor. No es que seáis dignos de Mi Amor, pero sois Míos, imágenes Mías, y Mi Corazón es infinitamente amante. Siempre encuentro un pretexto para amar, aun a las almas más miserables. Soy su Amigo, deseoso de perdonarlas.”</i>"],[32]],[1050,["1 de enero de 1941. Yo Le pedía una Gracia. Me dijo: “<i>Si es el amor el que le pide cosas al Amor, este no puede negar nada. Pero si son el interés o el temor los que piden cosas al Amor, el Amor escucha desde lejos.”</i>"],[33]],[1052,["6 de enero de 1941. Epifanía. Yo pensaba en el júbilo de la Santísima Virgen al recibir para su Hijo los regalos de los Magos, y la llamaba ¡la Virgen Gozosa! Él me dijo: “<i>Ella será feliz si la llamas así con frecuencia. Ella es la Madre de la Alegría, lo mismo que la Madre Dolorosa. Es ¡La Mujer!, en la absoluta perfección de su ser.”</i>"],[28]],[1053,["9 de enero de 1941. Hora Santa. <i>“Ven, esposa Mía, y mírame sufrir en el Huerto, como si hubiera sido hoy. Porque esta tarde es, para Dios, lo mismo que todos los tiempos. No Me dejes. Soy como un niño atemorizado que suplica. Permanece ahí. Que Yo te vea presente, pues la presencia es un consuelo, tómame de la Mano. Siendo Dios, Soy también Hombre miserable; tanto, que nadie podrá jamás comprender la magnitud de Mi Miseria. Tengo necesidad de ver a todos los que amo junto a Mí. Veo el Infierno desencadenado y estoy solo para defenderme: ¡ora conmigo!</i>\n<i>“¿Crees más en Mi Amor ahora que Me contemplas sufriendo?</i>","9 de enero de 1941. Hora Santa. <i>“Desear amar es ya amar. Todos tus esfuerzos por amar todavía más te son anotados como ganancias especiales por la Misericordia.</i>\n<i>“Avanza, avanza. Que nada detenga tu marcha confiada puesto que Yo estoy contigo. Y si te apoyas en Mí, ¿cómo puedes creer que Yo no te ayude a llegar a donde querías? Aprende a desear. Sé audaz, pues has oído Mi Palabra: ‘Sed perfectos, como es Perfecto vuestro Padre Celestial’. Sola no puedes nada: pero conmigo lo puedes todo. Por eso te digo que no te quedes en ti misma, sino que vengas a Mí y Me pidas humildemente que te mueva. Y Yo te moveré.”</i>"],[36,53]],[1054,["<i>“Ayúdame orando y amando; es mucho lo que puede hacer el amor en un corazón sensible, tan extraordinariamente sensible como el Mío. Y si se te pregunta qué haces en este momento y tú puedes responder que estás ocupada en amar a tu Dios, el Cielo y la Tierra podrían detenerse, y eso no tendría la menor importancia ante un alma que se esfuerza por agradarme.”</i>"],[1]],[1055,["16 de enero. En la cuarta estación del Via Crucis. <i>“Contempla al Amor en este encuentro con Mi Madre; pídeme encontrarme con un amor así de grande en todas las acciones de tu vida.”</i>"],[51]],[1057,["17 de enero. Yo pensaba que a la hora de mi muerte no tendré sino himnos de agradecimiento por mi vida, tan llena de favores. Él: <i>“Y Yo, la víspera de Mi Muerte, instituí la Eucaristía. La palabra significa Acción de Gracias. Démosle gracias juntos al Padre.”</i>"],[31]],[1059,["18 de enero. <i>“De estas Cuarenta Horas recibe la Gracia de no volver nunca más a obrar por ti misma, sino que déjame obrar en ti, que eres demasiado pequeña para ser capaz de algo.</i>\n<i>“Ten siempre fijos tus ojos en el Esposo, independientemente de lo que estés haciendo. Sea que ores, sea que converses, mírame con gran deseo de que te reemplace. Y lo haré. ¿Te acuerdas de aquella que se agitaba mucho y avanzaba poco? Así has sido tú. Pero recuerda a aquella otra que se mantenía a los Pies del Salvador, humildemente; que se dejaba mover, vaciándose de sí misma. Así adquiría de su Salvador una gran cantidad de méritos. Así vas a ser tú. Es Mi Gracia de las Cuarenta Horas.”</i>"],[49]],[1060,["18 de enero, delante del Santísimo Sacramento. <i>“Dime: ‘Señor, hazme creer, hazme esperar, hazme amar’, y Yo te reemplazaré porque eres muy pequeña. Ve hacia el prójimo más y más: seré Yo el que vaya. Contémplame hablando en tu lugar porque tú no lo sabes hacer por ti sola. Pídemelo con frecuencia, y Yo vendré a reemplazarte.”</i>"],[53]],[1061,["22 de enero de 1941. Hora Santa. Él: <i>“¿Crees en la Potencia de Mi Amor?” </i>Yo: ‘Sí, mi Señor, creo en la Potencia de Tu Amor.’ Él: <i>“¿Crees que Mi Amor es más fuerte que todos los amores reunidos de la Tierra?” </i>Yo: ‘Así lo creo, Señor. Él: <i>“Repítemelo a menudo, pues esto alivia un poco Mi Agonía. Los incrédulos hieren Mí Ternura, pero la confianza de un alma Me es dulcísima.”</i>"],[10]],[1062,["24 de enero. Yo decía: ‘Mi Dios.’ Él: <i>“Nunca digas eso sin pensar que tu Dios te pertenece.”</i>"],[1]],[1064,["31 de enero de 1941. En Rennes, en la iglesia de San Germán, sonaban las tres. Él: <i>“Esta hora, ¿te recuerda algo? Adórame en la Muerte que padecí por ti, en expiación. Recoge, hija Mía, como tesoro precioso, esos últimos instantes de Mi Vida terrena. Fueron Mi suprema Voluntad de sufrir, ante la Mirada del Padre, para salvaros. Ofrécele esos últimos minutos de Amor y de Sacrificio total. Dile: ‘¡Padre, tu Hijo se está muriendo; déjate conmover! Convierte a los pecadores, hazlos santos. Da la Paz, la verdadera Paz al Mundo. ¿Qué puedes, Padre, rehusar a Tu Hijo? Él ora en nosotros y por nosotros: ¡escúchanos!’”</i>"],[36]],[1065,["31 de enero. Via Crucis, 13ª. Estación. “<i>Tú también, descansa en las Manos de tu Santa Madre, y déjala curar tus llagas.”</i>"],[51]],[1067,["Con las Reparadoras, el padre Lechat hablaba de la presencia continua de Cristo en nosotros, cuando estamos en Gracia. Él: <i>“¿Sabes, hija, que podemos hablarnos sin decirnos nada? Miradas, impulsos. Amor.”</i>"],[39]],[1068,["Después de un sermón sobre el Cuerpo Místico de Cristo. “<i>Puesto que sois miembros de Mi Cuerpo, ¿qué tiene de raro el que Mis miembros pensantes entiendan Mis Pensamientos? Somos Uno.”</i>"],[52]],[1070,["Después de la comunión.<i> “Cuando te distraigas, vuelve a Mí y no tengas pena ni temor; pídeme perdón y ámame más.”</i>"],[17]],[1072,["6 de febrero de 1941. Hora Santa, en Notre Dame de Nantes. Yo estaba muy descontenta del valor de mi día. Él: <i>“Eso no importa. Yo te tomo como eres, con tus justificados descontentos. Echa de menos el bien que no haces. Dime que mañana pondrás más atención. Ten la seguridad de que prefiero un alma que cae y se arrepiente, que otra llena de orgullo por sus buenas acciones. Esta pierde todo su mérito.”</i>","6 de febrero de 1941. Hora Santa, en Notre Dame de Nantes. <i>“Sé pequeña, muy pequeña, siempre, Mi Gabriela. Mírate en tu falta de fuerzas, en tu imposibilidad de ser buena sin Mi Auxilio. Eres nada. La nada de donde te saqué. Créelo firmemente, porque es la verdad. Y la nada no es capaz de nada. Además, tu vestidura tiene muchas manchas. Piensa en el trapo con que se limpia debajo de los muebles. Llega hasta desear que te desprecien, para que te unas a Mí, que fui despreciado.</i>\n<i>“En el desamparo de tu pobreza, mira Mis Riquezas: son todas tuyas. Mira Mi Bondad y arrójate en Mis Brazos. Mira Mi Amor y no temas nunca, pues Soy tu Salvador. Juan, Mi Apóstol decía simplemente: ‘Es el Señor’, y para él eso quería decir tantas cosas. Y, ¿para ti? </i>‘Para mí también muchas cosas, mi Señor.’ Él: <i>“Es preciso que para ti Yo lo sea todo. ¿Entiendes? ¡Todo! Tu vida es para Mí. Para Mí tu razón, tu corazón, los motivos de tu existencia. Tu muerte dámela como el coronamiento de tu amor. Será al fin la apoteosis.</i>\n<i>“Te daré Gracias mayores a medida que te vayas haciendo más pequeña. Aléjate de ti misma. Que Yo te ocupe por entero. Quiero todo el lugar.”</i>","6 de febrero de 1941. Hora Santa, en Notre Dame de Nantes. <i>“¿Recuerdas Mi Grito al expirar? Clamaba por última vez Mi Amor en medio de atroces Sufrimientos. Únete a Mí. Responde a Mi Grito, dáteme. Guarda todo tu ‘tú’ para Mí y dame las gracias porque tengo tanta Voluntad de tomarte, a ti, tan poca cosa.”</i>"],[12,24,36]],[1073,["6 de febrero de 1941. Via Crucis. ‘Señor, quiero ayudarte como el Cireneo y bien querría que lo hubieras sentido en Tu Camino doloroso.’ Él: <i>“No dudes que así haya sido. Yo veía todos los tiempos.”</i>"],[51]],[1076,["<i>“Cuando digas, ‘Gloria al Padre, al Hijo y al Espíritu Santo’, no dudes de que Yo amplifico esta glorificación. No son tus méritos, sino Mi Bondad la que habla.”</i>"],[48]],[1079,["19 de febrero. En la avenida, con la oscuridad de la mañana, la cerca mojada tenía reverberaciones del cielo que me ayudaban a orientarme. Él: <i>“Cuando la Gracia impregna a un alma atenta, esta alma refleja a Dios y arrastra a su prójimo. ¿Quién podrá decir lo que puede obtenerse por la sola influencia, Mi Gabriela?”</i>"],[47]],[1080,["20 de febrero. Hora Santa. <i>“Nada es pequeño para Mis Atenciones de Amor. ¿Sabes reconocerme en los acontecimientos? Porque Soy Yo Quien sale a tu encuentro, como cuando dos amigos salen el uno hacia el otro en el mismo camino. No Me dejes nunca solo en el camino deseándote sin que tú llegues. ¡Pequeña alma amada!</i>\n<i>“Y sírveme con todo tu corazón, teniendo en nada lo que no sea para Mí. Y puesto que Yo Soy el huésped de tu corazón, baja a él con frecuencia para hacerme una visita. No concedas atención al Mundo. Encláustrate en tu interior. Adora allí, sin testigos, a tu divino Esposo. Cuéntale tus cosas y escucha lo que Él te diga.”</i>\n1148 a. 28 de agosto. <i>“¿El celo? No consiste en el apremio de hacer cosas, sino en poner el corazón lleno de amor en cada momento.</i>\n“Deséame todo bien de parte de Mis creaturas. Deséame que muchas almas salgan del Purgatorio este día. Únete a su alegría porque al fin llegan a verme, y a la Mía por su felicidad. Sube, sube con frecuencia al Cielo.”"],[3]],[1084,["2 de marzo de 1941. Iglesia de Santa Teresa. Cuarenta Horas. Yo había tenido una humillación. Él: <i>“Una humillación... ¿acaso no es una de las mejores Gracias que puedo ofrecerte? Mientras más te hundas en Mí, menos aparecerás al exterior.”</i>"],[23]],[1085,["5 de marzo. Yo leía que el Espíritu Santo es el Alma de ese Cuerpo Místico que se llama Iglesia. Le pregunté: ‘¿Es Él, acaso, el que me ha hecho ser la pequeña comediante del Buen Dios?’ Él: <i>“Que no te quepa la menor duda. Él es el Autor de vuestra sobrenaturaleza.”</i>"],[48]],[1087,["8 de marzo de 1941. <i>“Considera la diferencia entre dos almas. Una no piensa sino en sí misma, y en todo, no busca sino su propio interés. La segunda no vive sino para procurarme dulzura y gloria. Se ha perdido totalmente para sí misma al consagrarse a Mí Servicio. Siempre está contenta y su rostro refleja la alegría. Y mientras tanto la otra arrastra, llena de temores y de fastidio, la cadena de sus días. Cuando estas dos vidas lleguen a su término verás también la diferencia.”</i>"],[47]],[1094,["Nantes. Martes Santo de 1941. <i>“‘Pongamos madera en su pan’. ¿Entiendes esta palabra del profeta Jeremías? ¿Comprendes que preparaba mi Cruz mientras Yo celebraba mi Primera Eucaristía? Humildad. Cuando tú Me das en tu corazón un pequeño acto, lo purificas grandemente. Y recuerda que mientras más te abajas, tanto más alto te veo Yo.”</i>"],[23]],[1095,["Pascua ele 1941. De camino hacia la Catedral, decía yo a lo largo de las calles: ‘Salud, mi Cristo resucitado.’ Él: <i>“Que para tu corazón el Mundo esté sepultado y que solo Yo viva.”</i>\nDurante el Ofertorio: <i>“Ofrece, juntamente con la Mía, tu propia resurrección, que tendrá lugar en el último día. Ofrece la resurrección de todos los miembros de tu familia, de los que han vivido antes, de los que vivirán después; la resurrección de todos tus conocidos y de todos los demás, como un cortejo en torno a Mi Resurrección, para gloria del Padre.”</i>"],[38]],[1099,["“<i>Desea con fuerza progresar. Desea la santidad. Pídela de limosna, como un pobre pide un pan. Pídele a Mi Madre todos los días de este hermoso mes que te introduzca más dentro de Mi Corazón. ¡Ella es tan buena!”</i>"],[28]],[1103,["15 de mayo, iglesia de Anjou. <i>“Como ves, siempre hablamos de Amor. Y siempre será así. El Amor es el lenguaje que se habla en el Cielo. Soy como un viajero que no sabe sino una sola lengua y habla en ella siempre. ¿No te parece que esta lengua es fácil de aprender y que pronto se adquiere el acento? Mi pequeña, no te preocupes de ninguna otra ciencia sino la del Amor; este es suficiente para Mi Alegría y la tuya.”</i>\nYo: ‘Señor, yo quisiera, para darle gusto, superar a mi Profesor.’ Él: <i>“Escucha estas dos palabras: ‘donación y abandono’. No conserves nada tuyo; entra en Mí hasta perder el recuerdo de ti misma. Y cuando te hayas perdido completamente en Mí, Yo te volveré a encontrar... y entonces, ¿qué temerías? ¡Oh, Mi pequeñita!”</i>","15 de mayo, iglesia de Anjou. Hora Santa. <i>“No pocos piensan que Yo estoy ocupado en alguna otra parte, en otro mundo y en otras almas, siendo así que siempre estoy en medio de vosotros y cerca de cada uno. Estoy Presente y os miro. Obrad, pues, como cuando uno siente sobre sí una mirada. Pero no una mirada cualquiera, sino la Mirada del que os creó y tanto os ama, la Mirada del que os salvó y permanece con vosotros hasta la consumación de los tiempos. Cuando tú estás en el escenario y todas las miradas están fijas en ti, adoptas instintivamente gestos amables. Si pensaras que Yo considero todo lo que hay en ti cada momento, incluso durante tu sueño, te tomarías más cuidados para serme agradable. ¡Que así sea, hija! No temas excederte en la tarea de agradarme. Yo nunca he temido excederme en amarte.”</i>","15 de mayo, iglesia de Anjou. Hora Santa. La iglesia estaba llena de los ruidos de la calle y de la plaza. Me dijo: <i>“Y sin embargo, tú estás tranquila a Mis Pies. Ya ves cómo en medio de los negocios de este mundo es posible ocuparse de Mí en el silencio del corazón. Para eso basta que se Me ame. Aspiración del alma es Mi Intimidad. Más se Me ama y más fácil es venir a encontrarme en lo interior del corazón; y entonces las cosas del mundo parecen pesadas v aburridas, y el alma trata de huir de ellas para concentrarse en el amor de su Señor.”</i>"],[18,29,41]],[1104,["25 de mayo (1941). <i>“Al instituir la Eucaristía vi Yo todas las comuniones del Mundo. Vi las tuyas, la de ayer, la de hoy. Aplícate a recibirlas con amor y a agradecérmelas con amor. Puesto que Yo Me doy por entero, date tú también toda entera, sin la menor intención de reservarte nada.”</i>"],[8]],[1105,["25 de mayo. Después de las Vísperas. <i>“Si Yo quisiera tenerte una hora a Mis Pies, sin decirte nada, sino solamente viéndote mirarme, tendrías que conservar la misma serenidad de ánimo. Eres Mía y Yo puedo hacer contigo lo que quiera sin que pierdas tu sonrisa interior. Ten el valor de amar de este modo. No quieras sino lo que Yo quiero, pues todos Mis Designios son Designios de Amor. Y si alguna vez algo te parece penoso, piensa que más tarde Mi Corazón te recompensará.”</i>","25 de mayo. <i>“De noche, cuando te despiertas, Me ofreces el trance de tu muerte. Yo la conozco bien, tal y como te sobrevendrá. Con todo Mi Amor te la escogí. No temas, pues, abrazar por anticipado esta última cruz de la Tierra, la muerte, en unión con Mi Cruz. Haz de tu muerte, anticipadamente, un acto de amor perfecto, dichosa de dejar tu cuerpo para caer en Mis Brazos.”</i>","25 de mayo. <i>“Piensa en el Cielo con mayor frecuencia, pues el Cielo es tu Morada futura, donde muchos te aguardan y donde aumentarás Mi Gloria accidental.</i>\n<i>“No es orgullo pensar ir al Cielo, es vuestro deber ir allá y es el vivo deseo de Mi Cariño.”</i>"],[29,31,38]],[1107,["Mayo de 1941. Volviendo del comulgatorio decía yo al caminar: ‘Gran Amor mío, mi Amor hermoso, mi dulce Amor…’ Él: <i>“Si pasaras cada día en la contemplación de Mi Grandeza, de Mi Hermosura y de Mi Dulzura, eso daría fin a la monotonía y avivaría tu amor.”</i>"],[11]],[1108,["28 de mayo, después de la comunión. <i>“Eres demasiado pequeña para poder elevarte por ti misma. Pídeme que lo haga; pídeselo a Mi Madre y entre los dos te levantaremos. El fruto de tu amor a Mí será la alegría para tus prójimos, aun con detrimento de tu reposo. Sirve. Sirve como discípula Mía. Y entonces, acércate a Mí. Mírame y no Me dejes.”</i>"],[24]],[1110,["30 de mayo de 1941. <i>“Tú debes imitar, pues eres hija de Dios, el Triple Incendio, Triple y Uno, de la Trinidad. Pídeselo así al Espíritu que descenderá mañana y que no puede quedar inactivo el día de Pentecostés. Él renueva la Tierra entera y a cada uno según su disposición. Él es Infinito. Abandónate a Él, que es Fuego Devorador. Abandónate a Él, que es el Consolador. Pídele que se sirva de ti para dar consolación. Entra en tu nada y deja obrar a Dios.”</i>","30 de mayo de 1941. (Yo tenía un sacrificio que ofrecerle). Me dijo: <i>“Es una flor que Yo prendo en tu túnica. Dámelas con frecuencia: es como si tú aumentaras Mi Hermosura.” </i>(Y como sonriendo): <i>“¿Ves? Cuando tú te pones más hermosa es como si Yo mismo Me pusiera más Bello. ¡Qué unidos estamos tú y Yo, Mi pequeña! Desde tu comunión de la mañana hasta tu sueño de la noche debemos ser Uno. Y Uno también cuando estás profundamente dormida. Dime que quieres que sea así: que este deseo esté siempre en tu alma. Como esos tapices de la Abadía de Beaune, que están formados en su totalidad por la palabra ‘sola’, que expresa el duelo de aquella viuda inconsolable. Los tapices del palacio de tu alma llevarán la palabra ‘Uno’ para expresar nuestra indisoluble Unión.”</i>"],[48,49]],[1111,["30 de mayo de 1941. Vigilia de Pentecostés. <i>“Mañana descenderá sobre la iglesia el Espíritu Santo. Ruégale que te enseñe a imitar, tú que eres hija de Dios, el Abrazo Triple y Uno de la Trinidad. No creas que Él Se va a quedar inactivo en esta mañana de Pentecostés; pues Él renueva toda la Tierra y a cada uno en lo particular. Es Infinito. Abandónate a Él, que es un Fuego devorador. Abandónate a Él, pues es el Consolador. Pídele que se valga de ti, toda anonadada, para consolar. Sí. Entra en tu propia nada y deja obrar a Dios.”</i>"],[48]],[1114,["En Saint-Florent. <i>“¿Has visto lo felices que se son quienes están construyendo una nueva casa? Pero se pueden equivocar si apegan a la casa su corazón. El sentimiento básico de ‘la casa’ le fue dado al hombre para su Casa del Cielo.”</i>"],[38]],[1115,["12 de junio de 1941. <i>“Recuérdalo: no hay varios Jesucristos sino solamente Uno. El que está en el cielo es el mismo que vosotros coméis. Y no te intimide el verbo ‘comer’. Yo lo puse en el Evangelio y lo hice porque explica la Unión que quiero tener con vosotros. Cómeme, comedme sin temor: satisfacéis Mi Amor, aliviáis Mi Sed ardiente. ¿Sabes tú lo que es la sed? Y si lo sabes, ¿puedes comprender la Sed de un Dios que mañana, a la hora de la Eucaristía, va a estar ya muerto de Amor?</i>\n<i>“Dame cada mañana un nombre nuevo cuando me recibas. Yo haré verdadero el nombre que tú me escojas. Y ten cuidado de escogerlo muy tierno y muy íntimo. Escríbelo con letras de fuego. Mírame, hija: ¡qué feliz eres! ¿Me creerías si te digo que te estoy agradecido porque eres feliz?”</i>","12 de junio de 1941. Hora Santa. Yo pensaba en los momentos felices de mi juventud, cuando el tiempo me parecía tan corto... Él: <i>“Y qué, ¿nuestras Horas Santas no han pasado también con mucha rapidez? ¿Qué no te parece que los cuartos de hora pasan en cinco minutos? ¿Y no te ha sucedido que una noche entera pasada conmigo te ha parecido fugaz como un relámpago?</i>\n<i>“¿Cómo sucede esto? Es que Yo os transporto fuera del tiempo. Tú te apoyas sobre mi Corazón; Me agradeces que haya instituido la Eucaristía que te ha alimentado cotidianamente, y con ello te olvidas de todas las cosas. Ocupas el lugar de Juan. Él podía contar las palpitaciones de Mi Corazón, lleno de Amor y Ternura. ¡Lugar bendito! Trata de dar una respuesta y no abandones nunca tu lugar.</i>\n<i>“Pero como eres pobre y muda, toma de Mí y ofréceme Mi propio Amor, que tú haces tuyo. Y dame las gracias por todas Mis hostias, las tuyas, hasta la última; las hostias del mundo entero, hasta la última, antes del Juicio final. ¡Hostias que Yo preparé para vosotros, para estar siempre cerca...! Os veo venir a Mí como vi en otro tiempo venir a Mis Apóstoles a la Cena; y Yo voy a vosotros, con el Corazón lleno de las mismas emociones que tuve el Jueves Santo.</i>\n<i>“Mis pobres pequeños que no pensáis en estas cosas; que estáis tentados a creer que Yo estoy en Mi Eucaristía inerte, como en una pintura; veis en Mí algo así como un antiguo recuerdo, mientras que estoy con vosotros vivo y respirando.”</i>"],[8,20]],[1116,["15 de junio de 1941. <i>“Entra en el Océano infinito, en la Paz tranquila como una hermosa aurora. ¿Recuerdas los tintes del cielo aquella vez en Nápoles, cuando se levantaba el sol? ¿Aquel firmamento, aquel mar, en una serenidad de innumerables tonalidades? Considera lo que pueden ser las Perfecciones de Mi Corazón en su Infinitud. ¿Cómo podrías percibir todas sus Bellezas? Adora, pues, lo que no conoces. Y todos vosotros seréis recompensados por haber creído en la oscuridad.”</i>","<i>“Pon tu frente sobre la Mía, para que puedas penetrar en Mis Pensamientos.”</i>"],[21,52]],[1117,["17 de junio de 1941. Comunión. ‘Eres Tú, mi Señor, Tú solo Quien me ha llevado por todos mis caminos’. Él: <i>“Agradécemelo. Yo Soy el que mira y tú sabes de cuánto Amor están llenas Mis Miradas. Yo Soy el que te habla. Soy el Visitante que deja siempre algún regalo como recuerdo de su paso.”</i>"],[29]],[1118,["<i>“Mañana, en la comunión, Me llamarás ‘El Corazón de las Misericordias’. Y Me pedirás, como regalo de fiesta, la conversión de Mi pecador. Aun cuando a todos los quiero convertidos, de cuando en cuando hay alguno cuyo retorno daría al Cielo un verdadero júbilo. Ayuda a producir alegrías en el Cielo, tú, que eres miserable, y ve en esto Mi Condescendencia. Me puedes dar con verdad plena el título de ‘Corazón de las Misericordias’.”</i>","19 de junio de 1941. ‘Señor, deseo que llegue ya tu fiesta del Sagrado Corazón, que es mañana.’ <i>“Todos los días serían Mi Fiesta si tú Me lo desearas, Mi Gabriela. Todos los días serían una fiesta de Amor, desde el amanecer hasta la caída del sol.”</i>\n<i>“Soy Yo el que te manda el sueño y esto es una manera de amarte. Mientras duermes, Yo no dejo de mirarte. Entonces, ruégale a tu santo Ángel que ofrezca en tu nombre todas las respiraciones de tu reposo, para la Gloria del Padre; como el Loira, que nunca se detiene, ni de día ni de noche. ¡Qué sencillo es el amor! Despiertos, se ama; dormidos, también se ama; y en el Cielo no hay interrupciones, pues allí todo es pura actividad. Que tu deseo del Cielo sea grande.</i>\n<i>“Hay que desear ardientemente el Cielo. Es desearme a Mí y Me glorifica.”</i>"],[30,38]],[1119,["19 de junio de 1941. Hora Santa. <i>“Yo Soy el Reparador, dame tus males. Enséñamelos en tus dos manos, como una mendiga. A Mis Apóstoles les dije una vez: ‘No temáis, Soy Yo’, y ahora te repito estas dulces palabras de Amor. Acuérdate que en el Sinaí solo Moisés podía acercarse a Dios, y si alguien traspasaba el límite al pie de la montaña, era castigado con la muerte. Y ahora que el Hijo de Dios ha venido a morir por vosotros, os dice a todos: ‘Acercaos a Mí. Venid y amadme sin miedo, porque Yo os amo’.”</i>\n1140.19 de agosto. En la iglesia vacía. <i>“Ya ves, no te tengo más que a ti.”</i> Busqué un lugar delante del Tabernáculo. Él prosiguió: <i>“Lo que más importa es que pongas tu corazón más cerca del Mío. Imagínate. He estado aquí solo todo el día...”</i> (El señor cura había salido de viaje). <i>“Piensa en el placer que puede darme tu visita de amor. Dime, ¿estás contenta de tu día?”</i> ‘Señor, causé una pena sin quererlo y estoy desolada.’ Él: <i>“Cuando no puedas con un asunto, encomiéndamelo a Mí con confianza y Yo lo arreglaré. Ahora voy a darte una ocasión de reparar tu falta con una gentileza.”</i> Yo: ‘Señor, habla siempre en lugar mío.’ Él: <i>“Hay un medio para lograrlo: mírame siempre cuando hables. Verás entonces que tu palabra se hace amable y gentil.”</i>"],[12]],[1120,["3 de julio. <i>“Deletrea, ya desde ahora, el alfabeto del Amor en el trance de la muerte. Tus últimas respiraciones serán tu ‘Consumatum est’. Dímelas ya desde ahora. No dejes nada imprevisto para ese bello trance que es la muerte. La hora de la muerte es la hora de la cita; apresúrate, Mi bien amada, a ofrecerme ese pensamiento. ¿Comprendes que tienes que morir por anticipado?</i>\n<i>“Como una alegría largamente soñada, que se acaricia con el pensamiento; una alegría que no se da sino una sola vez y que debe disfrutarse en plenitud. Desde hoy dime: ‘Cuando mis párpados comiencen a cerrarse para las cosas del mundo, es Tu Mirada de Amor lo que buscarán mis ojos. Y cuando mis oídos se hayan cerrado, es Tu Voz amorosa lo que voy a querer escuchar. Señor, Tú tomarás los sufrimientos de mi cuerpo como expiación de mi vida y de la de los pecadores, para gloria de la Verdad. Y si mi agonía se prolonga, que se prolongue igualmente mi amor, y que sea fiel en responder al Tuyo que me diste en la Cruz.’</i>\n<i>“Dime todas estas cosas con frecuencia, Mi pequeña, y no dejes nada a la improvisación. El Esposo también espera. Si tu impaciencia crece, ¡cuánto más la Suya! Él es tu Creador. Tu primera respiración la tuviste por Él. Ofrécele, pues, las últimas, que Él las recoja. Esto Le dará honor y Él te permite que Lo honres. Dale gracias por este favor. Vosotros sois de Su Familia.”</i>"],[31]],[1123,["‘¡Qué no se me olviden los deseos de mi Señor! Esta mañana, en la comunión, me olvidé de darte el nombre escogido que Tú esperabas.’ Él: <i>“Olvidar no es una falta. Pero despreciar, desdeñar, sí lo sería, y Me haría sufrir en Mi Amor. Levántate cada día como sobre la punta de tus pies para hacer las cosas mejor que la víspera. Has de ser fiel al esfuerzo sobrenatural, como si alargaras la mano para alcanzarme mejor. Y Yo Me acercaré para que tú sientas menos tu flaqueza; ¿no estoy siempre lleno para ti de dulces Atenciones?</i>\n<i>“Mañana dame el nombre de ‘Dulce Vencedor’. Y tú, que eres Mi pequeña conquista, te aprestarás a dejarte conquistar todavía más, porque Me quedan en ti algunos puntos que ocupar. ¿Me has darlo ya realmente ‘todo’ lo que es tuyo? ¡Entrégame la última llave!”</i>"],[8]],[1124,["A la hora de comer yo Le decía: ‘Amor mío, bendice mi comida.’ Él: <i>“La bendeciré simplemente porque Me has llamado ‘mi Amor’. Soy más sensible que el más sensible de los hombres, y vuestras palabras de niños afectuosos tienen gran poder sobre Mí. Conoced los caminos que os llevan directamente a Mí. Os revelo Mis Secretos. Vosotros creéis poco en este peso de Amor que os acompaña porque juzgáis de vuestro Dios según las medidas humanas. Tú, cuando menos, ríndete y reconócelo. Cree sin definir las cosas. Admíteme en ti.</i>\n<i>“Si tu miseria te abruma, piensa que a Mí Me atrae. Si tu frialdad te da miedo, podrás siempre tomar Mi Amor. Yo Soy tu Creador y Soy Inmenso; tú eres Mi hija pequeña. Yo conozco tus emociones lo mismo que conozco cada una de las olas del mar. Antes de que empieces a hablar, ya te oí. Porque te habito. ¿Quieres dejarme pasear por tu jardín interior?”</i> Yo: ‘Descansa en él, Señor. Toma las flores y los frutos’. Él: <i>“Yo sembraré y tú harás crecer. Y luego Me entregarás toda la cosecha, porque Soy el Dueño del jardín.”</i>"],[16]],[1128,["25 de julio. En Le Fresne. En la iglesia. <i>“Aquí estoy. Ámame mucho. Soy el mismo Jesucristo que está en el Cielo. Mi Mirada alcanza todo el Universo y son pocos los que Me aman. Ámame mucho, Mi pequeña, ¿no piensas que lo merezco? Por Mi dolorosa Pasión, por Mi Vida entera. Y por los dones que en lo personal te he dado: tu país, tu familia, tu persona misma, en lo interior y en lo exterior. Ámame mucho.</i>\n<i>“Búscame en todo lo que te haga feliz porque Yo estoy en ello. Y dame las gracias por los acontecimientos menos felices; son maneras, todas, que Mi Amor usa para modelarte. Que ninguna de Mis Maneras te escandalice.</i>\n<i>“Considera el Rostro fatigado de tu Redentor; Él es toda tu Vida. Él borra el pecado con Su Túnica empapada en Sangre. Créelo y no te hurtes a la Misericordia refugiándote en tu propio corazón. Ríndete, y tu pequeñez te elevará. Sé cada vez más pequeña, hasta la nada. Y Yo seré tu Todo.”</i>"],[10]],[1129,["‘Señor, que los asuntos de la Tierra no me separen de Ti.’ Él: <i>“Y, ¿cómo podrían separarnos? Es el tejido de los días. Yo también tuve toda clase de inconvenientes, contradicciones, calumnias y burlas. Pero no por ellas dejaba Yo Mi Camino en la Voluntad del Padre, con filial Amor, buscando para Él toda Gloria. Esto solo podrás comprenderlo cuando veas a Dios. Arroja en Él todas tus preocupaciones, como en un ramillete de homenajes, feliz de que Él te haya escogido como su pequeña servidora y para continuar a su Hijo. Piensa en ello: ¡continuar a su Hijo Único! En bondades, en desprendimiento, en simple y puro amor. Hija del Padre, encomienda tu alma viviente a Sus Cuidados”.</i>"],[50]],[1130,["26 de julio, en el campo. Yo Le decía: ‘Vayamos a pasear en tu avenida de tilos.’ Él me corrigió: <i>“Nuestra avenida de tilos. ¿De qué Me serviría sin ti? Trata de comprender Mi Sed de Unión.”</i>"],[49]],[1131,["27 de julio. Comunión: Yo le daba el nombre de ‘Amor de mi amor, la Fuente que me mueve’. Él: <i>“Así es. Yo soy el Corazón de cuanto se mueve en ti.”</i>"],[8]],[1132,["Yo pensaba en Su extrema Aflicción en el Huerto de Getsemaní, donde no tuvo siquiera el consuelo de la presencia de esta Madre amada. Él: <i>“Ofréceme las más pequeñas cosas de la vida con la intención de consolarme, y como afirmación de que toda tu vida es Mía. Y estas pequeñas cosas, Me parecerán entonces grandes: no sabes cuánto. Formarán el tejido del precioso manto de tu vida, cubriendo tu fidelidad, y Yo te levantaré más alto en el cortejo de Mis consoladores.”</i>","29 de julio. Yo: ‘Señor, ¿qué tal si nos entretenemos Tú y yo hoy vaciando el Purgatorio con un poco de Tu Sangre?’ Él: <i>“Nada es imposible para la efusión de la Sangre de Mi Corazón; sin embargo, hay que someter todas las cosas a la Voluntad de Mi Padre, que ama vuestra sumisión.</i>\n<i>“La sumisión es la expresión de la humildad y Él ama la humildad. Recuerda el evangelio que relata que Mis mayores Milagros fueron hechos para los más humildes. Para los que Me decían: ‘Di solamente una palabra...’, o ‘Yo no soy digno…’, o ‘yo no merezco desatar el cordón de su sandalia’, o como la pobre mujer que dijo: ‘los perritos comen las migajas que caen de la mesa’. Recuerda una palabra que te dijeron hace poco: ‘Somos demasiado grandes para ser santos.’</i>\n<i>“¿Sabes tú que en medio de las otras mujeres Mi Madre se creía la última de todas? ¡Ella!”</i>","<i>“¿Sabes que en medio de las otras mujeres Mi Madre se creía la última? ¡Ella!” </i>‘Señor, te ofrezco Su Humildad en lugar de la mía.’ <i>“Sí, ofréceme las virtudes que Ella tuvo en la Tierra. Se han quedado aquí para vosotros, para que os sirváis de ellas, vosotros, Mis pobres pequeños. ¡Tan pobres! Ella pensaba siempre, conmigo, en vosotros. ¿Su vida? Siempre estuvo llena de Mí y de vosotros. Y Ella está siempre dispuesta a dároslo todo. Pedid y recibiréis. ¡Piensa! Es tu Madre.”</i>"],[10,23,28]],[1133,["30 de julio. Una visita. Yo Le decía: ‘¡Qué novedad cada vez es amarte!’ Él me respondió: <i>“Y para Mí, Mi Gabriela, es también siempre nuevo el Amor que te tengo.” </i>Yo continuaba y Él me respondía. Esto me recordó a esos pajaritos que charlan en voz baja en sus nidos."],[1]],[1134,["30 de julio. <i>“¿Tienes alguna cosa que decirme esta tarde? Se te preguntaba cuál es tu misión.” </i>‘Señor, yo soy demasiado pequeña para tener una misión.’<i> “Las niñas pequeñas pueden recibir un encargo. Tú debes mostrar que hay que hablar conmigo y no dejarme solo en los corazones. Lázaro, Marta y María estaban en su casa cerca de Mí, ocupándose de Mí. ¿No te parece que Yo debía recibirlos muy bien en Mi Palacio del Cielo?”</i>"],[15]],[1135,["4 de agosto. Yo estaba orando con los brazos en cruz, sin apoyarlos. Y pensaba que acaso una cosa tal no tenía mayor importancia. Me dijo: <i>“¿Acaso no fue escuchada la plegara de Moisés? Y Aarón le sostenía los brazos.”</i>"],[37]],[1136,["5 de agosto. Cuarta Estación del Via Crucis: Yo no me atrevía a unirme al saludo del Hijo y de la Madre. Me dijo: <i>“Ven, ven. Mi Madre y Yo no nos reservamos nada, todo es vuestro. Todo es para vuestra salvación, aun nuestras Ternuras más íntimas.”</i>"],[51]],[1137,["12 de agosto. <i>“Estás a Mis Pies, mirándome y lista para escribir. Estamos solos en la iglesia y, para Mí, tú representas a todo el país.</i>\n<i>“Pide perdón por las infidelidades. Pide Gracias de amor para cada uno. Yo podría darlas sin ti, pero Mi Bondad se sirve de vosotros, lo mismo que Yo Me he valido de los ángeles, como la cabeza se sirve de los miembros. Así somos uno. Guarda constantemente el pensamiento de nuestra Unión. Sé ‘la Mía’. Yo seré ‘El Tuyo’. Vigila tu pensamiento para que no se te escape. Átalo fuertemente a Mí. Mírame con frecuencia y encontrarás que siempre te estoy mirando, que te animo y te cuido. Un Gigante inclinado sobre Su pequeñita. Tú sabes que el Gigante es infinitamente bueno; por eso pones tu confianza en Su Fuerza bienhechora, aun cuando a veces se te esconda.</i>\n<i>“Por lo que mira a Él, es tu debilidad lo que hace fuerza a Su Corazón. Muéstrale hasta qué punto has sido miserable durante el día, en toda tu vida; y Él, lejos de rechazarte, abrirá Sus Brazos y te apoyará sobre Su Corazón: el lugar de Juan.”</i>"],[49]],[1141,["20 de agosto, desde una cruz. <i>“No puedo ir a buscar pecadores porque Mis Pies están clavados, porque Mis Brazos están extendidos no puedo apretarlos contra Mi Pecho. Pero Mi Corazón está abierto. Que entren y permanezcan. Diles que Mi Cruz está levantada, esperándolos a todos a través de los siglos. ¡Pobres pecadores, a quienes tanto amo!”</i>"],[44]],[1142,["21 de agosto. <i>“Sé toda Mía. ¿Ya lo ves? Tienes el pensamiento puesto en la casa que acabas de comprar y en lo que quieres añadirle... Sé Mía; de lo contrario, será como lo que dice el Evangelio de las invitaciones a la boda...”</i>","21 de agosto. <i>“Sé toda Mía. ¿Ya lo ves? Tienes el pensamiento puesto en la casa que acabas de comprar y en lo que quieres añadirle… Sé Mía; de lo contrario será como lo que dice el Evangelio de las invitaciones a la boda… Uno no fue porque quería probar su yunta de bueyes, el otro salía del campo. Mientras tanto, el que los invitaba se quedaba solo con su mesa. Sé toda Mía.”</i>"],[4,49]],[1143,["Yo: ‘Señor, quiero encontrarte en todas partes. Ayer Te besaba yo en cada rosa.’ Él. <i>“Que tus ojos, tus oídos, tus sentidos, Me busquen a través de la Naturaleza. Es el gran jardín donde se pasea tu Amado; ahí puedes tener la esperanza de encontrarlo. Tantas cosas buenas dependen de un encuentro... Vive conmigo, pequeña alma elegida, conmigo, tu Señor y tu Dios.”</i>"],[39]],[1145,["Via Crucis. En la Estación de Simón el Cireneo Le dije: ‘Señor, ¿puedo ayudarte?’ Me contestó: <i>“Cuando ayudas a tu prójimo, Me ayudas a Mí.”</i>"],[5]],[1147,["28 de agosto de 1941. Yo Le daba las gracias por sus Dones. Dijo: <i>“Aun cuando tu confianza no tuviera ni el tamaño de una semilla de mostaza, es necesario hacerla crecer. Así pues, en esas Gracias que tanto te han conmovido hoy, ve Mi Amor siempre atento a los detalles de tu vida. Me encontrarás a cada paso cuidándote y precediéndote. ¿A dónde has ido que no estuviera Yo esperándote? Con frecuencia Me has encomendado tus bienes. Para Mí, el bien de tus bienes, eres tú. Confíate tú misma incesantemente.</i>\n<i>“Dame cada instante: en Mis Manos es donde está mejor. El Evangelio dice: </i>«<i>Imponía las Manos y curaba</i>»<i>. Yo le quitaré a tu momento presente lo que tiene de terreno: el egoísmo que mancha la intención. Ten confianza, siempre más, no te detengas ante el milagro. No te detengas, porque limitarías la acción de Mi Amor. Y después de haber desarrollado tu confianza, la seguirás desarrollando aún más, y nunca alcanzarás el niel que Yo quisiera. Cuanta siempre conmigo, nunca contigo. Y así avanzarás, subirás, y devorarás el camino. ¡Pequeña hija Mía!”</i>"],[9]],[1148,["28 de agosto. <i>“Deséame todo bien de parte de Mis creaturas. Deséame que muchas almas salgan del Purgatorio este día. Únete a su alegría porque al fin llegan a verme, y a la Mía por su felicidad. Sube, sube con frecuencia al Cielo.”</i>"],[38]],[1150,["14 de septiembre. Yo Le dije: ‘Señor, ten piedad de los de mi familia que no se encuentren en Tu Gracia.’ Él: <i>“Ponlos tú misma en Mi Alma, en la de Mi Santísima Madre. Si los cuerpos se curaban con solo tocar Mi Cuerpo, ¿no crees que Mi Alma tiene también ese poder? Yo siempre tengo a los pecadores en Mi Pensamiento.</i>\n<i>“Si Me ves como encadenado por Mi Justicia, rompe Mis cadenas con una plegaria, un sacrificio, un encanto. ¿O Me crees insensible a un gesto de encanto que Me haga Mi pequeña? ¿A Mí, que Soy el más tierno y compasivo? ¡Oh, Mis amados ladrones de Gracias! Yo estoy más que dispuesto a agradeceros estas audacias. Y deseo inmensamente que Me sigáis robando...</i>\n<i>“No pocos son los que creen que Yo Soy malo y que solo tengo deseos de venganza, y la verdad es que aquí estoy, con los Brazos y el Corazón abiertos. ¡Pobres pecadores, tan queridos y tan esperados!”</i>","14 de septiembre. Fiesta patronal. El adorno de las flores naturales era encantador. En la iglesia vacía, Le dije: ‘¡Qué contenta estoy de que tu altar esté tan bonito!’ Él: <i>“Más bonito era cuando, como esta mañana, estaba rodeado de almas piadosas. Tú no puedes saberlo. No sabes lo que es la magnificencia de un alma. Es el soplo del Espíritu de Dios; nada de materia, ni siquiera la que hay en una flor. El alma es espíritu y esta belleza del alma crece según el cuidado que le dais. Un esfuerzo, un deseo, un acto de amor; un acto de paciencia o de abnegación que parece no ser nada, le da en el mismo instante un aspecto más maravilloso; como una luz que se infundiera en otra luz y luego en otra, a medida que van aumentando las virtudes.</i>\n<i>“Vosotros decís que el cuerpo humano cambia cada siete años, ¿qué no diríais de las metamorfosis de las almas cuando son fieles a la Gracia?</i>\n<i>“¡Lo que sería si se diera al alma cada día el mismo cuidado que se da al cuerpo! Y sin embargo, ¡bien sabéis que el cuerpo no es sino una envoltura de barro!”</i>"],[4,47]],[1151,["Desde el Ostensorio. <i>“Descansa sobre Mi Corazón. Come y bebe. Tenéis que alimentaros de este alimento que no conocéis. Atreveos. El amor es audaz. Y quédate ahí. Y cuando te despiertes, que sea siempre en Mi Corazón, y en nombre de la humanidad entera, como si estuviera en tu poder darme, en un solo instante, a todos los que respiran. Ten este deseo. Es un fruto hermoso que puedes ofrecer con frecuencia para Mi Sed. Vete ahora y llévame contigo.”</i>","14 de septiembre. Yo me disponía a dejar Le Fresne para ir a un lugar lejano a montar piezas de teatro. Le dije: ‘Te ofrezco por los pecadores el sacrificio de salir de aquí. Tómalo para todos ellos.’ Me contestó: <i>“Une siempre tus sufrimientos a los Míos para hacer infinita su eficacia. Ten por seguro que cuanto hagas por ti misma nada vale, pero puedes siempre poner tus pasos sobre Mis Huellas.”</i>"],[13,37]],[1153,["22 de septiembre. París. En Montmartre. <i>“Yo te escogí. También a todos los tuyos. Todo lo que te ha conmovido; la gente que has encontrado, tus grupos de teatro, aun aquellas personas que no has visto sino una sola vez. Dámelo todo. Mi Corazón es un Hospital. Yo cuido y doy la salud.”</i> ‘Entonces, Señor, Le dije: Te doy todo cuanto hay de malo en mi naturaleza.’ Él prosiguió: <i>“Pon tus horas malas en Mis Horas dolorosas; Las que lo fueron o para Mi Cuerpo o para Mi Corazón. Yo lo redimo todo y todo lo renuevo. Soy el Gran Coleccionista y Mis Colecciones se rehacen en Mis Manos. ¡Con que tuvierais algo de Fe!”</i>","22 de septiembre. París. En Montmartre. Yo: ‘Señor, creo que no tengo amor suficiente para creer en el Tuyo.’ Él: <i>“Ese Amor está en Mí, pídemelo todos los días. ¿Te lo podría negar Yo, que tanto deseo darlo a todos? Si vosotros pedís poco, es porque vuestra Fe es escasa. Sin embargo, Yo no necesito comprar para tener y dar. Lo tengo todo.”</i> Yo: ‘Si, en el misterio.’ É1: <i>“Para que haya mérito en vosotros. Vosotros queréis que Yo os lleve al Cielo; pero, ¿cómo podría hacerlo sin algunas pruebas?”</i>"],[12,21]],[1156,["23 de septiembre. En Le Fresne. <i>“Yo Soy el Amor. El que cree en el Amor crece en la posesión de Mí. ¡Tómame!”</i>","23 de septiembre. En Le Fresne.<i> “Yo Soy el Ardor. El que crece en el Amor crece en la posesión de Mí. ¡Tómame!”</i>"],[1,3]],[1157,["27 de septiembre. Después de la comunión no me atrevía yo a pedirle Su Reino sobre la Tierra entera, Me dijo: <i>“Entonces, tú no crees realmente que si hubiera mil mundos Mi Sangre hubiera podido redimirlos a todos.”</i>"],[45]],[1158,["l de octubre. En el campo. Él: <i>“Si la unión entre un alma y Yo comienza sobre la Tierra, ¿cómo podría ser que Yo la interrumpiera cuando el alma sale del cuerpo?”</i> ‘Señor, ¿es que solo en ese momento podremos comprender Tu Amor?’ Él: <i>“Sí, solamente en ese momento podréis comenzar a comprender lo que es Mi Amor, pero para continuar en la Eternidad.”</i> ‘Yo quisiera ser presa de Tu Presencia y ser como aniquilada, como en el momento de la muerte.’ <i>“Ofréceme este deseo de no ver nada sino a Mí en todas las cosas. Me adornaré con él como con un regalo tuyo. Que nada cuente para ti fuera de Mi Pena o de Mi alegría”.</i>","1158.<i> “Sacrifícate delante de Mí hasta el punto de ni siquiera ver tu sacrificio. Que todo te sea simple en el sufrimiento, pues es por Mí. Yo sufrí por ti. Y ¿qué es la vida cuando se tiene la Eternidad? Que sea como una lengua nueva en la que Me digas que Me amas y que eres el incienso que arde ante Mi Rostro, con un deseo intenso de serme agradable, a Mí, tu Amigo.”</i>"],[31,37]],[1159,["El tiempo era espléndido y yo decía: ‘Señor, creo que Tú estás presente en todos esos árboles dorados, en la bruma de las praderas; y acaso Te hayas quedado presente también en mí desde la comunión de esta mañana.’ Él: <i>“¡Es tan poco lo que te impide verme! Tan poco. Cree en medio de la oscuridad. Cree con fuerza. ¿Qué sería Yo capaz de negarte, a ti, que transcribes Mis Palabras?”</i> Yo: ‘Señor, esto es una alegría, no mi mérito…’ Él: <i>“¿Y si Yo quiero mostrarme magnífico? ¿Le impedirías tú explayarse a un corazón enamorado? ¿Puedes reducir las aguas del océano cuando se desbordan? Déjame amarte como Me place amarte. ¿Cuándo Me conocerás lo suficiente como para que Mis Magnificencias no te asombren? Eso sucederá cuando tú, ante un exceso de Dones, digas ‘¡Es Él!’”</i>"],[53]],[1160,["8 de octubre de 1941. Después de la comunión no había yo tenido los ojos cerrados. <i>“Cuando se tiene en casa al Amigo más querido, al Esposo Amado, se cierran las ventanas para estar bien a solas con Él, que ha venido. Así se prolongan de una parte y otra las expansiones.”</i>"],[8]],[1161,["Durante mi tiempo de descanso. <i>“La única finalidad que tiene la Tierra es la de ganar el Cielo para sí y para los otros. Pero, ¿cuál es la finalidad del Cielo mismo? Es la celebración de las Bodas.</i>\n<i>“Bodas maravillosas, Festín del Esposo, Festín de la esposa. ¿No crees que para tales Bodas y en tal Lugar tendrás que aparecer digna de tu Señor, sin los harapos del pasado, sino con la vestidura que el Esposo mismo puso a tu disposición, la vestidura de Sus Virtudes y de Sus Méritos?</i>\n<i>“Abandona ya desde ahora todo lo manchado. Elévate en Mí. Piensa en la cercanía del día feliz de la Boda. Y no te imagines nada sobre él, porque Yo Soy quien lo está preparando para nosotros dos, así como también para todas las demás almas. Yo seré la respuesta.</i>\n<i>“Sé Mi encanto desde ahora. Que nada falte en tus preparativos, Mi amada. Trata continuamente de agradarme, sabiendo que Yo te habré de colmar como no lo fue nunca ninguna otra esposa. Espera de Mí las alegrías más dulces que no alcanzas a imaginar. ‘Ni ojo vio, ni oído oyó...’</i>\n<i>“El Cielo son tus Bodas. Y eso es todo.”</i>"],[6]],[1162,["En Bel-Air, sola. <i>“Un instrumento. Sí. Con frecuencia te llamo de este modo. Hay instrumentos de música. Y, ¿no es una música suave ese canto interior que sube desde Mis Palabras?”</i>"],[4]],[1166,["Durante la Misa Mayor. <i>“Cuando un amigo querido está presente en una fiesta, tú gozas de la fiesta doblemente porque piensas: ‘también él está oyendo esta música y viendo estas bellezas’. Piensa que Yo, tu gran Amigo, estoy siempre contigo y asisto a tu vida. Compártelo todo con tu Amigo y esto duplicará tu alegría de vivir.”</i>"],[46]],[1169,["15 de octubre. En Nantes, en el convento carmelita de Santa Teresa de Ávila. <i>“Ella creyó en el Amor. Cree también tú.”</i>"],[18]],[1170,["Después de la comunión. <i>“Tanto más te acercarás a Mí cuanto más hondo entres en la simplicidad. Créelo todo y espéralo todo de Mí. Y dalo también todo en amor. ¿No es esto lo más simple? Adora al que Es simple y adóralo en la simplicidad.”</i>"],[8]],[1171,["17 de octubre. Comunión en Notre Dame. <i>“Ensancha bien tu corazón para que Yo pueda entrar en él con todas Mis Gracias. Piensa en Mí, llámame, deséame, alégrate en Mí. Créelo todo.”</i>\n‘Di, Señor, una sola Palabra y mi alma quedará curada.’"],[8]],[1172,["‘Señor, no Te había yo dicho esto por temor a que no vinieras a mi casa.’ Él: “<i>Yo entro con frecuencia sin que nadie lo sepa. Y todo lo que digo a un alma es para todas las almas. Mi Voz es la más tierna, la más delicada. Conozco los caminos de los corazones. Tú, aprende cómo se llega al Mío.”</i>"],[15]],[1175,["22 de octubre. Le Fresne. <i>“Aun cuando no hubieras venido a esta iglesia sino a darme gusto y ponerte a Mi Disposición, ya Me habrías dado con eso solo una prueba de amor. ¿No te da gusto darme a entender que Me amas? Yo espero eso de ti y espero que lo hagas con frecuencia. Los desposados se hacen pequeños regalos que les son muy dulces… Gracias por los pensamientos que Me dedicas por la noche, que sean cada vez más simples y naturales.</i>\n<i>“Unidos de día, unidos por la noche… ¿Podríamos estar separados en el Cielo? Entonces, no hay que interrumpir nuestra Unión sobre la Tierra.</i>\n<i>“Cuando Mi Madre estaba lejos de Mí se preocupaba de Mis Interese como si Me tuviera presente. Haz tú como si Me vieras. Recuerda que siempre asisto a la fiesta de tu vida. Vive ‘a dúo’ conmigo; seremos una sola cosa en el Padre. ¡Dichosa Unidad!</i>\n<i>“Y no es demasiado larga la espera, cuando se trata de preparar una felicidad semejante. Toma valor de Mi Valor en la hora de Mi Pasión y medita en Ella. Toma amor de Mi Amor en la hora de la Pasión. Pide. Sola nada puedes. Y ya sabes que cuando aceptas que nada puedes, tienes una fuerza que Me atrae, a Mí, tu Rey. Quiero reinar en ti. No te pongas, pues, atención, y no pienses sino en Mí que te llevo en Mi Corazón.”</i>"],[49]],[1177,["En la iglesia de Ingrandes. <i>“Sé sencilla, muy sencilla. Si durante toda esta hora no hicieras sino repetir ‘Te amo’, Yo estaría contento. Y tú, ¿estás contenta de que tu Amado lo esté? No busques otra cosa, Mi Gabriela, sino hacerme feliz. Y puedes conseguirlo con cosas muy pequeñas, porque la intención cuenta más que la acción misma. La intención se tiene en el corazón, y son los corazones lo único que Me interesa. ¿Y no es también el Corazón lo que tú buscas en Mí?</i>\n<i>“Cuando llegue el día en que comprendas Mi amor, entenderás también por qué Yo soy un Cazador de corazones. ¡La fiesta que hago con cada captura!”</i>"],[13]],[1179,["Al despertar. <i>“Tu día, una vida: cada despertar, como un nacimiento. La Misa, tu primera comunión. Y luego, gozos y penas, todo ofrecido a Mí y en Mí. Y Yo te llevare en Mi Corazón lleno de Amor. Prepárate para el sueño como para la muerte, en el amor y para Mi Gloria. Y mañana tendrás de nuevo la vida en Mi Corazón, atento a cada uno de tus pasos, Mi pequeña.”</i>"],[39]],[1182,["6 de noviembre. En “Les Dames Noires”. Retiro predicado por el P. Guyot. <i>“Estas cosas, ¿no te las había dicho ya?” </i>‘Sí, Señor, ya me las habías dicho.’ <i>“¿No reconoces todas Mis Palabras? Que todos vosotros formáis parte de Mi Cuerpo, cuando estáis en estado de Gracia y sois Mis amigos… que no solamente sois ostensorios vivos, sino otros Cristos, por lo cual debéis amaros los unos a los otros, que a todos les pertenecen los méritos de todos, así como los Míos y los de mi Santísima Madre. Tomad, pues, a manos llenas, no sigáis pobres.</i>\n<i>“Ofreceos al Padre Celestial revestidos con esos ornamentos de belleza. Y esto, cada día… y siempre… antes de comulgar, antes de dormir, en el momento de despertar… todo el Cielo será feliz con ello. Y así entraré en posesión definitiva de Mis Joyas vivas. Será la integridad de Mi cuerpo…”</i>"],[7]],[1184,["9 de noviembre. En el campo, a la hora de un hermoso levante del sol. <i>“Mira, las nubes no son magníficas sino por obra de las mil virtudes del sol. Sin esto, se tornan grises de nuevo. Así es tu alma, resplandeciente cuando está cubierta por Mis Méritos, oscura cuando es solo ella misma.”</i>"],[47]],[1186,["13 de noviembre. Por la tarde. <i>“¿Quién te podría impedir estar a Mi lado durante Mi Agonía? Nadie, fuera de ti misma. Eres libre. ¿Quieres darme esa tu libertad? Dime: ‘Ya no tengo libertad porque Te la di.’”</i>"],[36]],[1192,["11 de diciembre. Yo estaba en Getsemaní con el pensamiento. <i>“¿Estás conmigo? ¿De verdad? Ayúdame, entonces, a llevar el Mundo. Consuélame del Mundo. Que haya cuando menos un corazón que sea Mío y que Me sea para siempre fiel. Que no pueda Yo decir que tenía una sola alma y que Me la quitaron. Y digo que ‘sola’, porque ninguna alma se parece a otra. Para Mí, cada una es ella sola. Sí, pertenéceme de verdad...”</i>"],[36]],[1199,["Navidad. En la Catedral. Él: <i>“Si he llegado al extremo de descender hasta vosotros... ¿hasta dónde crees que pueda llegar Mi Poder puesto a vuestro servicio? No vaciles. No dudes que Yo pueda hacer llegar tu trabajo de transmisión hasta el confín del mundo. Persiste en rogar que llegue Mi Reino. Pide.”</i>","<i>“Cuando tú piensas en Mí, trata de poner en ello tanto amor como pongo Yo cuando pienso en ti. Trata de aumentar tu celo, tu entusiasmo por unirte a la Santidad de tu Esposo. Invoca con frecuencia al Espíritu Santo, diciéndole: ‘¡Ven a mí!’ Y si Él viene a ti, viene con la Santidad, ¿no vale la pena que Lo llames? Y la santidad consiste en la manera de amar en medio de las cosas ordinarias. Enciende tu amor en Mis Llagas. Válete de pequeñas industrias y no descuides nada que te pueda acercar a Mí. Acuérdate de Zaqueo, que se subió a un árbol para verme. Y este deseo de verme, que era grande, le valió la Gracia de Mi Visita. Vive más en lo interior que en lo exterior. Porque es en tu interior donde Yo te hago Mis Visitas; cada vez que entras en ti, Me encuentras, pues ahí estoy instalado.”</i>"],[33,47]],[1202,["2 de enero de 1942. Durante la Misa. Me dijo: <i>“Guarda tu vestidura sin manchas, sin manchas voluntarias. Si al caminar por una pradera sucede que algún abrojo o la hierba verde te deja una seña o rozadura en tu vestido blanco, nada importa. Pero si tú misma la rasgas con tijeras o le pintas figuras con tinta, es diferente. Es negligencia o desprecio de la Belleza. Y mucho peor es cuando eso pasa en el alma, hecha según Mi Imagen.”</i>"],[12]],[1206,["20 de enero de 1942. <i>“Ruega por los pecadores pero también por los justos, a fin de que lleguen a ser santos. ¡Mis pobres pequeños! ¿Quién es santo? Solamente Yo, en vosotros. Y cuando haya santos cambiará la faz de la Tierra. Recuérdalo: unos pocos bastan para salvar una ciudad.”</i>"],[47]],[1207,["21 de enero. <i>“¡No Me has besado mucho hoy!”</i>"],[16]],[1208,["22 de enero. A la hora de comulgar Le dije: ‘Señor, haz que yo sea otro Tú’. Me dijo: <i>“Hay un medio para alcanzarlo, no obstante tus miserias: consiste en que seas, ‘toda tú, Caridad’. No solamente para con los que pobres de dinero, sino también para los que son pobres porque no son felices. Y sobre todo, Caridad para con el Pobre que Soy Yo. Sé pues, toda tierna y toda Caridad.”</i>"],[8]],[1210,["24 de enero. <i>“Tú oras por tus intenciones; ora también por las Mías.”</i>"],[33]],[1213,["En la Basílica de Montmartre. ‘Señor, Te entrego el momento de mi muerte. Y en mi muerte, todas las muertes de mi familia.’ <i>“Hija Mía, invoca Mi Nombre en la Cruz cuando Me encomiendes a las personas. Y encomiéndalos a todos, sin excepción alguna, aun aquellos que te parecen grandes pecadores. Porque Mi Sangre es tan poderosa; Mi Amor es tan grande... ¡Qué alegría para ti y para Mí, si conseguimos salvar a esos pobres moribundos!”</i>"],[44]],[1215,["11 de febrero. Nantes, en la calle Lamoricière. <i>“Es posible que ahora no puedas hablar conmigo, pues no siempre tiene uno cosas que decir... Pero puedes caminar a Mi lado y pensar con ternura en Mí...”</i>"],[39]],[1219,["<i>“Soy tu Dios y tu Salvador, tu Esposo amado. Adora. Dame los nombres más dulces y vendré a ti con esos nombres. Soy el Uno y el Múltiple, Soy el Infinito y colmo a Mis creaturas y las arrullo como una madre a su pequeño.</i>\n‘Yo quisiera también ser múltiple y amarte con todas las maneras posibles de amor.’"],[16]],[1221,["1º de marzo, después de la comunión. <i>“No hay ocupación alguna que realmente se oponga a la oración. Yo recitaba los salmos bajo los golpes y cubierto de Llagas, arrastrándome por el camino al Calvario, en medio de la multitud que gritaba. Y también sobre la Cruz. ¿Y tú encuentras difícil orar en medio de tus ocupaciones cómodas? Únete a Mi’.”</i>"],[39]],[1223,["5 de marzo. <i>“Yo te aguardo siempre, con el mismo transporte, con la impaciencia de la primera vez, porque Soy el Infinito.</i>\n<i>“Ve en espíritu a la iglesia profanada de Méan. Arrodíllate cerca de Mis pobres hostias y adora. Pero sobre todo, ama y consuélame. Yo amo a los hombres: ¿por qué ellos Me tratan así?</i>\n<i>“Crímenes que vi desde el Huerto de los Olivos y tanto Me hicieron sufrir... Cuando alguien rechace un gesto cariñoso de tu parte, únete a los Sufrimientos secretos de Mi Corazón, y con eso Me aliviarás. Soy inmensamente sensible al odio que querría aniquilarme, pero también lo Soy al amor que quiere consolarme, y a las encantadoras delicadezas de Mis creaturas. Nunca exagerarás. No temas nada de Mí, eres bien comprendida, pues no tenemos sino un movimiento común del corazón.</i>\n<i>“Ensánchate, Yo te escucho y no Me canso. No te canses tú tampoco. Háblame como en voz baja y en la oscuridad, segura de la atención de Mi Oído y del Amor de Mi Corazón.”</i>"],[3]],[1224,["11 de marzo de 1942. <i>“A veces te sucede que quieres presentarte a otros con aspecto agradable, y te arreglas. Pero ante Mí eres lo que eres, y no hay nadie fuera de Mí que pueda mirarte con esa Mirada de verdad. Lejos de huir de Mí, muéstrame tu miseria con sentimientos de contrición. Busca Mi Ternura y ejercita la tuya. Soy el Único que realmente te conoce, hija Mía. Regocíjate en la intimidad de tu Dios. ¿Podrías soñar en algo más alto? La vida se te dio para que Me amaras, ¿encuentras tú en ello tu dicha? ¿No te consuela esto de todo lo demás? ¡Amarme! ¡Cuando Me veas...!”</i>"],[29]],[1225,["22 de marzo. Después de la comunión. <i>“Me has pedido torrentes incesantes de Fe, de Esperanza y de Caridad, pero es preciso que ejercites con frecuencia esas virtudes. Di: ‘Creo en Ti, Mi Amor querido; creo en Ti, Amor poderoso; Te amo, Amor infinito y amo al prójimo por amor a Ti. Tú lo eres todo para mí y yo soy toda tuya’.”</i>"],[53]],[1228,["27 de marzo. Durante el Evangelio. <i>“Habla a tus hermanos como Yo, en la humildad, con la Verdad de Dios, en el Amor.”</i> ‘Señor, beso la Tierra que pisaste y beso Tu Sombra detrás de Ti.’ <i>“Mi Sombra es tu prójimo.”</i>","27 de marzo. Como yo dudaba en pedirle una conversión difícil, me dijo: <i>“¿Acaso no liberé a Barrabás?”</i>"],[5,33]],[1229,["27 de marzo. Yo arrancaba hierba de la terraza, y mientras tanto Le decía: ‘Es para ayudarte a arrancar a los pecadores de sus malos hábitos.’<i> “Dime estas cosas como si Me vieras, y si Me vieras no Me hablarías sino con una sonrisa. Ensaya y verás la diferencia.”</i>"],[39]],[1231,["11 de abril de 1942. <i>“Yo prefiero un alma que ha caído con frecuencia, pero que se humilla a Mis Pies, que otra que vive satisfecha de sí misma y no piensa tener nada que reprocharse. Manifiéstame cada día, hija, tu arrepentimiento. Mira tus faltas y ofrécemelas, para que Yo las repare. Admite tu debilidad, tus fracasos. Y dime: ‘Creo Amigo mío, ayúdame, ya sabes que sola nada puedo, pero Contigo lo puedo todo’. Y vuelve a emprender el camino, llena de confianza en Mí. Y aun cuando no aprecies ningún progreso, fortifícate en la paciencia.”</i>"],[12]],[1232,["16 de abril. Estando en el jardín, Le decía yo: ‘Arranco la hierba para que Tú vengas a pasearte en la terraza.’ Y en una callecita, Le dije: ‘Esto se parece a tu ciudad de Nazaret.’ Era como si Él estuviera allí. Y yo pensaba en algo que Él me había dicho: <i>“¡Es tan poco lo que te impide verme!”</i>"],[39]],[1233,["Iglesia de Montrealais. Visita al Santísimo. <i>“Honra Mi Delicadeza con la delicadeza de tus pensamientos y tus expresiones; compórtate conmigo como si Yo fuera tímido; da siempre tú el primer paso. Ensaya. ¡Cuántas veces Yo os espero y vosotros no venís! Recuerda cómo sufrías cuando tenías preparadas las cosas para recibir a una persona de tu particular afecto y ella te decía: ‘se me olvidó’. Y, ¿qué son los amores de la Tierra en comparación con Mi Amor? Sí. Pídeme mil perdones por las citas a las que no acudiste, y Mi Misericordia las olvidará.”</i>","<i>“Unirse. Toda la vida está en ello. ¿No te es muy dulce que Yo sea la vida de tu alma? Vosotros rara vez percibís Mi Acción, pero tú cree en Ella firmemente. Ofrécete frecuentemente a la Unión, y Mi Actividad en ti será mayor. Y aunque no la sientas, busca la unión conmigo en el amor. Aun cuando tu manera de orar fuera únicamente esa, tu vida no sería simplemente ordinaria, sino toda sobrenatural y solo el Padre conocería su verdadero valor.”</i>"],[20,54]],[1236,["30 de abril. Yo decía: ‘Dios mío, haz de mi corazón un pequeño nido de amor.’ Me dijo: <i>“¿El Amor? Lo encuentras en Mí por todas partes. En las Heridas de Mis Manos y de Mis Pies, en la Herida de Mi Costado y en todas las llagas de Mi Flagelación... y en las que no se ven. Las invisibles Llagas que Me causan en el Alma los pecados de todos los tiempos. Todas estas llagas arden en el Amor de un Dios enamorado de Sus creaturas.”</i>","30 de abril. Yo decía: ‘Dios mío, haz de mi corazón un pequeño nido de amor.’ Me dijo: <i>¿El Amor? Lo encuentras en Mí por todas partes. En las Heridas de Mis Manos y de Mis Pies, en la Herida de Mi Costado y en todas las llagas de Mi Flagelación... y en las que no se veían, las invisibles Llagas que Me causaban en el Alma los pecados de todos los tiempos. Todas estas llagas ardían en el Amor de un Dios enamorado de Sus creaturas.</i>\n<i>“Te lo he dicho ya: la Locura de un Dios, cada uno de cuyos movimientos es adorable y perfecto. Mezcla tu pequeño amor al Amor con que el Hijo del Hombre Se ofrece a Su Padre. Tú y Yo haremos entre los dos grandes cosas.</i>\n<i>“¿Te extraña el que Yo tenga necesidad de ti? Recuerda lo que decía San Pablo: ‘Lo que falta a la Pasión de Cristo’: vuestra unión y colaboración. Hija, al contemplar Mi Amor viviente en ti, desarrollarás el tuyo dándomelo para que Yo lo acreciente. ¿No te has preguntado muchas veces cómo sería posible aumentar el amor? Mira con frecuencia el Mío y ruégale. ¿Qué fin más amable que este podrías concebir para tu vida? Ámame siempre y en todo. ¡No te canses!</i>\n<i>“Si no sientes Mi Respuesta, piensa que la Respuesta está ya dada. Ama como aman los niños, como aman las buenas esposas. Ama al Amor.”</i>"],[27,36]],[1237,["6 de mayo, después de la comunión. <i>“No Me has besado esta mañana, ni ayer por la noche. Y sin embargo, tú eres Mi pequeña. ¿Qué, no estuviste contenta cuando aquel niñito que tú no conocías, te sonrió y te tendió los brazos? Vuestros gestos más simples Me tocan el Corazón. No lo dudes.”</i>"],[16]],[1238,["7 de mayo, en la iglesia. Yo decía: ‘¡Qué felicidad que Tú seas un Loco de Amor! Porque esto nos da la alegría de ser amados sin medida.’ Me contestó: <i>“¿Sabes lo fácil que es servir a Dios en el amor? Respóndele entrando en él, y todo te será sencillo. Recordarás lo que Él ha hecho por ti, y tú darás de lo tuyo. No dejes de ofrecerte, a lo largo del día, como continuación del ofrecimiento de la mañana; y entre tú y Yo cantaremos al Padre una canción de Amor que Él escuchará, aun cuando tú no percibas el sonido.</i>\n<i>“Busca solamente el Amor y con eso habrás alcanzado el fin. Amor en todo y para todo. El Amor que Soy Yo.”</i>"],[18]],[1239,["21 de mayo. Fresne, en mi aposento. ‘Señor, en los terrenos de la locura de amor, ¿no es acaso una locura para mí eso de amarte sin verte?’ Él: <i>“Las locuras de amor de las creaturas no podrán jamás igualar la Locura de Dios. No temas excederte. Búscame, llámame. Me encontrarás. Te contestaré. Amiga Mía, ¡no te canses! Que tu manera de amar se renueve en cada momento, como si te enamoraras en cada instante por primera vez. No te inquietes si no oyes Mi Voz; no Me supongas nunca lejos, pues estoy en tu centro con el Padre y el Divino Espíritu. Ofrécete a nosotros Tres. Entrégate, aun sin comprenderlo, despojándote de tu amor propio, de todo recuerdo de ti.</i>\n<i>“Todo lo que tienes viene de Mí. Por ti misma eres nada, pero ¡que esa nada sea Mía! Sabes que respeto la libertad humana. Sé esperar. Más tarde, cuando comprendas la magnitud de Mi Amor, ¡con qué ardor querrías volver sobre la Tierra solo para amarme un instante y sufrir hasta el fin del mundo! ¡Sé una conmigo tanto como puedas!”</i>"],[2]],[1240,["1º de junio de 1942. <i>“Vive todo este mes en Mi Corazón y habla siempre un poco de Mí. Aunque sea pronunciar Mi Nombre en una frase, te lo agradeceré y te lo pagaré.”</i>"],[13]],[1241,["4 de junio. Yo decía: ‘Gloria a Ti en mi corazón, Tú, que eres Padre, Hijo y Espíritu Santo,’ Me dijo: <i>“Pide frecuentemente Nuestra Gloria, pues la Gloria de la Trinidad está en vuestro amor. ¿Qué podría glorificarnos más que el amor de Nuestras creaturas? ¿Y qué podría haceros a vosotros más felices? Considera que todo lo que Yo pido de los hombres es para su bien y su felicidad. Pero ellos no lo comprenden y Me tratan como si fuera un Amo exigente.</i>\n<i>“¡Y Soy el más tierno! Y cuán agradecido estoy a los que Me consuelan de esta incomprensión, de este desprecio, de esta indiferencia. Consuélame, dándome todo lo que eres, dejándome hablar y obrar por ti, recordando que solo Yo, Yo en ti, es por Quien debes vivir. Vivir para alguien es muy dulce, pero vivir para Dios, es algo que sobrepasa toda dulzura. Ensaya, pues.”</i>","4 de junio. Yo decía: ‘Gloria a Ti en mi corazón, Tú, que eres Padre, Hijo y Espíritu Santo.’ Me dijo: <i>“Pide frecuentemente Nuestra Gloria, pues la Gloria de la Trinidad está en vuestro amor. ¿Qué podría glorificarnos más que el amor de Nuestras creaturas? ¿Y qué podría haceros a vosotros más felices? Considera que todo lo que Yo pido de los hombres es para su bien y su felicidad. Pero ellos no lo comprenden y Me tratan como si fuera un Amo exigente.</i>\n<i>“¡Y Soy el más tierno! Y cuán agradecido estoy a todos los que Me consuelan de esta culpable incomprensión, de este desprecio, de esta indiferencia. Consuélame, dándome todo lo que eres, dejándome hablar y obrar por ti, recordando que solo Yo, Yo en ti, es por Quien debes vivir. Vivir para alguien es muy dulce, pero vivir para Dios es algo que sobrepasa toda dulzura. Ensaya, pues.”</i>"],[10,48]],[1243,["Montrelais. En la iglesia. <i>“No es necesario que Yo esté expuesto en el Ostensorio para que creas en Mi Presencia. Mándame tu amor a través de la puerta del Sagrario. Soy Yo, tu Esposo y Salvador, que siempre te está esperando. ¡No Me hagas esperar mucho! Y cuando Yo te posea, trata con todas tus fuerzas de ser la que Yo quería.”</i>"],[43]],[1245,["7 de junio, en la Misa. <i>“Deja tus pequeñas distracciones habituales y húndete en Mí. ¿Qué es lo que esperas para hacer las cosas mejor y para responder mejor? Considera el canto de los pájaros: no cantan con la misma voz cuando llega la estación en que ellos hacen sus nidos. ¿No habrá cambios en tu voz cuando la Gracia aumenta en ti? ¿No encontrarás acentos más penetrantes y más conmovedores? Dime que sí y pruébamelo.”</i>"],[47]],[1246,["16 de junio. Pensaba con tristeza que, pasadas las fiestas del Corpus, no iba a haber más fiestas. Él: <i>“¿Qué, Mi Sacramento no está siempre ahí? ¿No es una continua fiesta el que todos los días vengas a verme? Soy el Infinito; en Mí nada termina.”</i>"],[43]],[1247,["19 de junio, en la iglesia. <i>“Yo digo: ‘Aquí viene la que ha recibido de Mí tantas Gracias.’ ¡Ojalá pueda añadir: ‘Es la misma que Me ha dado testimonio de tanto agradecimiento!’</i>”"],[22]],[1248,["Visita. Yo: ‘Permite, Señor, por medio de Tu hija, una huella de luz y de bondad para todos.’ Él: <i>“Déjate penetrar, invadir. Que nada en ti Me impida servirme de ti. Yo obro a través de aquellos que Me prestan todo su ser. Así pues, dame tu voz, tu mirada, y camina con la firme intención de dejarme obrar en ti, pues Yo te habito.”</i>"],[4]],[1250,["20 de junio, en el campo. Yo subía la escalera ofreciendo cada peldaño. ‘Señor, ¿cómo puedes aceptar cosas tan pequeñas?’ Él contestó: <i>“Eso que vosotros llamáis cosas pequeñas no se hacen sin que pongáis en ellas vuestro entendimiento, vuestra memoria y vuestra voluntad. ¡Es cuanto tenéis! Dondequiera que pongáis vuestro ser para que Yo to tome, lo tomo. ¿Comprendes?”</i>"],[14]],[1251,["25 de junio. Visita en la iglesia de Le Fresne. <i>“¡Ojalá pudieras ver Mi Esplendor en el Tabernáculo! Mi Omnipotencia y Mi Dulzura. ¡Y la corte de honor amorosa con que Me rodean Mis ángeles! ¡Cuáles no serían tus sentimientos de respeto y anonadamiento! Y tus deseos crecerían con un renovado ardor, pues comprobarías que lo que no es Mi Amor no vale nada. Tu mayor placer será darme alegrías.</i>\n<i>“Adora, en unión de todos los santos, este Cielo que es el Tabernáculo. Ama con ellos. Canta y alaba. Nunca será demasiado, pues Soy el Autor de todo cuanto tienes y te he dado todos Mis Méritos. Tú no los conoces; solo los conoce el Padre. Y has de saber que si fuera necesario, Yo volvería a empezar. Dame cada día una alabanza nueva; que tu pensamiento siga ahondando sin cesar en Mis Tesoros escondidos e infinitos. Y que tus descubrimientos enciendan en ti un fuego desconocido, de manera que digas: ‘¡Eras Tú, mi Señor! ¿Cómo es que no lo había yo entendido? Porque lo mejor de mí eres siempre Tú.’</i>\n<i>“Y mientras Me hablas así, Yo continuaré colmándote de Gracias, porque tengo el Corazón lleno de Ellas y el solo darlas Me aligera. De parte vuestra es poco lo que falta para hacerlo desbordarse.</i>\n<i>“Es necesario, Mis pequeños, que conozcáis vuestro poder sobre Mí; es preciso que Me conozcáis un poco mejor. Balbucead para Mí palabras de amor: Yo las completaré. Como el único sol, que se refleja en todos los espejitos, cuya luz nadie puede resistir. Pero, ¿qué sería del espejo sin el sol?”</i>"],[43]],[1254,["2 de julio. <i>“Ve, ve a encontrarla al tren. Que nunca se te escape una ocasión de dar gusto a los demás, como si de Mí mismo se tratara. ¡Una gentileza puede hacer tanto bien! A veces es como el principio de un milagro en un corazón, que se enternece de que alguien haya sido bueno para con él.”</i>"],[5]],[1255,["10 de julio. Yo tenía dudas sobre Su Palabra, de la cual no me sentía digna. Él: <i>“¿Y por qué? ¿No soy libre de hablar a quién Me plazca? ¿No puedo escoger a Mis apóstoles, a Mis amigos? Yo siempre he escogido. Lee el Evangelio. A ti te he llamado desde el principio de tu camino para señalar la simplicidad y la alegría de la vida interior. Camina según lo que está escrito de ti en el Libro de Mis Designios.”</i>"],[15]],[1256,["16 de julio. Visita. <i>“Mi pequeña, que el recuerdo de Mí no te abandone. Hazlo todo por Mi Amor siempre atento a ti. Que nada te distraiga de Mí, tu Esposo amado. Inventa palabras nuevas, cantos, plegarias, como te vengan al espíritu. Sé Mi fiel compañera, pues Yo Soy tu Compañero. Desde que naciste y aun antes de que existieras, Yo pensaba dulcemente en ti.”</i>"],[39]],[1257,["23 de julio. <i>“A veces no sabes cómo emplear los momentos en que estás despierta durante la noche; llénalos con un llamamiento de amor por la comunión que vas a recibir la mañana siguiente. Tiéndeme los brazos. Dame los nombres más dulces, aunque estés medio dormida. Que tus entrañas se estremezcan en un impulso hacia la Hostia que Soy Yo, preparada para ti desde la Última Cena. Esta comunión te reserva Gracias que no eran las de ayer y que no se te darán mañana. Mi Amor es infinito y multiplicador, entrégame la disposición en que te encuentres, por pobre que sea.”</i>"],[8]],[1258,["28 de julio. <i>“Yo Soy el mismo Cristo que está en el Cielo. Trata de ser ahora la misma que serás más tarde.”</i>"],[6]],[1259,["30 de julio. En la estación, esperaba a unos amigos. Le dije: ‘Ojalá fueras Tú el que bajara del tren.’ Me contestó: <i>“Piensa en Mí siempre y en todas partes. Sé mi lamparita, siempre encendida. La lámpara de esta estación, la de las carreteras y la de los malos caminos. ¡Mi alabanza en todo lugar!”</i>"],[39]],[1260,["6 de agosto. ‘¡Transfigúrate! Transfigúrate, Señor, para mi alma.’ <i>“Multiplica tus miradas hacia Mí, contémplame más frecuentemente y con más amor. Me verás bajo aspectos nuevos e infinitos, amándote siempre, Mi pequeña. Pero sobre todo, cree. Habitúate a los frecuentes actos de Fe. Fe en Mi Presencia, en Mi Potencia y, sobre todo, en Mi Amor, Mi pobre, tierno Amor, tan desconocido. Trata siempre de complacerlo; ocasiones no te faltan y Yo acepto siempre vuestras pequeñeces con tanto agrado...</i>\n<i>“Yo Soy el Padre, el Esposo y no descuido nada, sino que todo lo tomo en Mi Corazón. ¡Qué misión la tuya, Mi Gabriela, la de cuidar Mi Corazón!”</i>"],[13]],[1261,["18 de agosto. <i>“Dime y repíteme: ‘Mi gran Amigo, aquí tienes un sacrificio de amor, un silencio de amor, una sonrisa de amor.’ Que todo cuanto hagas sea una fiesta de amor: Me darás la gloria que otros Me niegan. Solo con amor se puede consolar al Amor.”</i>\nYo: ‘Señor, hazme la Gracia de no vivir ni morir sino para agradarte.’ Él: <i>“En Mí, dirígete siempre al Amor. Si alguna de tus amigas te hablara de tu riqueza, de tu influencia, de tu inteligencia, ¿quedarías con eso satisfecha? Pero si ella te alaba por tu buen corazón, por tu fidelidad, por tus acciones cariñosas, ¿no es cierto que algo profundo vibraría en tu corazón y te sentirías inclinada a quererla más? Porque habrás visto en ella tu propia ternura. Glorifica, pues, Mi Amor, y dale gracias. Nunca Se las darás bastante, porque es infinito. Lo infinito es mucho más que lo meramente inmenso, y tú no sabes hasta qué extremos te amará el Amor, hasta dónde te arrebatará, porque la vida que habéis recibido de Mí no es sino una cuestión de Amor. Y los servicios que se os piden son también servicios de amor. Entrégate al Amor y Lo consolarás.”</i>"],[18]],[1265,["Después de la comunión, mientras Él entraba en mi corazón, yo trataba
